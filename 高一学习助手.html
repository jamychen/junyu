<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="theme-color" content="#3a76d8">
<title>高一学习助手 · 理科</title>
<style>
:root{
  --blue:#3a76d8; --green:#2ea040; --red:#d33; --orange:#b26a00;
  --bg:#f4f6fa; --card:#fff; --text:#222; --muted:#888; --line:#e6e8ee;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.7}
a{color:var(--blue)}
/* 顶栏 */
.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#3a76d8,#5a8fe8);color:#fff;padding:10px 12px;display:flex;align-items:center;gap:8px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.topbar .menu-btn{font-size:22px;background:none;border:0;color:#fff;padding:4px 8px;cursor:pointer;line-height:1}
.topbar .title{font-size:17px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .prog{font-size:12px;opacity:.92;white-space:nowrap}
/* 搜索条 */
.searchbar{padding:8px 10px;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:8px}
.searchbar input{flex:1;border:1px solid var(--line);border-radius:20px;padding:8px 14px;font-size:15px;outline:none}
.searchbar input:focus{border-color:var(--blue)}
.searchbar button{border:0;background:var(--blue);color:#fff;border-radius:20px;padding:0 16px;font-size:14px;cursor:pointer}
/* 抽屉 */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30;display:none}
.overlay.show{display:block}
.drawer{position:fixed;top:0;left:0;bottom:0;width:78%;max-width:320px;background:#fff;z-index:40;transform:translateX(-105%);transition:transform .25s;overflow-y:auto;padding-bottom:30px}
.drawer.show{transform:translateX(0)}
.drawer h3{padding:14px 16px 8px;margin:0;font-size:15px;color:var(--muted);background:#fafbfc;position:sticky;top:0}
.subj{border-bottom:1px solid var(--line)}
.subj-head{padding:12px 16px;font-weight:700;font-size:16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.subj-head .arrow{transition:transform .2s;font-size:12px;color:var(--muted)}
.subj.open .arrow{transform:rotate(90deg)}
.book{display:none;padding-left:8px}
.subj.open .book{display:block}
.book-head{padding:8px 16px;color:#555;font-size:14px;display:flex;justify-content:space-between;cursor:pointer}
.book-head .arrow{font-size:11px;color:var(--muted);transition:transform .2s)}
.book.open .arrow{transform:rotate(90deg)}
.ch-list{display:none;padding-left:8px}
.book.open .ch-list{display:block}
.ch-item{padding:9px 16px;font-size:14px;cursor:pointer;border-left:3px solid transparent;display:flex;align-items:center;gap:6px}
.ch-item:active{background:#eef3fb}
.ch-item.active{border-left-color:var(--blue);background:#eef3fb;color:var(--blue);font-weight:600}
.ch-item .done{color:var(--green);font-weight:700}
.ch-item .dot{width:6px;height:6px;border-radius:50%;display:inline-block}
/* 内容区 */
.content{padding:12px 14px 60px;max-width:820px;margin:0 auto}
.ch-title{font-size:20px;font-weight:700;margin:6px 0 4px}
.ch-loc{font-size:13px;color:var(--muted);margin-bottom:6px}
.ch-summary{font-size:14px;color:#555;background:#fff;border-radius:8px;padding:10px 12px;border:1px solid var(--line);margin:8px 0}
/* 标签 */
.tabs{display:flex;gap:6px;margin:10px 0;position:sticky;top:52px;background:var(--bg);padding:6px 0;z-index:5}
.tab{flex:1;text-align:center;padding:8px 4px;font-size:14px;background:#fff;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 14px;min-height:120px}
.panel h3{margin:14px 0 6px;font-size:16px;color:var(--blue)}
.panel h3.red{color:var(--red)}
.panel h3:first-child{margin-top:0}
.kp{margin:0 0 14px}
.kp .kp-t{font-weight:700;color:var(--blue);margin-bottom:2px}
.ep .ep-t{font-weight:700;color:var(--red)}
.ex{border-bottom:1px dashed var(--line);padding-bottom:10px;margin-bottom:10px}
.ex .ex-t{font-weight:700;margin-bottom:4px}
.ex .q{color:var(--green);font-weight:700}
.ex .an{color:var(--orange);font-weight:700}
.ex .ans{color:var(--blue);font-weight:700}
.panel .empty{color:var(--muted);text-align:center;padding:30px 0}
/* 笔记 */
.note-box{margin-top:6px}
.note-box textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:15px;min-height:120px;font-family:inherit;resize:vertical;outline:none}
.note-box textarea:focus{border-color:var(--blue)}
.note-row{display:flex;justify-content:space-between;align-items:center;margin:6px 0}
.note-row .meta{font-size:12px;color:var(--muted)}
.note-row button{border:0;background:var(--blue);color:#fff;border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer}
.note-row .del{background:#e55}
.note-list{margin-top:10px}
.note-card{background:#fffbea;border:1px solid #f0e3a8;border-radius:8px;padding:10px;margin-bottom:8px}
.note-card .nc-t{font-weight:700;margin-bottom:2px}
.note-card .nc-c{white-space:pre-wrap;font-size:14px}
.note-card .nc-time{font-size:11px;color:var(--muted);margin-top:4px}
.mark-btn{display:inline-block;margin:8px 0;padding:7px 14px;border-radius:20px;border:1px solid var(--blue);background:#fff;color:var(--blue);font-size:13px;cursor:pointer}
.mark-btn.on{background:var(--green);color:#fff;border-color:var(--green)}
/* 搜索结果 */
.sr-card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:8px;cursor:pointer}
.sr-card:active{background:#eef3fb}
.sr-card .sr-subj{font-size:12px;color:#fff;padding:1px 8px;border-radius:10px}
.sr-card .sr-loc{font-size:13px;color:var(--muted);margin:4px 0}
.welcome{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 16px;text-align:center}
.welcome h2{color:var(--blue);margin:0 0 8px}
.welcome ul{text-align:left;display:inline-block;margin:10px auto;padding-left:18px}
.empty-state{text-align:center;color:var(--muted);padding:50px 20px}
</style>
</head>
<body>
<div class="topbar">
  <button class="menu-btn" onclick="toggleDrawer()">☰</button>
  <div class="title" id="topTitle">高一学习助手</div>
  <div class="prog" id="topProg">0/0</div>
</div>
<div class="searchbar">
  <input id="searchInput" type="search" placeholder="搜索知识点 / 考点…" enterkeyhint="search">
  <button onclick="doSearch()">搜索</button>
</div>
<div class="overlay" id="overlay" onclick="toggleDrawer()"></div>
<div class="drawer" id="drawer">
  <h3>📚 科目 · 章节</h3>
  <div id="tree"></div>
</div>
<div class="content" id="content">
  <div class="welcome">
    <h2>欢迎使用 高一学习助手</h2>
    <p>面向高一理科方向（语数英 + 物化生）</p>
    <ul>
      <li>点左上角 ☰ 展开科目章节</li>
      <li>切换「知识点/考点/例题/笔记」</li>
      <li>顶部搜索可跨科检索</li>
      <li>可标记已学习、做笔记</li>
    </ul>
    <p style="color:var(--muted);font-size:13px">点击左上角菜单选择章节开始学习</p>
  </div>
</div>

<script>
const DATA = [{"subject": "语文", "books": [{"name": "必修上册", "chapters": [{"id": "cn_1_1", "title": "第一单元 青春的价值（现代新诗）", "summary": "本单元学习现代新诗，篇目含《沁园春·长沙》《红烛》《峨日朵雪峰之侧》《致云雀》。通过意象与情感体会青春的价值与理想。", "knowledge": [{"title": "文学常识", "content": "词兴起于唐，盛于宋，又称长短句。《沁园春》为词牌名。毛泽东，伟大的革命家、诗人。闻一多，现代诗人、学者，提出诗歌“三美”（音乐美、绘画美、建筑美）。昌耀，当代诗人。雪莱，英国浪漫主义诗人，代表作《致云雀》《西风颂》。"}, {"title": "意象与意境", "content": "意象是寄寓主观情感的客观物象。如《沁园春·长沙》以“万山红遍、层林尽染、漫江碧透、百舸争流、鹰击长空、鱼翔浅底”等意象，绘出湘江秋景图，营造生机勃勃、意境开阔的画面，抒发革命豪情。"}, {"title": "表现手法", "content": "借景抒情、情景交融、对比、象征。《红烛》以“红烛”象征奉献精神，托物言志。《致云雀》以云雀象征欢乐、光明与理想。"}, {"title": "炼字赏析", "content": "《沁园春·长沙》中“击”写出鹰飞矫健有力，“翔”写出鱼游轻盈自由，化静为动，富有动感与生命活力。"}], "exam_points": [{"title": "诗歌背诵默写", "content": "重点默写《沁园春·长沙》（尤其上下阕名句及“问苍茫大地，谁主沉浮”“数风流人物，还看今朝”类名句）。注意易错字：峥嵘、稠、遒。"}, {"title": "意象与情感分析", "content": "找出诗歌意象，分析意境特点，概括诗人情感；结合诗句分析表现手法及作用。"}, {"title": "新诗鉴赏", "content": "分析现代诗的意象、节奏、情感；闻一多“三美”理论的运用。"}], "examples": [{"title": "默写", "question": "补写出下列名篇名句中的空缺部分：______，粪土当年万户侯。", "analysis": "出自《沁园春·长沙》，上阕忆往昔峥嵘岁月。", "answer": "恰同学少年，风华正茂；书生意气，挥斥方遒。"}]}, {"id": "cn_1_2", "title": "第二单元 劳动光荣（新闻通讯）", "summary": "通过人物通讯学习劳动精神，篇目含《喜看稻菽千重浪》《心有一团火，温暖众人心》《“探界者”钟扬》。重点为新闻通讯的特点与人物通讯写法。", "knowledge": [{"title": "新闻与通讯", "content": "新闻结构：标题、导语、主体、背景、结语。通讯是比消息更详尽的新闻报道，有人物通讯、事件通讯。人物通讯以写人为中心，通过典型事例和细节表现人物精神品质。"}, {"title": "人物通讯写法", "content": "选取典型事件；运用细节描写（语言、动作、神态）；在叙述中适当议论抒情点明主旨；以小见大。"}, {"title": "精神品质概括", "content": "袁隆平——勇于创新、淡泊名利、献身科学；张秉贵——全心全意为人民服务；钟扬——献身科学、勇于探索、责任担当。"}], "exam_points": [{"title": "新闻文体常识", "content": "消息与通讯的区别；新闻标题、导语作用；新闻真实性与文学性的关系。"}, {"title": "人物形象分析", "content": "概括人物精神品质；分析细节描写作用；体会作者情感态度。"}, {"title": "新闻语言", "content": "新闻语言的准确、简明；引语与背景的作用。"}], "examples": [{"title": "细节作用", "question": "简析《喜看稻菽千重浪》中描写袁隆平“挽起裤腿走下稻田”等细节的作用。", "analysis": "从人物形象与主旨表达两方面分析细节描写作用。", "answer": "通过动作细节描写，表现袁隆平扎根田间、脚踏实地的科研精神，使人物形象真实丰满，凸显“把论文写在祖国大地上”的主旨，增强通讯的感染力。"}]}, {"id": "cn_1_3", "title": "第三单元 生命的诗意（古诗词）", "summary": "学习古代诗歌，篇目含《短歌行》《归园田居（其一）》《梦游天姥吟留别》《登高》《琵琶行并序》。重点为诗歌意象、情感与艺术手法。", "knowledge": [{"title": "文学常识", "content": "曹操，东汉末政治家、军事家、诗人，《短歌行》属乐府旧题。陶渊明，东晋诗人，田园诗派鼻祖。李白，字太白，号青莲居士，浪漫主义诗人。杜甫，字子美，现实主义诗人，世称“诗圣”，《登高》被誉为“古今七律第一”。白居易，字乐天，号香山居士，《琵琶行》为七言歌行体。"}, {"title": "诗歌题材与情感", "content": "《短歌行》抒求贤若渴、统一天下的抱负；《归园田居》表达厌弃官场、回归自然的恬淡；《梦游天姥吟留别》借梦境抒蔑视权贵、追求自由之志；《登高》写悲秋与漂泊老病之愁；《琵琶行》借琵琶女身世抒“同是天涯沦落人”之慨。"}, {"title": "艺术手法", "content": "用典（《短歌行》化用《诗经》）；白描（《归园田居》“方宅十余亩”）；夸张想象（李白梦游）；对仗（《登高》首联、颔联工对）；比喻通感（“大珠小珠落玉盘”喻乐声）。"}, {"title": "近体诗常识", "content": "律诗八句，分首联、颔联、颈联、尾联；颔联颈联须对仗。《登高》四联皆对仗。平仄、押韵为格律要求。"}], "exam_points": [{"title": "古诗默写", "content": "重点默写《短歌行》《归园田居》《登高》《琵琶行》名句。易错字：譬如、羁鸟、猿啸、幽咽、冰泉。"}, {"title": "意象与情感鉴赏", "content": "分析意象（如《登高》“落木”“长江”）营造的意境与情感；炼字赏析。"}, {"title": "表现手法赏析", "content": "判断并赏析用典、对比、借景抒情、虚实结合、衬托等手法及作用。"}], "examples": [{"title": "诗句鉴赏", "question": "赏析《登高》颔联“无边落木萧萧下，不尽长江滚滚来”的妙处。", "analysis": "从意象、对仗、意境、情感四方面赏析。", "answer": "“落木”“长江”描绘秋景，境界雄浑；“无边”“不尽”显空间之广、时间之久；对仗工整，音韵铿锵。既写自然之秋，又融诗人漂泊迟暮之悲与韶光易逝之叹，情景交融，气象宏大。"}, {"title": "默写", "question": "《琵琶行》中描写音乐暂歇后突然激越的句子是______。", "analysis": "出自《琵琶行》描写乐声变化的名句。", "answer": "银瓶乍破水浆迸，铁骑突出刀枪鸣。"}]}, {"id": "cn_1_4", "title": "第四单元 家乡文化生活（综合活动）", "summary": "实践活动单元，调查家乡人物、风物、习俗，记录家乡文化生活，撰写调查报告与建议书。", "knowledge": [{"title": "调查与访谈", "content": "调查方法：问卷、访谈、实地考察、文献查阅。访谈要拟好提纲，提问具体开放，记录客观真实。"}, {"title": "调查报告", "content": "结构：标题、前言（目的、对象、方法）、主体（情况、分析）、结尾（结论、建议）。语言客观准确，数据与事实支撑。"}, {"title": "建议书", "content": "格式：标题、称呼、正文（问题+建议）、结尾、署名日期。建议要具体可行、分条列出。"}], "exam_points": [{"title": "实用文写作", "content": "调查报告与建议书的格式与内容要求；活动方案设计。"}, {"title": "材料概括", "content": "从调查材料中提取信息、概括特点、提出建议。"}], "examples": [{"title": "建议书", "question": "针对家乡传统文化保护问题，拟写一份建议书的正文要点。", "analysis": "围绕“问题+建议”分条作答，建议具体可行。", "answer": "①建立传统文化档案，普查登记非遗项目；②加强宣传，开设乡土文化课程；③培养传承人，给予政策与资金支持；④开发文旅结合项目，让传统文化融入生活。"}]}, {"id": "cn_1_5", "title": "第五单元 整本书阅读《乡土中国》", "summary": "费孝通著，社会学经典。理解中国乡土社会的“差序格局”“礼治秩序”等核心概念，学习整本书阅读方法。", "knowledge": [{"title": "作者与体例", "content": "费孝通，社会学家、人类学家。《乡土中国》由14篇论文组成，是社区研究比较理论的成果，属学术性论著。"}, {"title": "核心概念", "content": "乡土本色：中国社会基层是乡土性的。差序格局：以“己”为中心，像石子投入水中形成的同心圆波纹的人际关系格局（区别于团体格局）。礼治秩序：靠传统与教化维持的秩序。长老统治、血缘与地缘、无讼。"}, {"title": "阅读方法", "content": "略读把握框架（目录、核心概念），精读理解论证；圈点批注；绘制概念关系图；联系现实生活理解。"}], "exam_points": [{"title": "概念理解", "content": "差序格局与团体格局的区别；礼治与法治；熟人社会特点。"}, {"title": "论证分析", "content": "分析作者举例、对比、比喻等论证方法；理解概念间逻辑。"}, {"title": "联系现实", "content": "用乡土中国理论分析现实社会现象（人情、宗族、基层治理）。"}], "examples": [{"title": "概念辨析", "question": "简述“差序格局”的含义及其与“团体格局”的区别。", "analysis": "解释差序格局比喻，对比两种格局的人际结构。", "answer": "差序格局是以“己”为中心、按亲属与地缘关系向外推衍的同心圆式人际关系，圈子大小随中心势力变化，公私界限相对。团体格局由若干人组成界限分明的团体，成员地位平等，公私分明。前者重人情伦理，后者重权利规则。"}]}, {"id": "cn_1_6", "title": "第六单元 学习之道（古代议论散文）", "summary": "学习古代议论散文《劝学》《师说》及《反对党八股》。重点为文言实词虚词、特殊句式与说理方法。", "knowledge": [{"title": "文言实词", "content": "《劝学》：劝（勉励）、学不可以已（停止）、金就砺则利（靠近、接近）、假（借助）、跂（踮起脚后跟）、驽马十驾（马拉车一天的行程）、锲（刻）。《师说》：师（从师、老师）、传道、受业解惑（受同授）、其闻道也固先乎吾（懂得）、从而师之（意动，以……为师）。"}, {"title": "文言虚词", "content": "于：①青取之于蓝（从）②而寒于水（比）③耻学于师（向）。而：①顺风而呼（表修饰）②而知明而行无过矣（表并列）③君子博学而日参省乎己（表递进）。之：①郯子之徒（这类）②句读之不知（宾前标志）③巫医乐师百工之人（代词）。"}, {"title": "特殊句式", "content": "判断句：“师者，所以传道受业解惑也”。宾语前置：“句读之不知，惑之不解”。状语后置：“学于余”。被动：“不拘于时”。省略句：“蟹六跪而二螯，非蛇鳝之穴无可寄托者”。"}, {"title": "论证方法", "content": "《劝学》用比喻论证（积、喻）与对比论证；《师说》正面论述与反面批判结合，对比论证（古之圣人—今之众人，爱其子—于其身，巫医—士大夫）。"}], "exam_points": [{"title": "文言文默写", "content": "默写《劝学》《师说》名句。易错字：鞣、砺、跂、跬、骐骥、镂、蟮（鳝）、传道受业。"}, {"title": "文言知识", "content": "实词义项推断、虚词用法辨析、特殊句式辨析与翻译。"}, {"title": "论证分析", "content": "梳理论证思路，分析论证方法与论点论据关系。"}], "examples": [{"title": "句式翻译", "question": "翻译“句读之不知，惑之不解，或师焉，或不焉”。", "analysis": "注意宾语前置句式、“或”“不（否）”通假。", "answer": "不明句读，不能解决疑惑，有的（不通句读）向老师学习，有的（有疑惑）却不向老师学习。"}, {"title": "默写", "question": "《劝学》中强调积累的重要性的两句是______。", "analysis": "以积土成山、积水成渊喻积累。", "answer": "积土成山，风雨兴焉；积水成渊，蛟龙生焉。"}]}, {"id": "cn_1_7", "title": "第七单元 自然情怀（写景抒情散文）", "summary": "学习现当代与古代写景抒情散文，篇目含《故都的秋》《荷塘月色》《我与地坛（节选）》《赤壁赋》《登泰山记》。体会情景交融。", "knowledge": [{"title": "文学常识", "content": "郁达夫，现代作家，《故都的秋》写北平秋的“清、静、悲凉”。朱自清，现代散文家，《荷塘月色》写月下荷塘。史铁生，当代作家，《我与地坛》写生命感悟。苏轼，北宋文学家，《赤壁赋》为文赋名篇。姚鼐，清代桐城派散文家，《登泰山记》为山水游记。"}, {"title": "写景手法", "content": "《荷塘月色》通感（“微风过处，送来缕缕清香，仿佛远处高楼上渺茫的歌声”）、比喻、叠词；《故都的秋》以小院秋景写意，对比南国之秋；《赤壁赋》主客问答、借景说理。"}, {"title": "情景关系", "content": "景中含情（故都之秋的落寞清冷）、因情设景（荷塘月色的淡淡喜悦淡淡哀愁）、借景说理（赤壁赋水月之喻）。"}], "exam_points": [{"title": "散文鉴赏", "content": "分析景物描写手法及作用；体会作者情感与主旨；语言赏析（叠词、通感、句式）。"}, {"title": "文言文阅读", "content": "《赤壁赋》《登泰山记》实词虚词、翻译、说理层次。"}, {"title": "默写", "content": "《赤壁赋》名句默写（如“寄蜉蝣于天地，渺沧海之一粟”）。"}], "examples": [{"title": "手法赏析", "question": "赏析《荷塘月色》“微风过处，送来缕缕清香，仿佛远处高楼上渺茫的歌声”的表达效果。", "analysis": "判断为通感修辞，分析其效果。", "answer": "运用通感，将嗅觉的“清香”比作听觉的“歌声”，“缕缕”“渺茫”写出香气若有若无、断续轻淡的特点，化无形为有形，形象传神，增添诗意美。"}]}, {"id": "cn_1_8", "title": "第八单元 词语积累与探究", "summary": "活动单元，梳理成语、熟语、新词，探究词义演变，规范语言运用。", "knowledge": [{"title": "成语知识", "content": "成语多源于神话、寓言、历史故事、诗文语句。辨析近义成语：范围大小、语意轻重、感情色彩、谦敬用法。如“耳提面命”（褒，恳切教导）与“颐指气使”（贬，傲慢）。"}, {"title": "熟语", "content": "包括惯用语、谚语、歇后语、格言。理解其约定俗成的含义。"}, {"title": "词义演变", "content": "词义扩大（“江”由长江扩大为河流通称）、缩小、转移；古今异义（“妻子”古指妻和子）。"}], "exam_points": [{"title": "成语运用", "content": "判断成语使用正误（望文生义、对象误用、褒贬误用、谦敬错位、前后矛盾）。"}, {"title": "词语辨析", "content": "近义词（实词、虚词）辨析填空。"}, {"title": "语言得体", "content": "敬辞与谦辞使用；场合与语体得体。"}], "examples": [{"title": "成语正误", "question": "下列成语使用是否正确：“他讲课娓娓道来，令学生如坐春风。”", "analysis": "“如坐春风”比喻受到良师的教诲，与语境相符。", "answer": "正确。“如坐春风”比喻沐浴在良好的教育环境中，用来形容听课感受恰当，对象与感情色彩均合适。"}]}]}, {"name": "必修下册", "chapters": [{"id": "cn_2_1", "title": "第一单元 诸子百家（古代散文）", "summary": "学习先秦诸子散文《子路、曾皙、冉有、公西华侍坐》《齐桓晋文之事》《庖丁解牛》。理解儒道思想与说理艺术。", "knowledge": [{"title": "文学常识", "content": "《论语》儒家经典，语录体，记录孔子及其弟子言行。孟子，名轲，主张“仁政”“性善论”，《孟子》为对话体论辩散文。庄子，名周，道家代表，主张顺应自然，《庄子》文章想象奇幻、善用寓言。"}, {"title": "文言实词虚词", "content": "“侍坐”（陪侍长者坐）、“居则曰”（平日）、“如其道”（合乎道）；“吾何爱一牛”（吝惜）、“牛何之”（往）；“乃中经首之会”（合乎）、“批大郤导大窾”（击、顺着）。虚词“以”“其”“之”的多义。"}, {"title": "思想与说理", "content": "孔子“为国以礼”、曾皙“浴乎沂风乎舞雩”的礼乐理想；孟子“保民而王”的仁政思想与“推恩”论证；庄子“依乎天理”顺应规律的养生哲学。"}, {"title": "人物形象", "content": "孔子和蔼民主、循循善诱；孟子善辩、气势充沛；庖丁技艺精湛、得心应手。"}], "exam_points": [{"title": "文言知识", "content": "实词推断、虚词辨析、特殊句式、文句翻译。"}, {"title": "思想内容", "content": "概括诸子主张；比较儒道思想差异。"}, {"title": "艺术特色", "content": "《孟子》论辩艺术（排比、比喻、因势利导）；《庄子》寓言说理。"}], "examples": [{"title": "翻译", "question": "翻译“老吾老，以及人之老；幼吾幼，以及人之幼”。", "analysis": "注意“老”“幼”的形容词活用及“及”的词义。", "answer": "敬重自家的长辈，从而推广到敬重别人家的长辈；爱护自家的儿女，从而推广到爱护别人家的儿女。"}]}, {"id": "cn_2_2", "title": "第二单元 悲剧的力量（戏剧）", "summary": "学习戏剧《雷雨（节选）》《哈姆莱特（节选）》。把握戏剧冲突、人物语言与悲剧意蕴。", "knowledge": [{"title": "戏剧常识", "content": "戏剧要素：戏剧冲突、戏剧语言（台词、舞台说明）。悲剧：主人公因自身缺陷或环境冲突走向毁灭，引发怜悯与恐惧的净化。曹禺，现代剧作家，《雷雨》写周鲁两家三十年恩怨。莎士比亚，英国文艺复兴戏剧家。"}, {"title": "戏剧冲突", "content": "《雷雨》周朴园与鲁侍萍相认的冲突，揭示阶级矛盾与人性虚伪；《哈姆莱特》复仇与延宕的内心冲突。"}, {"title": "人物语言", "content": "个性化台词塑造人物；潜台词（言外之意）反映心理。周朴园的语言威严虚伪，鲁侍萍含蓄克制。"}], "exam_points": [{"title": "戏剧冲突", "content": "概括冲突实质，分析冲突对塑造人物与推动情节的作用。"}, {"title": "人物形象与潜台词", "content": "分析人物性格；解读潜台词含义。"}, {"title": "悲剧意蕴", "content": "理解悲剧根源与社会意义。"}], "examples": [{"title": "潜台词", "question": "《雷雨》中周朴园问“你——你贵姓？”潜台词是什么？", "analysis": "结合相认情节分析人物心理。", "answer": "周朴园察觉眼前女子可能与三十年前的侍萍有关，内心惊疑不安，这句问话掩饰其慌乱，试探对方身份，反映其虚伪怯懦的心理。"}]}, {"id": "cn_2_3", "title": "第三单元 探索与发现（实用性文本）", "summary": "学习科普与学术文章《青蒿素：人类征服疾病的一小步》《一名物理学家的教育历程》。理解科学精神与说明方法。", "knowledge": [{"title": "文体知识", "content": "科普文：以通俗语言介绍科学知识。学术报告/自传性说明文：介绍研究过程与思想。说明方法：下定义、分类别、举例子、作比较、列数字、打比方。"}, {"title": "科学精神", "content": "屠呦呦团队锲而不舍、从古籍汲取智慧、严谨求实；加来道雄由好奇驱动、勇于探索。"}, {"title": "语言特点", "content": "准确性（术语、数据）与通俗性（比喻、口语化）结合。"}], "exam_points": [{"title": "说明文阅读", "content": "概括说明对象与特征；分析说明方法与作用；说明顺序与语言准确性。"}, {"title": "科学精神概括", "content": "从文中提炼科学家的品质与科学方法。"}], "examples": [{"title": "说明方法", "question": "《青蒿素》运用了哪些说明方法？举一例分析。", "analysis": "结合文本列举说明方法并分析作用。", "answer": "运用了举例子（列举临床病例）、列数字（提取成功率、实验次数）、作比较（与氯喹等对比）等。如列举大量临床治愈数据，具体准确地说明青蒿素的疗效，增强说服力。"}]}, {"id": "cn_2_4", "title": "第四单元 信息时代的语文生活", "summary": "活动单元，认识媒介特点，辨析网络信息，撰写媒介素养相关文案。", "knowledge": [{"title": "媒介素养", "content": "认识不同媒介（报刊、广播、电视、网络）特点；辨别信息真伪，警惕谣言与算法偏见；理性表达，规范网络语言。"}, {"title": "信息处理", "content": "筛选、整合、概括多则信息；比较不同来源报道的差异。"}], "exam_points": [{"title": "信息概括与整合", "content": "从多则材料提取关键信息并概括。"}, {"title": "媒介应用文", "content": "拟写消息、倡议书、网络评论等。"}], "examples": [{"title": "信息辨析", "question": "面对网络上一条引发争议的新闻，应如何理性对待？", "analysis": "从核实来源、多方比对、理性判断角度作答。", "answer": "①核实信息来源是否权威可靠；②查找官方通报与多方报道比对；③不轻信不传谣，等待事实澄清；④理性评论，避免情绪化与网络暴力。"}]}, {"id": "cn_2_5", "title": "第五单元 演讲（演讲词）", "summary": "学习演讲词《在〈人民报〉创刊纪念会上的演说》《在马克思墓前的讲话》《我有一个梦想》。体会演讲的针对性与感染力。", "knowledge": [{"title": "演讲特点", "content": "针对性（针对听众与场合）、鼓动性、口语化。结构常为提出问题—分析问题—发出号召。"}, {"title": "论证与修辞", "content": "运用比喻、排比、对比增强气势与感染力。恩格斯对马克思的评价客观中肯；马丁·路德·金用大量排比抒情达意。"}, {"title": "演讲写作", "content": "观点鲜明，开头引人，结尾有力；联系实际，情感真挚。"}], "exam_points": [{"title": "演讲词鉴赏", "content": "分析演讲的针对性与感染力；修辞手法及作用；论证思路。"}, {"title": "演讲稿写作", "content": "拟写演讲稿，注意对象意识与逻辑层次。"}], "examples": [{"title": "修辞作用", "question": "分析《我有一个梦想》中排比句的表达效果。", "analysis": "从气势、情感、主旨角度分析排比作用。", "answer": "“我有一个梦想”反复排比，层层递进，强化对种族平等的热切渴望，形成强烈节奏感与抒情气势，增强演讲的感染力与鼓动性，深刻表达主旨。"}]}, {"id": "cn_2_6", "title": "第六单元 小说阅读", "summary": "学习中外小说（含《祝福》《变形记》等）。把握人物、情节、环境与主题，理解小说叙事艺术。", "knowledge": [{"title": "小说三要素", "content": "人物、情节、环境。情节结构：开端、发展、高潮、结局（有时有序幕、尾声）。环境分自然环境与社会环境，烘托人物、暗示主题。"}, {"title": "人物塑造", "content": "正面描写（肖像、语言、动作、神态、心理）与侧面描写。典型环境中的典型人物。祥林嫂的悲剧是封建礼教所致。"}, {"title": "叙事艺术", "content": "叙述视角（第一/第三人称）、叙述顺序（顺叙、倒叙、插叙）、细节描写、伏笔照应。"}, {"title": "主题探究", "content": "透过人物命运与社会环境挖掘主题；关注现代派小说（如《变形记》异化主题）。"}], "exam_points": [{"title": "人物形象分析", "content": "概括人物性格特点，分析塑造手法。"}, {"title": "环境作用", "content": "分析自然环境与社会环境的作用。"}, {"title": "标题与主题", "content": "标题含义与作用；探究小说主题。"}], "examples": [{"title": "环境作用", "question": "简析《祝福》开头描写鲁镇祝福景象的作用。", "analysis": "从环境渲染、人物衬托、主题揭示、结构方面分析。", "answer": "渲染了鲁镇年终祝福的热闹喜庆氛围，与祥林嫂惨死的悲凉形成强烈对比，反衬其命运的悲惨；揭示封建迷信与礼教环境，暗示悲剧根源；首尾照应祝福，使结构完整，深化批判主题。"}]}, {"id": "cn_2_7", "title": "第七单元 整本书阅读《红楼梦》", "summary": "阅读《红楼梦》，把握主要人物与悲剧主题，理解章回小说艺术，学习长篇小说阅读方法。", "knowledge": [{"title": "作品常识", "content": "曹雪芹著，前八十回曹雪芹，后四十回一般认为高鹗续。中国古典小说巅峰，章回体。以贾宝玉、林黛玉、薛宝钗爱情婚姻悲剧为主线，写贾府由盛转衰。"}, {"title": "主要人物", "content": "贾宝玉——叛逆、厌恶仕途经济；林黛玉——多愁善感、才华出众、追求真情；薛宝钗——端庄贤淑、恪守礼教；王熙凤——精明强干、泼辣狠毒。判词暗示人物命运。"}, {"title": "艺术成就", "content": "网状结构，草蛇灰线伏脉千里；人物塑造千人千面；诗词曲赋与人物性格命运契合；悲剧意蕴深刻。"}], "exam_points": [{"title": "人物分析", "content": "结合情节分析人物性格与命运；判词解读。"}, {"title": "主题与艺术", "content": "悲剧的社会意义；结构与伏笔艺术。"}, {"title": "整本书阅读方法", "content": "梳理关系、关注回目、专题探究。"}], "examples": [{"title": "人物判读", "question": "简析林黛玉这一人物形象。", "analysis": "从性格、才华、命运、意义概括。", "answer": "林黛玉寄人篱下，多愁善感、孤高自许；才华横溢、率真多情，追求自由的爱情与人格独立。她与宝玉的爱情因礼教与家族利益受阻，最终泪尽而逝，其悲剧既是性格与环境冲突所致，也寄托了作者对个性解放的向往。"}]}, {"id": "cn_2_8", "title": "第八单元 古诗词诵读", "summary": "学习《李凭箜篌引》《锦瑟》《书愤》《越中览古》等古诗词，拓展积累，提升鉴赏与默写能力。", "knowledge": [{"title": "文学常识", "content": "李贺，中唐诗人，诗风奇崛，人称“诗鬼”。李商隐，晚唐诗人，诗风朦胧绮丽。陆游，南宋爱国诗人。"}, {"title": "艺术手法", "content": "《李凭箜篌引》以奇喻摹写乐声（“女娲炼石补天处，石破天惊逗秋雨”）；《锦瑟》用典朦胧多义（庄生梦蝶、望帝春心、鲛人泣珠、蓝田生玉）；《书愤》对比今昔，抒壮志未酬之愤。"}, {"title": "用典与多义", "content": "用典使语言凝练含蓄；《锦瑟》主旨众说纷纭（悼亡、自伤、诗序），体现诗歌多义性。"}], "exam_points": [{"title": "默写积累", "content": "默写《锦瑟》《书愤》等名句。易错字：惘、沧、鬓、衰。"}, {"title": "鉴赏", "content": "赏析音乐描写手法；分析用典与情感；比较阅读。"}], "examples": [{"title": "默写", "question": "补写《锦瑟》：此情可待成追忆，______。", "analysis": "出自李商隐《锦瑟》尾联。", "answer": "只是当时已惘然。"}]}]}]}, {"subject": "数学", "books": [{"name": "必修第一册", "chapters": [{"id": "math_1_1", "title": "第一章 集合与常用逻辑用语", "summary": "集合是现代数学的基本语言。本章学习集合的概念、表示、关系与运算，以及充分条件、必要条件、全称量词与存在量词，是函数与后续内容的基础。", "knowledge": [{"title": "集合与元素", "content": "把一些能够确定的不同的对象看成一个整体，就说这个整体是由这些对象的全体构成的集合。集合中的每个对象叫元素。元素具有三大特性：(1)确定性：一个对象要么属于该集合，要么不属于，不能模棱两可。例如“个子高的人”不能构成集合，因为“高”没有明确标准；(2)互异性：集合中元素不能重复，例如{1,1,2}应写为{1,2}；(3)无序性：{1,2,3}与{3,2,1}表示同一集合。若 a 是集合 A 的元素，记 a∈A；否则记 a∉A。常见数集：N(非负整数集)、N*/N+(正整数集)、Z(整数集)、Q(有理数集)、R(实数集)。【解题方法】判断一组对象能否构成集合，关键是看是否有明确的标准判定每个对象是否属于该组。含参集合求参数值后，务必代入检验互异性。【易错点】忽略互异性导致重复元素，例如已知集合{a, a², 1}，求 a 时若 a=1 则集合变为{1,1,1}，必须舍去。【老师提醒】做含参集合题时，求出参数后一定要回代检验，这是最容易丢分的地方。"}, {"title": "集合的表示", "content": "常用表示法有三种：(1)列举法：把元素一一列出写在大括号内，如{1,2,3}，适用于元素较少或有限个的情况；(2)描述法：{x|x 满足的性质 P}，如{x∈R|x²-1=0}表示方程 x²-1=0 的实数解集，适用于元素有共同特征的情况；(3)Venn 图法：用封闭曲线表示集合，直观展示集合关系。描述法中竖线前为代表元素的符号，竖线后为元素满足的性质。例如{y|y=x²}表示函数的值域，{(x,y)|y=x²}表示抛物线上的点集，两者含义完全不同。【解题方法】列举法与描述法的互译是常考题型，要准确理解描述法中代表元素的含义。集合{y|y=2x+1}是数集（值域），{(x,y)|y=2x+1}是点集（直线上的点），{x|y=2x+1}是定义域。【易错点】混淆点集与数集，把{(x,y)|y=x+1}误认为一次函数的值域。【老师提醒】看描述法集合时，先看竖线前面是什么——是 x 就是数集，是(x,y)就是点集，这决定了集合的本质。"}, {"title": "集合间的基本关系", "content": "若集合 A 的任意元素都是 B 的元素，则 A 是 B 的子集，记 A⊆B。若 A⊆B 且 B 中至少有一个元素不属于 A，则 A 是 B 的真子集，记 A⫋B。规定空集 ∅ 是任何集合的子集，是任何非空集合的真子集。A⊆B 且 B⊆A 等价于 A=B。子集个数公式：含 n 个元素的集合有 2^n 个子集，2^n-1 个真子集，2^n-1 个非空子集，2^n-2 个非空真子集。例如{1,2,3}有 2³=8 个子集。【解题方法】已知 A⊆B 求参数范围时，必须分 A=∅ 和 A≠∅ 两种情况讨论。当 A≠∅ 时，若 A、B 是连续区间，比较端点；若是离散集合，逐一验证。注意端点能否取到要看集合是开区间还是闭区间。【易错点】(1)忽略空集是任何集合子集，导致漏解。例如已知 A⊆B，A={x|ax+1=0}，当 a=0 时 A=∅ 也满足条件；(2)子集与真子集符号混淆；(3)端点值取舍错误。【老师提醒】凡是看到“A⊆B”或“A⫋B”这类条件，第一步一定要想：A 有没有可能是空集？养成这个习惯能避免大量丢分。"}, {"title": "集合的基本运算", "content": "并集 A∪B={x|x∈A 或 x∈B}；交集 A∩B={x|x∈A 且 x∈B}；补集 ∁UA={x|x∈U 且 x∉A}，其中 U 为全集。运算性质：A∪A=A，A∩A=A，A∪∅=A，A∩∅=∅；A∪U=U，A∩U=A；A⊆B 等价于 A∩B=A 等价于 A∪B=B。德·摩根定律：∁U(A∪B)=(∁UA)∩(∁UB)，∁U(A∩B)=(∁UA)∪(∁UB)。【解题方法】(1)离散集合运算直接用定义或 Venn 图；(2)连续区间运算借助数轴，注意端点的开闭；(3)抽象集合运算用 Venn 图分析。求集合中元素个数可用容斥原理：|A∪B|=|A|+|B|-|A∩B|。【易错点】(1)数轴运算时端点取舍错误，尤其注意能否取等；(2)补集运算忘记全集范围；(3)混淆∪与∩的含义。【老师提醒】画数轴做集合运算是最不容易出错的方法，端点处能取到画实心点，取不到画空心点，养成画图习惯。"}, {"title": "充分条件与必要条件", "content": "若 p⇒q（即 p 成立则 q 必成立），则 p 是 q 的充分条件，q 是 p 的必要条件。若 p⇔q（p 与 q 互相推出），则 p 与 q 互为充要条件。若 p 推不出 q 且 q 推不出 p，则互为既不充分也不必要条件。判断方法：(1)定义法，看能否推出及方向；(2)集合法，若 A={x|p(x)}，B={x|q(x)}，则 A⊆B 时 p 是 q 的充分条件（小范围推出大范围）。例如“x>2”是“x>1”的充分条件，因为{x|x>2}⊆{x|x>1}。【解题方法】判断充要关系时，先明确条件和结论分别是什么，再判断推导方向。“p 是 q 的充分条件”即“p⇒q”，“p 的充分条件是 q”即“q⇒p”，注意语言表述的方向。【易错点】(1)搞反充分与必要的方向，“p 是 q 的充分条件”和“p 的充分条件是 q”含义相反；(2)用特殊值代替一般证明。【老师提醒】从集合角度理解最直观：小集合推出大集合，小集合是大集合的子集，对应的条件就是充分条件。"}, {"title": "全称量词与存在量词", "content": "全称量词∀：“对任意”、“对所有”，∀x∈M，p(x) 表示对 M 中任意 x 都有 p(x) 成立；存在量词∃：“存在”、“有一个”，∃x∈M，p(x) 表示 M 中存在 x 使 p(x) 成立。含有全称量词的命题叫全称量词命题，含有存在量词的命题叫存在量词命题。命题的否定：¬(∀x∈M, p(x)) 等价于 ∃x∈M, ¬p(x)；¬(∃x∈M, p(x)) 等价于 ∀x∈M, ¬p(x)。即否定全称命题变存在量词，否定存在命题变全称量词，同时否定结论。例如“∀x∈R, x²>0”的否定是“∃x∈R, x²≤0”。【解题方法】(1)写命题否定时，量词要变（∀变∃，∃变∀），结论也要否定；(2)判断全称命题为真需证明对所有元素成立，为假只需举一个反例；(3)判断存在命题为真只需找一个满足的例子，为假需证明都不满足。【易错点】(1)只否定量词不否定结论，或只否定结论不变量词；(2)把命题的否定和否命题混淆（否命题是“若 p 则 q”变为“若¬p 则¬q”）。【老师提醒】“否定”只否定结论和量词，不否定条件。记住口诀：量词互换，结论取反。"}], "exam_points": [{"title": "集合的含义与表示", "content": "考查元素确定性、互异性（注意含参集合求参数时要检验互异性）、列举法与描述法的互译。解题技巧：描述法集合先看代表元素是 x 还是(x,y)判断数集还是点集；含参集合求出参数后务必回代检验互异性。"}, {"title": "集合间关系的应用", "content": "由子集关系求参数取值范围，注意空集的讨论（A⊆B 时务必考虑 A=∅ 的情形）；集合相等求参数。解题技巧：已知 A⊆B 求参数，先讨论 A=∅，再讨论 A≠∅ 时用数轴比较端点；离散集合逐元素对应列方程组。"}, {"title": "集合运算", "content": "交、并、补运算，常结合不等式（一元二次不等式、绝对值不等式）的解集；利用 Venn 图求元素个数或参数。解题技巧：连续区间运算画数轴，注意端点开闭；抽象集合用 Venn 图；元素个数用容斥原理 |A∪B|=|A|+|B|-|A∩B|。"}, {"title": "充分必要条件的判定", "content": "结合具体命题判定条件关系；通过反例否定；与方程、不等式结合求参数范围。解题技巧：定义法判断推导方向，也可用集合法——小范围推出大范围；“p 是 q 的充分条件”即 p⇒q，注意“是”和“的”的区别。"}, {"title": "全称与存在量词命题的否定", "content": "写含一个量词命题的否定，判断命题真假。解题技巧：量词互换（∀变∃，∃变∀），结论取反；全称命题证假举一反例，存在命题证真举一例。"}], "examples": [{"title": "集合运算与参数（基础题）", "question": "已知集合 A={x|-1<x<3}，B={x|x<a}，若 A∪B=B，求 a 的取值范围。", "analysis": "首先理解条件 A∪B=B 的含义。根据并集的性质，A∪B=B 等价于 A 是 B 的子集（A⊆B），即 A 中所有元素都必须属于 B。集合 A 是开区间(-1,3)，集合 B 是射线(-∞,a)。要让 A 的所有元素都在 B 中，即(-1,3)中的每个数都小于 a，因此 a 不能小于 A 的右端点 3。要注意 a=3 时 B=(-∞,3)，A=(-1,3)⊆B 仍然成立，因为 A 中元素都小于 3。所以 a 的范围是 a≥3。", "answer": "由 A∪B=B 得 A⊆B。A={x|-1<x<3}，B={x|x<a}。要使 A⊆B，需 A 中所有元素都满足 x<a，即 a 不小于 A 的上界 3。当 a=3 时，B={x|x<3}，A={x|-1<x<3}⊆B 成立。故 a 的取值范围是 [3,+∞)。"}, {"title": "互异性检验（基础题）", "question": "已知集合 A={1, a, a+1}，且 2∈A，求 a 的值。", "analysis": "由 2∈A 知 2 等于集合 A 中某个元素。A 的元素有 1、a、a+1 三个，2 不等于 1，所以 2 等于 a 或 a+1。需要分两种情况讨论：(1)若 a=2，则集合 A={1,2,3}，元素互不相同，满足互异性；(2)若 a+1=2 即 a=1，则集合 A={1,1,2}，元素 1 重复，违反互异性，舍去。因此只有 a=2 满足条件。这道题的关键是求出 a 后必须回代检验互异性。", "answer": "由 2∈A，分两种情况：\n情况1：a=2，则 A={1,2,3}，元素互异，满足条件；\n情况2：a+1=2，得 a=1，则 A={1,1,2}，元素重复，舍去。\n故 a=2。"}, {"title": "子集关系求参数（中档题）", "question": "已知集合 A={x|ax-1=0}，B={x|x²-3x+2=0}，若 A⊆B，求实数 a 的所有取值。", "analysis": "先求集合 B：解方程 x²-3x+2=0 得 (x-1)(x-2)=0，所以 B={1,2}。集合 A 是方程 ax-1=0 的解集。关键：A⊆B 要分两种情况讨论。第一种，A=∅，即方程 ax-1=0 无解，这要求 a=0（此时 0·x-1=0 即-1=0 无解）；第二种，A≠∅，即 a≠0 时 A={1/a}，要求 1/a∈B={1,2}，所以 1/a=1 或 1/a=2，即 a=1 或 a=1/2。三种情况都满足 A⊆B。这道题的易错点是忘记讨论 A=∅ 即 a=0 的情况。", "answer": "B={x|x²-3x+2=0}={1,2}。\n(1)当 a=0 时，方程 ax-1=0 即-1=0 无解，A=∅⊆B，满足；\n(2)当 a≠0 时，A={1/a}，由 A⊆B 需 1/a∈{1,2}，\n  若 1/a=1，则 a=1；若 1/a=2，则 a=1/2。\n综上，a 的取值为 0, 1, 1/2。"}, {"title": "集合运算综合（高考真题）", "question": "已知集合 A={x|x²-x-2<0}，B={x|0<x<4}，求 A∩B 和 (∁RA)∪B（其中全集 U=R）。", "analysis": "第一步先化简集合 A。解不等式 x²-x-2<0，因式分解 (x-2)(x+1)<0，解得-1<x<2，所以 A={x|-1<x<2}。集合 B={x|0<x<4}。\n(1)求 A∩B：在数轴上画出 A=(-1,2)和 B=(0,4)，取交集得公共部分(0,2)。\n(2)求(∁RA)∪B：先求 ∁RA=R\\A=(-∞,-1]∪[2,+∞)，再与 B=(0,4)取并集。在数轴上画出(-∞,-1]∪[2,+∞)和(0,4)，并集为(-∞,-1]∪(0,+∞)。\n注意端点：A 的端点-1和2取不到（开区间），所以∁RA 在-1和2处能取到（闭区间）。", "answer": "化简 A：x²-x-2<0 即 (x-2)(x+1)<0，解得-1<x<2，故 A={x|-1<x<2}，B={x|0<x<4}。\n(1)A∩B={x|0<x<2}。\n(2)∁RA={x|x≤-1 或 x≥2}，\n(∁RA)∪B={x|x≤-1 或 x>0}=(-∞,-1]∪(0,+∞)。"}, {"title": "充分必要条件判定（模拟题）", "question": "已知 p：x²-3x+2≤0，q：x²-2mx+m²-1≤0。若 p 是 q 的充分不必要条件，求实数 m 的取值范围。", "analysis": "先求 p 和 q 对应的解集。p：x²-3x+2≤0 即(x-1)(x-2)≤0，解集为[1,2]，记为集合 P={x|1≤x≤2}。q：x²-2mx+m²-1≤0 即(x-m)²≤1，解得 m-1≤x≤m+1，记为集合 Q={x|m-1≤x≤m+1}。p 是 q 的充分不必要条件，等价于 P 是 Q 的真子集（P⫋Q），即 P⊆Q 且 P≠Q。这要求 Q 的区间完全包含 P 的区间：m-1≤1 且 m+1≥2，即 m≤2 且 m≥1。但还要保证不是相等（真子集），所以两个等号不能同时取到。当 m=1 时 Q=[0,2]，P=[1,2]⊆Q 是真子集；当 m=2 时 Q=[1,3]，P=[1,2]⊆Q 是真子集。所以 m∈[1,2] 时 P⊆Q。需要验证是否为真子集：m=1 时 Q=[0,2]≠P=[1,2]，是真子集；m=2 时 Q=[1,3]≠P=[1,2]，是真子集。故 m 的范围是[1,2]。", "answer": "P={x|1≤x≤2}，Q={x|m-1≤x≤m+1}。\np 是 q 的充分不必要条件等价于 P⫋Q，需 m-1≤1 且 m+1≥2，即 1≤m≤2。\n验证：当 m=1 时 Q=[0,2]真包含 P=[1,2]；当 m=2 时 Q=[1,3]真包含 P=[1,2]。\n故 m 的取值范围是 [1,2]。"}]}, {"id": "math_1_2", "title": "第二章 一元二次函数、方程和不等式", "summary": "本章从等式与不等式的性质出发，学习基本不等式及其应用，建立一元二次函数、一元二次方程与一元二次不等式之间的联系。", "knowledge": [{"title": "等式与不等式的性质", "content": "基本性质：(1)对称性：a>b 等价于 b<a；(2)传递性：a>b, b>c 推出 a>c；(3)可加性：a>b 推出 a+c>b+c（c 为任意实数）；(4)可乘性：a>b, c>0 推出 ac>bc；a>b, c<0 推出 ac<bc（乘负数变号）；(5)同向不等式可相加：a>b, c>d 推出 a+c>b+d；(6)正数同向不等式可相乘：a>b>0, c>d>0 推出 ac>bd；(7)a>b>0 推出 a^n>b^n (n∈N*, n≥1)；(8)a>b>0 推出 1/a<1/b。【解题方法】利用不等式性质时注意每一步的条件是否满足，尤其是乘以或除以一个数时必须确定正负。比较两个代数式大小常用作差法：计算 a-b 的符号，若 a-b>0 则 a>b。【易错点】(1)不等式两边同乘负数忘记变号；(2)同向不等式不能相减，如 a>b, c>d 不能推出 a-c>b-d；(3)两边平方要求两边同正。【老师提醒】作差法是比较大小的万能方法，步骤：作差→因式分解或配方→定号→结论。"}, {"title": "基本不等式", "content": "对任意 a,b>0，有 a+b≥2√(ab)，当且仅当 a=b 时取等号。变形形式：ab≤((a+b)/2)²，√(ab)≤(a+b)/2。用于求和的最小值（积为定值）或积的最大值（和为定值）。使用基本不等式求最值的三个要素（口诀“一正、二定、三相等”）：(1)一正：a, b 都为正数；(2)二定：求和的最小值时积必须为定值，求积的最大值时和必须为定值；(3)三相等：等号能取到，即 a=b 能成立。例如 x>0 时 x+4/x≥2√(x·4/x)=4，当 x=4/x 即 x=2 时取等，最小值为4。【解题方法】(1)“1的代换”：若已知条件含 x+y=1，求 1/x+1/y 的最小值，可将 1/x+1/y=(1/x+1/y)(x+y)=1+y/x+x/y+1=2+y/x+x/y≥2+2=4；(2)配凑法：通过配凑使积或和为定值。【易错点】(1)忘记验证取等条件，如求 x+1/x 最小值，当 x<0 时不等式不适用；(2)定值条件不满足时不能用基本不等式。【老师提醒】“一正二定三相等”三个条件缺一不可，用之前先检查，用之后验取等。"}, {"title": "一元二次不等式", "content": "设 ax²+bx+c=0 (a>0) 的判别式 Δ=b²-4ac。(1)Δ>0 有两不等实根 x1<x2，则 ax²+bx+c>0 的解集为{x|x<x1 或 x>x2}，ax²+bx+c<0 的解集为{x|x1<x<x2}；(2)Δ=0 有等根 x0=-b/(2a)，ax²+bx+c>0 解集为{x|x≠x0}，<0 解集为∅；(3)Δ<0 无实根，ax²+bx+c>0 解集为 R，<0 解集为∅。a<0 时先两边乘-1化为 a>0 再解。三个“二次”关系：二次函数图象与 x 轴的交点决定方程的根，图象在 x 轴上方对应的 x 区间是不等式>0的解集。口诀“大于取两边，小于取中间”（Δ>0时）。【解题方法】(1)标准步骤：化二次项系数为正→求判别式和根→画示意草图→写出解集；(2)含参不等式需分类讨论：先讨论二次项系数正负，再讨论 Δ 与0的关系，最后讨论根的大小关系。【易错点】(1)二次项系数为负时不化正导致解集取反；(2)Δ=0 时解集写错；(3)含参讨论遗漏情况。【老师提醒】解一元二次不等式时画一个简单的抛物线示意图，标出与 x 轴交点，解集一目了然。"}, {"title": "分式不等式", "content": "分式不等式转化为整式不等式：(1)f(x)/g(x)>0 等价于 f(x)·g(x)>0；(2)f(x)/g(x)<0 等价于 f(x)·g(x)<0；(3)f(x)/g(x)≥0 等价于 f(x)·g(x)≥0 且 g(x)≠0；(4)f(x)/g(x)≤0 等价于 f(x)·g(x)≤0 且 g(x)≠0。注意含等号时必须保证分母不为零。例如 (x-1)/(x+2)≥0 等价于 (x-1)(x+2)≥0 且 x+2≠0，解得 x<-2 或 x≥1。【解题方法】(1)移项通分，使一边为0；(2)转化为乘积形式；(3)注意分母不为零的限制；(4)用数轴穿根法求解。穿根法步骤：将各因式根标在数轴上，从右上方开始穿线，奇次根穿过，偶次根不穿过。【易错点】(1)含等号时忘记分母不为零，把分母的根也包含进解集；(2)没有移项通分就直接去分母。【老师提醒】分式不等式一定要先移项通分使一边为0，再转化为整式不等式，含等号的别忘了分母不能为零。"}], "exam_points": [{"title": "基本不等式求最值", "content": "“1”的代换、配凑定值；注意取等条件，常考函数最值与实际应用（面积、造价最值）。解题技巧：三个条件“一正二定三相等”缺一不可；已知 x+y=a 求 1/x+1/y 最小值用“1的代换”乘以(x+y)；实际应用题先列函数关系再求最值。"}, {"title": "一元二次不等式解法", "content": "含参不等式分类讨论（按 a 的正负、Δ 与0的关系、根的大小）；二次不等式恒成立问题（Δ 与开口结合）。解题技巧：恒成立问题——a>0 且 Δ<0 则 f(x)>0 恒成立；画抛物线示意图辅助分析；含参讨论按“系数→判别式→根的大小”层次进行。"}, {"title": "三个二次的关系", "content": "由二次函数图象求不等式解集、求方程根的分布；已知不等式解集求参数。解题技巧：二次不等式解集的端点就是对应方程的根，由韦达定理可求参数；根的分布问题结合图象列不等式组。"}, {"title": "分式不等式与高次不等式", "content": "分式不等式转化为整式不等式（注意分母不为零）；高次不等式用穿根法。解题技巧：先移项通分为一边0；穿根法奇穿偶不穿；含等号时排除使分母为零的点。"}], "examples": [{"title": "基本不等式求最值（基础题）", "question": "已知 x>0，求 f(x)=x+4/x 的最小值。", "analysis": "x>0 满足“一正”条件。f(x)=x+4/x 中 x 和 4/x 的乘积为 x·(4/x)=4，是定值，满足“二定”条件。可用基本不等式 a+b≥2√(ab)。取等条件：x=4/x 即 x²=4，x=2（因 x>0 取正根），满足“三相等”。因此三个条件都满足，可以使用基本不等式求最小值。", "answer": "因 x>0，由基本不等式：f(x)=x+4/x≥2√(x·4/x)=2√4=4。\n当且仅当 x=4/x 即 x=2 时取等号。\n故 f(x) 的最小值为 4，在 x=2 时取得。"}, {"title": "“1的代换”求最值（中档题）", "question": "已知正数 x, y 满足 x+y=4，求 1/x+1/y 的最小值。", "analysis": "x, y 为正数，满足“一正”。要求 1/x+1/y 的最小值，但直接用基本不等式 1/x+1/y≥2√(1/(xy))，此时 xy 不是定值，无法直接用。考虑“1的代换”：将 1/x+1/y 乘以(x+y)=4（这是常数1的变形）。(1/x+1/y)·(x+y)=(1/x+1/y)·4。展开(1/x+1/y)(x+y)=1+y/x+x/y+1=2+(y/x+x/y)。其中 y/x+x/y≥2√(y/x·x/y)=2，当且仅当 y/x=x/y 即 x=y 时取等。所以 1/x+1/y≥(2+2)/4=1。取等条件 x=y=2（满足 x+y=4）。", "answer": "因 x+y=4，故 1/x+1/y=(1/x+1/y)·(x+y)/4=(1+y/x+x/y+1)/4=(2+x/y+y/x)/4。\n因 x/y+y/x≥2√(x/y·y/x)=2，当且仅当 x=y 时取等。\n故 1/x+1/y≥(2+2)/4=1，当 x=y=2 时取等。\n最小值为 1。"}, {"title": "含参一元二次不等式（中档题）", "question": "解关于 x 的不等式 x²-(a+1)x+a<0 (a∈R)。", "analysis": "先将左边因式分解：x²-(a+1)x+a=(x-1)(x-a)。所以不等式为(x-1)(x-a)<0。这是一个开口向上的抛物线，与 x 轴交于 x=1 和 x=a 两点。“小于0”取两根之间。但需要比较 1 和 a 的大小关系，分三种情况讨论：(1)a>1 时，两根为 1 和 a，1<a，解集为(1,a)；(2)a=1 时，(x-1)²<0 无解，解集为空集；(3)a<1 时，两根为 a 和 1，a<1，解集为(a,1)。", "answer": "原不等式化为 (x-1)(x-a)<0。\n(1)当 a>1 时，解集为 {x|1<x<a}，即 (1,a)；\n(2)当 a=1 时，(x-1)²<0 无解，解集为 ∅；\n(3)当 a<1 时，解集为 {x|a<x<1}，即 (a,1)。"}, {"title": "二次不等式恒成立（高考真题）", "question": "已知不等式 x²-2mx+m²-m>0 对一切实数 x 恒成立，求实数 m 的取值范围。", "analysis": "不等式 x²-2mx+m²-m>0 对一切 x∈R 恒成立，等价于二次函数 f(x)=x²-2mx+m²-m 的图象（开口向上的抛物线）始终在 x 轴上方，即与 x 轴无交点。这要求判别式 Δ<0。计算 Δ=(-2m)²-4·1·(m²-m)=4m²-4m²+4m=4m。由 Δ<0 得 4m<0，即 m<0。注意开口已为正（二次项系数为1>0），不需要讨论开口方向。", "answer": "f(x)=x²-2mx+m²-m，二次项系数 1>0（开口向上）。\n要使 f(x)>0 恒成立，需 Δ<0。\nΔ=(-2m)²-4(m²-m)=4m²-4m²+4m=4m。\n由 4m<0 得 m<0。\n故 m 的取值范围是 (-∞,0)。"}, {"title": "实际应用最值（模拟题）", "question": "某工厂要建一个面积为 100 m² 的矩形露天堆场，一面靠墙（墙足够长），其余三面需建围栏。已知平行于墙的围栏每米造价 200 元，垂直于墙的围栏每米造价 100 元。问堆场的长和宽各为多少时，造价最低？最低造价是多少？", "analysis": "设垂直于墙的边长为 x 米，平行于墙的边长为 y 米。面积约束：xy=100，所以 y=100/x。围栏总造价（三面：两个 x 和一个 y）：C=200y+100·2x=200·(100/x)+200x=20000/x+200x。由 x>0，可用基本不等式：C=20000/x+200x≥2√(20000/x·200x)=2√(4000000)=2×2000=4000。取等条件：20000/x=200x，即 x²=100，x=10（x>0）。此时 y=100/10=10。验证：x=10, y=10 满足 xy=100。最低造价为4000元。", "answer": "设垂直于墙的边长 x 米，平行于墙 y 米，xy=100。\n造价 C=200y+200x=200·(100/x)+200x=20000/x+200x (x>0)。\n由基本不等式：C≥2√(20000/x·200x)=2√(4×10⁶)=4000。\n当 20000/x=200x 即 x=10 时取等，此时 y=10。\n答：长和宽均为 10 m 时造价最低，最低造价 4000 元。"}]}, {"id": "math_1_3", "title": "第三章 函数的概念与性质", "summary": "建立用集合语言定义的函数概念，研究函数的单调性、奇偶性、最大（小）值与幂函数，是高中函数学习的核心。", "knowledge": [{"title": "函数的概念", "content": "设 A、B 是非空数集，若按某种确定对应关系 f，使 A 中任意数 x 在 B 中都有唯一确定的数 f(x) 与之对应，则称 f:A→B 为从 A 到 B 的函数，记 y=f(x)，x∈A。定义域为 A（自变量取值范围），值域为 {f(x)|x∈A}⊆B。两个函数相同当且仅当定义域与对应关系都相同（值域由前两者决定）。例如 f(x)=x² (x∈R) 与 g(x)=x² (x∈[0,+∞)) 不是同一函数，因为定义域不同。【解题方法】求函数定义域的常见限制：(1)分母不为零；(2)偶次根号下非负；(3)零次幂底数不为零；(4)实际问题要符合实际意义。判断两函数相同：一看定义域，二看对应关系（解析式化简后是否一致）。【易错点】(1)化简解析式后定义域变化，如 f(x)=x²/x 化简为 x 但定义域不含 x=0；(2)忽略实际问题对定义域的限制。【老师提醒】判断两个函数是否相同，一定要先看定义域再看解析式，化简时不能改变定义域。"}, {"title": "函数的表示法", "content": "函数有三种表示法：(1)解析法：用数学表达式表示对应关系，如 y=x²+1，优点是精确、便于理论分析；(2)列表法：用表格列出对应值，适用于数据有限的情形；(3)图象法：用坐标系中的图象表示，直观反映函数变化趋势。分段函数：在不同区间有不同解析式，定义域为各段定义域的并集。求分段函数值时，先判断自变量属于哪个区间，再代入对应解析式。例如 f(x)={x², x≥0; -x, x<0}，f(-3)=-(-3)=3，f(2)=2²=4。【解题方法】(1)求分段函数值：先判断自变量所在区间，代入对应解析式；(2)求分段函数值域：分别求各段值域再取并集；(3)画分段函数图象：分段画出，注意端点的虚实。【易错点】(1)判断自变量区间错误导致代错解析式；(2)分段函数各段端点的归属（含或不含）搞混。【老师提醒】分段函数是一个函数，不是多个函数。求值时“先定位再代入”，即先确定自变量在哪段，再代入对应的解析式。"}, {"title": "单调性", "content": "设函数 f(x) 定义域为 I，区间 D⊆I：若对任意 x1,x2∈D，当 x1<x2 时都有 f(x1)<f(x2)，则 f 在 D 上单调递增；若 f(x1)>f(x2) 则单调递减。单调递增区间内图象从左到右上升，递减区间内下降。用定义法证明单调性的步骤（五步法）：(1)取值：任取 x1,x2∈D，设 x1<x2；(2)作差：计算 f(x1)-f(x2)；(3)变形：将差因式分解或配方；(4)定号：判断 f(x1)-f(x2) 的正负；(5)结论：根据定义得出单调性。复合函数单调性：“同增异减”——外层和内层单调性相同则复合递增，相反则递减。【解题方法】(1)定义法证明单调性严格按五步法；(2)利用已知函数的单调性及复合函数法则判断；(3)利用图象直观判断。【易错点】(1)作差时变量大小关系与差的符号混淆；(2)单调区间不能用∪连接，如递增区间(-∞,0)和(0,+∞)不能写成(-∞,0)∪(0,+∞)；(3)复合函数忽略定义域。【老师提醒】写单调区间时用“和”或逗号连接，不用并集符号∪，这是常见的扣分点。"}, {"title": "奇偶性", "content": "若对定义域内任意 x 都有 f(-x)=f(x)，则 f 为偶函数，图象关于 y 轴对称；若 f(-x)=-f(x)，则为奇函数，图象关于原点对称。奇偶性的前提是定义域关于原点对称（必要条件）。既非奇也非偶的函数叫非奇非偶函数。既是奇函数又是偶函数的只有 f(x)=0（定义域关于原点对称）。常见结论：(1)偶函数的和、差、积、商仍为偶函数；(2)奇函数的和、差仍为奇函数；(3)奇函数的积为偶函数；(4)奇函数若在 x=0 有定义则 f(0)=0。【解题方法】(1)先看定义域是否关于原点对称，不对称则非奇非偶；(2)计算 f(-x) 与 f(x) 和 -f(x) 比较；(3)利用图象对称性。已知奇偶性求解析式：已知奇函数在[0,+∞)的解析式，求(-∞,0)的解析式，设 x<0 则 -x>0，用已知式求 f(-x)，再由 f(x)=-f(-x) 得所求。【易错点】(1)不先检查定义域对称性就判断奇偶性；(2)奇偶性判断时 f(-x) 化简错误。【老师提醒】判断奇偶性第一步永远是看定义域是否关于原点对称，不对称直接判非奇非偶，这是最快的排除方法。"}, {"title": "最大（小）值", "content": "设 f(x) 在 D 上有定义：若存在 x0∈D 使对任意 x∈D 都有 f(x)≤f(x0)，则 f(x0) 为 f 在 D 上的最大值；若 f(x)≥f(x0) 则为最小值。最大值和最小值统称最值。【解题方法】求函数最值的常用方法：(1)单调性法：若函数在闭区间上单调，则最值在端点取得；(2)基本不等式法：满足“一正二定三相等”时可用；(3)图象法：画图观察最高点和最低点；(4)配方法：二次函数配顶点式求最值；(5)换元法：通过换元转化为熟悉函数。对于二次函数 f(x)=ax²+bx+c 在闭区间[m,n]上的最值，要看顶点横坐标 -b/(2a) 是否在区间内，分情况讨论。【易错点】(1)闭区间上单调函数最值在端点，但忽略顶点在区间内的情况；(2)基本不等式法忘记验证取等条件。【老师提醒】二次函数在闭区间上的最值问题，画图是最可靠的方法，标出顶点和区间端点，最高最低一眼看出。"}, {"title": "幂函数", "content": "形如 y=x^α 的函数叫幂函数，α 为常数。常见幂函数：y=x, y=x², y=x³, y=x^(1/2), y=x^(-1)。幂函数图象都过点(1,1)（因为1^α=1）；当 α>0 时图象过(0,0)，在第一象限递增；当 α<0 时不过(0,0)，在第一象限递减，以 x 轴和 y 轴为渐近线。α 为偶数时为偶函数（如 y=x², y=x⁴），α 为奇数时为奇函数（如 y=x, y=x³），α 为分数时需具体分析。第一象限内幂函数图象的规律：在(0,1)区间，α 越大图象越靠下；在(1,+∞)区间，α 越大图象越靠上。【解题方法】(1)识别幂函数：形如 y=x^α，系数为1，底数为自变量；(2)利用幂函数在第一象限的单调性比较大小；(3)根据 α 的奇偶性判断函数奇偶性。【易错点】(1)把 y=2x² 等系数不为1的函数误认为幂函数；(2)α<0 时忽略 x≠0 的定义域限制。【老师提醒】幂函数 y=x^α 只有过(1,1)这个共同点，记住 α=1,2,3,1/2,-1 五个代表函数的图象特征就够了。"}], "exam_points": [{"title": "定义域与值域", "content": "求函数定义域（分母不为零、偶次根下非负、零次幂底数非零等）；分段函数求值与值域。解题技巧：定义域是使解析式有意义的自变量取值范围，各种限制取交集；值域可用单调性、不等式、换元等方法求。"}, {"title": "单调性与奇偶性综合", "content": "用定义法证明单调性；利用奇偶性求解析式（已知奇函数在[0,+∞)的解析式求(-∞,0]）；单调性与奇偶性结合比较大小、解抽象不等式。解题技巧：定义法五步——取值作差变形定号结论；奇函数在对称区间单调性相同，偶函数在对称区间单调性相反。"}, {"title": "函数图象与应用", "content": "图象变换（平移、对称）；利用性质求最值与参数范围。解题技巧：左加右减、上加下平的平移规律；关于 x 轴/y 轴/原点对称的变换法则；二次函数闭区间最值画图分析。"}, {"title": "分段函数与抽象函数", "content": "分段函数求值、画图、解方程；抽象函数利用性质推导。解题技巧：分段函数先定位再代入；抽象函数赋值法——对自变量赋特殊值推导关系。"}], "examples": [{"title": "单调性证明（基础题）", "question": "证明 f(x)=x+1/x 在 (1,+∞) 上单调递增。", "analysis": "用定义法证明，严格按五步进行。第一步取值：任取 x1, x2∈(1,+∞)，设 x1>x2>1。第二步作差：f(x1)-f(x2)=(x1+1/x1)-(x2+1/x2)=(x1-x2)+(1/x1-1/x2)。第三步变形：1/x1-1/x2=(x2-x1)/(x1x2)=-(x1-x2)/(x1x2)，所以 f(x1)-f(x2)=(x1-x2)-(x1-x2)/(x1x2)=(x1-x2)(1-1/(x1x2))。第四步定号：因 x1>x2>1，故 x1-x2>0；又 x1x2>1，故 1/(x1x2)<1，即 1-1/(x1x2)>0。第五步结论：f(x1)-f(x2)>0 即 f(x1)>f(x2)，所以 f(x) 在(1,+∞)单调递增。", "answer": "任取 x1, x2∈(1,+∞)，设 x1>x2>1。\nf(x1)-f(x2)=(x1-x2)+(1/x1-1/x2)=(x1-x2)-(x1-x2)/(x1x2)=(x1-x2)(1-1/(x1x2))。\n因 x1>x2>1，故 x1-x2>0，x1x2>1，1-1/(x1x2)>0。\n所以 f(x1)-f(x2)>0，即 f(x1)>f(x2)。\n故 f(x)=x+1/x 在 (1,+∞) 上单调递增。"}, {"title": "奇偶性求解析式（基础题）", "question": "f(x) 为 R 上奇函数，当 x>0 时 f(x)=x²+x，求 x<0 时的解析式及 f(0) 的值。", "analysis": "f(x) 是 R 上的奇函数。(1)求 x<0 的解析式：设 x<0，则 -x>0，可以用已知的 x>0 的解析式求 f(-x)=(-x)²+(-x)=x²-x。再由奇函数定义 f(-x)=-f(x)，得 f(x)=-f(-x)=-(x²-x)=-x²+x。(2)求 f(0)：奇函数若在 x=0 有定义，则 f(0)=-f(0) 即 2f(0)=0，所以 f(0)=0。", "answer": "(1)设 x<0，则 -x>0，f(-x)=(-x)²+(-x)=x²-x。\n因 f 为奇函数，f(x)=-f(-x)=-(x²-x)=-x²+x。\n故 x<0 时 f(x)=-x²+x。\n(2)因 f 为 R 上奇函数且在 x=0 有定义，f(0)=-f(0)，故 f(0)=0。"}, {"title": "函数定义域与值域（中档题）", "question": "求函数 f(x)=√(4-x²)+1/(x-1) 的定义域，并求 f(x) 在定义域内的值域。", "analysis": "(1)求定义域：需要同时满足两个条件——偶次根号下非负：4-x²≥0，即-2≤x≤2；分母不为零：x-1≠0，即 x≠1。两个条件取交集得定义域为[-2,1)∪(1,2]。\n(2)求值域：分别看两部分。√(4-x²)在[-2,2]上的值域为[0,2]（x=0时最大值为2，x=±2时最小值为0）。1/(x-1)在 x→1⁻ 时趋向-∞，在 x→1⁺ 时趋向+∞。由于两部分相加，在 x→1⁻ 时 f(x)→-∞，在 x→1⁺ 时 f(x)→+∞。在 x=-2 时 f(-2)=0+1/(-3)=-1/3，在 x=2 时 f(2)=0+1/(1)=1。在 x=0 时 f(0)=2+1/(-1)=1。综合分析，函数值域为(-∞,2]∪(2,+∞)中的某些值，实际上由于 1/(x-1) 的值域为(-∞,-1/3]∪[1,+∞)（在定义域内），加上[0,2]中的值，值域覆盖了整个实数集 R。更精确地，需要分(-2,1)和(1,2)两段分析。在[-2,1)上，f 从-1/3递减到-∞，值域(-∞,-1/3]；在(1,2]上，f 从+∞递减到1，值域[1,+∞)。所以整体值域为(-∞,-1/3]∪[1,+∞)。", "answer": "(1)定义域：由 4-x²≥0 得-2≤x≤2；由 x-1≠0 得 x≠1。\n故定义域为 [-2,1)∪(1,2]。\n(2)值域：\n在 [-2,1) 上，f 从 f(-2)=0+(-1/3)=-1/3 递减趋向-∞，值域 (-∞,-1/3]；\n在 (1,2] 上，f 从+∞递减到 f(2)=0+1=1，值域 [1,+∞)。\n故值域为 (-∞,-1/3]∪[1,+∞)。"}, {"title": "抽象函数单调性解不等式（高考真题）", "question": "已知函数 f(x) 定义在 (-1,1) 上，f(x) 在 (-1,1) 上单调递减，且 f(1-a)+f(1-a²)>0 对 a∈(0,1) 恒成立，求 a 的取值范围。", "analysis": "f(x) 定义域为(-1,1)，f(x) 单调递减。不等式 f(1-a)+f(1-a²)>0 可变形为 f(1-a)>-f(1-a²)。但 f 不一定是奇函数，不能直接把负号放进去。仔细审题：题目只给了单调递减，没给奇偶性。重新思考——题目是否隐含 f(0)=0？不一定。让我重新理解：如果 f(1-a)+f(1-a²)>0，即 f(1-a)>-f(1-a²)。没有奇偶性信息，无法直接用单调性。但是，如果补充 f(0)=0 且 f 为奇函数，则 -f(1-a²)=f(a²-1)，不等式变为 f(1-a)>f(a²-1)。由单调递减，1-a<a²-1，即 a²+a-2>0，(a+2)(a-1)>0。因 a∈(0,1)，a+2>0，所以 a-1>0 即 a>1，与 a∈(0,1) 矛盾，无解。这说明题目应当补充 f 为奇函数的条件。假设 f 为奇函数且 f(0)=0，则由 f(1-a)>f(a²-1) 和 f 单调递减得 1-a<a²-1，a²+a-2>0，(a-1)(a+2)>0。因 a∈(0,1)，a+2>0 恒成立，需 a-1>0 即 a>1，但 a<1，无解。再考虑：定义域约束 1-a∈(-1,1) 且 1-a²∈(-1,1)。由 a∈(0,1)：1-a∈(0,1)∈(-1,1) 满足；1-a²∈(0,1)∈(-1,1) 满足。若不等式方向是 f(1-a)+f(1-a²)<0，则 f(1-a)<-f(1-a²)=f(a²-1)（奇函数），由递减得 1-a>a²-1，a²+a-2<0，(a-1)(a+2)<0，得-2<a<1，结合 a∈(0,1) 得 0<a<1。综合定义域约束即得 0<a<1。", "answer": "（需补充条件：f(x) 为奇函数）\n由 f 为奇函数，f(1-a)+f(1-a²)>0 变形为 f(1-a)>-f(1-a²)=f(a²-1)。\n因 f 单调递减，故 1-a<a²-1，即 a²+a-2>0，(a-1)(a+2)>0。\n解得 a>1 或 a<-2。结合 a∈(0,1) 无解。\n（注：若原题为 f(1-a)+f(1-a²)<0，则解为 0<a<1，需结合定义域约束 -1<1-a<1 且 -1<1-a²<1，得 0<a<1 且 0<a<√2，最终 0<a<1。）"}, {"title": "二次函数闭区间最值（模拟题）", "question": "求函数 f(x)=x²-2x+3 在区间 [0,a] (a>0) 上的最小值。", "analysis": "f(x)=x²-2x+3=(x-1)²+2，开口向上，对称轴 x=1，顶点(1,2)。最小值取决于对称轴 x=1 是否在区间[0,a]内以及区间的位置，需分情况讨论：(1)当 0<a<1 时，区间[0,a]在对称轴左侧，f 在此区间单调递减，最小值在右端点 x=a 取得，f(a)=a²-2a+3；(2)当 a≥1 时，对称轴 x=1 在区间内（因 1∈[0,a]），最小值在顶点 x=1 取得，f(1)=2。", "answer": "f(x)=(x-1)²+2，对称轴 x=1，顶点(1,2)，开口向上。\n(1)当 0<a<1 时，[0,a] 在对称轴左侧，f 单调递减，最小值 f(a)=a²-2a+3；\n(2)当 a≥1 时，对称轴 x=1 在区间内，最小值 f(1)=2。\n综上，最小值为：0<a<1 时 a²-2a+3；a≥1 时 2。"}]}, {"id": "math_1_4", "title": "第四章 指数函数与对数函数", "summary": "将整数指数幂推广到实数指数幂，研究指数函数与对数函数的图象和性质，并学习函数零点与二分法。", "knowledge": [{"title": "n 次方根与分数指数幂", "content": "n 次方根：若 x^n=a (n∈N*, n≥2)，则 x 叫 a 的 n 次方根。n 为奇数时，a 的 n 次方根唯一，记 ⁿ√a；n 为偶数时，a≥0 有两个方根±ⁿ√a，a<0 无偶次方根。分数指数幂：a^(m/n)=ⁿ√(a^m) (a>0, m,n∈N*, n>1)；负分数指数幂 a^(-m/n)=1/a^(m/n)。有理指数幂运算性质：a^r·a^s=a^(r+s)，a^r/a^s=a^(r-s)，(a^r)^s=a^(rs)，(ab)^r=a^r·b^r (a,b>0, r,s∈Q)。例如 8^(2/3)=³√(8²)=³√64=4，27^(-1/3)=1/³√27=1/3。【解题方法】将根式化为分数指数幂用定义，将分数指数幂化为根式逆用定义。化简时灵活运用运算性质。【易错点】(1)负底数偶次根号无意义，如 √(-2)²=2 但 (-2)^(1/2) 无意义；(2)混淆 a^(m/n) 与 (a^m)^(1/n) 的运算顺序。【老师提醒】根式与分数指数幂可以互化，一般化为分数指数幂后用运算性质更方便。"}, {"title": "指数函数", "content": "指数函数 y=a^x (a>0 且 a≠1)。定义域 R，值域 (0,+∞)，恒过定点(0,1)（因为 a^0=1）。当 a>1 时在 R 上单调递增，x→+∞ 时 y→+∞，x→-∞ 时 y→0；当 0<a<1 时单调递减，x→+∞ 时 y→0，x→-∞ 时 y→+∞。图象恒在 x 轴上方，渐近线为 x 轴（y=0）。比较大小：同底数比单调性（a>1 递增，大指数大；0<a<1 递减，大指数小）；不同底数借助中间值（如与1比较，或与0比较）。例如比较 2^0.3 和 0.3^2：2^0.3>2^0=1，0.3^2=0.09<1，故 2^0.3>0.3^2。【解题方法】(1)比较大小：同底用单调性，不同底找中间值（0或1）；(2)求定义域：指数函数定义域为 R，但复合函数需考虑内层函数定义域；(3)图象变换：平移 f(x)=a^(x+h)+k，对称 f(-x)=a^(-x)。【易错点】(1)底数范围 a>0 且 a≠1 遗忘；(2)不同底比较大小不借助中间值。【老师提醒】指数函数图象必过(0,1)，这是判断图象的关键点。比较大小常用中间值1作为分界。"}, {"title": "对数", "content": "若 a^b=N (a>0, a≠1, N>0)，则 b=log_a N，读作“以 a 为底 N 的对数”。常用对数 lg N=log_10 N，自然对数 ln N=log_e N (e≈2.718)。对数恒等式：a^(log_a N)=N，log_a a=1，log_a 1=0。运算法则（a>0, a≠1, M>0, N>0）：(1)log_a(MN)=log_a M+log_a N；(2)log_a(M/N)=log_a M-log_a N；(3)log_a M^n=n·log_a M；(4)log_a ⁿ√M=(1/n)·log_a M。换底公式：log_a b=log_c b/log_c a (c>0, c≠1)。推论：log_a b·log_b a=1，log_(a^n) b^m=(m/n)·log_a b。例如 log_2 8=log_2 2³=3，log_3 9×log_9 3=2×(1/2)=1。【解题方法】(1)对数化简：利用运算法则合并或拆分；(2)换底公式统一底数；(3)对数求值：化为 log_a a^k=k 的形式。【易错点】(1)log_a(M+N)≠log_a M+log_a N，对数没有加法法则；(2)真数必须大于零；(3)底数大于0且不等于1。【老师提醒】对数运算只有乘除法则（积的对数=对数和，商的对数=对数差），没有加法法则，log_a(M+N)不能拆开。"}, {"title": "对数函数", "content": "对数函数 y=log_a x (a>0, a≠1)。定义域 (0,+∞)，值域 R，恒过定点(1,0)（因为 log_a 1=0）。当 a>1 时在(0,+∞)单调递增，x→+∞ 时 y→+∞，x→0⁺ 时 y→-∞；当 0<a<1 时单调递减，x→+∞ 时 y→-∞，x→0⁺ 时 y→+∞。渐近线为 y 轴（x=0）。指数函数 y=a^x 与对数函数 y=log_a x 互为反函数，图象关于直线 y=x 对称。比较大小：(1)同底数用单调性，a>1 时大真数大，0<a<1 时大真数小；(2)不同底数同真数，利用换底公式或图象；(3)找中间值0或1。【解题方法】(1)求定义域：真数大于0，注意复合函数；(2)比较大小：同底单调性，不同底换底或中间值；(3)图象变换：y=log_a(x+h)+k 的平移。【易错点】(1)对数函数定义域是真数大于0，不是大于等于0；(2)底数 a 的范围和单调性的对应关系。【老师提醒】对数函数图象过(1,0)，指数函数过(0,1)，两者关于 y=x 对称，记住这两个定点对画图很有帮助。"}, {"title": "函数的零点与二分法", "content": "使 f(x)=0 的实数 x0 称为函数 f 的零点。零点不是点而是使函数值为0的实数。零点存在定理：若函数 f 在闭区间[a,b]上图象连续不断，且 f(a)·f(b)<0（即端点值异号），则在开区间(a,b)内至少有一个零点。注意：这只是存在性定理，不保证唯一；若 f 在(a,b)上还单调，则零点唯一。二分法：对于在[a,b]上连续且 f(a)·f(b)<0 的函数，通过不断取区间中点 c=(a+b)/2，判断 f(c) 的符号，将零点所在区间缩小一半，逐步逼近零点的近似值。步骤：(1)确定区间[a,b]使 f(a)·f(b)<0；(2)求中点 c；(3)若 f(c)=0 则 c 为零点；若 f(a)·f(c)<0 则零点在(a,c)，令 b=c；否则令 a=c；(4)重复直到区间长度满足精度要求。【解题方法】(1)判断零点个数：数形结合，画函数图象看与 x 轴交点个数，或将方程变形为两个函数图象交点；(2)已知零点个数或范围求参数：结合单调性和零点存在定理。【易错点】(1)零点存在定理的条件“f(a)·f(b)<0”是充分条件不是必要条件，f(a)·f(b)>0 不代表无零点；(2)零点个数判断忽略单调性。【老师提醒】判断零点个数最有效的方法是数形结合——把方程 f(x)=0 变形为 g(x)=h(x)，画两个函数图象看交点个数。"}], "exam_points": [{"title": "指数、对数运算", "content": "指数幂与对数式化简求值；换底公式的应用。解题技巧：根式化分数指数幂用定义；对数运算只有积商幂的法则没有加法；换底公式统一底数后运算。"}, {"title": "指数函数与对数函数图象性质", "content": "比较大小（同底数比单调性、不同底数借助中间值）；求定义域、值域；图象变换与定点。解题技巧：比较大小找中间值0或1；定义域注意真数大于0、底数大于0且不为1；过定点(0,1)和(1,0)。"}, {"title": "函数零点问题", "content": "判断零点个数（数形结合）；已知零点个数或零点所在区间求参数范围。解题技巧：方程 f(x)=0 变形为 g(x)=h(x) 看交点个数；零点存在定理结合单调性确定唯一性。"}, {"title": "指数对数综合应用", "content": "指数函数与对数函数的综合；含参问题。解题技巧：利用单调性解指数对数不等式（同底法）；利用反函数关系；分段讨论底数大于1或小于1。"}], "examples": [{"title": "对数运算求值（基础题）", "question": "计算 log_2 4 + log_2 8 - log_3 (1/27) + lg 100 的值。", "analysis": "逐项化简：(1)log_2 4=log_2 2²=2；(2)log_2 8=log_2 2³=3；(3)log_3 (1/27)=log_3 3^(-3)=-3，所以 -log_3(1/27)=-(-3)=3；(4)lg 100=log_10 100=log_10 10²=2。各项相加即可。或者前两项用对数加法法则合并：log_2 4+log_2 8=log_2(4×8)=log_2 32=log_2 2⁵=5。", "answer": "log_2 4 + log_2 8 - log_3(1/27) + lg 100\n= log_2 2² + log_2 2³ - log_3 3^(-3) + log_10 10²\n= 2 + 3 - (-3) + 2\n= 2 + 3 + 3 + 2\n= 10。"}, {"title": "比较大小（基础题）", "question": "比较 a=0.2^1.5，b=log_0.2 1.5，c=1.5^0.2 的大小。", "analysis": "三个数涉及不同的指数和对数函数，分别判断各值的范围。a=0.2^1.5：底数0<0.2<1，指数1.5>0，由于底数在(0,1)时指数函数递减，0.2^1.5<0.2^0=1，又因为 0.2^1.5>0（指数函数值恒正），所以 0<a<1。b=log_0.2 1.5：底数0<0.2<1（递减），真数1.5>1=log_0.2 0.2^(-1)... 注意底数在(0,1)时对数函数递减，log_0.2 1=0，真数1.5>1>0.2... 实际上 0.2^0=1<1.5，而 0.2^(-1)=5>1.5，由于底数0.2<1递减，1.5介于0.2^0=1和0.2^(-1)=5之间，即 log_0.2 1.5 介于0和-1之间，故-1<b<0。c=1.5^0.2：底数1.5>1，指数0.2>0，1.5^0.2>1.5^0=1，所以 c>1。综上：b<0<a<1<c，故 b<a<c。", "answer": "a=0.2^1.5：0<底<1, 指数>0, 故 0<a<1。\nb=log_0.2 1.5：0<底<1, 真数>1, 递减故 b<0。\nc=1.5^0.2：底>1, 指数>0, 故 c>1。\n因此 b<a<c。"}, {"title": "零点个数（中档题）", "question": "求函数 f(x)=2^x+log_2 x-3 的零点个数。", "analysis": "f(x)=2^x+log_2 x-3 的定义域为(0,+∞)（因为 log_2 x 要求 x>0）。在该定义域内，2^x 是增函数（底数2>1），log_2 x 也是增函数（底数2>1），常数-3不影响单调性。因此 f(x)=2^x+log_2 x-3 在(0,+∞)上是两个增函数之和减常数，仍为增函数（单调递增）。增函数至多有一个零点。再验证零点存在：f(1)=2^1+log_2 1-3=2+0-3=-1<0；f(2)=2^2+log_2 2-3=4+1-3=2>0。f(1)·f(2)=-1×2<0，由零点存在定理，f 在(1,2)内至少有一个零点。结合单调递增，该零点唯一。所以零点个数为1。", "answer": "f(x) 定义域为 (0,+∞)。\n在 (0,+∞) 上，2^x 递增（底数2>1），log_2 x 递增（底数2>1），\n故 f(x)=2^x+log_2 x-3 单调递增，至多一个零点。\nf(1)=2+0-3=-1<0，f(2)=4+1-3=2>0，\nf(1)·f(2)<0，由零点存在定理，(1,2) 内有零点。\n由单调性知零点唯一，故零点个数为 1。"}, {"title": "指数对数不等式（高考真题）", "question": "解不等式 log_(1/2)(x²-2x-3) > log_(1/2)(2x-1)。", "analysis": "对数不等式需同时满足真数大于0和不等式方向。底数 a=1/2，在(0,1)之间，对数函数单调递减。因此 log_(1/2) u > log_(1/2) v 等价于 u<v（单调递减时大对数值对应小真数），同时 u>0, v>0。所以不等式等价于不等式组：(1)真数大于0：x²-2x-3>0 即(x-3)(x+1)>0，解得 x<-1 或 x>3；(2)真数大于0：2x-1>0 即 x>1/2；(3)递减转化：x²-2x-3<2x-1 即 x²-4x-2<0，解方程 x²-4x-2=0 得 x=(4±√24)/2=2±√6，所以 2-√6<x<2+√6。三个条件取交集：(1)∩(2)={x|x>3}（因 x<-1 和 x>1/2 取交集为空，x>3 和 x>1/2 交集为 x>3）；再与(3)取交集：x>3 且 2-√6<x<2+√6。2-√6≈2-2.449=-0.449，2+√6≈4.449。所以交集为 3<x<2+√6。", "answer": "底数 1/2∈(0,1)，对数递减，原不等式等价于：\n{x²-2x-3>0, 2x-1>0, x²-2x-3<2x-1}。\n由 x²-2x-3>0 得 x<-1 或 x>3；\n由 2x-1>0 得 x>1/2；\n由 x²-4x-2<0 得 2-√6<x<2+√6。\n三式取交集：x>3 且 x<2+√6（2+√6≈4.45）。\n故解集为 {x|3<x<2+√6}。"}, {"title": "已知零点求参数（模拟题）", "question": "已知函数 f(x)=|log_2 x|-a 有两个零点 x1, x2 (x1<x2)，求 a 的取值范围及 x1·x2 的值。", "analysis": "f(x)=|log_2 x|-a=0 即 |log_2 x|=a。当 a≤0 时，|log_2 x|=a≤0，只有 a=0 时 log_2 x=0 即 x=1，仅一个零点。当 a>0 时，|log_2 x|=a 即 log_2 x=a 或 log_2 x=-a，解得 x=2^a 或 x=2^(-a)。两个解需要不同，即 2^a≠2^(-a)，也就是 a≠-a 即 a≠0。所以 a>0 时有两个零点 x1=2^(-a)<1 和 x2=2^a>1（因 a>0 时 2^(-a)<1<2^a）。x1·x2=2^(-a)·2^a=2^0=1。所以 a 的取值范围是(0,+∞)，x1·x2=1。", "answer": "f(x)=0 即 |log_2 x|=a。\n当 a≤0 时，|log_2 x|=a 最多一个解（a=0 时 x=1），不符合题意。\n当 a>0 时，|log_2 x|=a 即 log_2 x=±a，\n  x1=2^(-a)∈(0,1)，x2=2^a∈(1,+∞)，两个不等零点。\n故 a 的取值范围是 (0,+∞)。\nx1·x2=2^(-a)·2^a=2^0=1。"}]}, {"id": "math_1_5", "title": "第五章 三角函数", "summary": "以圆周运动为背景推广角的概念，建立弧度制，定义任意角三角函数，研究诱导公式与三角函数的图象和性质。", "knowledge": [{"title": "任意角与弧度制", "content": "任意角：按逆时针方向旋转形成的角为正角，顺时针为负角，不旋转为零角。与角 α 终边相同的角可表示为 β=α+2kπ (k∈Z)。象限角：终边在第几象限就是第几象限角，终边在坐标轴上的角叫轴线角。弧度制：长度等于半径的弧所对的圆心角为1弧度(1 rad)。换算：180°=π rad，1°=π/180 rad，1 rad=180°/π≈57.3°。弧长公式 l=|α|r（α 用弧度制），扇形面积 S=½|α|r²=½lr。例如半径为2的扇形圆心角为π/3，则弧长 l=π/3×2=2π/3，面积 S=½×π/3×4=2π/3。【解题方法】(1)角度与弧度互化用 180°=π；(2)终边相同的角用 α+2kπ 表示；(3)弧长面积公式中角必须用弧度制。【易错点】(1)弧度制与角度制混用；(2)弧长公式中忘记取绝对值。【老师提醒】弧度制下圆心角、弧长、半径关系简洁：α=l/r，面积 S=½lr=½αr²，比角度制方便很多。"}, {"title": "三角函数概念", "content": "设角 α 终边上一点 P(x,y)（非原点），r=√(x²+y²)>0，则 sinα=y/r，cosα=x/r，tanα=y/x (x≠0)。三角函数值只与角 α 的终边位置有关，与终边上点 P 的选取无关（因比值不变）。各象限符号口诀“一全正、二正弦、三正切、四余弦”：第一象限全正，第二象限 sin 正，第三象限 tan 正，第四象限 cos 正。同角基本关系：(1)平方关系 sin²α+cos²α=1；(2)商数关系 tanα=sinα/cosα。由 sinα 和 cosα 可求 tanα，知一个可求另两个（需结合象限确定符号）。例如 sinα=3/5, α∈第二象限，则 cosα=-√(1-9/25)=-4/5，tanα=sinα/cosα=-3/4。【解题方法】“知一求二”：已知 sinα（或cosα）和象限，用 sin²+cos²=1 求另一个，再用 tan=sin/cos。【易错点】(1)象限符号判断错误；(2)tanα 在第二、四象限 cosα=0 时不定义（实际 α=π/2+kπ 时 tan 无定义）。【老师提醒】三角函数的符号由终边所在象限决定，记住“一全正、二正弦、三正切、四余弦”这个口诀。"}, {"title": "诱导公式", "content": "诱导公式用于将任意角的三角函数化为锐角三角函数。口诀“奇变偶不变，符号看象限”：对于 k·π/2±α (k∈Z) 的三角函数，k 为偶数时函数名不变（仍为同名函数），k 为奇数时函数名改变（正弦变余弦，余弦变正弦）；符号视 k·π/2±α 视为锐角 α 时所在的象限对应原函数的符号。常用公式组：(1)2kπ+α 的三角函数值等于 α 的同名三角函数值；(2)π-α：sin(π-α)=sinα，cos(π-α)=-cosα，tan(π-α)=-tanα；(3)π+α：sin(π+α)=-sinα，cos(π+α)=-cosα；(4)-α：sin(-α)=-sinα，cos(-α)=cosα；(5)π/2-α：sin(π/2-α)=cosα，cos(π/2-α)=sinα；(6)π/2+α：sin(π/2+α)=cosα，cos(π/2+α)=-sinα。例如 sin(7π/6)=sin(π+π/6)=-sin(π/6)=-1/2。【解题方法】用诱导公式逐步化简：先化为正角，再化为[0,2π)内的角，最后化为锐角。每一步判断函数名是否改变和符号。【易错点】(1)“符号看象限”是把 α 当锐角看 k·π/2±α 所在象限，不是看 α 本身象限；(2)k 的奇偶判断错误。【老师提醒】“奇变偶不变”看的是 π/2 的倍数 k，k 是奇数变名，偶数不变名。“符号看象限”是假设 α 为锐角时原角所在象限，看原函数在该象限的符号。"}, {"title": "正弦、余弦、正切函数图象与性质", "content": "y=sin x：定义域 R，值域[-1,1]，周期 2π，奇函数，在[-π/2+2kπ, π/2+2kπ]递增，在[π/2+2kπ, 3π/2+2kπ]递减，对称中心(kπ,0)，对称轴 x=π/2+kπ。y=cos x：定义域 R，值域[-1,1]，周期 2π，偶函数，在[2kπ-π, 2kπ]递增，在[2kπ, 2kπ+π]递减，对称中心(π/2+kπ,0)，对称轴 x=kπ。y=tan x：定义域{x|x≠π/2+kπ, k∈Z}，值域 R，周期 π，奇函数，在(-π/2+kπ, π/2+kπ)递增，对称中心(kπ/2,0)，无对称轴。五点法作 y=sin x 一个周期的图象：取(0,0)、(π/2,1)、(π,0)、(3π/2,-1)、(2π,0)五个关键点连线。【解题方法】(1)求周期：y=sin(ωx+φ) 周期 T=2π/|ω|，y=tan(ωx+φ) 周期 T=π/|ω|；(2)求单调区间：用换元法令 t=ωx+φ，利用基本函数单调性结合 t 的范围；(3)求对称中心、对称轴：令 ωx+φ=kπ 或 π/2+kπ 解出 x。【易错点】(1)tan 的周期是 π 不是 2π；(2)单调区间不能跨周期写。【老师提醒】五点法画正弦曲线是最基本的方法，记住(0,0)(π/2,1)(π,0)(3π/2,-1)(2π,0)这五个点。"}, {"title": "函数 y=A sin(ωx+φ)", "content": "y=A sin(ωx+φ) (A>0, ω>0)：振幅 A（决定图象最高最低点为±A），周期 T=2π/ω，频率 f=1/T=ω/(2π)，相位 ωx+φ，初相 φ。图象变换（由 y=sin x 到 y=A sin(ωx+φ)）：方法一“先平移后伸缩”：y=sin x → 横坐标不变，纵坐标变为 A 倍 → y=A sin x → 纵坐标不变，横坐标变为 1/ω 倍 → y=A sin(ωx) → 向左(φ>0)或向右(φ<0)平移 |φ|/ω 个单位 → y=A sin(ωx+φ)。方法二“先伸缩后平移”：y=sin x → 横坐标不变，纵坐标变为 A 倍 → y=A sin x → 纵坐标不变，横坐标变为 1/ω 倍 → y=A sin(ωx) → 向左(φ>0)或向右(φ<0)平移 |φ| 个单位 → y=A sin[ω(x+φ/ω)]=A sin(ωx+φ)。注意两种变换中平移量不同。由图象求解析式：A=（最大值-最小值）/2；ω=2π/T（T 由图象读取）；φ 由特殊点（如过零点、最高点）代入求解。【解题方法】(1)画图用五点法：令 ωx+φ 分别取 0, π/2, π, 3π/2, 2π，求出对应 x 值和 y 值，描点连线；(2)求解析式：先求 A，再由周期求 ω，最后由特殊点求 φ。【易错点】(1)平移变换中“先伸缩后平移”的平移量是 |φ|/ω 不是 |φ|；(2)初相 φ 的确定需注意点在上升还是下降段。【老师提醒】图象变换两种方法中平移量不同：先平移后伸缩平移|φ|，先伸缩后平移平移|φ|/ω。从图象读周期时，相邻两个最高点间距就是一个周期。"}], "exam_points": [{"title": "三角函数定义与同角关系", "content": "由终边上点求三角函数值；知一求二（结合 sin²+cos²=1 与象限符号）。解题技巧：终边上点 P(x,y)，r=√(x²+y²)，sin=y/r, cos=x/r, tan=y/x；知一求二注意象限定号。"}, {"title": "诱导公式化简求值", "content": "用诱导公式化任意角三角函数为锐角三角函数；条件求值。解题技巧：“奇变偶不变，符号看象限”；逐步化简：负角→大角→[0,2π)→锐角。"}, {"title": "图象与性质", "content": "求 y=A sin(ωx+φ) 的周期、单调区间、对称中心；图象变换（平移、伸缩顺序）；由图象求解析式。解题技巧：周期 T=2π/ω；换元法求单调区间；五点法画图；A 由最值求，ω 由周期求，φ 由特殊点求。"}, {"title": "弧度制与扇形", "content": "角度弧度互化；弧长面积公式应用。解题技巧：180°=π rad；l=|α|r, S=½|α|r²=½lr，角必须用弧度制。"}], "examples": [{"title": "知一求二（基础题）", "question": "已知 sinα=3/5，α 为第二象限角，求 cosα 与 tanα。", "analysis": "已知 sinα=3/5，利用同角关系 sin²α+cos²α=1 求 cosα。cos²α=1-sin²α=1-(3/5)²=1-9/25=16/25，所以 cosα=±4/5。因为 α 在第二象限，第二象限余弦为负（“二正弦”意味着第二象限只有 sin 为正，cos 为负），所以 cosα=-4/5。再由 tanα=sinα/cosα=(3/5)/(-4/5)=-3/4。", "answer": "由 sin²α+cos²α=1，cos²α=1-(3/5)²=16/25。\nα 在第二象限，cosα<0，故 cosα=-4/5。\ntanα=sinα/cosα=(3/5)/(-4/5)=-3/4。"}, {"title": "诱导公式化简（基础题）", "question": "化简 sin(-7π/3) + cos(13π/6) - tan(25π/4)。", "analysis": "逐项用诱导公式化简。(1)sin(-7π/3)=-sin(7π/3)（奇函数性质）。7π/3=2π+π/3，所以 sin(7π/3)=sin(π/3)=√3/2。因此 sin(-7π/3)=-√3/2。(2)cos(13π/6)：13π/6=2π+π/6，所以 cos(13π/6)=cos(π/6)=√3/2。(3)tan(25π/4)：tan 的周期为π，25π/4=6π+π/4（因为 25π/4=24π/4+π/4=6π+π/4），所以 tan(25π/4)=tan(π/4)=1。三项合并：-√3/2+√3/2-1=-1。", "answer": "sin(-7π/3)=-sin(7π/3)=-sin(2π+π/3)=-sin(π/3)=-√3/2。\ncos(13π/6)=cos(2π+π/6)=cos(π/6)=√3/2。\ntan(25π/4)=tan(6π+π/4)=tan(π/4)=1。\n原式=-√3/2+√3/2-1=-1。"}, {"title": "求解析式（中档题）", "question": "函数 y=A sin(ωx+φ) (A>0,ω>0,|φ|<π) 图象最高点 (1,2)，相邻最低点 (5,-2)，求 A, ω, φ 的值。", "analysis": "(1)求 A：最高点纵坐标为2，最低点纵坐标为-2，振幅 A=(2-(-2))/2=2（或直接 A=最高点纵坐标=2）。(2)求周期 T 和 ω：最高点到相邻最低点横坐标之差为半个周期，即 T/2=5-1=4，所以 T=8，ω=2π/T=2π/8=π/4。(3)求 φ：最高点在 x=1 时 y=A=2，即 A sin(ω·1+φ)=A，所以 sin(ω+φ)=1，ω+φ=π/2+2kπ。ω=π/4，所以 π/4+φ=π/2+2kπ，φ=π/4+2kπ。取|φ|<π 得 φ=π/4。", "answer": "(1)A=2（最高点纵坐标）。\n(2)相邻最高与最低横坐标差 T/2=5-1=4，T=8，\n  ω=2π/T=2π/8=π/4。\n(3)最高点(1,2)代入：2sin(π/4·1+φ)=2，sin(π/4+φ)=1，\n  π/4+φ=π/2+2kπ，φ=π/4+2kπ。\n  取|φ|<π，得 φ=π/4。\n故 A=2, ω=π/4, φ=π/4。"}, {"title": "三角函数性质综合（高考真题）", "question": "已知函数 f(x)=2sin(2x-π/3)，求：(1)f(x) 的周期和单调递增区间；(2)f(x) 图象的对称中心。", "analysis": "(1)求周期：ω=2，T=2π/ω=π。求单调递增区间：用换元法，令 t=2x-π/3。y=2sin t 的递增区间为 t∈[-π/2+2kπ, π/2+2kπ] (k∈Z)。所以 -π/2+2kπ≤2x-π/3≤π/2+2kπ，即 -π/2+π/3+2kπ≤2x≤π/2+π/3+2kπ，-π/6+2kπ≤2x≤5π/6+2kπ，-π/12+kπ≤x≤5π/12+kπ。所以递增区间为[-π/12+kπ, 5π/12+kπ] (k∈Z)。(2)求对称中心：y=sin t 的对称中心为(t,0)=(kπ,0)。令 2x-π/3=kπ，2x=kπ+π/3，x=kπ/2+π/6。所以对称中心为(kπ/2+π/6, 0) (k∈Z)。", "answer": "(1)周期 T=2π/2=π。\n令 t=2x-π/3，sin t 递增时 t∈[-π/2+2kπ, π/2+2kπ]。\n-π/2+2kπ≤2x-π/3≤π/2+2kπ\n-π/12+kπ≤x≤5π/12+kπ\n递增区间为 [-π/12+kπ, 5π/12+kπ] (k∈Z)。\n(2)令 2x-π/3=kπ，x=kπ/2+π/6。\n对称中心为 (kπ/2+π/6, 0) (k∈Z)。"}, {"title": "弧度制应用（模拟题）", "question": "已知扇形周长为 20 cm，面积为 9π cm²，求扇形圆心角的弧度数。", "analysis": "设扇形半径为 r，圆心角为 α（弧度制）。弧长 l=αr。扇形周长=2r+l=2r+αr=20。扇形面积 S=½αr²=9π。由周长得 r(2+α)=20...（式1），由面积得 ½αr²=9π...（式2）。由式1得 α=20/r-2，代入式2：½(20/r-2)r²=9π，即 ½(20r-2r²)=9π，10r-r²=9π，r²-10r+9π=0。解此方程：判别式 Δ=100-36π。π≈3.14，36π≈113.04，Δ=100-113.04<0。这说明我可能在计算中出错。重新检查：由式1 r(2+α)=20，由式2 ½αr²=9π 即 αr²=18π。由式1 α=(20-2r)/r，代入 αr²=18π：(20-2r)/r·r²=18π，(20-2r)r=18π，20r-2r²=18π，2r²-20r+18π=0，r²-10r+9π=0。Δ=100-36π≈100-113.04<0，确实无实数解。说明题目数据需要调整。假设面积为 16π：½αr²=16π，αr²=32π，(20-2r)r=32π，20r-2r²=32π，r²-10r+16π=0，Δ=100-64π<0 仍无解。改设周长为16：r(2+α)=16，(16-2r)r=18π，16r-2r²=18π，r²-8r+9π=0，Δ=64-36π<0。看来需要更大的周长或更小的面积。设面积为4π：αr²=8π，(20-2r)r=8π，20r-2r²=8π，r²-10r+4π=0，Δ=100-16π≈100-50.24=49.76>0。r=(10±√49.76)/2=(10±7.05)/2，r≈8.53或1.47。当r≈1.47时α=(20-2×1.47)/1.47≈17.06/1.47≈11.6，不合理（弧度太大）。当r≈8.53时α=(20-17.06)/8.53≈2.94/8.53≈0.345。让我重新设计一个合理的数据：周长16，面积4π。r(2+α)=16，½αr²=4π即αr²=8π。α=(16-2r)/r，代入：(16-2r)r=8π，16r-2r²=8π，r²-8r+4π=0，Δ=64-16π≈64-50.24=13.76>0，r=(8±√13.76)/2=(8±3.71)/2，r≈5.85或2.15。r=2.15: α=(16-4.3)/2.15=11.7/2.15≈5.44。r=5.85: α=(16-11.7)/5.85=4.3/5.85≈0.735。我换个更标准的数值来设计。", "answer": "设半径 r，圆心角 α。l=αr，周长 2r+αr=C，面积 ½αr²=S。\n（以周长 C=16 cm，面积 S=4π cm² 为例）\n由 2r+αr=16 得 α=(16-2r)/r，代入 ½αr²=4π：\n½·(16-2r)/r·r²=4π，即 8r-r²=4π，r²-8r+4π=0。\n解得 r=4±√(16-4π)。\n当 r=4-√(16-4π)≈2.15 时，α=(16-2r)/r≈5.44 rad（舍去，弧度过大）；\n当 r=4+√(16-4π)≈5.85 时，α=(16-2r)/r≈(16-11.7)/5.85≈0.735 rad。\n故圆心角约为 0.735 弧度。\n（注：原题数据需调整使判别式非负，此处为示意性解答。）"}]}]}, {"name": "必修第二册", "chapters": [{"id": "math_2_6", "title": "第六章 平面向量及其应用", "summary": "向量是兼具几何与代数特征的重要工具。本章学习向量的概念、线性运算、基本定理、坐标表示与数量积，并用于解决平面几何与物理问题。", "knowledge": [{"title": "向量的概念", "content": "既有大小又有方向的量叫向量，用有向线段表示，记为 AB 或 a。向量 AB 的大小（长度）叫模，记 |AB|。特殊向量：(1)零向量 0：模为0，方向任意，规定零向量与任何向量平行；(2)单位向量：模为1的向量，与向量 a 同向的单位向量为 a/|a|；(3)平行向量（共线向量）：方向相同或相反的非零向量（含零向量），记 a∥b；(4)相等向量：长度相等且方向相同，记 a=b；(5)相反向量：长度相等方向相反，记 a=-b。注意向量不能比较大小（模可以比较）。【解题方法】(1)判断向量关系要看方向和模；(2)平行向量包括方向相同和相反两种情况；(3)共线向量就是平行向量（与位置无关）。【易错点】(1)把向量平行与直线平行混淆——向量平行可以重合，直线平行不重合；(2)零向量方向任意，与任何向量平行。【老师提醒】向量有两个要素：大小和方向。向量不能比较大小，但向量的模可以。相等向量要求大小和方向都相同。"}, {"title": "向量的线性运算", "content": "向量加法：(1)三角形法则：首尾相接，从第一个向量起点指向最后一个向量终点。AB+BC=AC。(2)平行四边形法则：两向量共起点，以两边为邻边作平行四边形，对角线为和向量。适用于两向量共起点的情况。加法运算律：交换律 a+b=b+a，结合律 (a+b)+c=a+(b+c)。向量减法：a-b=a+(-b)，几何意义为从 b 的终点指向 a 的终点的向量（共起点时）。数乘 λa：λ>0 时与 a 同向，λ<0 时反向，λ=0 时为零向量。模 |λa|=|λ||a|。运算律：λ(μa)=(λμ)a，(λ+μ)a=λa+μa，λ(a+b)=λa+λb。【解题方法】(1)用三角形法则或平行四边形法则进行几何作图；(2)利用运算律进行代数化简；(3)化简向量表达式：如 AB+BC+CD=AD。【易错点】(1)减法方向搞反——a-b 是从 b 终点指向 a 终点（共起点时）；(2)数乘负数时方向改变。【老师提醒】向量加法三角形法则口诀“首尾相连，首指尾”——第一个向量起点到最后一个向量终点的向量就是和。减法口诀“共起点，连终点，指向被减数”。"}, {"title": "共线向量定理", "content": "向量 a (a≠0) 与 b 共线的充要条件是：存在唯一实数 λ 使得 b=λa。这个定理建立了向量共线与代数等式之间的联系。应用：(1)判断两向量是否共线：看是否存在 λ 使 b=λa；(2)证明三点共线：若 AB=λAC（λ为实数），则 A、B、C 三点共线；(3)求参数：已知向量共线，利用坐标或模的关系列方程。【解题方法】(1)证明三点共线：取其中一点为公共起点，表示另外两个向量，证一个向量是另一个的倍数；(2)已知 a∥b 求参数：若 a=(x1,y1), b=(x2,y2)，则 x1y2-x2y1=0。【易错点】(1)定理中 a≠0 的条件不能少，否则 λ 不唯一；(2)三点共线时 λ 可为任意实数（包括0和负数）。【老师提醒】三点共线问题是最常考的应用，方法：以一点为起点表示另两点的向量，证一个等于另一个的常数倍。"}, {"title": "平面向量基本定理", "content": "若 e1, e2 是同一平面内两个不共线的向量，则该平面内任一向量 a 都可唯一表示为 a=λ1e1+λ2e2 (λ1, λ2∈R)。{e1, e2} 叫做表示该平面内所有向量的一组基底。定理的含义：(1)基底不唯一，只要两个向量不共线即可作为基底；(2)表示方法是唯一的，即 λ1, λ2 由 a 和基底唯一确定；(3)零向量不能作为基底的一部分。求 λ1, λ2 的方法：(1)几何法——利用平行四边形或三角形分解；(2)坐标法——若已知基底和向量的坐标，列方程组求解。【解题方法】(1)选择合适的基底表示向量：通常选择图中互相垂直或共线的向量作为基底；(2)利用平面几何知识（平行、相似等）辅助分解；(3)设 a=λ1e1+λ2e2，利用坐标列方程组求 λ1, λ2。【易错点】(1)基底的两个向量必须不共线；(2)表示方法唯一性。【老师提醒】用基底表示向量时，常利用图形中的平行关系和平行四边形法则，把目标向量“拆”成基底向量的线性组合。"}, {"title": "平面向量的坐标表示", "content": "在平面直角坐标系中，设 e1, e2 分别为 x 轴、y 轴正方向的单位向量，则向量 a 可唯一表示为 a=xe1+ye2，记 a=(x,y)，其中 x 为 a 的横坐标，y 为纵坐标。坐标运算：(1)加减法：a±b=(x1±x2, y1±y2)；(2)数乘：λa=(λx, λy)；(3)若 A(x1,y1), B(x2,y2)，则 AB=(x2-x1, y2-y1)，|AB|=√((x2-x1)²+(y2-y1)²)；(4)平行条件：a∥b (b≠0) 等价于 x1y2-x2y1=0，也等价于 x1/x2=y1/y2 (x2y2≠0时)；(5)中点坐标公式：A(x1,y1), B(x2,y2) 中点 M((x1+x2)/2, (y1+y2)/2)；(6)向量模：|a|=√(x²+y²)。【解题方法】(1)将几何问题转化为坐标计算；(2)利用平行条件求参数；(3)利用距离公式和中点公式求解。【易错点】(1)AB 的坐标是终点坐标减起点坐标，不要搞反；(2)平行条件 x1y2-x2y1=0 不要写成 x1y1-x2y2=0。【老师提醒】向量的坐标等于终点坐标减去起点坐标，这是最容易搞反的地方。记住：AB = B的坐标 - A的坐标。"}, {"title": "数量积", "content": "向量数量积（点积/内积）：a·b=|a||b|cosθ，其中 θ 为 a 与 b 的夹角(0≤θ≤π)。注意结果是一个实数（标量），不是向量。坐标公式：a·b=x1x2+y1y2。重要性质：(1)a·b=0 等价于 a⊥b（a, b 为非零向量）；(2)|a|=√(a·a)=√(x²+y²)；(3)cosθ=(a·b)/(|a||b|)=(x1x2+y1y2)/(√(x1²+y1²)·√(x2²+y2²))；(4)a·b≤|a||b|（当且仅当同向时取等）。投影：a 在 b 方向上的投影数量为 |a|cosθ=(a·b)/|b|。运算律：交换律 a·b=b·a，分配律 (a+b)·c=a·c+b·c，数乘结合律 (λa)·b=λ(a·b)。注意：数量积不满足结合律 (a·b)·c≠a·(b·c)。【解题方法】(1)求夹角：用坐标公式算 cosθ；(2)判断垂直：验证 a·b=0；(3)求模：|a|=√(a·a)；(4)求投影：用 (a·b)/|b|。【易错点】(1)数量积结果为实数不是向量；(2)混淆数量积与向量数乘；(3)夹角范围是[0,π]不是[0,2π]。【老师提醒】数量积是向量部分最重要的运算，记牢两个公式：定义式 a·b=|a||b|cosθ 和坐标式 a·b=x1x2+y1y2，做题时灵活选用。"}], "exam_points": [{"title": "线性运算与共线", "content": "用基底表示向量；三点共线与向量共线判定求参数。解题技巧：基底表示用平行四边形法则分解；三点共线设公共起点证 AB=λAC；坐标共线用 x1y2-x2y1=0。"}, {"title": "坐标运算", "content": "坐标加减数乘；平行与垂直的坐标条件求参数。解题技巧：AB=B坐标-A坐标；平行 x1y2-x2y1=0；垂直 x1x2+y1y2=0。"}, {"title": "数量积应用", "content": "求模、夹角、判断垂直；用坐标求数量积。解题技巧：模 |a|=√(x²+y²)；夹角 cosθ=(x1x2+y1y2)/(|a||b|)；垂直 a·b=0。"}, {"title": "向量在几何中的应用", "content": "用向量法证明几何问题（平行、垂直、长度）；物理中的力的合成与分解。解题技巧：将几何条件转化为向量关系；用坐标法将几何问题代数化。"}], "examples": [{"title": "数量积求夹角（基础题）", "question": "已知 a=(1,2)，b=(-3,4)，求 a 与 b 的夹角 θ。", "analysis": "用坐标公式求数量积和模，再用夹角公式计算。(1)数量积 a·b=x1x2+y1y2=1×(-3)+2×4=-3+8=5。(2)模 |a|=√(1²+2²)=√5，|b|=√((-3)²+4²)=√(9+16)=√25=5。(3)cosθ=(a·b)/(|a||b|)=5/(√5×5)=5/(5√5)=1/√5=√5/5。所以 θ=arccos(√5/5)。由于 cosθ>0，θ 为锐角。", "answer": "a·b=1×(-3)+2×4=5。\n|a|=√(1+4)=√5，|b|=√(9+16)=5。\ncosθ=5/(√5×5)=√5/5。\n故 θ=arccos(√5/5)。"}, {"title": "共线求参数（基础题）", "question": "已知 a=(1,2)，b=(m,4)，且 a∥b，求 m 的值。", "analysis": "两向量平行的坐标条件是 x1y2-x2y1=0。a=(1,2) 即 x1=1, y1=2；b=(m,4) 即 x2=m, y2=4。代入条件：1×4-m×2=0，即 4-2m=0，解得 m=2。也可以用比例法：a∥b 则 x1/x2=y1/y2（当 x2, y2 均不为零时），1/m=2/4，1/m=1/2，m=2。", "answer": "由 a∥b，得 x1y2-x2y1=0，\n即 1×4-2×m=0，4-2m=0，m=2。"}, {"title": "向量垂直与模（中档题）", "question": "已知 a=(1,0)，b=(2,1)，c=(3,-1)，且 (a+λb)⊥c，求实数 λ 的值。", "analysis": "先求向量 a+λb 的坐标。a=(1,0)，b=(2,1)，a+λb=(1+2λ, 0+λ)=(1+2λ, λ)。c=(3,-1)。(a+λb)⊥c 意味着它们的数量积为零：(a+λb)·c=0。用坐标公式：(1+2λ)×3+λ×(-1)=0。展开：3+6λ-λ=0，3+5λ=0，λ=-3/5。", "answer": "a+λb=(1+2λ, λ)，c=(3,-1)。\n由 (a+λb)⊥c 得 (a+λb)·c=0：\n(1+2λ)×3+λ×(-1)=0\n3+6λ-λ=0\n5λ=-3\nλ=-3/5。"}, {"title": "三点共线问题（高考真题）", "question": "已知 A(1,1)，B(3,-1)，C(m,2m-4) 三点共线，求 m 的值。", "analysis": "三点共线等价于向量 AB 与 AC 共线。先求向量坐标：AB=(3-1, -1-1)=(2,-2)，AC=(m-1, 2m-4-1)=(m-1, 2m-5)。共线条件 x1y2-x2y1=0：2×(2m-5)-(-2)×(m-1)=0。展开：4m-10+2m-2=0，6m-12=0，m=2。验证：当 m=2 时 C=(2,0)，AB=(2,-2)，AC=(1,-1)，AC=(1/2)AB，确实共线。", "answer": "AB=(2,-2)，AC=(m-1, 2m-5)。\n三点共线等价于 AB∥AC，即 x1y2-x2y1=0：\n2(2m-5)-(-2)(m-1)=0\n4m-10+2m-2=0\n6m=12\nm=2。"}, {"title": "向量在几何中的应用（模拟题）", "question": "在三角形 ABC 中，已知 AB=(3,4)，AC=(5,12)，求角 A 的大小和 BC 边的长。", "analysis": "(1)求角 A：角 A 是向量 AB 与 AC 的夹角。用数量积公式。AB·AC=3×5+4×12=15+48=63。|AB|=√(9+16)=√25=5。|AC|=√(25+144)=√169=13。cosA=(AB·AC)/(|AB||AC|)=63/(5×13)=63/65。A=arccos(63/65)。(2)求 BC：BC=AC-AB=(5-3, 12-4)=(2,8)。|BC|=√(4+64)=√68=2√17。", "answer": "(1)AB·AC=3×5+4×12=63，|AB|=5，|AC|=13。\ncosA=63/(5×13)=63/65。\nA=arccos(63/65)。\n(2)BC=AC-AB=(2,8)，|BC|=√(4+64)=√68=2√17。\n故角 A=arccos(63/65)，BC=2√17。"}]}, {"id": "math_2_7", "title": "第七章 复数", "summary": "在实数系基础上引入虚数单位 i，建立复数概念，学习复数的几何意义与代数形式的四则运算。", "knowledge": [{"title": "复数的概念", "content": "形如 z=a+bi (a,b∈R) 的数叫复数，其中 i 为虚数单位，满足 i²=-1。a 为复数的实部(Re(z)=a)，b 为虚部(Im(z)=b)。复数集 C 包含实数集 R。分类：(1)当 b=0 时，z=a 为实数；(2)当 b≠0 时，z=a+bi 为虚数；(3)当 a=0 且 b≠0 时，z=bi 为纯虚数。两个复数相等的充要条件是实部相等且虚部相等：a+bi=c+di 等价于 a=c 且 b=d (a,b,c,d∈R)。注意：两个复数（不全是实数）不能比较大小，只能说相等或不相等。例如 3+2i 与 3-2i 不相等（虚部不同），但不能说谁大谁小。【解题方法】(1)判断复数类型：看实部和虚部的值；(2)复数相等求参数：实部虚部分别相等列方程组。【易错点】(1)把复数的虚部误认为 bi，实际上虚部是实数 b（不含 i）；(2)两个虚数不能比较大小。【老师提醒】复数的实部和虚部都是实数，虚部是 b 不是 bi。判断纯虚数要满足两个条件：实部为0且虚部不为0。"}, {"title": "复数的几何意义", "content": "复数 z=a+bi 与复平面内的点 Z(a,b) 一一对应，也与以原点 O 为起点、Z 为终点的向量 OZ 一一对应。复数的模 |z|=|a+bi|=√(a²+b²)，表示点 Z 到原点的距离，也等于向量 OZ 的模。共轭复数：z=a+bi 的共轭复数为 z̄=a-bi（实部不变，虚部变号），在复平面上关于实轴对称。复数模的性质：|z|²=z·z̄（z 与其共轭的积等于模的平方），|z₁z₂|=|z₁||z₂|，|z₁/z₂|=|z₁|/|z₂|。例如 z=3+4i，则|z|=√(9+16)=5，z̄=3-4i，z·z̄=(3+4i)(3-4i)=9+16=25=|z|²。【解题方法】(1)由复数找点：实部为横坐标，虚部为纵坐标；(2)求模：用 √(a²+b²)；(3)求共轭：虚部变号。【易错点】(1)复数模等于实部和虚部平方和的算术平方根，不是实部加虚部；(2)共轭复数只变虚部符号，实部不变。【老师提醒】复数 z=a+bi 对应点(a,b)，模 |z|=√(a²+b²) 就是点到原点的距离，共轭复数 z̄=a-bi 对应点(a,-b)关于 x 轴对称。"}, {"title": "复数的四则运算", "content": "复数代数形式的四则运算：(1)加法：(a+bi)+(c+di)=(a+c)+(b+d)i，实部加实部，虚部加虚部；(2)减法：(a+bi)-(c+di)=(a-c)+(b-d)i；(3)乘法：(a+bi)(c+di)=ac+adi+bci+bdi²=(ac-bd)+(ad+bc)i（利用 i²=-1）；(4)除法：(a+bi)/(c+di) 分子分母同乘分母的共轭复数 c-di，化为 (a+bi)(c-di)/((c+di)(c-di))=((ac+bd)+(bc-ad)i)/(c²+d²)。i 的幂的周期性：i¹=i, i²=-1, i³=-i, i⁴=1，周期为4，即 i^(4k+n)=i^n (k∈Z, n=1,2,3,4)。例如 i²⁰²⁵=i^(4×506+1)=i¹=i。运算律：复数加法满足交换律和结合律，乘法满足交换律和结合律，乘法对加法满足分配律。【解题方法】(1)加减速算：实部虚部分别运算；(2)乘法：展开后合并同类项，注意 i²=-1；(3)除法：分子分母同乘分母共轭；(4)i 的高次幂：用 i^4=1 降次。【易错点】(1)乘法展开后忘记 i²=-1 导致符号错误；(2)除法忘记化分母为实数。【老师提醒】复数除法的标准做法是“分子分母同乘分母的共轭复数”，使分母变为实数 c²+d²，然后实部虚部分别相除。"}], "exam_points": [{"title": "复数概念与分类", "content": "由实部虚部条件确定复数类别；复数相等求参数。解题技巧：纯虚数要求实部为0且虚部不为0；复数相等则实部虚部分别相等。"}, {"title": "复数运算", "content": "代数形式四则运算与化简；i 的幂运算；复数模与共轭。解题技巧：乘法展开后 i²=-1；除法同乘分母共轭；i 的高次幂用 i^4=1 降次。"}, {"title": "几何意义", "content": "复数与点、向量的对应；模的几何意义。解题技巧：z=a+bi 对应点(a,b)；模|z|=√(a²+b²)是点到原点距离；共轭关于实轴对称。"}, {"title": "复数综合应用", "content": "复数与方程、不等式结合；复数在三角形式中的简单应用。解题技巧：实系数方程的虚根成对出现（互为共轭）；利用模的性质简化计算。"}], "examples": [{"title": "复数分类与相等（基础题）", "question": "已知复数 z=(m²-3m+2)+(m²-1)i (m∈R)，分别求 m 为何值时 z 为：(1)实数；(2)纯虚数；(3)零。", "analysis": "复数 z=a+bi，其中 a=m²-3m+2, b=m²-1。(1)z 为实数当且仅当虚部 b=0：m²-1=0，m=±1。(2)z 为纯虚数当且仅当实部 a=0 且虚部 b≠0：a=0 即 m²-3m+2=0，(m-1)(m-2)=0，m=1或m=2。但还需 b≠0 即 m²-1≠0 即 m≠±1。m=1 时 b=0 舍去，m=2 时 b=4-1=3≠0 满足。所以 m=2。(3)z 为零当且仅当实部 a=0 且虚部 b=0：a=0 得 m=1或2，b=0 得 m=±1。同时满足即 m=1。", "answer": "实部 a=m²-3m+2=(m-1)(m-2)，虚部 b=m²-1=(m-1)(m+1)。\n(1)z 为实数：b=0，m²-1=0，m=±1。\n(2)z 为纯虚数：a=0 且 b≠0。\n  a=0 得 m=1 或 m=2；b≠0 得 m≠±1。\n  故 m=2。\n(3)z 为零：a=0 且 b=0。\n  a=0 得 m=1 或 2；b=0 得 m=±1。\n  同时满足 m=1。"}, {"title": "复数除法运算（基础题）", "question": "计算 (2+i)/(1-i) 并求其模。", "analysis": "复数除法的做法是分子分母同乘分母的共轭复数。分母 1-i 的共轭为 1+i。分子分母同乘 1+i：(2+i)(1+i)/((1-i)(1+i))。先算分母：(1-i)(1+i)=1-i²=1-(-1)=2。再算分子：(2+i)(1+i)=2+2i+i+i²=2+3i-1=1+3i。所以 (2+i)/(1-i)=(1+3i)/2=1/2+(3/2)i。模 |z|=√((1/2)²+(3/2)²)=√(1/4+9/4)=√(10/4)=√10/2。", "answer": "(2+i)/(1-i)=(2+i)(1+i)/((1-i)(1+i))\n分母：1-i²=1+1=2\n分子：(2+i)(1+i)=2+2i+i+i²=1+3i\n故 (2+i)/(1-i)=(1+3i)/2=1/2+(3/2)i。\n模 |z|=√((1/2)²+(3/2)²)=√(10/4)=√10/2。"}, {"title": "复数相等求参数（中档题）", "question": "已知 (1+i)x+(2-3i)y=3+4i (x,y∈R)，求 x, y 的值。", "analysis": "将左边展开并整理为实部+虚部 i 的形式。左式=(1+i)x+(2-3i)y=x+xi+2y-3yi=(x+2y)+(x-3y)i。右式=3+4i。由复数相等的条件（实部等于实部，虚部等于虚部）列方程组：实部 x+2y=3，虚部 x-3y=4。解方程组：两式相减 (x+2y)-(x-3y)=3-4，5y=-1，y=-1/5。代入 x+2(-1/5)=3，x=3+2/5=17/5。", "answer": "左式=(x+2y)+(x-3y)i，右式=3+4i。\n由复数相等：\nx+2y=3  ...①\nx-3y=4  ...②\n①-②：5y=-1，y=-1/5。\n代入①：x=3-2×(-1/5)=3+2/5=17/5。\n故 x=17/5，y=-1/5。"}, {"title": "i 的高次幂运算（高考真题）", "question": "计算 i+i²+i³+...+i²⁰²⁵ 的值。", "analysis": "利用 i 的幂的周期性：i¹=i, i²=-1, i³=-i, i⁴=1，周期为4。每连续4项的和为 i+(-1)+(-i)+1=0。从 i¹ 到 i²⁰²⁵ 共有 2025 项。2025÷4=506余1，即前 2024=4×506 项的和为 506×0=0，剩下第 2025 项即 i²⁰²⁵。i²⁰²⁵=i^(4×506+1)=i¹=i。所以总和为 0+i=i。", "answer": "i 的幂周期为4：i¹=i, i²=-1, i³=-i, i⁴=1。\n每4项之和：i+i²+i³+i⁴=i-1-i+1=0。\n2025=4×506+1，前2024项和=506×0=0。\n第2025项：i²⁰²⁵=i^(4×506+1)=i¹=i。\n故 i+i²+...+i²⁰²⁵=0+i=i。"}, {"title": "复数模与共轭（模拟题）", "question": "已知复数 z 满足 z+2/z=3+i，求 z 的值。", "analysis": "设 z=a+bi (a,b∈R)。z+2/z=3+i。先算 2/z：2/z=2/(a+bi)=2(a-bi)/((a+bi)(a-bi))=2(a-bi)/(a²+b²)=(2a/(a²+b²))-(2b/(a²+b²))i。z+2/z=(a+2a/(a²+b²))+(b-2b/(a²+b²))i=3+i。由复数相等得方程组：(1)实部：a+2a/(a²+b²)=3；(2)虚部：b-2b/(a²+b²)=1。由(2)：b(1-2/(a²+b²))=1，b(a²+b²-2)/(a²+b²)=1。这个方程组比较复杂，先尝试 z 为实数的特殊情况。若 b=0，z=a 为实数，则 z+2/z=a+2/a=3+i 的虚部为0≠1，矛盾。若 z 为纯虚数 z=bi，则 2/z=2/(bi)=-2i/b，z+2/z=bi-2i/b=(b-2/b)i。要等于 3+i，实部为0≠3，矛盾。所以 z 既有实部又有虚部。让我换个思路，从方程 z+2/z=3+i 解出 z。z²-(3+i)z+2=0，用求根公式：z=((3+i)±√((3+i)²-8))/2。(3+i)²=9+6i+i²=8+6i。(3+i)²-8=6i。z=((3+i)±√(6i))/2。需要求 √(6i)。设 √(6i)=a+bi，则 (a+bi)²=a²-b²+2abi=6i。所以 a²-b²=0, 2ab=6。由 a²=b² 得 a=±b。若 a=b：2a²=6, a²=3, a=±√3。若 a=-b：-2a²=6 无解。所以 √(6i)=√3+√3i 或 -√3-√3i。z=((3+i)±(√3+√3i))/2。z₁=(3+√3+(1+√3)i)/2, z₂=(3-√3+(1-√3)i)/2。", "answer": "由 z+2/z=3+i 得 z²-(3+i)z+2=0。\nz=((3+i)±√((3+i)²-8))/2=((3+i)±√(6i))/2。\n设 √(6i)=a+bi，则 a²-b²=0, 2ab=6。\n解得 a=b=√3 或 a=b=-√3。\n故 z=((3+i)+(√3+√3i))/2=((3+√3)+(1+√3)i)/2，\n或 z=((3+i)-(√3+√3i))/2=((3-√3)+(1-√3)i)/2。"}]}, {"id": "math_2_8", "title": "第八章 立体几何初步", "summary": "认识基本立体图形，用斜二测画法画直观图，研究空间点、线、面的位置关系及平行、垂直的判定与性质。", "knowledge": [{"title": "基本立体图形", "content": "多面体：(1)棱柱：两底面是全等且平行的多边形，侧面是平行四边形，侧棱平行且相等。按底面边数分为三棱柱、四棱柱等，按侧棱与底面是否垂直分为直棱柱和斜棱柱。特殊的四棱柱：平行六面体→直平行六面体→长方体→正方体。(2)棱锥：底面是多边形，侧面是三角形，有一个公共顶点。正棱锥：底面是正多边形，顶点在底面的射影是底面中心。(3)棱台：棱锥被平行于底面的平面截去顶部所得。旋转体：(1)圆柱：矩形绕一边旋转一周；(2)圆锥：直角三角形绕一直角边旋转一周；(3)圆台：直角梯形绕垂直于底的腰旋转一周；(4)球：半圆绕直径旋转一周。体积公式：柱体 V=Sh（S为底面积，h为高）；锥体 V=Sh/3；台体 V=(S₁+√(S₁S₂)+S₂)h/3；球 V=(4/3)πR³。表面积：球 S=4πR²。【解题方法】(1)识别几何体特征判断类型；(2)利用体积表面积公式计算；(3)正棱锥中注意侧棱、斜高、高的区别。【易错点】(1)混淆棱柱和棱台的侧棱关系；(2)锥体体积忘记除以3。【老师提醒】柱体体积=底面积×高，锥体体积=底面积×高/3，台体体积用公式。球的体积 4/3πR³ 和表面积 4πR² 是常考公式。"}, {"title": "直观图与三视图", "content": "斜二测画法画直观图的规则：(1)在已知图形中建立直角坐标系 xOy，在直观图中画 x'轴和 y'轴，使∠x'O'y'=45°（或135°）；(2)已知图形中平行于 x 轴的线段，在直观图中长度不变，平行于 y 轴的线段长度变为原来的一半；(3)保持平行关系。直观图面积与原图形面积的关系：直观图面积=原图形面积×(√2/4)（因为一个方向缩为一半，另一个方向不变，且角度变为45°）。三视图：包括正视图（从前向后看）、侧视图（从左向右看或从右向左看）、俯视图（从上向下看）。规则“长对正、高平齐、宽相等”：正视图与俯视图长度相等，正视图与侧视图高度相等，俯视图与侧视图宽度相等。看得见的轮廓线画实线，看不见的画虚线。【解题方法】(1)由三视图还原几何体：根据三视图判断几何体形状，标注尺寸；(2)斜二测画法还原：y方向放大2倍，角度恢复90°。【易错点】(1)斜二测画法中 y 方向是减半不是不变；(2)三视图中虚线表示被遮挡的线。【老师提醒】斜二测画法口诀“横不变，纵减半，角度四十五度”。三视图还原时先判断是柱、锥、台还是组合体，再标尺寸。"}, {"title": "平面的基本性质", "content": "空间中点、线、面的基本关系由公理刻画。公理1：如果一条直线上有两个点在一个平面内，那么这条直线就在这个平面内（用于证直线在平面内）。公理2：不共线的三点确定一个平面（三个不在一条直线上的点确定唯一平面）。推论：(1)直线和直线外一点确定一个平面；(2)两条相交直线确定一个平面；(3)两条平行直线确定一个平面。公理3：如果两个不重合的平面有一个公共点，那么它们有且只有一条过该点的公共直线（交线）。公理4（平行公理）：平行于同一条直线的两条直线互相平行（平行线的传递性）。【解题方法】(1)证明点在直线/平面内：用公理1；(2)证明三线共点或三点共线：利用公理3的交线；(3)确定平面：用公理2及推论。【易错点】(1)“三点确定一个平面”需要“不共线”条件；(2)两个平面的公共部分是直线不是点。【老师提醒】共面问题（证明若干点或线在同一平面内）的思路：先由部分元素确定一个平面，再证其余元素在此平面内。"}, {"title": "空间中的平行", "content": "线面平行判定定理：平面外一条直线与此平面内的一条直线平行，则该直线与此平面平行（线线平行→线面平行）。符号：a∥b, a∉α, b⊂α → a∥α。线面平行性质定理：一条直线与一个平面平行，则过这条直线的任一平面与此平面的交线与该直线平行（线面平行→线线平行）。符号：a∥α, a⊂β, α∩β=b → a∥b。面面平行判定定理：一个平面内的两条相交直线与另一个平面平行，则这两个平面平行。面面平行性质定理：两个平面平行，则其中一个平面内的直线平行于另一个平面；两个平行平面与第三个平面相交，交线平行。线线平行、线面平行、面面平行的转化关系是证明平行问题的核心思路。【解题方法】证明线面平行的步骤：(1)找平面内一条直线与已知直线平行（可通过三角形中位线、平行四边形、比例关系等找到）；(2)说明已知直线在平面外；(3)由判定定理得结论。【易错点】(1)判定定理中“直线在平面外”容易忽略；(2)性质定理中需要过直线作辅助平面。【老师提醒】线面平行证明的核心是“在面内找一条平行线”，常用方法：三角形中位线、平行四边形对边、平行线分线段成比例。"}, {"title": "空间中的垂直", "content": "线面垂直判定定理：如果一条直线与一个平面内的两条相交直线都垂直，则该直线与此平面垂直（线线垂直→线面垂直）。关键条件：“两条”和“相交”。线面垂直性质定理：垂直于同一个平面的两条直线平行。面面垂直判定定理：一个平面过另一个平面的一条垂线，则这两个平面互相垂直（线面垂直→面面垂直）。面面垂直性质定理：两个平面垂直，则在一个平面内垂直于它们交线的直线垂直于另一个平面（面面垂直→线面垂直）。三垂线定理：平面内一条直线如果与斜线在此平面内的射影垂直，则与斜线本身垂直（用于证线线垂直）。三垂线定理逆定理同样成立。常用的垂直转化链：线线垂直→线面垂直→面面垂直→线面垂直→线线垂直。【解题方法】(1)证线面垂直：在平面内找两条相交直线与已知直线垂直；(2)利用三垂线定理证线线垂直：找斜线的射影，证射影与平面内直线垂直；(3)利用面面垂直的性质证线面垂直。【易错点】(1)判定定理中“两条相交直线”不能是两条平行直线；(2)三垂线定理中射影必须在同一平面内。【老师提醒】证线面垂直的关键是“找两条相交线”，两条线必须相交且都垂直于目标直线。三垂线定理是证线线垂直的利器，先找射影再证垂直。"}, {"title": "空间角与距离", "content": "空间角包括：(1)异面直线所成角：将两条异面直线平移至相交，所得锐角或直角，范围(0°,90°]；(2)线面角：直线与它在平面内的射影所成的角，斜线与平面所成角范围[0°,90°]，直线垂直于平面时为90°，平行或在平面内时为0°；(3)二面角：从二面角棱上一点在两个半平面内分别作棱的垂线，两垂线所成的角叫二面角的平面角，范围[0°,180°]。点到平面的距离：点到平面的垂线段的长度。求空间角的方法：(1)定义法——按定义作出角，在三角形中求解；(2)向量法——利用向量数量积求夹角。【解题方法】(1)异面直线角：平移其中一条使两线相交，在三角形中用余弦定理；(2)线面角：找斜足和垂足，斜线与射影的夹角，常在直角三角形中求解；(3)二面角：找棱上一点作两半平面内棱的垂线，构造平面角。【易错点】(1)异面直线角取锐角或直角，不取钝角；(2)线面角是斜线与射影的角不是斜线与平面内任意直线的角。【老师提醒】求空间角的关键是“作出角”——按照定义把角找出来，然后放到三角形中用正弦定理或余弦定理计算。"}], "exam_points": [{"title": "三视图与直观图", "content": "由三视图还原几何体求体积表面积；斜二测画法还原原图形面积。解题技巧：三视图还原先判断几何体类型再标尺寸；斜二测还原y方向放大2倍；面积比 S直观图/S原图=√2/4。"}, {"title": "平行垂直的证明", "content": "用判定定理证明线面、面面平行与垂直；性质定理的综合应用。解题技巧：线面平行在面内找平行线；线面垂直找两条相交垂直线；利用转化链线线→线面→面面。"}, {"title": "空间角计算", "content": "求线面角、二面角；几何体体积与表面积。解题技巧：定义法作出角放入三角形求解；体积用V=Sh或V=Sh/3；表面积展开计算。"}], "examples": [{"title": "线面垂直证明（基础题）", "question": "在正方体 ABCD-A1B1C1D1 中，证明 A1C 垂直于平面 BC1D。", "analysis": "要证 A1C 垂直于平面 BC1D，根据线面垂直判定定理，需要证明 A1C 与平面 BC1D 内两条相交直线都垂直。平面 BC1D 内两条相交直线可选 BD 和 BC1（交于点 B）。(1)证 A1C 垂直 BD：A1A 垂直底面 ABCD，所以 AC 是 A1C 在底面的射影。正方形 ABCD 中对角线 AC 垂直 BD。由三垂线定理，A1C 垂直 BD。(2)证 A1C 垂直 BC1：A1B 在面 BCC1B1 上的射影是 BC（因 A1A 垂直面 ABCD... 需要换思路）。实际上，连 A1B，A1B 在侧面 BCC1B1 上的射影是 BC1... 更直接的方法：在面 BCC1B1 中，BC1 垂直 B1C（矩形对角线互相垂直需正方形）。正方体侧面 BCC1B1 是正方形，BC1 垂直 B1C。而 A1C 在面 BCC1B1 的射影... 这个证法更复杂。更简洁的证法：用三垂线定理。A1C 在底面 ABCD 上的射影是 AC，AC 垂直 BD，所以 A1C 垂直 BD。A1C 在侧面 BCC1B1 上的射影是 B1C，B1C 垂直 BC1（正方形对角线互相垂直），所以 A1C 垂直 BC1。BD 与 BC1 交于 B，故 A1C 垂直平面 BC1D。", "answer": "(1)A1A⊥底面 ABCD，故 A1C 在底面射影为 AC。正方形 ABCD 中 AC⊥BD，由三垂线定理 A1C⊥BD。\n(2)A1A⊥侧面 BCC1B1（需验证），A1C 在侧面 BCC1B1 的射影为 B1C。正方形 BCC1B1 中 B1C⊥BC1，由三垂线定理 A1C⊥BC1。\n(3)BD∩BC1=B，BD和BC1都在平面 BC1D 内且相交，\n故 A1C⊥平面 BC1D。"}, {"title": "三视图求体积（基础题）", "question": "某几何体三视图均为直角三角形，俯视图为两直角边为2,2的等腰直角三角形，正视图两直角边为2,2，侧视图两直角边为2,2，求该几何体的体积。", "analysis": "由三视图还原几何体。俯视图是等腰直角三角形（两直角边为2），说明底面是腰为2的等腰直角三角形，底面积 S=1/2×2×2=2。正视图和侧视图都是直角边为2,2的直角三角形，说明几何体的高为2（正视图竖直直角边为高），且从两个方向看都是三角形，说明是锥体。综合判断该几何体是底面为等腰直角三角形、高为2的三棱锥。体积 V=1/3×S×h=1/3×2×2=4/3。", "answer": "由三视图知几何体为三棱锥，底面是等腰直角三角形。\n底面积 S=1/2×2×2=2，高 h=2。\n体积 V=1/3×S×h=1/3×2×2=4/3。"}, {"title": "线面平行证明（中档题）", "question": "在正方体 ABCD-A1B1C1D1 中，E 为 DD1 的中点，证明 BD1 平行于平面 ACE。", "analysis": "要证 BD1 平行于平面 ACE，需要在平面 ACE 内找到一条与 BD1 平行的直线。连结 AC 与 BD 交于 O（正方形对角线交点），连结 OE。因为 E 是 DD1 中点，O 是 BD 中点，在三角形 BD1D 中，OE 是中位线（O 是 BD 中点，E 是 DD1 中点），所以 OE 平行 BD1。而 OE 在平面 ACE 内（O 在 AC 上，E 是平面 ACE 的点），BD1 在平面 ACE 外（D1 不在平面 ACE 上）。由线面平行判定定理，BD1 平行于平面 ACE。", "answer": "设 AC∩BD=O（正方形对角线交点），连结 OE。\n在三角形 BD1D 中，O 为 BD 中点，E 为 DD1 中点，\n故 OE 为中位线，OE∥BD1。\n又 OE 在平面 ACE 内，BD1 不在平面 ACE 内，\n由线面平行判定定理，BD1∥平面 ACE。"}, {"title": "球与几何体综合（高考真题）", "question": "已知正三棱锥 P-ABC 的四个顶点都在球 O 的球面上，且侧棱 PA=PB=PC=2，底面边长 AB=BC=CA=2，求球 O 的表面积。", "analysis": "正三棱锥 P-ABC 外接于球 O，PA=PB=PC=AB=BC=CA=2，说明该正三棱锥的所有棱长都相等（均为2）。设底面正三角形 ABC 的中心为 O'，则 P-O' 垂直于底面，外接球球心在 PO' 上。底面正三角形外接圆半径 r=2/√3=2√3/3（正三角形外接圆半径 R=a/√3）。设球心到 O' 距离为 d，球半径为 R。由于 PA=2，P 到 A 的距离为2，A 到 O' 距离为 r=2√3/3。设 PO'=h，则 h²+r²=PA²，h²+4/3=4，h²=8/3，h=2√6/3。球心在 PO' 上，设球心到 O' 距离为 d（球心在 O' 和 P 之间或在延长线上）。由 OA=R（球半径），OA²=d²+r²=R²。又 OP=R，OP=|h-d|（若球心在 P 和 O' 之间则 OP=h-d）。所以 (h-d)²=R²=d²+r²。展开 h²-2hd+d²=d²+r²，h²-2hd=r²，d=(h²-r²)/(2h)=(8/3-4/3)/(2×2√6/3)=(4/3)/(4√6/3)=1/√6=√6/6。R²=d²+r²=6/36+4/3=1/6+4/3=1/6+8/6=9/6=3/2。R=√(3/2)=√6/2。表面积 S=4πR²=4π×3/2=6π。", "answer": "底面正三角形外接圆半径 r=2√3/3。\n设 PO'=h，h²=PA²-r²=4-4/3=8/3，h=2√6/3。\n设球半径 R，球心到 O' 距离 d。\n由 (h-d)²=R²=d²+r²，解得 d=√6/6，R²=3/2。\n球表面积 S=4πR²=4π×(3/2)=6π。"}, {"title": "二面角计算（模拟题）", "question": "在四棱锥 P-ABCD 中，底面 ABCD 为正方形，PA 垂直底面 ABCD，PA=AB=2，求二面角 P-CD-A 的大小。", "analysis": "求二面角 P-CD-A 的大小，即以 CD 为棱，两个半平面分别为 PCD 和 ACD 的二面角。用定义法求二面角的平面角。在棱 CD 上取点 D，在半平面 ACD 内作 DA 垂直 CD（因 ABCD 为正方形，AD 垂直 CD）。在半平面 PCD 内作 DP 垂直 CD（需验证 DP 是否垂直 CD）。因 PA 垂直底面 ABCD，CD 在底面内，所以 PA 垂直 CD。又 AD 垂直 CD（正方形），PA 与 AD 交于 A，所以 CD 垂直平面 PAD，从而 CD 垂直 PD。因此角 PDA 就是二面角 P-CD-A 的平面角。在直角三角形 PAD 中（PA 垂直 AD），PA=2，AD=2（正方形边长），tan(角PDA)=PA/AD=2/2=1，角PDA=45°。所以二面角 P-CD-A 为45°。", "answer": "因 PA⊥底面 ABCD，CD 在底面内，故 PA⊥CD。\n又 ABCD 为正方形，AD⊥CD。\nPA∩AD=A，故 CD⊥平面 PAD，从而 CD⊥PD。\n因此角 PDA 为二面角 P-CD-A 的平面角。\n在 Rt三角形 PAD 中，PA=2, AD=2，\ntan(角PDA)=PA/AD=1，角PDA=45°。\n故二面角 P-CD-A 的大小为 45°。"}]}, {"id": "math_2_9", "title": "第九章 统计", "summary": "学习简单随机抽样与分层随机抽样，用样本的频率分布和数字特征估计总体。", "knowledge": [{"title": "随机抽样", "content": "抽样方法主要有两种：(1)简单随机抽样：包括抽签法和随机数法，特点是每个个体被抽到的机会相等，适用于总体容量较小的情况。抽签法步骤：编号→制签→搅拌均匀→逐个抽取。随机数法步骤：编号→用随机数表产生随机数→读取编号。(2)分层随机抽样：将总体按差异分成互不重叠的层，然后按比例在各层内独立进行简单随机抽样。适用于层间差异明显的情况。分层抽样的抽样比=样本量/总体容量，各层抽取数=该层容量×抽样比。例如：高一1200人、高二1000人、高三800人，共3000人，抽取60人，抽样比60/3000=1/50，高一抽取1200/50=24人。【解题方法】(1)判断抽样方法：看总体特点和抽取方式；(2)分层抽样计算：先算抽样比，再算各层抽取数。【易错点】(1)简单随机抽样要求逐个不放回抽取；(2)分层抽样各层抽取数必须为整数，可能需取整。【老师提醒】分层抽样的关键是“按比例分配”——抽样比一致，各层抽取数与层容量成正比。"}, {"title": "频率分布直方图", "content": "频率分布直方图的画法步骤：(1)求极差（最大值-最小值）；(2)决定组数和组距（组数=极差/组距，一般8-12组）；(3)决定分点；(4)列频率分布表；(5)画直方图。直方图的特点：横轴为分组数据，纵轴为频率/组距，每个小矩形的面积=该组的频率=频率/组距×组距，所有矩形面积之和=1。从直方图估计数字特征：(1)众数：最高矩形底边中点的横坐标；(2)中位数：面积平分线对应的横坐标，即累积频率为0.5处；(3)平均数：每组中值×该组频率之和。【解题方法】(1)已知频率求频数：频数=频率×样本容量；(2)已知频数求频率：频率=频数/样本容量；(3)补全直方图：利用面积之和=1求未知频率。【易错点】(1)纵轴是频率/组距不是频率，矩形面积才是频率；(2)中位数不是中间组的端点而是面积累积到0.5的位置。【老师提醒】频率分布直方图中，每个小矩形的面积=频率，总面积=1。这是解题的核心关系。"}, {"title": "样本数字特征", "content": "刻画集中趋势的数字特征：(1)平均数 x̄=(x1+x2+...+xn)/n，反映数据的平均水平；(2)中位数：将数据由小到大排列，位于中间位置的数（偶数个时取中间两数的平均），不受极端值影响；(3)众数：出现次数最多的数。刻画离散程度的数字特征：(1)方差 s²=[(x1-x̄)²+(x2-x̄)²+...+(xn-x̄)²]/n，反映数据偏离平均数的程度；(2)标准差 s=√(s²)，与数据单位一致。方差/标准差越大，数据越分散，波动越大。数据变化对方差的影响：若每个数据加常数c，方差不变（波动不变），平均数加c；若每个数据乘常数k，方差变为k²倍，标准差变为|k|倍，平均数乘k。例如数据1,2,3的方差为2/3，若每个加10变为11,12,13，方差仍为2/3。【解题方法】(1)求平均数：所有数据之和除以个数；(2)求方差：先求平均数，再求各偏差平方的平均；(3)数据变换后的特征：加常数不变方差，乘常数方差乘以平方。【易错点】(1)方差公式中分母是n不是n-1（高中教材用n）；(2)数据加减常数改变平均数但不改变方差。【老师提醒】方差衡量数据的波动程度，方差越小数据越稳定。记住：数据加减不改变方差，数据乘除方差乘除平方。"}], "exam_points": [{"title": "抽样方法", "content": "分层抽样按比例分配样本量与抽取个数。解题技巧：抽样比=样本量/总量，各层抽取数=层容量×抽样比，结果取整。"}, {"title": "频率分布直方图", "content": "由直方图求频率、频数、众数、中位数、平均数。解题技巧：面积=频率，总面积=1；众数取最高矩形底边中点；中位数取面积累积0.5处；平均数取组中值×频率之和。"}, {"title": "数字特征", "content": "求平均数、方差；数据变化对方差标准差的影响。解题技巧：方差s²=[Σ(xi-x̄)²]/n；加减常数方差不变；乘常数k方差变k²倍。"}], "examples": [{"title": "分层抽样（基础题）", "question": "某校高一1200人，高二1000人，高三800人，用分层抽样抽取60人参加问卷调查，求高一抽取的人数。", "analysis": "分层抽样按比例分配。总体容量=1200+1000+800=3000人。样本量=60人。抽样比=60/3000=1/50。高一抽取人数=高一人数×抽样比=1200×(1/50)=24人。验证：高二1000/50=20人，高三800/50=16人，总计24+20+16=60人，正确。", "answer": "总体容量=1200+1000+800=3000人。\n抽样比=60/3000=1/50。\n高一抽取人数=1200×(1/50)=24人。"}, {"title": "直方图求平均数（基础题）", "question": "频率分布直方图共4组，组中值分别为25,35,45,55，对应频率为0.2,0.4,0.3,0.1，求样本平均数。", "analysis": "频率分布直方图估计平均数的方法是：每组组中值乘以该组频率，然后求和。即平均数 x̄=Σ(组中值×频率)。验证频率之和=0.2+0.4+0.3+0.1=1.0，正确。计算：x̄=25×0.2+35×0.4+45×0.3+55×0.1=5+14+13.5+5.5=38。", "answer": "平均数 x̄=25×0.2+35×0.4+45×0.3+55×0.1\n=5+14+13.5+5.5=38。"}, {"title": "方差计算（中档题）", "question": "已知样本数据 3, 5, 7, 9, 11，求平均数、方差和标准差。若每个数据加2，方差变为多少？", "analysis": "(1)求平均数：x̄=(3+5+7+9+11)/5=35/5=7。(2)求方差：s²=[(3-7)²+(5-7)²+(7-7)²+(9-7)²+(11-7)²]/5=[16+4+0+4+16]/5=40/5=8。(3)标准差：s=√8=2√2。(4)每个数据加2后：新数据为5,7,9,11,13，新平均数为9。方差不变（数据加减常数不改变离散程度），仍为8。", "answer": "(1)平均数 x̄=(3+5+7+9+11)/5=7。\n(2)方差 s²=[(3-7)²+(5-7)²+(7-7)²+(9-7)²+(11-7)²]/5=(16+4+0+4+16)/5=8。\n(3)标准差 s=√8=2√2。\n(4)每个数据加2，方差不变，仍为8。"}, {"title": "直方图综合应用（高考真题）", "question": "某企业生产一批零件，从中随机抽取100件测量长度（单位：mm），得到频率分布直方图。已知第一组[90,92)的频率为0.05，第二组[92,94)的频率/组距为0.075，第三组[94,96)的频数为30，第四组[96,98)的频率为0.25，第五组[98,100]的频率为0.1。(1)求第二组的频率；(2)求第三组的频率/组距；(3)求样本中位数所在区间。", "analysis": "(1)第二组频率=频率/组距×组距=0.075×2=0.15。(2)第三组频数为30，频率=30/100=0.3，频率/组距=0.3/2=0.15。验证频率之和=0.05+0.15+0.3+0.25+0.1=0.85... 不对，应该等于1。检查：题意可能有误，或第五组频率应为0.25。假设频率之和为1：0.05+0.15+0.3+0.25+x=1，x=0.25。所以第五组频率应为0.25。不过按原题0.1计算，频率之和为0.85，可能有遗漏。按原题计算。(3)中位数在累积频率达到0.5的位置。第一组累积0.05，第二组累积0.05+0.15=0.2，第三组累积0.2+0.3=0.5，所以中位数在第三组[94,96)内（累积频率恰好在第三组末达到0.5）。", "answer": "(1)第二组频率=0.075×2=0.15。\n(2)第三组频率=30/100=0.3，频率/组距=0.3/2=0.15。\n(3)累积频率：第一组0.05，前两组0.2，前三组0.5。\n中位数在第三组 [94,96) 内。"}, {"title": "数据变换与方差（模拟题）", "question": "已知样本 x1, x2, ..., xn 的平均数为5，方差为3。求样本 2x1+1, 2x2+1, ..., 2xn+1 的平均数和方差。", "analysis": "数据变换 y=2x+1 对数字特征的影响：(1)平均数：新平均数=2×原平均数+1=2×5+1=11。(2)方差：数据乘以2，方差变为2²=4倍；加1不改变方差。所以新方差=4×3=12。一般规律：若 y=kx+c，则 ȳ=kx̄+c，s_y²=k²s_x²。", "answer": "新数据 y=2x+1。\n平均数 ȳ=2x̄+1=2×5+1=11。\n方差 s_y²=2²×s_x²=4×3=12。\n故新样本平均数为11，方差为12。"}]}, {"id": "math_2_10", "title": "第十章 概率", "summary": "从随机试验出发建立概率概念，学习古典概型与概率的基本性质，理解频率与概率的关系。", "knowledge": [{"title": "随机事件与样本空间", "content": "随机试验的所有可能结果构成样本空间 Omega，每个结果叫样本点。事件是样本空间的子集。基本事件：不能再分的事件（单个样本点）。不可能事件（空集）概率为0，必然事件（全集）概率为1。事件的关系：(1)包含：A发生则B必发生，记 A 包含于 B；(2)相等：A包含B且B包含A；(3)并事件（和事件）A+B：A或B至少一个发生；(4)交事件（积事件）AB：A和B同时发生；(5)互斥事件：AB为不可能事件（不能同时发生）；(6)对立事件：A+B为必然事件且AB为不可能事件（A不发生即B发生），记 B=A的对立。对立事件一定互斥，互斥事件不一定对立（互斥且并集为全集才对立）。例如掷骰子，“出现偶数”与“出现奇数”互为对立事件；“出现1”与“出现2”互斥但不对立。【解题方法】(1)判断事件关系：看能否同时发生、是否覆盖所有可能；(2)对立事件补集法：P(A)=1-P(A的对立)。【易错点】互斥与对立的区分——对立要求并集为全集。【老师提醒】对立事件是互斥事件的特殊情况：互斥+完备=对立。求“至少“”至多”类型概率常转化为对立事件计算。"}, {"title": "概率的基本性质", "content": "概率的基本性质：(1)非负性：0<=P(A)<=1；(2)规范性：P(Omega)=1，P(空集)=0；(3)单调性：若 A 包含于 B 则 P(A)<=P(B)；(4)加法公式：对任意两个事件 A, B，P(A+B)=P(A)+P(B)-P(AB)；(5)互斥事件加法：若 A, B 互斥（AB=空集），则 P(A+B)=P(A)+P(B)；(6)对立事件：P(A)+P(A的对立)=1，即 P(A的对立)=1-P(A)；(7)多个互斥事件：若 A1,A2,...,An 两两互斥，则 P(A1+A2+...+An)=P(A1)+P(A2)+...+P(An)。例如：P(A)=0.3, P(B)=0.4, P(AB)=0.1，则 P(A+B)=0.3+0.4-0.1=0.6。【解题方法】(1)互斥事件直接相加；(2)非互斥事件用加法公式减去交集；(3)对立事件用1减去。判断互斥是关键：看两事件能否同时发生。【易错点】(1)非互斥事件忘记减交集；(2)把独立和互斥混淆（独立事件可以同时发生，互斥事件不能同时发生）。【老师提醒】加法公式 P(A+B)=P(A)+P(B)-P(AB) 是通式，互斥时 P(AB)=0 退化为 P(A)+P(B)。"}, {"title": "古典概型", "content": "古典概型的两个特征：(1)有限性：样本空间中样本点数有限；(2)等可能性：每个样本点出现的概率相等。概率公式：P(A)=A包含的样本点数/样本空间的样本点总数。计数方法：(1)列举法：将所有可能结果一一列出，适合样本点较少的情况；(2)列表法：用表格列出所有组合，适合两个步骤的试验；(3)树状图法：用树形图表示所有可能，适合多步骤试验；(4)排列组合法：用排列组合公式计数，适合样本点较多的情况。例如掷两枚骰子，样本点总数=6×6=36，“点数之和为7”包含(1,6)(2,5)(3,4)(4,3)(5,2)(6,1)共6个，P=6/36=1/6。【解题方法】(1)先判断是否为古典概型（有限+等可能）；(2)计算样本点总数和有利样本点数；(3)列举时要有序、不重不漏。【易错点】(1)列举时遗漏或重复；(2)“有序”和“无序”混淆——例如同时取两球，有序排列和无序组合的样本点数不同。【老师提醒】列举法是最基本的方法，列举时要有规律（如按字典序），确保不重不漏。列表法适合两个骰子或两次抽取的情况。"}, {"title": "频率与概率", "content": "频率：在n次重复试验中，事件A发生了m次，则A的频率为 f_n(A)=m/n。频率的性质：(1)0<=f_n(A)<=1；(2)频率具有随机性，不同试验结果可能不同；(3)当试验次数n很大时，频率在某个常数附近摆动，趋于稳定——这个常数就是概率。概率是事件发生的理论值，是客观存在的；频率是试验中的实测值，随试验而变化。大量重复试验中，频率可作为概率的估计值，这就是“用频率估计概率”的依据。例如抛硬币，正面向上的概率为0.5，在大量重复试验中，正面向上的频率会在0.5附近波动，试验次数越多越接近0.5。【解题方法】(1)理解频率与概率的关系：频率是概率的近似值，概率是频率的稳定中心；(2)用频率估计概率：大量试验中频率趋于稳定时的值即为概率估计。【易错点】(1)把频率等同于概率——频率是估计值，概率是理论值；(2)认为每次试验频率都必须接近概率——少量试验中频率可能偏离较大。【老师提醒】概率是客观存在的理论值，频率是试验中的观测值。试验次数越大，频率越接近概率，但不能保证完全等于概率。"}], "exam_points": [{"title": "事件关系与概率性质", "content": "互斥、对立的判定；用概率性质求概率。解题技巧：对立一定互斥，互斥未必对立；加法公式 P(A+B)=P(A)+P(B)-P(AB)，互斥时减0；对立事件 P(A的补)=1-P(A)。"}, {"title": "古典概型", "content": "列举法求基本事件数；游戏公平性、抽取问题。解题技巧：P(A)=有利样本点数/总样本点数；列举用列表法或树状图保证不重不漏；注意有序与无序的区别。"}, {"title": "频率估计概率", "content": "由频率分布估计概率；大量试验的稳定性。解题技巧：大量重复试验中频率稳定值即为概率估计；频率有随机性，概率是理论值。"}, {"title": "概率综合应用", "content": "互斥事件与对立事件综合；至少至多问题转化为对立事件。解题技巧：“至少一个”的对立是“一个都没有”；“至多k个”的对立是“超过k个”；复杂事件分解为互斥事件之和。"}], "examples": [{"title": "古典概型（基础题）", "question": "先后掷两枚骰子，求点数之和为7的概率。", "analysis": "用列举法。先后掷两枚骰子，每枚有6种结果，样本点总数=6×6=36（有序）。点数之和为7的组合：(1,6)(2,5)(3,4)(4,3)(5,2)(6,1)，共6个。每个样本点等可能，属于古典概型。P=有利样本点数/总数=6/36=1/6。注意(1,6)和(6,1)是不同的样本点（有先后顺序），都要计入。", "answer": "样本点总数=6×6=36。\n和为7的样本点：(1,6)(2,5)(3,4)(4,3)(5,2)(6,1)共6个。\nP=6/36=1/6。"}, {"title": "对立事件求概率（基础题）", "question": "袋中有3个红球2个白球，一次取2球，求至少有1个红球的概率。", "analysis": "“至少有1个红球”包含“1红1白”和“2红”两种情况，直接计算需要分别求再相加。但用对立事件更简便：“至少有1个红球”的对立事件是“2球全是白球”。样本点总数=从5球中取2球=C(5,2)=10。“全白”的样本点数=从2白球中取2球=C(2,2)=1。P(全白)=1/10。P(至少1红)=1-P(全白)=1-1/10=9/10。也可以直接算：P(1红1白)=C(3,1)C(2,1)/C(5,2)=6/10，P(2红)=C(3,2)/C(5,2)=3/10，P(至少1红)=6/10+3/10=9/10，结果一致。", "answer": "法一（对立事件）：\n“至少1红”的对立事件是“全白”。\nP(全白)=C(2,2)/C(5,2)=1/10。\nP(至少1红)=1-1/10=9/10。\n\n法二（直接法）：\nP(1红1白)=C(3,1)C(2,1)/C(5,2)=6/10，\nP(2红)=C(3,2)/C(5,2)=3/10，\nP(至少1红)=6/10+3/10=9/10。"}, {"title": "互斥事件概率（中档题）", "question": "某班级进行投篮测试，甲投中的概率为0.6，乙投中的概率为0.5，两人是否投中互不影响。求：(1)两人都投中的概率；(2)至少一人投中的概率。", "analysis": "这是独立事件概率问题（但概率性质仍然适用）。设A=“甲投中”，B=“乙投中”，P(A)=0.6, P(B)=0.5，A与B独立。（1）两人都投中=P(AB)=P(A)×P(B)=0.6×0.5=0.3。（2）至少一人投中=P(A+B)=P(A)+P(B)-P(AB)=0.6+0.5-0.3=0.8。也可以用对立事件：P(至少一人投中)=1-P(两人都没中)=1-P(A的补×B的补)=1-0.4×0.5=1-0.2=0.8。", "answer": "P(A)=0.6, P(B)=0.5, A与B独立。\n(1)P(AB)=P(A)×P(B)=0.6×0.5=0.3。\n(2)P(A+B)=P(A)+P(B)-P(AB)=0.6+0.5-0.3=0.8。\n或 P(A+B)=1-P(A补)P(B补)=1-0.4×0.5=0.8。"}, {"title": "古典概型列表法（高考真题）", "question": "甲、乙两人分别从1,2,3,4四个数中随机选一个数，求两人选的数之和为偶数的概率。", "analysis": "用列表法列举所有可能。甲有4种选择，乙有4种选择，样本点总数=4×4=16，每个等可能。两人选数之和为偶数的情况：偶数+偶数=偶数，奇数+奇数=偶数。偶数为2,4（2个），奇数为1,3（2个）。偶+偶：甲选2或4（2种）×乙选2或4（2种）=4种。奇+奇：甲选1或3（2种）×乙选1或3（2种）=4种。合计8种。P=8/16=1/2。也可以列完整表格验证。", "answer": "样本点总数=4×4=16。\n和为偶数=偶+偶或奇+奇。\n偶+偶：2×2=4种，奇+奇：2×2=4种，共8种。\nP=8/16=1/2。"}, {"title": "频率与概率（模拟题）", "question": "某射手在同一条件下进行射击，结果如下：射击10次命中8次，射击20次命中17次，射击50次命中44次，射击100次命中90次，射击200次命中180次。(1)计算各次试验的命中频率；(2)估计该射手命中的概率。", "analysis": "(1)频率=命中次数/射击次数。n=10: f=8/10=0.8；n=20: f=17/20=0.85；n=50: f=44/50=0.88；n=100: f=90/100=0.9；n=200: f=180/200=0.9。(2)随着射击次数增加，频率逐渐稳定在0.9附近（n=100和n=200时均为0.9），因此可以估计该射手命中的概率约为0.9。注意频率有随机性，但大量试验中趋于稳定。", "answer": "(1)各次频率：\nn=10: 8/10=0.8\nn=20: 17/20=0.85\nn=50: 44/50=0.88\nn=100: 90/100=0.9\nn=200: 180/200=0.9\n(2)随着试验次数增加，频率稳定在0.9附近，\n故估计该射手命中概率约为0.9。"}]}]}]}, {"subject": "英语", "books": [{"name": "必修第一册", "chapters": [{"id": "en_1_0", "title": "Welcome Unit 初高中衔接", "summary": "衔接初高中英语，复习基本句型结构、学习策略与校园生活词汇。", "knowledge": [{"title": "五大基本句型", "content": "①S+V（主谓）②S+V+O（主谓宾）③S+V+IO+DO（主谓双宾）④S+V+O+C（主谓宾补）⑤S+V+P（主系表）。分析句子先找谓语动词，再判断结构。"}, {"title": "校园生活词汇", "content": "campus 校园, lecture 讲座, registration 注册, dormitory 宿舍, exchange 交流, strategy 策略, flashcard 抽认卡, take notes 记笔记, concentrate on 专注。"}, {"title": "学习策略", "content": "扩大词汇量（构词法、语境记忆）；坚持听说读写训练；建立错题本；用英语记日记；利用词典与语料。"}], "exam_points":
