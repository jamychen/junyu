[{"title": "句型分析", "content": "判断句子结构，划分句子成分（主谓宾定状补表）。"}, {"title": "词义推断", "content": "阅读中通过构词法、上下文、同义反义推断生词含义。"}], "examples": [{"title": "句型判断", "question": "指出 \"She bought me a dictionary.\" 的句型。", "analysis": "bought 为谓语，me 为间接宾语，a dictionary 为直接宾语。", "answer": "S+V+IO+DO（主谓双宾结构）。"}]}, {"id": "en_1_1", "title": "Unit 1 Teenage Life 青少年生活", "summary": "话题：青少年生活与课外活动。语法：复习时态。写作：建议信。", "knowledge": [{"title": "重点词汇", "content": "volunteer 志愿者, debate 辩论, prefer 更喜欢, suitable 合适的, challenge 挑战, schedule 日程, quit 放弃, responsible 负责任的, generation 一代人, attract 吸引, focus 集中, advance 进步。"}, {"title": "重点短语", "content": "prefer...to... 喜欢……胜过……, sign up for 报名参加, be suitable for 适合, focus on 集中于, be responsible for 对……负责, hand out 分发, be addicted to 沉迷于, get used to 习惯于。"}, {"title": "核心句型", "content": "①I prefer... to... ②The reason why... is that... ③It is + adj. + for sb. to do sth. ④You'd better (not) do...（表建议）。"}, {"title": "语法：复习时态", "content": "一般现在时表习惯真理；一般过去时表过去事实；现在进行时表进行；现在完成时表过去动作对现在的影响；一般将来时表将来。注意时间状语搭配与主从句时态呼应。"}], "exam_points": [{"title": "词汇与短语", "content": "prefer/preference 词形变化；be addicted to 后接动名词；focus 与 concentrate 辨析。"}, {"title": "时态", "content": "依据语境与时间状语选择正确时态，注意主从句时态一致。"}, {"title": "建议信写作", "content": "格式（称呼、正文、结尾）；常用句式 I suggest/recommend that..., It is advisable to..., Why not...?。"}], "examples": [{"title": "时态选择", "question": "用适当形式填空：He ______ (join) the chess club last term and ______ (be) a member ever since.", "analysis": "前句 last term 用一般过去时；后句 ever since 提示现在完成时。", "answer": "joined; has been。"}, {"title": "建议句式", "question": "翻译：我建议你报名参加辩论社。", "analysis": "suggest 后从句用 (should)+动词原形。", "answer": "I suggest that you (should) sign up for the debate club."}]}, {"id": "en_1_2", "title": "Unit 2 Travelling Around 旅游", "summary": "话题：旅游与目的地。语法：现在进行时表将来。写作：旅行计划/游记。", "knowledge": [{"title": "重点词汇", "content": "destination 目的地, amazing 令人惊叹的, ancient 古老的, narrow 狭窄的, flight 航班, accommodation 住宿, unique 独特的, official 官方的, emperor 皇帝, site 遗址, economy 经济。"}, {"title": "重点短语", "content": "apply for 申请, take control of 控制, other than 除了, make up 构成/编造, check in 办理登记, check out 结账离开, be famous for 因……著名, package tour 跟团游。"}, {"title": "核心句型", "content": "①be doing sth. 表按计划即将发生 ②It is amazing that... ③主语 + be + to do（表计划安排）。"}, {"title": "语法：现在进行时表将来", "content": "come, go, arrive, leave, start, fly, travel 等位移动词的现在进行时可表示按计划即将发生的动作。如 I am leaving for Beijing tomorrow."}], "exam_points": [{"title": "现在进行时表将来", "content": "位移动词进行时表将来；与 be going to / be to do 的区别。"}, {"title": "词汇运用", "content": "amaze/amazed/amazing 辨析（-ing 修饰物，-ed 修饰人）；apply/application 词族。"}, {"title": "旅行计划写作", "content": "用现在进行时描述行程，条理清晰，包含交通、住宿、景点。"}], "examples": [{"title": "语法填空", "question": "My flight ______ (take off) at 9:00 tomorrow morning.", "analysis": "位移动词 take off 进行时表按计划将来。", "answer": "is taking off。"}, {"title": "词形辨析", "question": "用 amaze 适当形式填空：The view was ______ and we were ______ at it.", "analysis": "amazing 修饰物，amazed 修饰人。", "answer": "amazing; amazed。"}]}, {"id": "en_1_3", "title": "Unit 3 Sports and Fitness 运动与健康", "summary": "话题：体育运动与健康生活。语法：反意疑问句。写作：健康生活方式比较。", "knowledge": [{"title": "重点词汇", "content": "fitness 健康, champion 冠军, determine 决心, injured 受伤的, captain 队长, graceful 优雅的, strength 力量, failure 失败, compete 竞争, pretend 假装, diet 饮食, balanced 平衡的。"}, {"title": "重点短语", "content": "make it 成功/赶到, work out 锻炼, give up 放弃, lose weight 减肥, rather than 而不是, cut out 戒除, compare...to... 把……比作, make a difference 起作用。"}, {"title": "核心句型", "content": "①Instead of doing..., sb. does... ②The more..., the more... ③It is up to sb. to do sth.。"}, {"title": "语法：反意疑问句", "content": "前肯后否、前否后肯；be/助/情态动词与主句一致。特殊情况：let's 用 shall we；祈使句用 will you；nothing/nobody 等否定词后用肯定；I think/believe 后反问与从句主语一致。"}], "exam_points": [{"title": "反意疑问句", "content": "依据主句谓语与否定词确定反问部分；特殊句型（let's, 祈使, 主从复合句）的用法。"}, {"title": "词汇辨析", "content": "compete/competition/competitive；injure/wound/hurt。"}, {"title": "健康话题写作", "content": "比较不同生活方式，提出建议，结构对比清晰。"}], "examples": [{"title": "反意疑问句", "question": "完成反意疑问句：He has never been to the gym, ______?", "analysis": "前句有 never 否定词，反问部分用肯定；谓语 has 为助动词。", "answer": "has he。"}, {"title": "句型翻译", "question": "翻译：你锻炼得越多，就越健康。", "analysis": "用 The more..., the more... 句型。", "answer": "The more you work out, the healthier you will be."}]}, {"id": "en_1_4", "title": "Unit 4 Natural Disasters 自然灾害", "summary": "话题：自然灾害与救援。语法：限制性定语从句（关系代词）。写作：灾害报道/新闻报道。", "knowledge": [{"title": "重点词汇", "content": "disaster 灾难, earthquake 地震, rescue 救援, shelter 庇护所, survive 幸存, destroy 破坏, affect 影响, effort 努力, emergency 紧急情况, supply 供应, summary 摘要, significant 重大的。"}, {"title": "重点短语", "content": "in ruins 严重受损, as if 仿佛, come to an end 结束, in shock 震惊, dig out 掘出, sweep away 冲走, suffer from 遭受, provide sth. for sb. 为某人提供某物。"}, {"title": "核心句型", "content": "①It seemed as if... ②There were... doing sth. ③The number of... who/which...（定语从句）。"}, {"title": "语法：限制性定语从句（关系代词）", "content": "who 指人作主/宾，whom 指人作宾，which 指物，that 指人或物，whose 表所属（人/物均可）。作宾语可省略。that 与 which 区别：只用 that 的情况（最高级、序数词修饰、不定代词先行词、人和物并列先行词等）。"}], "exam_points": [{"title": "定语从句关系代词", "content": "选用正确关系代词；that 与 which 的辨析；whose 的用法。"}, {"title": "词汇运用", "content": "destroy/ruin/damage 辨析；survive/survival/survivor 词族。"}, {"title": "新闻写作", "content": "新闻要素（when/where/who/what/why/how）；语言客观简洁。"}], "examples": [{"title": "定语从句", "question": "用关系代词填空：The earthquake ______ struck the city caused great damage.", "analysis": "先行词 earthquake 指物，在从句中作主语，可用 that 或 which。", "answer": "that / which。"}, {"title": "that 与 which", "question": "This is the most terrible disaster ______ I have ever experienced.（填关系代词）", "analysis": "先行词被最高级修饰，只用 that。", "answer": "that。"}]}, {"id": "en_1_5", "title": "Unit 5 Languages Around the World 世界语言", "summary": "话题：世界语言与汉字发展。语法：限制性定语从句（关系副词与介词+关系代词）。写作：语言学习经验。", "knowledge": [{"title": "重点词汇", "content": "symbol 符号, classic 经典的, regard 看作, variety 多样性, major 主要的, native 本地的, attitude 态度, official 官方的, appreciate 欣赏, demand 要求, vocabulary 词汇。"}, {"title": "重点短语", "content": "regard...as... 把……看作, refer to 指的是/提到, date back to 追溯到, be based on 基于, no matter 不管, point of view 观点, depend on 依赖。"}, {"title": "核心句型", "content": "①even though/if 即使 ②no matter + 疑问词 ③the way (in which/that) + 定语从句。"}, {"title": "语法：关系副词与介词+关系代词", "content": "when 表时间 (=at/in/on which)，where 表地点 (=in/at which)，why 表原因 (=for which)。介词+which/whom：根据动词搭配或先行词确定介词。关系副词可用 that 替换，作状语不可省略。"}], "exam_points": [{"title": "关系副词", "content": "区分关系代词与关系副词（看在从句中作主宾还是状语）；when/where/why 的选用。"}, {"title": "介词+关系代词", "content": "根据搭配确定介词；which 指物 whom 指人。"}, {"title": "词汇与句型", "content": "no matter 与 however 的转换；regard...as...。"}], "examples": [{"title": "关系副词", "question": "填空：This is the school ______ I studied for three years.", "analysis": "先行词 school 表地点，从句缺地点状语，用 where。", "answer": "where。"}, {"title": "介词+关系代词", "question": "填空：The person ______ ______ I talked is our English teacher.", "analysis": "talk to sb. 搭配，介词用 to，指人用 whom。", "answer": "to; whom。"}]}]}, {"name": "必修第二册", "chapters": [{"id": "en_2_1", "title": "Unit 1 Cultural Heritage 文化遗产", "summary": "话题：文化遗产保护（以阿斯旺大坝神庙搬迁为例）。语法：限制性定语从句（复习）。写作：保护文化遗产倡议。", "knowledge": [{"title": "重点词汇", "content": "heritage 遗产, temple 寺庙, preserve 保护, promote 促进, balance 平衡, protest 抗议, committee 委员会, establish 建立, limit 限制, conduct 进行, document 文件/记录。"}, {"title": "重点短语", "content": "give way to 让步于, turn to 求助于, take apart 拆开, piece by piece 一块块地, contribute to 有助于, be likely to 可能, in turn 依次。"}, {"title": "核心句型", "content": "①Not only...but also...（部分倒装） ②There comes a time when... ③It is worthwhile to do...。"}, {"title": "语法：定语从句复习", "content": "综合运用关系代词与关系副词；非限制性定语从句初步认识（用逗号隔开，补充说明，不可用 that）。"}], "exam_points": [{"title": "定语从句综合", "content": "限制性与非限制性定语从句辨析；关系词选用与省略。"}, {"title": "倒装句", "content": "not only...but also 置于句首引起部分倒装。"}, {"title": "应用文写作", "content": "倡议书结构与呼吁句式。"}], "examples": [{"title": "倒装", "question": "用倒装改写：Not only ______ ______ (he/protect) the temple, but he also raised funds.", "analysis": "Not only 置于句首，主句部分倒装，用助动词 did。", "answer": "did he protect。"}]}, {"id": "en_2_2", "title": "Unit 2 Wildlife Protection 野生动植物保护", "summary": "话题：野生动植物保护。语法：现在进行时的被动语态。写作：保护动物短文。", "knowledge": [{"title": "重点词汇", "content": "wildlife 野生动物, species 物种, endangered 濒危的, habitat 栖息地, reserve 保护区, adapt 适应, exist 存在, attack 攻击, recover 恢复, concern 担忧, harmony 和谐。"}, {"title": "重点短语", "content": "die out 灭绝, be concerned about 关心, adapt to 适应, under pressure 在压力下, be aware of 意识到, on average 平均, make progress 取得进步。"}, {"title": "核心句型", "content": "①...is being done（正在进行被动） ②It is high time that sb. did sth. ③Only by doing... can we...（部分倒装）。"}, {"title": "语法：现在进行时被动语态", "content": "结构 am/is/are + being + 过去分词，表示正在被进行的动作。如 The bridge is being built now. 注意：being 不可遗漏。"}], "exam_points": [{"title": "现在进行时被动", "content": "结构辨析与填空；与一般现在时被动、现在完成时被动的区别。"}, {"title": "词汇", "content": "adapt/adopt 辨析；die out/die of/die from 区别。"}, {"title": "倒装", "content": "only + 状语前置的部分倒装。"}], "examples": [{"title": "被动语态", "question": "填空：The old church ______ ______ ______ (repair) at present.", "analysis": "at present 提示现在进行，主语被修用被动。", "answer": "is being repaired。"}, {"title": "倒装", "question": "改写：Only by working together ______ ______ (we/save) these animals.", "analysis": "Only+状语前置引起部分倒装。", "answer": "can we save。"}]}, {"id": "en_2_3", "title": "Unit 3 The Internet 互联网", "summary": "话题：互联网与生活。语法：现在完成时的被动语态。写作：网络利弊议论文。", "knowledge": [{"title": "重点词汇", "content": "convenient 方便的, benefit 利益, privacy 隐私, identity 身份, update 更新, confirm 确认, distance 距离, addicted 上瘾的, battery 电池, discount 折扣。"}, {"title": "重点短语", "content": "keep track of 跟踪, keep sb. company 陪伴, now that 既然, have access to 有权使用, in shape 状况良好, belong to 属于。"}, {"title": "核心句型", "content": "①...has/have been done（现在完成被动） ②It is the first time that...has/have done ③so...that...。"}, {"title": "语法：现在完成时被动语态", "content": "结构 has/have + been + 过去分词，表示过去已完成且对现在有影响的被动动作。如 The work has been finished."}], "exam_points": [{"title": "现在完成时被动", "content": "结构辨析；与一般过去时被动的区别（看是否对现在有影响）。"}, {"title": "议论文写作", "content": "利弊分析结构：引出话题—利—弊—结论；连接词 however, on the other hand, in addition。"}, {"title": "词汇辨析", "content": "benefit from/by；convenient 不能以人作主语。"}], "examples": [{"title": "被动语态", "question": "填空：All the tickets ______ ______ ______ (sell) online so far.", "analysis": "so far 提示现在完成，tickets 被售用被动。", "answer": "have been sold。"}, {"title": "时态句型", "question": "翻译：这是我第一次参观故宫。", "analysis": "It is the first time that... 后用现在完成时。", "answer": "It is the first time that I have visited the Palace Museum."}]}, {"id": "en_2_4", "title": "Unit 4 History and Traditions 历史与传统", "summary": "话题：英国历史与传统文化。语法：过去分词作定语和宾补。写作：地点/景点介绍。", "knowledge": [{"title": "重点词汇", "content": "ancestor 祖先, philosopher 哲学家, individual 个人, belong 属于, evidence 证据, achieve 达到, generous 慷慨的, position 位置, fascinating 迷人的, landscape 风景。"}, {"title": "重点短语", "content": "belong to 属于, as well as 也, be proud of 以……为豪, break away from 脱离, result in 导致, leave behind 留下。"}, {"title": "核心句型", "content": "①过去分词短语作后置定语 ②have/get sth. done ③with + 宾语 + 过去分词（宾补）。"}, {"title": "语法：过去分词作定语与宾补", "content": "作定语：单个词前置（fallen leaves 落叶），短语后置（the book written by him）；及物动词过去分词表被动完成。作宾补：have/get sth. done（使某事被做），表状态或被动。"}], "exam_points": [{"title": "过去分词作定语", "content": "区分现在分词与过去分词作定语（主动进行 vs 被动完成）；位置。"}, {"title": "过去分词作宾补", "content": "have/get sth. done 结构；与 doing 宾补的区别。"}, {"title": "地点介绍写作", "content": "位置、历史、特色、感受；现在/过去分词丰富表达。"}], "examples": [{"title": "过去分词作定语", "question": "填空：The building ______ (build) in 1900 is still in use.", "analysis": "build 与 building 为被动关系，且已完成，用过去分词。", "answer": "built。"}, {"title": "宾补结构", "question": "翻译：我昨天让人修了电脑。", "analysis": "have sth. done 表使某事被做。", "answer": "I had the computer repaired yesterday."}]}, {"id": "en_2_5", "title": "Unit 5 Music 音乐", "summary": "话题：音乐与虚拟合唱团。语法：过去分词作状语。写作：音乐的影响短文。", "knowledge": [{"title": "重点词汇", "content": "perform 表演, stage 舞台, award 奖项, composition 作品, capable 有能力的, phenomenon 现象, treatment 治疗, relief 缓解, thus 因此, equipment 设备。"}, {"title": "重点短语", "content": "fall in love with 爱上, be capable of 能够, in addition to 除……之外, take part in 参加, come up with 想出, from then on 从那时起。"}, {"title": "核心句型", "content": "①过去分词作状语（时间/原因/条件/让步） ②It is said that... ③Not only...but also...。"}, {"title": "语法：过去分词作状语", "content": "过去分词作状语表被动、完成，逻辑主语与主句主语一致。如 Given more time, I could do better. 否定用 Not given。注意与现在分词作状语区分（主动 vs 被动）。"}], "exam_points": [{"title": "过去分词作状语", "content": "判断分词与主语关系选 doing/done；分词作状语的否定与位置。"}, {"title": "词汇", "content": "perform/performance；award/reward 辨析。"}, {"title": "写作", "content": "用分词状语使句式多样。"}], "examples": [{"title": "分词作状语", "question": "填空：______ (give) another chance, he would succeed.", "analysis": "give 与 he 为被动关系，作条件状语用过去分词。", "answer": "Given。"}, {"title": "分词选择", "question": "填空：______ (face) with difficulties, she didn't give up.", "analysis": "be faced with 固定搭配，作状语用 faced。", "answer": "Faced。"}]}]}, {"name": "必修第三册", "chapters": [{"id": "en_3_1", "title": "Unit 1 Festivals and Celebrations 节日", "summary": "话题：世界节日与庆祝。语法：情态动词。写作：节日介绍。", "knowledge": [{"title": "重点词汇", "content": "festival 节日, celebrate 庆祝, origin 起源, religious 宗教的, custom 习俗, gather 聚集, feast 盛宴, gratitude 感激, joy 喜悦, decorate 装饰, symbol 象征。"}, {"title": "重点短语", "content": "in spite of 尽管, range from...to... 范围从……到……, dress up 打扮, after all 毕竟, be grateful for 感激, figure out 弄明白。"}, {"title": "核心句型", "content": "①情态动词表能力、许可、必须、建议 ②No matter how... ③It is a time when...。"}, {"title": "语法：情态动词", "content": "can/could 表能力或许可；may/might 表许可或推测；must 表必须（否定 needn't 不必）；should/ought to 表建议；shall 表征求意见或命令；will/would 表意愿。推测：must be 一定是，can't be 不可能是。"}], "exam_points": [{"title": "情态动词", "content": "基本用法与辨析；表推测的用法（must/can't/may）；must 与 have to 的区别。"}, {"title": "词汇", "content": "celebrate/celebration；custom/habit 辨析。"}, {"title": "节日介绍写作", "content": "时间、起源、活动、意义。"}], "examples": [{"title": "情态动词", "question": "填空：You ______ not park here; it's forbidden.", "analysis": "禁止停车，表必须不，用 must。", "answer": "must。"}, {"title": "推测", "question": "改写：I'm sure he is the thief. → He ______ be the thief.", "analysis": "肯定推测用 must。", "answer": "must。"}]}, {"id": "en_3_2", "title": "Unit 2 Morals and Virtues 道德与美德", "summary": "话题：道德困境与美德（以林巧稚为例）。语法：情态动词表推测。写作：美德故事/观点。", "knowledge": [{"title": "重点词汇", "content": "moral 道德的, virtue 美德, dilemma 困境, faint 晕倒, complain 抱怨, respond 回应, reject 拒绝, tend 照顾, retire 退休, principle 原则, significant 重要的。"}, {"title": "重点短语", "content": "carry sb. through 帮某人渡过难关, in trouble 处于困境, be known for 因……闻名, first aid 急救, in despair 绝望, be responsible for 对……负责。"}, {"title": "核心句型", "content": "①情态动词表推测（must/may/might/can't + do/be doing/have done） ②It is worthwhile to do... ③Rather than..., sb. did...。"}, {"title": "语法：情态动词表推测", "content": "肯定推测 must（一定）、may/might（可能）；否定推测 can't（不可能）。对现在推测 + do/be doing，对过去推测 + have done。如 He must have finished it yesterday."}], "exam_points": [{"title": "情态动词表推测", "content": "依据肯定/否定选 must/can't/may；时态搭配（have done 表过去）。"}, {"title": "词汇", "content": "respond/response；reject/refuse 辨析。"}, {"title": "写作", "content": "叙述美德故事，夹叙夹议。"}], "examples": [{"title": "推测过去", "question": "填空：The ground is wet. It ______ ______ rained last night.", "analysis": "对过去肯定推测用 must have done。", "answer": "must have。"}, {"title": "否定推测", "question": "填空：He ______ be at home; I just saw him at school.", "分析": "否定推测用 can't。", "answer": "can't。"}]}, {"id": "en_3_3", "title": "Unit 3 Diverse Cultures 多元文化", "summary": "话题：多元文化（以旧金山为例）。语法：it 的用法。写作：城市/文化介绍。", "knowledge": [{"title": "重点词汇", "content": "diverse 多样的, fortune 财富, immigrant 移民, contain 包含, district 地区, material 材料, construction 建设, definitely 肯定地, historical 历史的, diverse 不同的。"}, {"title": "重点短语", "content": "head to 前往, seek one's fortune 寻找发财机会, a variety of 各种, bring about 引起, apart from 除了, settle in 定居于。"}, {"title": "核心句型", "content": "①It is + adj./n. + that... ②It takes sb. time to do... ③It is... that...（强调句）。"}, {"title": "语法：it 的用法", "content": "it 作形式主语（It is said that...）、形式宾语（find it hard to...）；强调句 It is/was + 强调部分 + that...；指代时间、天气、距离。判断强调句：去掉 It is/was...that 后句子仍完整。"}], "exam_points": [{"title": "it 用法", "content": "形式主语/宾语；强调句判断与改写；与定语从句区分。"}, {"title": "词汇", "content": "diverse/diversity；contain/include 辨析。"}, {"title": "文化介绍写作", "content": "特点、成因、表现、感受。"}], "examples": [{"title": "强调句", "question": "对画线部分强调：I met Tom in the park yesterday.（强调 in the park）", "分析": "强调句结构 It is/was + 强调部分 + that + 其余。", "answer": "It was in the park that I met Tom yesterday."}, {"title": "形式宾语", "question": "填空：I find ______ important to learn English well.", "分析": "it 作形式宾语，真正宾语为 to do。", "answer": "it。"}]}, {"id": "en_3_4", "title": "Unit 4 Space Exploration 太空探索", "summary": "话题：太空探索历程。语法：不定式。写作：太空探索意义议论文。", "knowledge": [{"title": "重点词汇", "content": "explore 探索, launch 发射, astronaut 宇航员, signal 信号, intelligent 智能的, determine 决心, independent 独立的, limited 有限的, vital 至关重要的, mystery 谜。"}, {"title": "重点短语", "content": "carry on 继续, on board 在船上/机上, as a result 结果, provide for 供养, in closing 最后, run out 用完。"}, {"title": "核心句型", "content": "①It is + adj. + for sb. to do ②To do... is...（不定式作主语） ③so as to / in order to 表目的。"}, {"title": "语法：不定式", "content": "不定式作主语（常以 it 作形式主语）、宾语、表语、定语（表将来）、状语（表目的、结果）。否定 not to do。注意：decide/hope/plan + to do；make up one's mind to do。"}], "exam_points": [{"title": "不定式", "content": "作各成分的辨析；不定式作定语与状语；to do 与 doing 区别。"}, {"title": "词汇", "content": "explore/exploration；determined/determine。"}, {"title": "议论文写作", "content": "明确观点，论据充分，逻辑清晰。"}], "examples": [{"title": "不定式作主语", "question": "改写：To master a language is necessary. → It is necessary ______.", "分析": "it 作形式主语，不定式后置。", "answer": "to master a language。"}, {"title": "不定式作目的状语", "question": "翻译：他早起是为了赶上首班车。", "分析": "表目的用不定式。", "answer": "He got up early to catch the first bus."}]}, {"id": "en_3_5", "title": "Unit 5 The Value of Money 金钱的价值", "summary": "话题：金钱的价值（以《百万英镑》为例）。语法：复习情态动词与不定式。写作：金钱观讨论/剧本片段。", "knowledge": [{"title": "重点词汇", "content": "value 价值, basis 基础, apologise 道歉, spot 发现, patience 耐心, manner 方式/礼貌, permission 允许, indeed 确实, hesitate 犹豫, reserve 预订。"}, {"title": "重点短语", "content": "as a matter of fact 事实上, on the basis of 在……基础上, take out a loan 贷款, in return 作为回报, be about to do 即将做, to be honest 老实说。"}, {"title": "核心句型", "content": "①be about to do... when... ②It is up to sb. to do ③情态动词 + have done（表对过去的推测或责备）。"}, {"title": "语法：复习情态动词与不定式", "content": "should have done 本该做却没做；ought to have done；could have done 本可以做；needn't have done 本不必做。不定式综合运用。"}], "exam_points": [{"title": "情态动词+have done", "content": "表责备/推测/虚拟的辨析；should/could/needn't have done。"}, {"title": "词汇", "content": "value/valuable；manner(s) 单复数含义。"}, {"title": "写作", "content": "金钱观议论；剧本对白格式。"}], "examples": [{"title": "情态动词+have done", "question": "填空：You ______ ______ (not/hurry); we still have plenty of time.", "分析": "本不必做用 needn't have done。", "answer": "needn't have hurried。"}, {"title": "句型", "question": "翻译：我刚要出门，这时电话响了。", "分析": "be about to do... when... 句型。", "answer": "I was about to go out when the phone rang."}]}]}]}, {"subject": "物理", "books": [{"name": "必修第一册", "chapters": [{"id": "ph_1_1", "title": "第一章 运动的描述", "summary": "建立质点、参考系、坐标系等概念，用位移、速度、加速度描述物体运动。", "knowledge": [{"title": "质点、参考系", "content": "质点：忽略物体大小和形状，把它看作有质量的点。物体能否看成质点视研究问题而定。参考系：用来作参考的物体，通常选地面或相对地面静止的物体。"}, {"title": "时刻与时间间隔", "content": "时刻对应时间轴上一点，时间间隔对应一段。位置是时刻对应，位移是时间间隔对应。"}, {"title": "位移与路程", "content": "位移描述位置变化，是矢量（从初位置指向末位置的有向线段）；路程是运动轨迹长度，是标量。单向直线运动中位移大小等于路程。"}, {"title": "速度", "content": "速度 v=Δx/Δt，矢量，方向与位移方向相同。平均速度＝位移/时间；瞬时速度是某一时刻（位置）的速度。速率是瞬时速度的大小（标量）。平均速率＝路程/时间。"}, {"title": "加速度", "content": "加速度 a=Δv/Δt，矢量，方向与速度变化量 Δv 方向相同。a 与 v 同向加速，反向减速。a 大小与 v 大小无必然联系。"}], "exam_points": [{"title": "质点模型", "content": "判断物体能否视为质点（看大小形状是否为次要因素）。"}, {"title": "矢量运算", "content": "位移、速度、加速度的矢量性，方向判断；Δv=v2−v1 的矢量运算（直线运动带正负号）。"}, {"title": "v-t 图象", "content": "斜率表加速度，面积表位移；截距、交点含义。"}], "examples": [{"title": "加速度与速度关系", "question": "汽车以 10 m/s 行驶，刹车 2 s 后速度变为 4 m/s，求加速度大小与方向。", "analysis": "取初速度方向为正，由 a=Δv/Δt 计算，符号表示方向。", "answer": "a=(4−10)/2=−3 m/s²，大小 3 m/s²，方向与初速度方向相反（减速）。"}, {"title": "v-t 图象", "question": "在 v-t 图象中，一物体速度随时间增大但增加得越来越慢，其加速度如何变化？", "analysis": "v-t 图象斜率表示加速度。", "answer": "速度增大说明加速度与速度同向；增加越来越慢说明斜率减小，即加速度逐渐减小但方向不变。"}]}, {"id": "ph_1_2", "title": "第二章 匀变速直线运动的研究", "summary": "研究匀变速直线运动的规律，包括速度、位移公式及自由落体运动，掌握逐差法处理纸带数据。", "knowledge": [{"title": "基本公式", "content": "速度公式 v=v0+at；位移公式 x=v0t+½at²；速度位移公式 v²−v0²=2ax。适用匀变速直线运动。"}, {"title": "重要推论", "content": "①中间时刻速度 vm=v/2=(v0+v)/2；②中间位置速度 vx=√((v0²+v²)/2)；③连续相等时间 T 内位移差 Δx=aT²（逐差法求 a）；④初速度为零的匀加速运动比例式。"}, {"title": "自由落体运动", "content": "初速度为零、加速度为 g（约 9.8 m/s²）的匀加速直线运动。v=gt，h=½gt²，v²=2gh。"}, {"title": "实验：探究小车速度随时间变化", "content": "用打点计时器获取纸带；用逐差法求加速度 a=Δx/T²；平衡摩擦力使细线拉力近似等于合力。"}], "exam_points": [{"title": "公式应用", "content": "运动学公式选择与计算；多过程问题（分段处理）。"}, {"title": "推论应用", "content": "Δx=aT² 逐差法；中间时刻速度等于平均速度。"}, {"title": "图象", "content": "v-t、x-t、x-v² 图象的识别与转换。"}], "examples": [{"title": "逐差法", "question": "纸带上连续相等时间 T 内的位移依次为 x1,x2,x3,x4，求加速度 a。", "analysis": "用逐差法取两段差除以总时间平方。", "answer": "a=[(x4−x2)+(x3−x1)]/(4T²)，或 a=(x4−x2)/(2T²)。"}, {"title": "自由落体", "question": "物体从高处自由下落，最后 1 s 内下落 25 m，求下落总时间（g=10 m/s²）。", "analysis": "设总时间 t，最后 1 s 位移＝总位移−前(t−1)s 位移。", "answer": "½gt²−½g(t−1)²=25，代入 g=10 得 5[2t−1]=25，t=3 s。"}]}, {"id": "ph_1_3", "title": "第三章 相互作用——力", "summary": "认识重力、弹力、摩擦力，学习力的合成与分解，掌握共点力平衡条件。", "knowledge": [{"title": "重力", "content": "G=mg，方向竖直向下。重心位置与质量分布有关，可用悬挂法测定。g 随纬度、高度变化。"}, {"title": "弹力", "content": "弹力产生条件：接触且发生弹性形变。方向垂直接触面（或沿绳）。胡克定律 F=kx，k 为劲度系数，x 为形变量。"}, {"title": "摩擦力", "content": "滑动摩擦力 Ff=μFN，方向与相对运动方向相反。静摩擦力大小在 0~Fmax 之间，由平衡或牛顿定律确定，方向与相对运动趋势相反。μ 与接触面粗糙程度有关，与压力、面积无关。"}, {"title": "力的合成与分解", "content": "遵循平行四边形定则。合力范围 |F1−F2|≤F≤F1+F2。正交分解：将力分解到两个互相垂直方向。"}, {"title": "共点力平衡", "content": "平衡条件：合力为零，即 ΣFx=0，ΣFy=0。三力平衡时三力可构成闭合三角形。"}], "exam_points": [{"title": "摩擦力分析", "content": "静摩擦与滑动摩擦的判断与计算；摩擦力方向判定。"}, {"title": "力的合成与分解", "content": "平行四边形定则计算；正交分解法解题；合力范围。"}, {"title": "平衡问题", "content": "用平衡条件求未知力；动态平衡分析（图解法、解析法）。"}], "examples": [{"title": "摩擦力计算", "question": "质量 2 kg 物体置于水平地面，μ=0.2，用 3 N 水平力拉它，求摩擦力（g=10）。", "analysis": "先判断是否运动：最大静摩擦近似 μmg=4 N > 3 N，物体静止。", "answer": "物体未动，受静摩擦力，由平衡得 Ff=3 N，方向与拉力相反。"}, {"title": "动态平衡", "question": "用轻绳将小球悬挂，用另一绳水平拉球使绳与竖直方向成 θ 角，θ 增大时各绳拉力如何变化？", "analysis": "用图解法或解析法，重力恒定。", "answer": "设悬绳拉力 F1、水平绳拉力 F2，由平衡 F1=mg/cosθ，F2=mg tanθ。θ 增大时 cosθ 减小、tanθ 增大，故 F1、F2 均增大。"}]}, {"id": "ph_1_4", "title": "第四章 运动和力的关系", "summary": "建立牛顿三大定律，用牛顿定律分析物体受力与运动的关系，解决超重失重等问题。", "knowledge": [{"title": "牛顿第一定律", "content": "一切物体总保持匀速直线运动状态或静止状态，除非作用在它上面的力迫使它改变。揭示了惯性，质量是惯性大小的量度。"}, {"title": "牛顿第二定律", "content": "物体加速度的大小与所受合力成正比、与质量成反比，方向与合力方向相同。F合=ma。矢量性、瞬时性。"}, {"title": "牛顿第三定律", "content": "两个物体之间的作用力和反作用力总是大小相等、方向相反、作用在两个物体上、同性质、同时产生消失。"}, {"title": "超重与失重", "content": "视重大于实重为超重（加速度向上）；视重小于实重为失重（加速度向下）；视重为零为完全失重（a=g 向下）。物体实际重力不变。"}, {"title": "整体法与隔离法", "content": "连接体问题：求整体加速度用整体法，求内力用隔离法。"}], "exam_points": [{"title": "牛顿第二定律应用", "content": "受力分析列 F=ma 求加速度或未知力；多过程问题。"}, {"title": "连接体问题", "content": "整体法与隔离法结合求加速度与相互作用力。"}, {"title": "超重失重", "content": "判断超失重状态及视重计算。"}], "examples": [{"title": "牛顿第二定律", "question": "质量 2 kg 物体受水平力 F=8 N，μ=0.1，求加速度（g=10）。", "analysis": "合力=F−μmg，由 F合=ma 求 a。", "answer": "F合=8−0.1×2×10=6 N，a=F合/m=6/2=3 m/s²。"}, {"title": "超重失重", "question": "电梯中的人站在体重计上，电梯由静止开始向上加速，体重计示数如何变化？", "analysis": "向上加速时人处于超重状态。", "answer": "向上加速时加速度向上，人受支持力 N−mg=ma，N=m(g+a)>mg，体重计示数变大（超重）。"}]}]}, {"name": "必修第二册", "chapters": [{"id": "ph_2_5", "title": "第五章 抛体运动", "summary": "研究曲线运动条件，平抛运动规律与一般抛体运动。", "knowledge": [{"title": "曲线运动", "content": "物体做曲线运动的条件：合力方向与速度方向不在同一直线上。速度方向沿轨迹切线方向。"}, {"title": "运动的合成与分解", "content": "合运动与分运动具有等时性、独立性。分运动、合运动都遵守平行四边形定则。"}, {"title": "平抛运动", "content": "初速度水平、只受重力的匀变速曲线运动。水平：匀速 vx=v0，x=v0t；竖直：自由落体 vy=gt，y=½gt²。合速度 v=√(vx²+vy²)，方向 tanθ=vy/vx。"}, {"title": "斜抛运动", "content": "可分解为水平匀速与竖直匀变速运动。射程、射高与抛射角有关，45° 射程最大（不计空气阻力）。"}], "exam_points": [{"title": "平抛规律", "content": "位移、速度计算；落地时间由高度决定 t=√(2h/g)，水平射程由 v0 和 h 决定。"}, {"title": "速度方向", "content": "某一时刻速度方向与位移方向不同；速度反向延长线交水平位移中点。"}, {"title": "合成与分解", "content": "小船渡河问题（渡河时间、最短位移）。"}], "examples": [{"title": "平抛", "question": "从高 20 m 处以 5 m/s 水平抛出物体，求落地时间、水平射程和落地速度（g=10）。", "分析": "竖直方向自由落体求时间，水平匀速求射程。", "answer": "t=√(2h/g)=√(40/10)=2 s；x=v0t=5×2=10 m；vy=gt=20 m/s，v=√(25+400)=√425≈20.6 m/s。"}, {"title": "速度反向延长", "question": "平抛运动某时刻速度方向与水平方向夹角为 α，此时位移方向与水平方向夹角 β，二者关系？", "分析": "速度反向延长线过水平位移中点。", "answer": "tanα=2tanβ，即速度方向角正切是位移方向角正切的两倍。"}]}, {"id": "ph_2_6", "title": "第六章 圆周运动", "summary": "描述圆周运动的物理量，研究匀速圆周运动的向心加速度、向心力及生活中的圆周运动。", "knowledge": [{"title": "描述量", "content": "线速度 v=Δs/Δt=2πr/T；角速度 ω=Δφ/Δt=2π/T；v=ωr；周期 T、频率 f=1/T；转速 n。同轴转动 ω 相同，同带（不打滑）传动 v 相同。"}, {"title": "向心加速度", "content": "a=v²/r=ω²r=ωv，方向始终指向圆心，只改变速度方向不改变大小。"}, {"title": "向心力", "content": "F=m v²/r=mω²r，方向指向圆心，是效果力，由重力、弹力、摩擦力等提供。匀速圆周运动中合力等于向心力。"}, {"title": "变速圆周与离心", "content": "合力不指向圆心时为变速圆周运动；所受合力不足以提供所需向心力时物体做离心运动。"}], "exam_points": [{"title": "向心力来源分析", "content": "分析什么力提供向心力（如汽车转弯、圆锥摆、火车转弯）。"}, {"title": "临界问题", "content": "最高点最低点临界速度（如绳模型最高点 v≥√(gr)，杆模型 v 可为零）。"}, {"title": "传动问题", "content": "同轴、同带传动的 v、ω、a 关系。"}], "examples": [{"title": "向心力来源", "question": "汽车在水平弯道转弯，半径 50 m，μ=0.4，求最大安全速度（g=10）。", "分析": "静摩擦力提供向心力，最大静摩擦近似 μmg。", "answer": "μmg=m v²/r，v=√(μgr)=√(0.4×10×50)=√200≈14.1 m/s。"}, {"title": "绳模型临界", "question": "长 1 m 轻绳系小球在竖直平面做圆周运动，最高点最小速度（g=10）？", "分析": "最高点重力恰好提供向心力时速度最小。", "answer": "mg=m v²/r，v=√(gr)=√10≈3.16 m/s。"}]}, {"id": "ph_2_7", "title": "第七章 万有引力与宇宙航行", "summary": "学习万有引力定律，用其分析天体运动，了解人造卫星与宇宙速度。", "knowledge": [{"title": "开普勒定律", "content": "第一定律：行星轨道为椭圆，太阳在焦点；第二定律：相同时间扫过相同面积（近日点快）；第三定律：a³/T²=k，对所有绕同一天体运动的物体成立。"}, {"title": "万有引力定律", "content": "F=G m1m2/r²，G=6.67×10⁻¹¹ N·m²/kg²。引力存在于一切物体间，距离 r 为质心间距。"}, {"title": "天体质量与密度", "content": "对环绕天体：G Mm/r²=m(2π/T)²r，得 M=4π²r³/(GT²)。由表面重力 GMm/R²=mg 得 GM=gR²（黄金代换）。"}, {"title": "宇宙速度", "content": "第一宇宙速度 v1=√(gR)=7.9 km/s，是最小发射速度、最大环绕速度；第二 11.2 km/s；第三 16.7 km/s。同步卫星周期 24 h、定轨道平面。"}], "exam_points": [{"title": "卫星问题", "content": "轨道半径、速度、周期、加速度关系（r 越大 v、ω、a 越小，T 越大）。"}, {"title": "天体质量计算", "content": "用环绕法或表面重力法求中心天体质量与密度。"}, {"title": "变轨问题", "content": "卫星变轨中速度、加速度变化（近地点加速、远地点）。"}], "examples": [{"title": "卫星速度", "question": "已知地球质量 M、半径 R，求近地卫星环绕速度表达式。", "分析": "近地卫星轨道半径近似 R，万有引力提供向心力。", "answer": "GMm/R²=m v²/R，v=√(GM/R)。"}, {"title": "天体质量", "question": "某行星的卫星轨道半径 r、周期 T，求行星质量 M。", "分析": "万有引力提供向心力。", "answer": "GMm/r²=m(4π²/T²)r，M=4π²r³/(GT²)。"}]}, {"id": "ph_2_8", "title": "第八章 机械能守恒定律", "summary": "建立功、功率概念，学习动能定理与机械能守恒定律，理解功能关系。", "knowledge": [{"title": "功", "content": "W=Fl cosα，α 为力与位移夹角。α<90° 正功，α>90° 负功，α=90° 不做功。功是标量，单位 J。"}, {"title": "功率", "content": "P=W/t（平均功率）；P=Fv cosα（瞬时功率）。额定功率与实际功率。机车启动：恒定功率启动时 a 减小，速度增大直至 a=0 匀速。"}, {"title": "动能与动能定理", "content": "动能 Ek=½mv²。动能定理：合力做的功等于动能变化，W合=ΔEk=½mv2²−½mv1²。适用一切过程。"}, {"title": "势能", "content": "重力势能 Ep=mgh（h 相对零势面），重力做正功势能减少，W_G=−ΔEp。弹性势能 Ep=½kx²。"}, {"title": "机械能守恒定律", "content": "只有重力（或弹力）做功时，动能与势能相互转化，机械能总量不变。Ek1+Ep1=Ek2+Ep2。条件：除重弹力外其它力不做功。"}], "exam_points": [{"title": "功与功率", "content": "恒力做功、变力做功（图象、动能定理）；机车启动问题。"}, {"title": "动能定理", "content": "多过程问题中用动能定理求速度或位移。"}, {"title": "机械能守恒", "content": "判断守恒条件；用守恒定律解题；功能关系（合外力功=ΔEk，重力弹簧力功=−ΔEp）。"}], "examples": [{"title": "动能定理", "question": "质量 1 kg 物体从高 5 m 处由静止下落，落地速度 8 m/s，求阻力做功（g=10）。", "分析": "合外力功等于动能变化。", "answer": "mgh+Wf=½mv²−0，1×10×5+Wf=½×1×64，Wf=32−50=−18 J，阻力做负功 18 J。"}, {"title": "机械能守恒", "question": "小球从光滑半球顶端由静止滑下，求滑离球面时距地面的高度（球半径 R）。", "分析": "光滑无摩擦，只有重力做功，机械能守恒；脱离时支持力为零。", "answer": "由机械能守恒 mgR=mv²/2+mg h，脱离时 mg cosθ=m v²/R 且 h=R cosθ，联立得 v²=gR(1−cosθ)，代入守恒解得 cosθ=2/3，h=2R/3。"}]}]}, {"name": "必修第三册", "chapters": [{"id": "ph_3_9", "title": "第九章 静电场及其应用", "summary": "建立电荷、库仑定律、电场概念，学习电场强度与电场线。", "knowledge": [{"title": "电荷与守恒", "content": "自然界两种电荷，同斥异引。元电荷 e=1.6×10⁻¹⁹ C。电荷守恒：电荷不会创生消灭，只能转移。起电方式：摩擦、感应、接触。"}, {"title": "库仑定律", "content": "真空中两个静止点电荷间作用力 F=k q1q2/r²，k=9×10⁹ N·m²/C²。方向沿连线，同种电荷相斥异种相吸。适用于真空中静止点电荷。"}, {"title": "电场强度", "content": "E=F/q（定义式，与 F、q 无关）；点电荷 E=kQ/r²（决定式）。矢量，方向规定为正电荷受力方向。叠加遵循平行四边形定则。"}, {"title": "电场线", "content": "形象描述电场：从正电荷出发到负电荷终止，不相交，疏密表强弱，切线方向表场强方向。匀强电场电场线平行等距。"}], "exam_points": [{"title": "库仑定律", "content": "力的大小计算与方向判断；接触带电后电荷平分。"}, {"title": "电场强度", "content": "定义式与决定式区别；场强叠加（多个点电荷）。"}, {"title": "电场线", "content": "识别常见电场线；判断场强大小方向。"}], "examples": [{"title": "库仑力", "question": "真空中间距 r 的两个点电荷 q1、q2，相互作用力 F，将距离增大到 2r，力变为多少？", "分析": "库仑力与距离平方成反比。", "answer": "F'=F×(r/2r)²=F/4。"}, {"title": "场强叠加", "question": "等量异种电荷连线中垂线上，距中点远处一点的电场强度方向如何？", "分析": "两电荷在该点场强叠加，水平分量抵消，竖直分量合成。", "answer": "等量异种电荷中垂线上场强方向垂直中垂线、由正电荷指向负电荷一侧，各点方向相同。"}]}, {"id": "ph_3_10", "title": "第十章 静电场中的能量", "summary": "学习电势、电势能、电势差与电容，理解电场力做功与电势能变化的关系。", "knowledge": [{"title": "电势能与电场力做功", "content": "电场力做正功电势能减少，W_AB=EpA−EpB。电势能是标量，有正负。"}, {"title": "电势与电势差", "content": "电势 φ=Ep/q（相对零势点）；电势差 UAB=φA−φB=WAB/q。沿电场线方向电势降低。等势面与电场线垂直。"}, {"title": "匀强电场", "content": "E=U/d（d 为沿电场方向距离）。电场力做功 W=qU，与路径无关。"}, {"title": "电容", "content": "C=Q/U（定义式），平行板电容 C=εrS/(4πkd)。电容器充放电：电压不变（接电源）改变 d、S，或电荷量不变（断电）改变 d、S，分析 Q、E 变化。"}], "exam_points": [{"title": "电势高低判断", "content": "沿电场线方向电势降低；正电荷在电势高处电势能大。"}, {"title": "电场力做功", "content": "W=qU 计算；动能定理在电场中的应用。"}, {"title": "电容器动态分析", "content": "区分电压恒定与电荷量恒定两种情况分析。"}], "examples": [{"title": "电场力做功", "question": "电场中 A、B 两点电势差 UAB=100 V，电子从 A 到 B 电场力做功多少？", "分析": "电子电量 q=−e，W=qUAB。", "answer": "q=−1.6×10⁻¹⁹ C，W=qUAB=−1.6×10⁻¹⁹×100=−1.6×10⁻¹⁷ J，电场力做负功，电势能增加。"}, {"title": "匀强电场", "question": "匀强电场 E=200 V/m，沿电场方向相距 0.1 m 的两点电势差？", "分析": "匀强电场中 U=Ed。", "answer": "U=Ed=200×0.1=20 V。"}]}, {"id": "ph_3_11", "title": "第十一章 电路及其应用", "summary": "学习电流、电阻、欧姆定律与串并联电路，掌握电学实验与电表改装。", "knowledge": [{"title": "电流与电阻", "content": "电流 I=q/t，方向为正电荷定向移动方向。电阻 R=U/I（定义），R=ρL/S（决定），ρ 随温度变化。"}, {"title": "欧姆定律", "content": "I=U/R（适用于金属和电解液，不适用于气态）。伏安特性曲线：线性元件直线过原点，非线性元件曲线。"}, {"title": "串并联", "content": "串联：I 相同，U、P 与 R 成正比，R=R1+R2；并联：U 相同，I、P 与 R 成反比，1/R=1/R1+1/R2。并联总电阻小于任一支路。"}, {"title": "电表改装与测量", "content": "电流表内阻很小，电压表内阻很大。测电阻：伏安法（电流表内接测大电阻、外接测小电阻）；测电源电动势和内阻（伏安法、安阻法）。"}], "exam_points": [{"title": "电路计算", "content": "串并联化简；含电容电路；电路动态分析（R 变化引起 I、U 变化）。"}, {"title": "电表改装", "content": "电流表改装电压表（串联分压电阻）；量程扩大计算。"}, {"title": "实验", "content": "测金属电阻率、描绘伏安特性曲线、测电动势与内阻的电路与数据处理。"}], "examples": [{"title": "电路动态", "question": "并联电路中一支路电阻增大，总电流、另一支路电流如何变化（电压恒定）？", "分析": "电压不变，分析各支路与总电阻。", "answer": "恒定电压下，该支路电流减小，另一支路电压不变电流不变；总电阻增大，总电流减小。"}, {"title": "电表改装", "question": "满偏电流 Ig=1 mA、内阻 Rg=100 Ω 的电流表改装为 3 V 电压表，需串联多大电阻？", "分析": "串联电阻分担额外电压。", "answer": "Ug=IgRg=0.1 V，需分担 2.9 V，R=(3−0.1)/0.001=2900 Ω。"}]}, {"id": "ph_3_12", "title": "第十二章 电能 能量守恒定律", "summary": "学习电动势、闭合电路欧姆定律、焦耳定律与电源功率，理解能量守恒。", "knowledge": [{"title": "电动势", "content": "电源把其它形式能转化为电能的本领，E=W/q。电源内阻 r。"}, {"title": "闭合电路欧姆定律", "content": "I=E/(R+r)。路端电压 U=E−Ir。外电路断路 I=0 时 U=E；短路 R=0 时 I=E/r。U-I 图象纵截距为 E、斜率为 −r。"}, {"title": "电功与电热", "content": "电功 W=UIt（电能转化为其它形式能）；电热 Q=I²Rt（焦耳定律，纯电阻时 W=Q）。功率 P=UI，热功率 P=I²R。电源功率 P=EI，内耗 I²r，输出 UI=EI−I²r。"}, {"title": "能量守恒", "content": "能量不会创生消灭，只发生转化转移。电源总能量＝内耗＋外电路消耗。"}], "exam_points": [{"title": "闭合电路欧姆定律", "content": "求电流、路端电压；含电容电路；U-I 图象分析。"}, {"title": "功率分配", "content": "电源输出功率最大条件 R=r；效率 η=U/E=R/(R+r)。"}, {"title": "动态与故障", "content": "电阻变化引起各量变化；含容电路电容电量。"}], "examples": [{"title": "闭合电路", "question": "电源 E=6 V、r=1 Ω，外接 R=2 Ω，求路端电压与电源效率。", "分析": "由闭合电路欧姆定律求电流再求路端电压。", "answer": "I=E/(R+r)=6/3=2 A，U=IR=4 V，η=U/E=4/6≈66.7%。"}, {"title": "输出功率最大", "question": "电源 E、r 一定，外阻 R 为何值时输出功率最大？", "分析": "输出功率 P=I²R=E²R/(R+r)²，求极值。", "answer": "当 R=r 时输出功率最大，Pmax=E²/(4r)。"}]}, {"id": "ph_3_13", "title": "第十三章 电磁感应与电磁波初步", "summary": "初步认识磁场对电流的作用、电磁感应现象与电磁波，了解麦克斯韦电磁理论。", "knowledge": [{"title": "磁场与安培力", "content": "磁感线闭合，磁感应强度 B。安培力 F=BIL（B⊥I），方向用左手定则。地磁场分布。"}, {"title": "电磁感应", "content": "穿过闭合回路的磁通量 Φ=BS（B⊥S）变化时产生感应电流。法拉第电磁感应定律 E=nΔΦ/Δt。导体切割磁感线 E=BLv。楞次定律判断方向：感应电流磁场阻碍磁通量变化。"}, {"title": "电磁波", "content": "变化的电场和磁场交替产生由近及远传播形成电磁波。真空中 c=3×10⁸ m/s，c=λf。电磁波谱：无线电波、红外线、可见光、紫外线、X 射线、γ 射线，频率依次增大、波长依次减小。"}, {"title": "能量量子化", "content": "普朗克能量子 ε=hν，h=6.63×10⁻³⁴ J·s。光电效应：极限频率，光子说。"}], "exam_points": [{"title": "安培力", "content": "大小计算与左手定则判断方向。"}, {"title": "电磁感应", "content": "感应电动势 E=nΔΦ/Δt、E=BLv 计算；楞次定律判断方向。"}, {"title": "电磁波", "content": "波速 c=λf；电磁波谱顺序与应用。"}], "examples": [{"title": "感应电动势", "question": "长 0.5 m 导体棒以 4 m/s 垂直切割 B=0.2 T 的匀强磁场，求感应电动势。", "分析": "切割磁感线 E=BLv。", "answer": "E=BLv=0.2×0.5×4=0.4 V。"}, {"title": "电磁波", "question": "某电磁波频率 5×10¹⁴ Hz，求真空中波长。", "分析": "由 c=λf 求 λ。", "answer": "λ=c/f=3×10⁸/(5×10¹⁴)=6×10⁻⁷ m=600 nm（可见光范围）。"}]}]}]}, {"subject": "化学", "books": [{"name": "必修第一册", "chapters": [{"id": "ch_1_1", "title": "第一章 物质及其变化", "summary": "学习物质分类、分散系与胶体、离子反应、氧化还原反应，建立化学变化的基本认识。", "knowledge": [{"title": "物质的分类", "content": "物质的分类是化学学习的基础框架。根据组成物质的种类，可将物质分为纯净物和混合物。纯净物由同一种分子（或离子、原子）构成，有固定的组成和性质；混合物由两种或两种以上物质混合而成，各保持原有性质。\n\n纯净物进一步分为单质和化合物。单质由同种元素组成，如 O₂、Fe、C（金刚石）；化合物由不同种元素组成。化合物分为无机物和有机物。无机化合物主要包括酸、碱、盐、氧化物四类。\n\n氧化物的分类是重点：（1）酸性氧化物：能与碱反应生成盐和水，如 CO₂ + 2NaOH = Na₂CO₃ + H₂O，SO₂、SO₃、P₂O₅ 等；（2）碱性氧化物：能与酸反应生成盐和水，如 CaO + 2HCl = CaCl₂ + H₂O，Fe₂O₃、CuO、Na₂O 等；（3）两性氧化物：既能与酸又能与碱反应生成盐和水，如 Al₂O₃；（4）不成盐氧化物：如 CO、NO，不能与酸或碱反应生成盐。\n\n酸的定义：电离时生成的阳离子全部是 H⁺ 的化合物；碱的定义：电离时生成的阴离子全部是 OH⁻ 的化合物。注意'全部'二字，如 NaHSO₄ 电离出 Na⁺、H⁺、SO₄²⁻，它是酸式盐而不是酸。\n\n【老师提醒】分类思想贯穿整个高中化学，做题时先判断物质类别，再依据类别通性反应。易错点：CO 虽含碳但属无机物；Na₂O₂ 是过氧化物不是普通碱性氧化物；酸性氧化物不一定溶于水（如 SiO₂）。\n\n解题方法：判断氧化物类别时，看它能否与酸/碱反应生成盐和水。判断酸碱盐时严格依据定义。"}, {"title": "分散系与胶体", "content": "分散系是把一种或多种物质以微小粒子的形式分散到另一种物质中所形成的混合物。被分散的物质叫分散质，起容纳作用的物质叫分散剂。\n\n根据分散质粒子直径大小，分散系分为三类：（1）溶液：粒子直径小于 1 nm，均匀稳定，能透过滤纸和半透膜，无丁达尔效应；（2）胶体：粒子直径在 1~100 nm 之间，较稳定，能透过滤纸但不能透过半透膜，有丁达尔效应；（3）浊液：粒子直径大于 100 nm，不稳定易沉降，不能透过滤纸，无丁达尔效应。\n\n胶体的特性：（1）丁达尔效应：用一束光通过胶体，可看到一条光亮通路，这是鉴别溶液和胶体最简便的方法，原因是胶体粒子对光的散射；（2）电泳：胶体粒子在外电场作用下定向移动，说明胶体粒子带电（一般金属氢氧化物胶体带正电，硅酸胶体、硫化物胶体带负电）；（3）聚沉：使胶体粒子聚集成较大颗粒沉降下来，方法有加电解质、加带相反电荷胶体、加热。\n\nFe(OH)₃ 胶体的制备：向沸水中逐滴加入饱和 FeCl₃ 溶液，继续煮沸至液体呈红褐色即停止加热。化学方程式：FeCl₃ + 3H₂O =（加热）Fe(OH)₃（胶体）+ 3HCl。注意：不能搅拌，不能长时间加热（否则胶体聚沉），制备得到的是胶体不是沉淀。\n\n【老师提醒】丁达尔效应是鉴别胶体和溶液的简便方法，但不是所有胶体都有电泳现象。胶体稳定的本质原因是胶体粒子带同种电荷相互排斥，而非布朗运动。易错：制备 Fe(OH)₃ 胶体必须用沸水，不能用冷水；方程式要标注'胶体'而非沉淀符号。\n\n解题技巧：判断分散系类型看粒子直径；鉴别溶液和胶体用丁达尔效应；使胶体聚沉可加电解质溶液（如 NaCl、Na₂SO₄）。"}, {"title": "离子反应", "content": "电解质：在水溶液中或熔融状态下能导电的化合物。强电解质包括强酸（HCl、H₂SO₄、HNO₃）、强碱（NaOH、KOH、Ba(OH)₂、Ca(OH)₂）和大多数盐；弱电解质包括弱酸（CH₃COOH、H₂CO₃、HClO）、弱碱（NH₃·H₂O）和水。注意：NH₃·H₂O 是弱电解质，但 NH₃ 不是电解质（是非电解质）。\n\n离子反应：有离子参加或生成的反应。复分解型离子反应发生的条件是生成沉淀、气体或弱电解质（水、弱酸、弱碱）。实质是溶液中某些离子浓度减小。\n\n离子方程式书写四步法（写、拆、删、查）：\n第一步'写'：写出正确的化学方程式。如 CaCO₃ + 2HCl = CaCl₂ + H₂O + CO₂↑。\n第二步'拆'：把易溶于水且易电离的物质（强酸、强碱、可溶性盐）拆成离子，难溶物、气体、弱电解质、氧化物、单质不拆。CaCO₃ 难溶不拆，HCl 拆为 H⁺ + Cl⁻，CaCl₂ 拆为 Ca²⁺ + 2Cl⁻，H₂O 和 CO₂ 不拆。\n第三步'删'：删去方程式两边相同的离子（未参加反应的离子）。Cl⁻ 两边各有 2 个，删去。\n第四步'查'：检查质量守恒和电荷守恒。\n最终：CaCO₃ + 2H⁺ = Ca²⁺ + H₂O + CO₂↑。\n\n拆分要牢记：不拆的物质包括沉淀（如 BaSO₄、AgCl、CaCO₃）、气体（如 CO₂、SO₂）、弱电解质（如 H₂O、CH₃COOH、NH₃·H₂O）、氧化物（如 Na₂O、Fe₂O₃）、单质（如 Na、Cl₂）、浓硫酸（浓度大时以分子形式存在）。\n\n【老师提醒】离子方程式正误判断是高频考点，检查要点：（1）是否符合客观事实（如 Fe + HCl 生成 FeCl₂ 而非 FeCl₃）；（2）是否拆分正确；（3）是否同时满足质量守恒和电荷守恒；（4）氧化还原反应中电子转移是否守恒；（5）量的关系是否正确（如少量/过量问题）。\n\n量的关系问题：Na₂CO₃ 与少量 HCl 反应：CO₃²⁻ + H⁺ = HCO₃⁻；与足量 HCl 反应：CO₃²⁻ + 2H⁺ = H₂O + CO₂↑。技巧：少量物质的离子比例由其化学式决定。"}, {"title": "氧化还原反应", "content": "氧化还原反应的本质是电子的转移（得失或偏移），外在表现是元素化合价的升降。\n\n核心口诀：'升失氧，降得还'。即化合价升高→失去电子→被氧化→发生氧化反应→作还原剂（自身被氧化）；化合价降低→得到电子→被还原→发生还原反应→作氧化剂（自身被还原）。\n\n氧化剂：得到电子、化合价降低、被还原、发生还原反应，反应后生成还原产物；还原剂：失去电子、化合价升高、被氧化、发生氧化反应，反应后生成氧化产物。\n\n常见氧化剂：（1）活泼非金属单质：Cl₂、O₂、O₃、Br₂；（2）高价化合物：KMnO₄（酸性）、K₂Cr₂O₇、HNO₃（浓/稀）、浓 H₂SO₄；（3）高价离子：Fe³⁺、Cu²⁺、MnO₄⁻；（4）过氧化物：Na₂O₂、H₂O₂。\n\n常见还原剂：（1）活泼金属单质：Na、K、Mg、Al、Zn、Fe；（2）某些非金属单质：H₂、C；（3）低价化合物：CO、SO₂、SO₃²⁻、I⁻、S²⁻；（4）含低价元素的化合物：Fe²⁺。\n\n氧化还原反应的规律：（1）守恒规律：得失电子总数相等（配平依据）；（2）强弱规律：强氧化剂 + 强还原剂 = 弱氧化剂 + 弱还原剂（即'强制弱'）；（3）先后规律：一种氧化剂遇到多种还原剂时，先氧化最强的；（4）价态规律：最高价只有氧化性，最低价只有还原性，中间价态既有氧化性又有还原性。\n\n电子转移的表示方法：双线桥法（从反应物指向生成物，同种元素间）和单线桥法（从还原剂指向氧化剂，表示电子转移方向和数目）。\n\n【老师提醒】判断氧化还原反应的关键是看有无化合价变化。注意：不是所有化合价变化都是氧化还原反应（如 NaCl 熔融电离），但所有氧化还原反应一定有化合价变化。易错点：（1）同种元素既被氧化又被还原的反应叫歧化反应，如 Cl₂ + 2NaOH = NaCl + NaClO + H₂O；（2）归中反应如 2H₂S + SO₂ = 3S + 2H₂O。\n\n配平方法：以化合价升降法为核心，步骤为：标价态→列变化→求总数（找最小公倍数）→配系数→查守恒。"}], "exam_points": [{"title": "离子共存", "content": "判断离子能否大量共存是高频考点。不共存的情况：（1）结合生成沉淀：如 Ba²⁺ 与 SO₄²⁻、Ag⁺ 与 Cl⁻、Ca²⁺ 与 CO₃²⁻；（2）结合生成气体：如 H⁺ 与 CO₃²⁻、H⁺ 与 SO₃²⁻、H⁺ 与 S²⁻；（3）结合生成弱电解质：如 H⁺ 与 OH⁻、H⁺ 与 CH₃COO⁻；（4）发生氧化还原反应：如 Fe³⁺ 与 I⁻、MnO₄⁻（H⁺）与 Cl⁻、NO₃⁻（H⁺）与 Fe²⁺；（5）发生双水解：如 Al³⁺ 与 AlO₂⁻、Al³⁺ 与 S²⁻。\n\n解题技巧：注意题干隐含条件——'无色溶液'排除 Fe²⁺（浅绿）、Fe³⁺（黄）、Cu²⁺（蓝）、MnO₄⁻（紫）；'酸性溶液'（pH=1）则含大量 H⁺，排除与 H⁺ 不共存的离子；'碱性溶液'（pH=13）则含大量 OH⁻，排除与 OH⁻ 不共存的离子；'因发生氧化还原反应不能共存'则只考虑氧化还原。"}, {"title": "离子方程式正误判断", "content": "离子方程式判断常见错误类型：（1）不符合客观事实：如 2Fe + 6H⁺ = 2Fe³⁺ + 3H₂↑（错，应生成 Fe²⁺）；（2）拆分错误：如 CH₃COOH 拆成 H⁺ + CH₃COO⁻（错，弱酸不拆）；（3）电荷不守恒：如 Fe + Fe³⁺ = 2Fe²⁺（错，左边电荷 +3，右边 +4，应为 2Fe³⁺）；（4）产物错误：如 Na 与水反应写成 Na + H₂O = Na⁺ + OH⁻ + H₂↑（错，未配平，应为 2Na + 2H₂O = 2Na⁺ + 2OH⁻ + H₂↑）；（5）量的关系错误。\n\n解题方法：一看事实、二看拆分、三看守恒（质量+电荷）、四看量比。"}, {"title": "氧化还原反应综合", "content": "常考题型：（1）判断氧化剂、还原剂、氧化产物、还原产物；（2）标电子转移方向和数目；（3）比较氧化性/还原性强弱（依据反应方向判断：强氧化剂 + 强还原剂 → 弱氧化剂 + 弱还原剂）；（4）氧化还原反应配平（化合价升降法）；（5）电子守恒计算。\n\n解题技巧：判断氧化性/还原性强弱时，由反应方向直接判断——反应物中氧化剂的氧化性强于生成物中氧化产物。配平时先找化合价变化最大的元素入手。计算题用电子守恒：氧化剂得电子总数 = 还原剂失电子总数。"}, {"title": "物质的分类与分散系", "content": "考查物质类别判断、酸性/碱性氧化物判断、分散系分类与鉴别。解题关键是熟记各类物质的概念和典型代表物，注意不成盐氧化物（CO、NO）和两性氧化物（Al₂O₃）的特殊性。胶体鉴别用丁达尔效应。"}], "examples": [{"title": "离子方程式书写（基础题）", "question": "写出下列反应的离子方程式：（1）石灰石与稀盐酸反应；（2）氢氧化钡溶液与稀硫酸反应。", "analysis": "（1）石灰石主要成分 CaCO₃ 是难溶物，不拆；HCl 是强电解质，拆为 H⁺ 和 Cl⁻；产物 CaCl₂ 是可溶性盐拆为 Ca²⁺ 和 Cl⁻，H₂O 是弱电解质不拆，CO₂ 是气体不拆。写化学方程式：CaCO₃ + 2HCl = CaCl₂ + H₂O + CO₂↑。拆开后：CaCO₃ + 2H⁺ + 2Cl⁻ = Ca²⁺ + 2Cl⁻ + H₂O + CO₂↑。删去两边相同的 Cl⁻，检查质量守恒和电荷守恒。\n（2）Ba(OH)₂ 是强碱拆为 Ba²⁺ + 2OH⁻，H₂SO₄ 是强酸拆为 2H⁺ + SO₄²⁻，产物 BaSO₄ 是沉淀不拆，H₂O 不拆。注意此反应中 Ba²⁺ 与 SO₄²⁻ 生成沉淀、H⁺ 与 OH⁻ 生成水，所有离子都参加了反应。", "answer": "（1）CaCO₃ + 2H⁺ = Ca²⁺ + H₂O + CO₂↑\n（2）Ba²⁺ + 2OH⁻ + 2H⁺ + SO₄²⁻ = BaSO₄↓ + 2H₂O"}, {"title": "氧化还原基本判断（基础题）", "question": "在反应 2Na + Cl₂ = 2NaCl 中，哪种物质被氧化？哪种物质被还原？哪种物质是氧化剂？哪种物质是还原剂？标出电子转移的方向和数目。", "analysis": "首先标出各元素化合价：Na 由 0 价升高到 +1 价（失去电子，被氧化，作还原剂），Cl 由 0 价降低到 -1 价（得到电子，被还原，作氧化剂）。用双线桥法表示：Na 从 0 → +1，失去 1 个电子，2 个 Na 共失去 2 个电子；Cl 从 0 → -1，得到 1 个电子，2 个 Cl 共得到 2 个电子。得失电子总数相等（2 个），符合守恒规律。用单线桥法表示：箭头从 Na 指向 Cl，标注'失去 2e⁻'。", "answer": "Na 元素化合价由 0 升高到 +1，失去电子被氧化，Na 是还原剂；Cl 元素化合价由 0 降低到 -1，得到电子被还原，Cl₂ 是氧化剂。电子转移：2 个 Na 共失去 2 个电子转移给 2 个 Cl 原子。"}, {"title": "离子共存判断（中档题）", "question": "某无色透明溶液中可能大量共存的离子组是（  ）\nA. K⁺、Na⁺、MnO₄⁻、SO₄²⁻\nB. Na⁺、Cu²⁺、OH⁻、NO₃⁻\nC. K⁺、Na⁺、HCO₃⁻、OH⁻\nD. Na⁺、K⁺、Cl⁻、SO₄²⁻", "analysis": "题干关键词'无色透明'，需排除有色离子。\n\nA 选项：MnO₄⁻ 是紫红色离子，溶液不为无色，排除 A。\nB 选项：Cu²⁺ 是蓝色离子，且 Cu²⁺ 与 OH⁻ 结合生成 Cu(OH)₂ 沉淀（蓝色），既不符合无色也不能共存，排除 B。\nC 选项：HCO₃⁻ 与 OH⁻ 反应生成 CO₃²⁻ 和 H₂O，即 HCO₃⁻ + OH⁻ = CO₃²⁻ + H₂O，不能共存，排除 C。\nD 选项：K⁺、Na⁺、Cl⁻、SO₄²⁻ 之间不会结合生成沉淀、气体或弱电解质，也不发生氧化还原反应，可以大量共存，且均为无色离子。", "answer": "选 D。K⁺、Na⁺、Cl⁻、SO₄²⁻ 之间不发生任何反应，且均为无色离子，可以大量共存。"}, {"title": "氧化还原配平（中档题）", "question": "配平化学方程式：__ Cu + __ HNO₃（稀）= __ Cu(NO₃)₂ + __ NO↑ + __ H₂O，并标出电子转移数目。", "analysis": "用化合价升降法配平。标价态：Cu 从 0 → +2（升 2，失去 2 个电子，被氧化），N 从 +5 → +2（降 3，得到 3 个电子，被还原）。\n\n求最小公倍数：升 2 和降 3 的最小公倍数为 6，所以 Cu 前系数为 6÷2 = 3，NO 前系数为 6÷3 = 2。\n\n初步配平：3Cu + __HNO₃ = 3Cu(NO₃)₂ + 2NO↑ + __H₂O。\n\nCu(NO₃)₂ 中含 3×2 = 6 个 NO₃⁻ 未参加反应（起酸的作用），NO 有 2 个参加反应（起氧化剂作用），所以 HNO₃ 总数为 6 + 2 = 8。\n\n配 H：8 个 HNO₃ 含 8 个 H，需 4 个 H₂O。\n\n配 O 验证：左边 8×3 = 24 个 O；右边 3×6 + 2 + 4 = 18 + 2 + 4 = 24 个 O，守恒。", "answer": "3Cu + 8HNO₃（稀）= 3Cu(NO₃)₂ + 2NO↑ + 4H₂O。电子转移：3 个 Cu 共失去 6 个电子，2 个 N 共得到 6 个电子。"}, {"title": "氧化还原综合计算（高考真题）", "question": "将 0.2 mol 铁粉加入 100 mL 2 mol/L 的 FeCl₃ 溶液中，充分反应后，溶液中 Fe²⁺ 和 Fe³⁺ 的物质的量分别为多少？（已知反应：2FeCl₃ + Fe = 3FeCl₂）", "analysis": "首先判断反应物量的关系。FeCl₃ 的物质的量：n(FeCl₃) = c × V = 2 mol/L × 0.1 L = 0.2 mol。\n\n由方程式 2Fe³⁺ + Fe = 3Fe²⁺ 可知，2 mol Fe³⁺ 与 1 mol Fe 完全反应。\n\n判断谁过量：0.2 mol Fe³⁺ 完全反应需 Fe 的物质的量 = 0.2 × (1/2) = 0.1 mol。现有 Fe 0.2 mol > 0.1 mol，所以 Fe 过量，Fe³⁺ 完全反应。\n\n由方程式：2 mol Fe³⁺ 反应生成 3 mol Fe²⁺，0.2 mol Fe³⁺ 反应生成 Fe²⁺ = 0.2 × (3/2) = 0.3 mol。消耗 Fe = 0.2 × (1/2) = 0.1 mol。\n\n所以溶液中 Fe²⁺ = 0.3 mol，Fe³⁺ = 0 mol（全部被还原）。", "answer": "n(FeCl₃) = 2 × 0.1 = 0.2 mol。由 2Fe³⁺ + Fe = 3Fe²⁺，0.2 mol Fe³⁺ 消耗 0.1 mol Fe（Fe 过量），Fe³⁺ 全部反应。生成 Fe²⁺ = 0.2 × (3/2) = 0.3 mol。故溶液中 Fe²⁺ = 0.3 mol，Fe³⁺ = 0。"}]}, {"id": "ch_1_2", "title": "第二章 海水中的重要元素——钠和氯", "summary": "学习钠及其化合物、氯及其化合物，建立物质的量的概念及计算。", "knowledge": [{"title": "钠及其化合物", "content": "金属钠的物理性质：银白色金属质软（可用小刀切），密度小（0.97 g/cm³，比水轻比煤油重，保存在煤油中），熔点低（97.8℃），是热和电的良导体。\n\n钠的化学性质——钠的原子结构最外层 1 个电子，极易失去，是强还原剂。\n（1）与 O₂ 反应：常温下缓慢氧化生成 Na₂O（白色）：4Na + O₂ = 2Na₂O；燃烧或加热生成 Na₂O₂（淡黄色）：2Na + O₂ =（点燃）Na₂O₂。\n（2）与水反应：2Na + 2H₂O = 2NaOH + H₂↑。实验现象口诀'浮熔游响红'：浮（钠浮在水面，密度比水小）、熔（熔成小球，反应放热且熔点低）、游（四处游动，产生气体推动）、响（有响声，反应剧烈）、红（加酚酞变红，生成 NaOH 呈碱性）。\n（3）与盐溶液反应：钠先与水反应生成 NaOH，NaOH 再与盐反应。如 Na + CuSO₄ 溶液：先 2Na + 2H₂O = 2NaOH + H₂↑，再 2NaOH + CuSO₄ = Cu(OH)₂↓ + Na₂SO₄，总反应：2Na + 2H₂O + CuSO₄ = Cu(OH)₂↓ + Na₂SO₄ + H₂↑。注意：钠不能从盐溶液中置换出金属。\n\nNa₂O：白色固体，碱性氧化物，与水反应：Na₂O + H₂O = 2NaOH；与酸反应：Na₂O + 2HCl = 2NaCl + H₂O。\n\nNa₂O₂：淡黄色固体，过氧化物（氧元素 -1 价）。与水反应：2Na₂O₂ + 2H₂O = 4NaOH + O₂↑；与 CO₂ 反应：2Na₂O₂ + 2CO₂ = 2Na₂CO₃ + O₂。Na₂O₂ 在这两个反应中既是氧化剂又是还原剂（O 从 -1 → -2 和 0，发生歧化）。Na₂O₂ 可用作供氧剂（潜水艇、航天）和漂白剂。\n\nNa₂CO₃（纯碱、苏打）与 NaHCO₃（小苏打）：\n（1）溶解性：Na₂CO₃ > NaHCO₃（同温下），NaHCO₃ 溶解度较小。\n（2）热稳定性：Na₂CO₃ 稳定，NaHCO₃ 不稳定，受热分解：2NaHCO₃ =（加热）Na₂CO₃ + H₂O + CO₂↑。\n（3）与酸反应：Na₂CO₃ + 2HCl = 2NaCl + H₂O + CO₂↑（产生气体较慢，分两步）；NaHCO₃ + HCl = NaCl + H₂O + CO₂↑（产生气体更快）。\n（4）相互转化：Na₂CO₃ + CO₂ + H₂O = 2NaHCO₃；2NaHCO₃ =（加热）Na₂CO₃ + H₂O + CO₂↑。\n\n【老师提醒】钠与水反应的现象描述要完整准确。Na₂O₂ 与水/CO₂ 反应是歧化反应，电子转移分析是重点。鉴别 Na₂CO₃ 和 NaHCO₃ 的方法：加热看是否产生气体（NaHCO₃ 分解产生 CO₂）、或加 HCl 看产生气体快慢、或加 BaCl₂ 溶液看是否产生沉淀（Na₂CO₃ + BaCl₂ = BaCO₃↓ + 2NaCl，NaHCO₃ 不与 BaCl₂ 反应）。\n\n解题技巧：Na₂O₂ 与 CO₂、H₂O 反应的增重问题——2Na₂O₂ + 2CO₂ = 2Na₂CO₃ + O₂，增重相当于吸收了 CO；2Na₂O₂ + 2H₂O = 4NaOH + O₂，增重相当于吸收了 H₂。"}, {"title": "氯及其化合物", "content": "氯气（Cl₂）的物理性质：黄绿色有刺激性气味的有毒气体，密度比空气大，能溶于水（1:2），易液化。\n\n氯气的化学性质——Cl 原子最外层 7 个电子，易得 1 个电子，是强氧化剂。\n（1）与金属反应：与活泼金属剧烈反应；与变价金属（如 Fe、Cu）反应生成高价金属氯化物。2Na + Cl₂ =（点燃）2NaCl（白烟）；2Fe + 3Cl₂ =（点燃）2FeCl₃（棕褐色烟，注意铁在氯气中生成 FeCl₃ 而非 FeCl₂）；Cu + Cl₂ =（点燃）CuCl₂（棕黄色烟）。\n（2）与非金属反应：H₂ + Cl₂ =（点燃）2HCl（苍白色火焰，工业制盐酸）；2P + 3Cl₂ = 2PCl₃（白雾，Cl₂ 不足）；2P + 5Cl₂ = 2PCl₅（白烟，Cl₂ 足量）。\n（3）与水反应：Cl₂ + H₂O = HCl + HClO。生成的次氯酸（HClO）是弱酸，具有强氧化性，能杀菌消毒和漂白（漂白原理是氧化有色物质，不可逆）。注意：氯水成分复杂，含 Cl₂、HClO、H₂O 分子及 H⁺、Cl⁻、ClO⁻ 等离子。新制氯水呈浅黄绿色。\n（4）与碱反应：Cl₂ + 2NaOH = NaCl + NaClO + H₂O（制漂白液，工业上用）；2Cl₂ + 2Ca(OH)₂ = Ca(ClO)₂ + CaCl₂ + 2H₂O（制漂白粉，有效成分 Ca(ClO)₂）。\n\n实验室制取 Cl₂：\n原理：MnO₂ + 4HCl（浓）=（加热）MnCl₂ + Cl₂↑ + 2H₂O。\n装置：固液加热型（圆底烧瓶 + 分液漏斗 + 酒精灯）。\n收集：向上排空气法（Cl₂ 密度比空气大）或排饱和食盐水法。\n除杂：通过饱和食盐水除去 HCl 气体，通过浓硫酸干燥。\n尾气处理：用 NaOH 溶液吸收多余 Cl₂（防止污染环境）。\n\n【老师提醒】氯水的漂白性来自 HClO 而非 Cl₂ 本身。干燥的 Cl₂ 无漂白性，湿润的 Cl₂（含 HClO）有漂白性。氯水久置后 HClO 分解（2HClO = 2HCl + O₂↑），溶液变为稀盐酸，颜色褪去，漂白性消失。\n\n检验 Cl⁻ 的方法：先加稀 HNO₃ 酸化（排除 CO₃²⁻ 等干扰），再加 AgNO₃ 溶液，产生不溶于稀 HNO₃ 的白色沉淀（AgCl）。"}, {"title": "物质的量", "content": "物质的量（n）是国际单位制中七个基本物理量之一，单位为摩尔（mol）。1 mol 粒子的数目规定为阿伏加德罗常数（NA）个，NA ≈ 6.02×10²³ mol⁻¹。\n\n核心换算关系：\n（1）n = N/NA（N 为粒子数，NA 为阿伏加德罗常数）\n（2）n = m/M（m 为质量，M 为摩尔质量，数值上等于相对分子/原子质量）\n（3）n = V/Vm（V 为气体体积，Vm 为气体摩尔体积，标况下 Vm ≈ 22.4 L/mol）\n（4）n = c×V（c 为物质的量浓度，V 为溶液体积）\n\n气体摩尔体积 Vm：在标准状况下（0℃、101 kPa），1 mol 任何气体（包括混合气体）的体积约为 22.4 L。注意：标况下，气体的摩尔体积为 22.4 L/mol；非标况下不一定为 22.4 L/mol。\n\n物质的量浓度 c = n/V（V 为溶液体积而非溶剂体积），单位 mol/L。\n\n溶液稀释定律：c₁V₁ = c₂V₂（稀释前后溶质的物质的量不变）。\n\n配制一定物质的量浓度溶液的步骤（以配制 100 mL 1 mol/L NaCl 溶液为例）：\n（1）计算：所需 NaCl 质量 m = c×V×M = 1 × 0.1 × 58.5 = 5.85 g\n（2）称量：用托盘天平称量 5.85 g NaCl\n（3）溶解：在烧杯中加适量蒸馏水溶解，用玻璃棒搅拌\n（4）冷却：溶液恢复至室温（热的溶液体积会膨胀）\n（5）转移：将冷却后的溶液沿玻璃棒转入 100 mL 容量瓶\n（6）洗涤：用蒸馏水洗涤烧杯和玻璃棒 2~3 次，洗涤液一并转入容量瓶\n（7）定容：加水至距刻度线 1~2 cm 处改用胶头滴管定容至凹液面最低点与刻度线相切\n（8）摇匀：盖好瓶塞，反复倒转摇匀\n\n【老师提醒】配制溶液的误差分析是重点。导致浓度偏高的操作：未冷却就转移（溶液膨胀，实际偏少）、定容时水加多了再倒出（溶质损失）；导致浓度偏低的操作：未洗涤烧杯和玻璃棒（溶质损失）、定容时仰视读数（实际加水偏多）、转移时洒出。\n\n注意：Vm = 22.4 L/mol 仅适用于标准状况下的气体，不适用于液体和固体。NA 的精确值为 6.02×10²³，考试中常考涉及 NA 的判断题。"}, {"title": "焰色试验", "content": "焰色试验是某些金属或其化合物在灼烧时使火焰呈现特殊颜色的现象，属于物理变化（电子跃迁释放能量），不是化学反应。\n\n常见元素焰色：Na——黄色；K——紫色（需透过蓝色钴玻璃观察，滤去 Na 的黄光干扰）；Ca——砖红色；Ba——黄绿色；Cu——绿色；Sr——洋红色。\n\n操作步骤：将铂丝（或铁丝）蘸取稀盐酸在酒精灯火焰上灼烧至无色（清洗），再蘸取待测液灼烧，观察火焰颜色。观察 K 的焰色时必须透过蓝色钴玻璃，因为 K 的化合物中常含微量 Na。\n\n【老师提醒】焰色试验用于鉴别某些金属离子（特别是 Na⁺ 和 K⁺），是物理方法而非化学方法。盐酸清洗铂丝的原理是金属氯化物易挥发。注意：焰色试验不是所有元素都有特殊焰色，如 Fe、Mg、Al 等无特征焰色。"}], "exam_points": [{"title": "钠的反应与计算", "content": "常考 Na、Na₂O₂ 与水、CO₂ 反应的化学方程式、实验现象和计算。重点：Na₂O₂ 与水反应产生 O₂（带火星木条复燃验证），Na₂O₂ 与 CO₂ 反应在密闭容器中可作供氧剂。增重问题技巧：2Na₂O₂ + 2CO₂ = 2Na₂CO₃ + O₂ 中每 2 mol Na₂O₂ 增重相当于 2 mol CO 的质量（28 g）；2Na₂O₂ + 2H₂O = 4NaOH + O₂ 中每 2 mol Na₂O₂ 增重相当于 2 mol H₂ 的质量（4 g）。"}, {"title": "氯气的制备与性质", "content": "实验室制 Cl₂ 的全套装置（发生→净化→收集→尾气处理）是高频考点。净化用饱和食盐水（除 HCl）和浓硫酸（干燥）。尾气用 NaOH 溶液。性质实验重点：Cl₂ 通入石蕊试液先变红后褪色（先酸化后漂白）、Cl₂ 通入品红溶液褪色（HClO 漂白）。Cl⁻ 检验：加 HNO₃ 酸化的 AgNO₃ 溶液产生白色沉淀。"}, {"title": "物质的量综合计算", "content": "n、N、m、V、c 之间的换算和溶液稀释是必考内容。注意：（1）气体摩尔体积 22.4 L/mol 仅适用于标况下的气体；（2）溶液体积不等于溶剂体积；（3）稀释时 c₁V₁ = c₂V₂。涉及 NA 的判断题常见陷阱：标况下非气体（如水、CCl₄）不能用 22.4 L/mol 计算；常温常压下气体体积不用 22.4 L/mol。"}, {"title": "Na₂CO₃ 与 NaHCO₃ 的鉴别与转化", "content": "鉴别方法：加热产生气体的是 NaHCO₃；加 HCl 产生气体更快的是 NaHCO₃；加 BaCl₂ 产生沉淀的是 Na₂CO₃（NaHCO₃ 不与 BaCl₂ 反应）。转化：Na₂CO₃ → NaHCO₃ 通入 CO₂；NaHCO₃ → Na₂CO₃ 加热分解。注意 Na₂CO₃ 与酸反应分两步：CO₃²⁻ + H⁺ = HCO₃⁻，HCO₃⁻ + H⁺ = H₂O + CO₂↑。"}], "examples": [{"title": "物质的量计算（基础题）", "question": "标准状况下，11.2 L CO₂ 的物质的量为多少？其中含有多少个原子？（NA = 6.02×10²³ mol⁻¹）", "analysis": "首先利用气体摩尔体积计算物质的量。标准状况下 Vm = 22.4 L/mol，n = V/Vm = 11.2 / 22.4 = 0.5 mol。\n\n再计算原子数。每个 CO₂ 分子由 1 个 C 原子和 2 个 O 原子组成，共 3 个原子。所以 0.5 mol CO₂ 中含有原子的物质的量为 0.5 × 3 = 1.5 mol，原子数 N = n × NA = 1.5 × 6.02×10²³ = 9.03×10²³ 个。", "answer": "n(CO₂) = 11.2 / 22.4 = 0.5 mol。每个 CO₂ 含 3 个原子，原子总数 = 0.5 × 3 × 6.02×10²³ = 9.03×10²³ 个。"}, {"title": "钠与水反应（基础题）", "question": "将 2.3 g 金属钠投入 100 mL 水中，充分反应后（假设溶液体积不变），求生成 NaOH 的物质的量浓度和产生 H₂ 的体积（标况）。", "analysis": "首先计算 Na 的物质的量：n(Na) = m/M = 2.3/23 = 0.1 mol。\n\n写出反应方程式：2Na + 2H₂O = 2NaOH + H₂↑。\n\n由方程式可知，Na 与 NaOH 的物质的量之比为 1:1，Na 与 H₂ 的物质的量之比为 2:1。\n\n所以 n(NaOH) = n(Na) = 0.1 mol，c(NaOH) = n/V = 0.1/0.1 = 1.0 mol/L（注意溶液体积按 100 mL = 0.1 L 计算，因为钠量少，水的消耗可忽略）。\n\nn(H₂) = n(Na)/2 = 0.1/2 = 0.05 mol，V(H₂) = n × Vm = 0.05 × 22.4 = 1.12 L。", "answer": "n(Na) = 2.3/23 = 0.1 mol。由 2Na + 2H₂O = 2NaOH + H₂↑，n(NaOH) = 0.1 mol，c(NaOH) = 0.1/0.1 = 1.0 mol/L。n(H₂) = 0.05 mol，V(H₂) = 0.05 × 22.4 = 1.12 L。"}, {"title": "Na₂O₂ 增重问题（中档题）", "question": "将足量 Na₂O₂ 分别通入（1）CO₂ 和 H₂O 的混合气体，（2）CO 和 H₂ 的混合气体（先通过电火花点燃使其完全燃烧后再通过 Na₂O₂），固体增重是否相同？请分析原因。", "analysis": "分析 Na₂O₂ 与不同气体反应的增重本质。\n\n（1）CO₂ 和 H₂O 混合气体通过 Na₂O₂：\n2Na₂O₂ + 2CO₂ = 2Na₂CO₃ + O₂，增重 = 吸收 CO₂ 质量 - 放出 O₂ 质量，每 2 mol Na₂O₂ 增重相当于吸收了 2 mol CO 的质量（2×28 = 56 g）。\n2Na₂O₂ + 2H₂O = 4NaOH + O₂，每 2 mol Na₂O₂ 增重相当于吸收了 2 mol H₂ 的质量（2×2 = 4 g）。\n所以混合气体通过 Na₂O₂ 的增重 = m(CO) + m(H₂)。\n\n（2）CO 和 H₂ 混合气体先点燃后通过 Na₂O₂：\nCO 燃烧：2CO + O₂ = 2CO₂；H₂ 燃烧：2H₂ + O₂ = 2H₂O。\n燃烧产物 CO₂ 和 H₂O 再通过 Na₂O₂，由上述分析，增重 = m(CO) + m(H₂)。\n\n两种情况增重完全相同！因为无论 CO 和 H₂ 先燃烧还是直接以 CO₂ 和 H₂O 形式存在，Na₂O₂ 最终增重都相当于吸收了原 CO 和 H₂ 的质量。", "answer": "两种情况增重相同。因为 2Na₂O₂ + 2CO₂ = 2Na₂CO₃ + O₂ 增重相当于吸收 CO；2Na₂O₂ + 2H₂O = 4NaOH + O₂ 增重相当于吸收 H₂。所以混合气体通过 Na₂O₂ 固体增重等于 CO 和 H₂ 的总质量，无论是否先燃烧结果都一样。"}, {"title": "氯气制备实验（中档题）", "question": "实验室用 MnO₂ 和浓盐酸制取 Cl₂，回答：（1）写出反应方程式；（2）指出装置类型；（3）如何除去 Cl₂ 中混有的 HCl 气体和水蒸气？（4）如何处理尾气？写出方程式。", "analysis": "（1）MnO₂ 氧化浓盐酸中的 Cl⁻ 生成 Cl₂。MnO₂ + 4HCl（浓）=（加热）MnCl₂ + Cl₂↑ + 2H₂O。此反应中 Mn 从 +4 降到 +2（被还原，MnO₂ 是氧化剂），Cl 从 -1 升到 0（被氧化，HCl 是还原剂），4 mol HCl 中有 2 mol 作还原剂。\n\n（2）反应物为固体（MnO₂）和液体（浓盐酸），需要加热，所以用固液加热型装置：圆底烧瓶（或蒸馏烧瓶）+ 分液漏斗 + 酒精灯。\n\n（3）净化分两步：先通过饱和食盐水除去 HCl 气体（原理：Cl₂ 在饱和食盐水中的溶解度比在纯水中小，而 HCl 极易溶于水被吸收），再通过浓硫酸除去水蒸气（干燥）。注意顺序：先除杂后干燥，不能反过来。\n\n（4）尾气用 NaOH 溶液吸收：Cl₂ + 2NaOH = NaCl + NaClO + H₂O。", "answer": "（1）MnO₂ + 4HCl（浓）=（加热）MnCl₂ + Cl₂↑ + 2H₂O。（2）固液加热型装置。（3）先通过饱和食盐水除 HCl，再通过浓硫酸干燥。（4）用 NaOH 溶液吸收：Cl₂ + 2NaOH = NaCl + NaClO + H₂O。"}, {"title": "溶液配制误差分析（高考模拟题）", "question": "用容量瓶配制一定物质的量浓度的 NaOH 溶液时，下列操作会使所配溶液浓度偏高还是偏低？\n（1）NaOH 溶解后未冷却就转移至容量瓶并定容；\n（2）转移溶液后未洗涤烧杯和玻璃棒；\n（3）定容时仰视刻度线；\n（4）定容摇匀后发现液面低于刻度线，再加水至刻度线。", "analysis": "（1）NaOH 溶解放热，溶液温度高于室温，体积膨胀。若未冷却就转移定容，在热状态下定容到刻度线时溶液体积偏大，冷却后体积缩小，实际溶液体积小于标称体积，浓度偏高。\n\n（2）烧杯和玻璃棒上残留有 NaOH 溶液，未洗涤意味着溶质损失，n 偏小，浓度偏低。\n\n（3）定容时仰视刻度线，视线偏低，看到的液面低于实际液面，因此会多加水，V 偏大，浓度偏低。反之，俯视则浓度偏高。\n\n（4）定容摇匀后液面会略低于刻度线（因为部分溶液附着在瓶塞和瓶颈上），这是正常现象，不应再加水。若再加水，V 偏大，浓度偏低。", "answer": "（1）偏高（热溶液定容后冷却体积缩小）；（2）偏低（溶质损失）；（3）偏低（仰视多加水）；（4）偏低（不应再加水，多加了水使体积偏大）。"}]}, {"id": "ch_1_3", "title": "第三章 铁 金属材料", "summary": "学习铁及其化合物的性质与转化、合金等金属材料。", "knowledge": [{"title": "铁的性质", "content": "铁的物理性质：银白色金属，有磁性，密度 7.86 g/cm³，熔点 1535℃，导电导热性良好，有延展性。\n\n铁的化学性质——Fe 是中等活泼金属，其最外层有 2 个电子，可失去 2 个或 3 个电子。与不同氧化剂反应生成 Fe²⁺ 或 Fe³⁺：\n（1）与弱氧化剂反应生成 Fe²⁺：Fe + 2HCl = FeCl₂ + H₂↑；Fe + S =（加热）FeS；Fe + CuSO₄ = FeSO₄ + Cu（湿法冶铜）；3Fe + 4H₂O（气）=（高温）Fe₃O₄ + 4H₂↑。\n（2）与强氧化剂反应生成 Fe³⁺：2Fe + 3Cl₂ =（点燃）2FeCl₃（棕褐色烟）；Fe + 4HNO₃（稀）= Fe(NO₃)₃ + NO↑ + 2H₂O。注意铁在纯氧中燃烧生成 Fe₃O₄：3Fe + 2O₂ =（点燃）Fe₃O₄（黑色固体，铁丝在氧气中剧烈燃烧，火星四射）。\n\n【老师提醒】铁与氧化剂反应产物取决于氧化剂强弱：弱氧化剂（H⁺、S、Cu²⁺）→ Fe²⁺，强氧化剂（Cl₂、Br₂、稀 HNO₃、浓 H₂SO₄）→ Fe³⁺。铁与过量稀 HNO₃ 生成 Fe³⁺，铁与少量稀 HNO₃（铁过量）先生成 Fe³⁺，多余铁再还原 Fe³⁺：2Fe³⁺ + Fe = 3Fe²⁺，最终生成 Fe²⁺。\n\n解题技巧：判断铁的产物先看氧化剂强弱，再看铁是否过量。"}, {"title": "铁的化合物", "content": "铁的氧化物：\n（1）FeO：黑色粉末，碱性氧化物，不溶于水，溶于酸：FeO + 2HCl = FeCl₂ + H₂O。不稳定，在空气中加热易被氧化为 Fe₃O₄。\n（2）Fe₂O₃：红棕色粉末（铁锈主要成分），碱性氧化物，不溶于水，溶于酸：Fe₂O₃ + 6HCl = 2FeCl₃ + 3H₂O。用途：作颜料（氧化铁红）、炼铁原料。\n（3）Fe₃O₄：黑色晶体，具有磁性，可看成 FeO·Fe₂O₃，其中铁元素有 +2 和 +3 两种价态（1:2）。与酸反应：Fe₃O₄ + 8HCl = FeCl₂ + 2FeCl₃ + 4H₂O。\n\n铁的氢氧化物：\n（1）Fe(OH)₂：白色固体，极不稳定，暴露在空气中迅速被氧化：4Fe(OH)₂ + O₂ + 2H₂O = 4Fe(OH)₃。颜色变化：白色 → 灰绿色 → 红褐色（这是 Fe²⁺ 被 O₂ 氧化的特征现象）。制备：FeSO₄ 溶液 + NaOH 溶液，为观察到白色沉淀需隔绝空气（在液面上加一层苯或煤油）。\n（2）Fe(OH)₃：红褐色固体，不溶于水，溶于酸：Fe(OH)₃ + 3HCl = FeCl₃ + 3H₂O。加热分解：2Fe(OH)₃ =（加热）Fe₂O₃ + 3H₂O。\n\nFe²⁺ 性质：浅绿色，有还原性（易被氧化为 Fe³⁺），与碱反应生成白色沉淀迅速变灰绿再变红褐。\nFe³⁺ 性质：黄色（或棕黄色），有氧化性（可被还原为 Fe²⁺），与碱反应生成红褐色沉淀。Fe³⁺ 水解使溶液呈酸性：Fe³⁺ + 3H₂O ⇌ Fe(OH)₃ + 3H⁺。\n\n【老师提醒】Fe(OH)₂ 的颜色变化（白→灰绿→红褐）是高考常考实验现象描述题，必须准确描述。制备 Fe(OH)₂ 时要隔绝空气防止氧化。Fe³⁺ 在溶液中易水解，配制 FeCl₃ 溶液时常加少量盐酸抑制水解。"}, {"title": "Fe²⁺ 与 Fe³⁺ 的转化与检验", "content": "Fe²⁺ → Fe³⁺（被氧化）：加入氧化剂如 Cl₂、Br₂、稀 HNO₃、H₂O₂、KMnO₄ 等。\n离子方程式：2Fe²⁺ + Cl₂ = 2Fe³⁺ + 2Cl⁻；2Fe²⁺ + Br₂ = 2Fe³⁺ + 2Br⁻。\n\nFe³⁺ → Fe²⁺（被还原）：加入还原剂如 Fe、Cu、KI、Na₂S、H₂S 等。\n离子方程式：2Fe³⁺ + Fe = 3Fe²⁺（铁与氯化铁反应）；2Fe³⁺ + Cu = 2Fe²⁺ + Cu²⁺（制印刷电路板原理）；2Fe³⁺ + 2I⁻ = 2Fe²⁺ + I₂。\n\nFe³⁺ 的检验方法：取少量待测液，加入 KSCN（硫氰化钾）溶液，若溶液变为血红色，说明含 Fe³⁺。离子方程式：Fe³⁺ + 3SCN⁻ = Fe(SCN)₃（血红色）。注意：此反应是络合反应，不是氧化还原反应；KSCN 不能检验 Fe²⁺（Fe²⁺ 与 SCN⁻ 无明显现象）。\n\nFe²⁺ 的检验方法：取少量待测液，先加 KSCN 溶液无明显现象（排除 Fe³⁺），再滴加少量氯水（或溴水），若溶液变为血红色，说明原溶液含 Fe²⁺。原理：2Fe²⁺ + Cl₂ = 2Fe³⁺ + 2Cl⁻，生成的 Fe³⁺ 再与 SCN⁻ 反应显血红色。\n\n【老师提醒】检验 Fe²⁺ 时必须'先加 KSCN 无现象，再加氧化剂变红'，而不能先加氧化剂——因为若溶液中本身含 Fe³⁺，先加氧化剂后加 KSCN 也会变红，无法区分 Fe²⁺ 和 Fe³⁺。\n\n另一种检验 Fe²⁺ 的方法：加 NaOH 溶液，产生白色沉淀迅速变灰绿再变红褐色。"}, {"title": "金属材料与合金", "content": "合金是由一种金属与另一种或几种金属（或非金属）熔合而成的具有金属特性的物质。合金是混合物。\n\n合金的特性：（1）硬度一般比组成它的纯金属的硬度大；（2）熔点一般比组成它的纯金属的熔点低；（3）合金的物理、化学性质可根据需要调节。\n\n常见合金：\n（1）钢：铁碳合金，含碳量 0.03%~2%。低碳钢（含碳<0.3%）、中碳钢（0.3%~0.6%）、高碳钢（>0.6%）。不锈钢含 Cr、Ni，耐腐蚀。\n（2）铝合金：硬铝（Al-Cu-Mg-Mn合金），密度小强度高，用于航空。\n（3）铜合金：黄铜（Cu-Zn）、青铜（Cu-Sn）、白铜（Cu-Ni）。\n（4）新型金属材料：储氢合金（如 LaNi₅，可吸收和释放 H₂）、钛合金（耐腐蚀、高强度、用于航空航天）、形状记忆合金。\n\n铁的冶炼（高炉炼铁）：原料铁矿石（赤铁矿 Fe₂O₃ 或磁铁矿 Fe₃O₄）、焦炭、石灰石、热空气。原理（热还原法）：Fe₂O₃ + 3CO =（高温）2Fe + 3CO₂。石灰石作熔剂造渣：CaCO₃ =（高温）CaO + CO₂↑，CaO + SiO₂ =（高温）CaSiO₃（炉渣）。\n\n铝的冶炼（电解法）：2Al₂O₃（熔融）=（电解，冰晶石）4Al + 3O₂↑。\n\n【老师提醒】合金的两大特性（硬度大、熔点低）是选择题常考点。合金不是化合物，是混合物。铁的冶炼用 CO 还原（热还原法），铝的冶炼用电解法，因为铝比铁活泼，热还原法难以还原铝。"}], "exam_points": [{"title": "Fe²⁺/Fe³⁺ 转化与离子方程式", "content": "重点掌握 Fe²⁺ 与 Fe³⁺ 相互转化的条件、试剂和离子方程式。Fe²⁺ → Fe³⁺ 用强氧化剂（Cl₂、稀 HNO₃、H₂O₂）；Fe³⁺ → Fe²⁺ 用还原剂（Fe、Cu、KI）。注意书写离子方程式时电荷守恒。Fe³⁺ 与 Cu 反应（2Fe³⁺ + Cu = 2Fe²⁺ + Cu²⁺）是制作印刷电路板的原理。"}, {"title": "Fe²⁺ 和 Fe³⁺ 的检验", "content": "Fe³⁺ 用 KSCN 溶液检验（变血红色）；Fe²⁺ 检验必须'先加 KSCN 无现象 → 再加氧化剂变红'，或用 NaOH 观察白色→灰绿→红褐的颜色变化。注意：KSCN 不能直接检验 Fe²⁺。"}, {"title": "铁及其化合物计算", "content": "铁与不同氧化剂反应产物判断（Fe²⁺ 或 Fe³⁺），铁过量问题的计算。核心方法：电子守恒法。铁的氧化物组成计算（如 Fe₃O₄ 中 Fe²⁺ 与 Fe³⁺ 比例 1:2）。注意铁与稀 HNO₃ 反应：铁不足生成 Fe³⁺，铁过量时 Fe³⁺ 被多余铁还原为 Fe²⁺。"}, {"title": "合金性质与金属冶炼", "content": "合金硬度比纯组分大、熔点比纯组分低。金属冶炼方法选择依据金属活动性：最不活泼（Hg、Ag）用热分解法；中等活泼（Fe、Cu、Zn）用热还原法；最活泼（Al、Na、Mg）用电解法。"}], "examples": [{"title": "铁的化合物方程式（基础题）", "question": "写出下列反应的化学方程式或离子方程式：（1）FeCl₃ 溶液与 Cu 反应；（2）FeCl₂ 溶液与 Cl₂ 反应。", "analysis": "（1）Fe³⁺ 有氧化性，Cu 有还原性，Fe³⁺ 将 Cu 氧化为 Cu²⁺，自身被还原为 Fe²⁺。这是制作印刷电路板的反应原理。配平：2 个 Fe³⁺ 得到 2 个电子变为 2 个 Fe²⁺，Cu 失去 2 个电子变为 Cu²⁺，电荷守恒：左边 +6，右边 +4+2 = +6。\n（2）Fe²⁺ 有还原性，Cl₂ 有氧化性，Fe²⁺ 被 Cl₂ 氧化为 Fe³⁺。配平：2 个 Fe²⁺ 各失去 1 个电子共失去 2 个电子，1 个 Cl₂ 得到 2 个电子变为 2 个 Cl⁻。", "answer": "（1）2Fe³⁺ + Cu = 2Fe²⁺ + Cu²⁺\n（2）2Fe²⁺ + Cl₂ = 2Fe³⁺ + 2Cl⁻"}, {"title": "Fe²⁺ 检验方法（基础题）", "question": "如何证明某溶液中含 Fe²⁺ 而不含 Fe³⁺？写出实验步骤和现象。", "analysis": "检验 Fe²⁺ 的关键是排除 Fe³⁺ 的干扰。因为 KSCN 遇 Fe³⁺ 变血红色，遇 Fe²⁺ 无现象，所以可以分两步操作：\n\n第一步：取少量待测液于试管中，滴加 KSCN 溶液。若无明显现象（不变红），说明溶液中不含 Fe³⁺。\n\n第二步：再向该溶液中滴加少量氯水（或溴水），氯水将 Fe²⁺ 氧化为 Fe³⁺：2Fe²⁺ + Cl₂ = 2Fe³⁺ + 2Cl⁻。生成的 Fe³⁺ 与已加入的 SCN⁻ 反应：Fe³⁺ + 3SCN⁻ = Fe(SCN)₃，溶液变为血红色，证明原溶液中含有 Fe²⁺。\n\n注意操作顺序不能反：若先加氯水再加 KSCN，即使原溶液不含 Fe²⁺ 只含 Fe³⁺，也会变红，无法区分。", "answer": "取试样加 KSCN 溶液，无明显现象说明不含 Fe³⁺；再滴加少量氯水，溶液变血红色，则证明原溶液含 Fe²⁺。原理：2Fe²⁺ + Cl₂ = 2Fe³⁺ + 2Cl⁻，Fe³⁺ + 3SCN⁻ = Fe(SCN)₃（血红色）。"}, {"title": "Fe(OH)₂ 制备与现象（中档题）", "question": "简述实验室制备 Fe(OH)₂ 的方法，描述实验现象，并说明如何使白色沉淀保持较长时间。", "analysis": "Fe(OH)₂ 极易被空气中 O₂ 氧化，制备时需要创造无氧环境。\n\n制备方法：向 FeSO₄ 溶液中加入 NaOH 溶液。反应：FeSO₄ + 2NaOH = Fe(OH)₂↓ + Na₂SO₄，离子方程式：Fe²⁺ + 2OH⁻ = Fe(OH)₂↓。\n\n实验现象：刚生成时为白色沉淀，随后迅速变为灰绿色，最终变为红褐色。因为 4Fe(OH)₂ + O₂ + 2H₂O = 4Fe(OH)₃，白色 Fe(OH)₂ 被空气中的 O₂ 氧化为红褐色 Fe(OH)₃。\n\n使白色沉淀保持较长时间的方法（创造无氧环境）：\n（1）用新配制的 FeSO₄ 溶液（久置的 FeSO₄ 已被氧化为 Fe₂(SO₄)₃）；\n（2）将 NaOH 溶液煮沸冷却后使用（赶去溶解的 O₂）；\n（3）用长滴管吸取 NaOH 溶液，将滴管尖端插入 FeSO₄ 溶液液面以下再挤出（避免接触空气）；\n（4）在 FeSO₄ 溶液液面上加一层苯或煤油（隔绝空气）。", "answer": "向 FeSO₄ 溶液中滴加 NaOH 溶液：Fe²⁺ + 2OH⁻ = Fe(OH)₂↓（白色）。现象：白色沉淀→灰绿色→红褐色（被 O₂ 氧化：4Fe(OH)₂ + O₂ + 2H₂O = 4Fe(OH)₃）。保持白色沉淀的方法：用新配制 FeSO₄、煮沸后的 NaOH、液面加苯隔绝空气、滴管伸入液面下滴加。"}, {"title": "铁与硝酸反应计算（中档题）", "question": "将 5.6 g 铁粉投入 100 mL 4 mol/L 的稀 HNO₃ 中，充分反应后溶液中的溶质是什么？各物质的量为多少？（已知：Fe + 4HNO₃（稀）= Fe(NO₃)₃ + NO↑ + 2H₂O）", "analysis": "首先计算反应物的物质的量：n(Fe) = 5.6/56 = 0.1 mol；n(HNO₃) = 4 × 0.1 = 0.4 mol。\n\n按方程式 Fe + 4HNO₃（稀）= Fe(NO₃)₃ + NO↑ + 2H₂O 分析，1 mol Fe 与 4 mol HNO₃ 完全反应。\n\n判断谁过量：0.1 mol Fe 需 0.4 mol HNO₃，恰好完全反应！\n\n所以 Fe 全部被氧化为 Fe³⁺，生成 Fe(NO₃)₃，n(Fe(NO₃)₃) = 0.1 mol，同时生成 NO 气体 n(NO) = 0.1 mol。\n\n溶液中溶质为 Fe(NO₃)₃，n = 0.1 mol。注意：如果 Fe 过量，多余的 Fe 会与 Fe³⁺ 反应：2Fe³⁺ + Fe = 3Fe²⁺，最终生成 Fe(NO₃)₂。但本题恰好完全反应，无多余 Fe。", "answer": "n(Fe) = 5.6/56 = 0.1 mol，n(HNO₃) = 4×0.1 = 0.4 mol。恰好按 Fe + 4HNO₃ = Fe(NO₃)₃ + NO↑ + 2H₂O 完全反应。溶液中溶质为 Fe(NO₃)₃，n = 0.1 mol。"}, {"title": "铁的氧化物组成分析（高考真题）", "question": "已知 Fe₃O₄ 可看作 FeO·Fe₂O₃，其中铁元素的化合价分别为 +2 和 +3。现有一铁的氧化物样品含铁 72.41%，求该氧化物的化学式。", "analysis": "设该氧化物为 FeₓOᵧ。已知 Fe 的相对原子质量为 56，O 为 16。\n\n含铁 72.41%，则含氧 1 - 72.41% = 27.59%。\n\nFe 与 O 的原子个数比：x : y = (72.41/56) : (27.59/16) = 1.293 : 1.724。\n\n化简：1.293/1.293 : 1.724/1.293 = 1 : 1.333 = 3 : 4。\n\n所以 x : y = 3 : 4，化学式为 Fe₃O₄。\n\n验证：Fe₃O₄ 中 Fe 的质量分数 = (3×56)/(3×56 + 4×16) = 168/232 = 72.41%，符合题意。\n\nFe₃O₄ 中含 1 个 Fe²⁺ 和 2 个 Fe³⁺（即 FeO·Fe₂O₃）。", "answer": "Fe 与 O 原子个数比 = (72.41/56):(27.59/16) = 1.293:1.724 = 3:4。该氧化物化学式为 Fe₃O₄，其中含 1 个 Fe²⁺ 和 2 个 Fe³⁺。"}]}, {"id": "ch_1_4", "title": "第四章 物质结构 元素周期律", "summary": "学习原子结构、元素周期表与元素周期律、化学键，建立微观结构决定性质的认识。", "knowledge": [{"title": "原子结构", "content": "原子的构成：原子由原子核（位于中心，带正电）和核外电子（带负电）构成。原子核由质子（带正电）和中子（不带电）构成。\n\n基本关系：（1）质子数（Z）= 核电荷数 = 核外电子数 = 原子序数（对于中性原子）；（2）质量数（A）= 质子数（Z）+ 中子数（N）；（3）原子符号表示为质量数在上、质子数在下的元素符号。\n\n同位素：质子数相同而中子数不同的同种元素的不同原子互称同位素。如 ¹H（氕）、²H（氘/D）、³H（氚/T）是氢的三种同位素；¹²C、¹³C、¹⁴C 是碳的同位素。同位素的化学性质几乎相同（质子数和电子数相同），物理性质有差异（质量不同）。\n\n核外电子排布规律：（1）每层最多容纳 2n² 个电子（K 层 2 个，L 层 8 个，M 层 18 个）；（2）最外层电子数不超过 8 个（K 层为最外层时不超过 2 个）；（3）次外层电子数不超过 18 个，倒数第三层不超过 32 个；（4）电子总是尽先排布在能量最低的电子层中（由内向外依次排布）。\n\n原子结构示意图：如 Na（11 号）为 +11 ) 2 ) 8 ) 1，表示 K 层 2 个、L 层 8 个、M 层 1 个电子。\n\n【老师提醒】核外电子排布是推断元素的基础。最外层电子数决定元素的化学性质（主族元素）：最外层电子数少的（1~3 个）易失电子，表现金属性；最外层电子数多的（5~7 个）易得电子，表现非金属性；最外层 8 电子（He 为 2）为稳定结构。\n\n易错点：质量数是整数，相对原子质量不是整数；同位素是原子概念不是元素概念。"}, {"title": "元素周期表", "content": "元素周期表的结构：\n（1）周期：共 7 个周期。第 1~3 周期为短周期（分别含 2、8、8 种元素），第 4~6 周期为长周期（分别含 18、18、32 种元素），第 7 周期为不完全周期。周期数 = 电子层数。\n（2）族：共 18 纵行 16 族。7 个主族（ⅠA~ⅦA）、7 个副族（ⅠB~ⅦB）、第Ⅷ族（第 8、9、10 纵行）、0 族（稀有气体，第 18 纵行）。主族序数 = 最外层电子数。\n\n周期表中元素性质的递变规律：\n（1）同周期（从左到右）：核电荷数递增，原子半径逐渐减小（电子层数相同，核电荷增大对电子吸引力增强），金属性逐渐减弱，非金属性逐渐增强，最高正价从 +1 → +7（0 族为 0），最低负价从 -4 → -1。\n（2）同主族（从上到下）：电子层数递增，原子半径逐渐增大，金属性逐渐增强，非金属性逐渐减弱，最高正价相同（等于族序数）。\n\n金属性强弱的判断依据：（1）与水（或酸）反应越剧烈；（2）最高价氧化物对应水化物（氢氧化物）碱性越强；（3）相互置换反应（活泼金属置换不活泼金属）；（4）阳离子氧化性越弱。\n\n非金属性强弱的判断依据：（1）与 H₂ 化合越容易，气态氢化物越稳定；（2）最高价氧化物对应水化物（含氧酸）酸性越强；（3）相互置换反应；（4）阴离子还原性越弱。\n\n【老师提醒】元素周期表是推断题的核心工具。掌握'位—构—性'三者关系：位置（周期表位置）↔ 结构（原子结构）↔ 性质（元素性质）。推断题的解题思路：由结构推位置，由位置推性质，或反向推断。\n\n常见元素记忆口诀：短周期前 20 号元素（H He Li Be B C N O F Ne Na Mg Al Si P S Cl Ar K Ca）要熟记。"}, {"title": "元素周期律", "content": "元素周期律：元素性质随原子序数递增而呈周期性变化的规律。本质原因是原子核外电子排布的周期性变化。\n\n随原子序数递增（同周期），元素性质的周期性变化：\n（1）原子半径：随核电荷数增加先逐渐减小（同周期），到稀有气体突然增大（稀有气体原子半径测量方法不同），然后进入下一周期又从大减小。\n（2）化合价：最高正价从 +1 递增到 +7（O、F 除外），最低负价从 -4 递变到 -1。最高正价 + |最低负价| = 8（H 除外）。\n（3）金属性与非金属性：从左到右金属性减弱、非金属性增强，周期表中金属与非金属交界处（硼族到氮族附近）过渡。\n\n元素周期律的应用：\n（1）预测元素性质：根据元素在周期表中的位置，预测其金属性/非金属性强弱、化合价等。\n（2）寻找新材料：在金属与非金属分界线附近寻找半导体材料（如 Si、Ge、Ga、Se）；在过渡元素中寻找催化剂和耐高温合金材料。\n（3）指导工农业生产：根据元素性质选择合适的农药、化肥等。\n\n【老师提醒】元素周期律的核心是'结构决定性质'。注意原子半径变化规律：同周期从左到右减小（稀有气体除外），同主族从上到下增大。比较微粒半径时注意：同种元素原子半径 > 其阳离子半径（如 Na > Na⁺），原子半径 < 其阴离子半径（如 Cl < Cl⁻）。"}, {"title": "化学键", "content": "化学键：相邻原子或离子之间强烈的相互作用。化学键分为离子键、共价键和金属键（高中主要学习前两种）。\n\n离子键：使阴阳离子结合成化合物的静电作用。形成条件：活泼金属（如 Na、K、Mg、Ca）与活泼非金属（如 F、Cl、O、S）之间。离子键的本质是阴阳离子间的静电作用（引力和斥力的平衡）。\n离子化合物：由离子键构成的化合物，包括大多数盐（NaCl、KNO₃）、强碱（NaOH、KOH、Ba(OH)₂）、活泼金属氧化物（Na₂O、CaO、MgO）。\n\n共价键：原子间通过共用电子对形成的相互作用。形成条件：非金属元素原子之间。共价键分为极性共价键（不同种元素间，电子对偏向一方，如 H-Cl）和非极性共价键（同种元素间，电子对不偏移，如 H-H、Cl-Cl）。\n共价化合物：只含共价键的化合物，如 HCl、H₂O、CO₂、CH₄、H₂SO₄。注意：含离子键的化合物一定含共价键（如 NaOH 中 Na⁺ 与 OH⁻ 之间是离子键，O-H 之间是共价键），但含共价键的化合物不一定是共价化合物（可能含离子键）。\n\n电子式书写：用小黑点（或×）表示原子最外层电子。离子化合物的电子式：Na⁺[ Cl的电子式 ]⁻（阳离子不加点，阴离子加方括号和电荷）；共价化合物的电子式：H:Cl:（不加方括号和电荷）。\n\n分子间作用力与氢键：分子间作用力（范德华力）是分子间的较弱作用力，影响物质的熔沸点（分子间作用力越大，熔沸点越高）。氢键是一种特殊的分子间作用力（比范德华力强），存在于 H 与 F、O、N 之间，如 H₂O、HF、NH₃ 的沸点反常偏高。\n\n【老师提醒】判断化学键类型的步骤：先判断是否为离子化合物（含金属元素一般含离子键，铵盐也是离子化合物），再看是否含共价键。NaOH、Na₂O₂、NH₄Cl 等既含离子键又含共价键，属于离子化合物。\n\n易错点：（1）单质中不一定有化学键（稀有气体是单原子分子，无化学键）；（2）共价化合物中一定不含离子键；（3）离子化合物中可能只含离子键（如 NaCl），也可能既含离子键又含共价键（如 NaOH）。"}], "exam_points": [{"title": "原子结构与周期表推断", "content": "'位—构—性'推断是核心。由原子结构（电子层数、最外层电子数）推断周期表位置（周期数 = 电子层数，主族序数 = 最外层电子数），再由位置推断性质。同位素概念辨析：质子数相同中子数不同的原子。注意：质量数 = 质子数 + 中子数，同位素化学性质几乎相同。"}, {"title": "元素性质比较", "content": "比较金属性/非金属性强弱及对应化合物性质。判断金属性强弱：与水/酸反应剧烈程度、氢氧化物碱性强弱、置换反应、阳离子氧化性。判断非金属性强弱：与 H₂ 化合难易、氢化物稳定性、含氧酸酸性强弱、置换反应、阴离子还原性。同周期左到右金属性减弱非金属性增强，同主族上到下金属性增强非金属性减弱。"}, {"title": "化学键类型判断", "content": "判断步骤：（1）是否含金属元素（或 NH₄⁺）→ 含则为离子化合物，必有离子键；（2）离子化合物中可能还含共价键（如 NaOH 中 O-H 键、Na₂O₂ 中 O-O 键）；（3）只含非金属元素且不含 NH₄⁺ → 一般为共价化合物，只含共价键。电子式书写注意：离子化合物中阴离子加方括号标电荷，共价化合物不加。"}, {"title": "微粒半径比较", "content": "半径比较规律：（1）同周期从左到右原子半径减小（稀有气体除外）；（2）同主族从上到下原子半径增大；（3）同种元素：原子 > 阳离子，原子 < 阴离子；（4）电子层结构相同的微粒，核电荷数越大半径越小（如 Na⁺ > Mg²⁺ > Al³⁺，F⁻ > Na⁺）。"}], "examples": [{"title": "周期表位置推断（基础题）", "question": "某主族元素 R 原子最外层有 6 个电子，有 3 个电子层。R 在周期表第几周期第几族？写出 R 的元素名称和符号。", "analysis": "根据'位—构—性'关系：周期数 = 电子层数，主族序数 = 最外层电子数。\n\nR 有 3 个电子层，所以位于第 3 周期。R 最外层有 6 个电子，所以位于第 ⅥA 族。\n\n第 3 周期第 ⅥA 族元素是硫（S），原子序数为 16。原子结构示意图为 +16 ) 2 ) 8 ) 6。\n\n验证：S 是非金属，最高正价为 +6（SO₃），最低负价为 -2（H₂S），符合 ⅥA 族特征。", "answer": "R 位于第 3 周期第 ⅥA 族，是硫元素，符号 S。"}, {"title": "化学键类型判断（基础题）", "question": "指出下列物质中含有的化学键类型：NaOH、CO₂、NaCl、HCl、Na₂O₂、NH₄Cl。", "analysis": "逐个分析每种物质的组成和化学键：\n\n（1）NaOH：由 Na⁺ 和 OH⁻ 构成，Na⁺ 与 OH⁻ 之间是离子键；OH⁻ 内部 O 和 H 之间是共价键。NaOH 是离子化合物，既含离子键又含共价键。\n\n（2）CO₂：由 C 和 O 两种非金属元素组成，C 与 O 之间共用电子对形成共价键。CO₂ 是共价化合物，只含共价键（极性共价键）。\n\n（3）NaCl：由 Na⁺ 和 Cl⁻ 构成，Na⁺ 与 Cl⁻ 之间是离子键。NaCl 是离子化合物，只含离子键。\n\n（4）HCl：H 与 Cl 之间共用电子对形成共价键（极性键）。HCl 是共价化合物，只含共价键。\n\n（5）Na₂O₂：由 Na⁺ 和 O₂²⁻ 构成，Na⁺ 与 O₂²⁻ 之间是离子键；O₂²⁻ 内部两个 O 之间是共价键（非极性键）。Na₂O₂ 是离子化合物，既含离子键又含共价键。\n\n（6）NH₄Cl：由 NH₄⁺ 和 Cl⁻ 构成，NH₄⁺ 与 Cl⁻ 之间是离子键；NH₄⁺ 内部 N 和 H 之间是共价键。NH₄Cl 是离子化合物，既含离子键又含共价键。", "answer": "NaOH：离子键 + 共价键（离子化合物）；CO₂：共价键（共价化合物）；NaCl：离子键（离子化合物）；HCl：共价键（共价化合物）；Na₂O₂：离子键 + 共价键（离子化合物）；NH₄Cl：离子键 + 共价键（离子化合物）。"}, {"title": "元素性质比较（中档题）", "question": "已知 X、Y、Z 三种短周期元素，X 的最高价氧化物的水化物是强酸，Y 的最外层电子数是电子层数的 2 倍，Z 是地壳中含量最多的元素。判断 X、Y、Z 各是什么元素，并比较它们的原子半径大小。", "analysis": "逐步推断三种元素：\n\nZ 是地壳中含量最多的元素，地壳中含量最多的元素是氧（O），所以 Z 是 O。\n\nX 的最高价氧化物的水化物是强酸。短周期元素中最高价含氧酸是强酸的有：HNO₃（N）、H₂SO₄（S）、HClO₄（Cl）。需要结合其他条件进一步判断，先暂时确定可能的范围。\n\nY 的最外层电子数是电子层数的 2 倍。分析短周期元素：\n- 如果电子层数为 1（H、He），最外层 2 个电子的是 He（但 He 是稀有气体）；\n- 如果电子层数为 2（第 2 周期），最外层 4 个电子的是 C；\n- 如果电子层数为 3（第 3 周期），最外层 6 个电子的是 S。\n所以 Y 可能是 C 或 S。\n\n综合分析：如果 Y = S（第 3 周期，最外层 6 = 3×2），则 X 可能是 Cl（HClO₄ 是最强酸之一）。X = Cl（第 3 周期 ⅦA），Y = S（第 3 周期 ⅥA），Z = O（第 2 周期 ⅥA）。\n\n比较原子半径：三者中 O 在第 2 周期（电子层数少），S 和 Cl 在第 3 周期。同周期从左到右半径减小，所以 S > Cl。不同周期，电子层多的半径大，所以 S、Cl > O。\n\n因此原子半径：S > Cl > O。", "answer": "Z = O（地壳含量最多），Y = S（最外层 6 = 3×2），X = Cl（最高价含氧酸 HClO₄ 是强酸）。原子半径大小：S > Cl > O。"}, {"title": "同位素与原子结构（中档题）", "question": "²³⁵U 和 ²³⁸U 是铀的两种同位素，请回答：（1）它们的质子数、中子数各是多少？（2）为什么它们的化学性质几乎相同？（3）天然铀中 ²³⁵U 的原子百分含量约为 0.72%，²³⁸U 约为 99.28%，求铀元素的近似平均相对原子质量。", "analysis": "（1）U 的原子序数为 92，所以质子数 = 92。\n²³⁵U 的中子数 = 235 - 92 = 143。\n²³⁸U 的中子数 = 238 - 92 = 146。\n\n（2）²³⁵U 和 ²³⁸U 的质子数相同（都是 92），核外电子排布相同，化学性质由核外电子（尤其是最外层电子）决定，因此化学性质几乎相同。\n\n（3）计算近似平均相对原子质量：用质量数代替同位素的精确相对原子质量进行计算。\n平均相对原子质量 = 235 × 0.72% + 238 × 99.28% = 235 × 0.0072 + 238 × 0.9928 = 1.692 + 236.2864 = 237.98 ≈ 238.0。", "answer": "（1）²³⁵U：质子数 92，中子数 143；²³⁸U：质子数 92，中子数 146。（2）质子数相同，核外电子排布相同，化学性质由核外电子决定。（3）近似平均相对原子质量 = 235×0.72% + 238×99.28% ≈ 238.0。"}, {"title": "元素推断综合题（高考真题）", "question": "短周期元素 X、Y、Z、W 的原子序数依次增大。X 的最外层电子数是内层电子数的 2 倍，Y 是短周期中金属性最强的元素，Z 是地壳中含量最多的金属元素，W 与 X 同主族。推断四种元素并写出 X 与 Y 反应的化学方程式。", "analysis": "逐个推断：\n\nX 的最外层电子数是内层电子数的 2 倍。短周期元素分析：\n- 如果内层电子数为 2（第 2 周期，K 层 2 个），最外层 4 个 → C（碳）；\n- 如果内层电子数为 10（第 3 周期，K+L 层 10 个），最外层 20 个 → 不可能（最外层不超过 8）。\n所以 X = C（碳，第 2 周期 ⅣA）。\n\nY 是短周期中金属性最强的元素。短周期（1~3 周期）中金属性最强的是 Na（钠，第 3 周期 ⅠA），因为同周期左到右金属性减弱，同主族上到下金属性增强。\n所以 Y = Na（钠）。\n\nZ 是地壳中含量最多的金属元素。地壳中含量最多的金属是铝（Al）。\n所以 Z = Al（铝，第 3 周期 ⅢA）。\n\nW 与 X 同主族。X = C 在 ⅣA 族，W 的原子序数大于 Al（13），短周期中 ⅣA 族且原子序数大于 13 的是 Si（硅，14 号）。\n所以 W = Si（硅，第 3 周期 ⅣA）。\n\n验证原子序数依次增大：C(6) < Na(11) < Al(13) < Si(14)，符合题意。\n\nX(C) 与 Y(Na) 反应：碳与钠在高温下反应生成碳化钠。2Na + 2C =（高温）2NaC。", "answer": "X = C（碳），Y = Na（钠），Z = Al（铝），W = Si（硅）。X 与 Y 反应：2Na + 2C =（高温）2NaC（碳化钠）。"}]}]}, {"name": "必修第二册", "chapters": [{"id": "ch_2_5", "title": "第五章 化工生产中的重要非金属元素——硫、氮", "summary": "学习硫及其化合物、氮及其化合物、无机非金属材料的性质与转化。", "knowledge": [{"title": "硫及其化合物", "content": "硫（S）的物理性质：淡黄色固体，不溶于水，微溶于酒精，易溶于 CS₂。俗称硫磺。\n\n硫的化学性质：S 的化合价为 0（中间价态），既有氧化性又有还原性。\n（1）与金属反应（表现氧化性）：Fe + S =（加热）FeS（硫化亚铁，注意生成 Fe²⁺ 而非 Fe³⁺，说明 S 的氧化性弱于 Cl₂）；2Cu + S =（加热）Cu₂S（硫化亚铜，注意生成 Cu⁺ 而非 Cu²⁺）；Hg + S = HgS（常温即可反应，用于处理洒落的汞）。\n（2）与非金属反应：S + O₂ =（点燃）SO₂（空气中淡蓝色火焰，纯氧中蓝紫色火焰）。\n\n二氧化硫（SO₂）：无色有刺激性气味的有毒气体，密度比空气大，易溶于水（1:40）。\nSO₂ 的化学性质：\n（1）酸性氧化物：SO₂ + H₂O ⇌ H₂SO₃（亚硫酸，中强酸，可逆）；SO₂ + 2NaOH = Na₂SO₃ + H₂O；SO₂ + Ca(OH)₂ = CaSO₃↓ + H₂O。\n（2）还原性（SO₂ 中 S 为 +4 价，可被氧化为 +6）：2SO₂ + O₂ =（催化剂，加热）2SO₃（工业制硫酸关键反应）；SO₂ + Cl₂ + 2H₂O = H₂SO₄ + 2HCl；SO₂ 能使酸性 KMnO₄ 溶液和溴水褪色（还原性而非漂白性）。\n（3）氧化性（较少见）：SO₂ + 2H₂S = 3S↓ + 2H₂O（归中反应）。\n（4）漂白性：SO₂ 能使品红溶液褪色，加热后红色恢复（漂白不稳定的可逆漂白）。原理：SO₂ 与有色物质化合生成无色不稳定的化合物，加热分解恢复原色。这与 HClO、Na₂O₂ 的氧化性漂白不同。\n\n三氧化硫（SO₃）：SO₃ + H₂O = H₂SO₄（工业制硫酸吸收反应）。\n\n浓硫酸（H₂SO₄）的三大特性：\n（1）吸水性：吸收游离的水分子，可用作干燥剂（干燥 O₂、H₂、CO₂、Cl₂ 等，不能干燥 H₂S、NH₃）。\n（2）脱水性：从有机物中夺取 H 和 O 元素以 2:1（水比例）脱去，使有机物碳化变黑。如蔗糖遇浓硫酸变黑（C₁₂H₂₂O₁₁ → 12C + 11H₂O）。\n（3）强氧化性：浓硫酸与金属反应一般不产生 H₂，而被还原为 SO₂。\nCu + 2H₂SO₄（浓）=（加热）CuSO₄ + SO₂↑ + 2H₂O（S 从 +6 降到 +4）；\nC + 2H₂SO₄（浓）=（加热）CO₂↑ + 2SO₂↑ + 2H₂O（C 从 0 升到 +4，S 从 +6 降到 +4）。\n常温下浓硫酸使 Fe、Al 钝化（表面生成致密氧化膜），加热时才反应。\n\n【老师提醒】SO₂ 的漂白性与 HClO、Na₂O₂ 的漂白性不同：SO₂ 漂白可逆（品红褪色加热恢复），HClO/Na₂O₂ 漂白不可逆（氧化破坏有色物质）。SO₂ 使 KMnO₄/溴水褪色是还原性而非漂白性。鉴别 SO₂ 和 CO₂：用品红溶液（SO₂ 使其褪色，CO₂ 不能）或酸性 KMnO₄（SO₂ 使其褪色，CO₂ 不能）。\n\n浓硫酸与稀硫酸的区别：浓硫酸有吸水性、脱水性、强氧化性，与金属反应不产生 H₂；稀硫酸具有酸的通性，与活泼金属反应产生 H₂。"}, {"title": "氮及其化合物", "content": "氮气（N₂）：无色无味气体，难溶于水。N≡N 三键键能很大，化学性质极稳定。但在高温放电或催化条件下可反应：N₂ + 3H₂ ⇌（催化剂，高温高压）2NH₃（合成氨，工业固氮）；N₂ + O₂ =（放电）2NO（雷雨发庄稼）。\n\n氮的氧化物：\nNO：无色气体，有毒，难溶于水。极易被氧化：2NO + O₂ = 2NO₂（无色 NO 遇空气立即变红棕色）。\nNO₂：红棕色有刺激性气味气体，有毒，能与水反应：3NO₂ + H₂O = 2HNO₃ + NO（工业制硝酸原理之一，NO 循环利用）。NO₂ 中 N 为 +4 价，既有氧化性又有还原性。\n\n空气中的氮氧化物（NOx）主要来自汽车尾气和化石燃料燃烧，是光化学烟雾和酸雨的成因之一。\n\n氨气（NH₃）：无色有刺激性气味气体，密度比空气小，极易溶于水（1:700，喷泉实验原理）。\nNH₃ 的化学性质：\n（1）与水反应：NH₃ + H₂O ⇌ NH₃·H₂O ⇌ NH₄⁺ + OH⁻（氨水呈碱性，是弱碱）。\n（2）与酸反应：NH₃ + HCl = NH₄Cl（产生白烟，用于检验 NH₃）。\n（3）还原性（催化氧化）：4NH₃ + 5O₂ =（催化剂，加热）4NO + 6H₂O（工业制硝酸的关键反应）。\n\nNH₃ 的实验室制法：2NH₄Cl + Ca(OH)₂ =（加热）CaCl₂ + 2NH₃↑ + 2H₂O。装置为固固加热型（与制 O₂ 相同），用向下排空气法收集（NH₃ 密度比空气小），用湿润红色石蕊试纸验满（变蓝）。\n\n铵盐的性质：（1）易溶于水；（2）受热分解：NH₄Cl =（加热）NH₃↑ + HCl↑（冷却后重新化合为 NH₄Cl，类似升华但不是升华）；（3）与碱反应：NH₄⁺ + OH⁻ =（加热）NH₃↑ + H₂O（用于检验 NH₄⁺）。\n\n硝酸（HNO₃）：无色易挥发液体，有刺激性气味。浓硝酸久置变黄（分解产生 NO₂ 溶于其中）。\n硝酸的特性——强氧化性：\n（1）与金属反应：一般不产生 H₂。Cu + 4HNO₃（浓）= Cu(NO₃)₂ + 2NO₂↑ + 2H₂O（红棕色气体）；3Cu + 8HNO₃（稀）= 3Cu(NO₃)₂ + 2NO↑ + 4H₂O（无色气体，遇空气变红棕色）。\n（2）常温下浓硝酸使 Fe、Al 钝化。\n（3）与非金属反应：C + 4HNO₃（浓）=（加热）CO₂↑ + 4NO₂↑ + 2H₂O。\n（4）不稳定性：4HNO₃ =（光照/加热）4NO₂↑ + O₂↑ + 2H₂O（保存在棕色瓶中）。\n\n【老师提醒】硝酸与金属反应的计算是重点，核心方法是电子守恒。浓硝酸产物为 NO₂，稀硝酸产物为 NO。铁铝在常温下被浓硝酸钝化（不能说'不反应'，是生成了保护膜）。NO 和 NO₂ 的颜色变化（NO 无色→遇空气变红棕色）是重要实验现象。\n\nNH₄⁺ 检验方法：加 NaOH 溶液加热，用湿润红色石蕊试纸放在管口，变蓝则含 NH₄⁺。"}, {"title": "无机非金属材料", "content": "硅元素及其化合物：\n硅（Si）：晶体硅是灰黑色固体，有金属光泽，硬度大，熔点高。硅是良好的半导体材料，用于制造芯片、太阳能电池。硅与碳同属 ⅣA 族。\n\n二氧化硅（SiO₂）：\n（1）物理性质：坚硬难熔固体（水晶、石英主要成分），不溶于水。\n（2）化学性质：SiO₂ 是酸性氧化物（但不溶于水，不能直接与水反应生成酸）。与碱反应：SiO₂ + 2NaOH = Na₂SiO₃ + H₂O（盛放碱液的试剂瓶不能用玻璃塞，因为 SiO₂ 与 NaOH 反应生成 Na₂SiO₃ 黏住瓶塞）；与 HF 反应：SiO₂ + 4HF = SiF₄↑ + 2H₂O（氢氟酸腐蚀玻璃，用塑料瓶盛装 HF）。\n\n硅酸（H₂SiO₃）：弱酸（比碳酸还弱），不溶于水。制备：Na₂SiO₃ + 2HCl = H₂SiO₃↓ + 2NaCl（硅酸凝胶可制成硅胶干燥剂）。\n\n硅酸盐：硅酸盐是构成地壳岩石的主要成分。硅酸钠（Na₂SiO₃）水溶液俗称水玻璃，是无色黏稠液体，不能燃烧，可用作阻燃剂和黏合剂。\n\n传统硅酸盐材料：水泥（主要原料石灰石和黏土）、玻璃（主要原料石英、纯碱、石灰石，反应：Na₂CO₃ + SiO₂ =（高温）Na₂SiO₃ + CO₂↑，CaCO₃ + SiO₂ =（高温）CaSiO₃ + CO₂↑）、陶瓷（主要原料黏土）。\n\n新型无机非金属材料：（1）光导纤维（主要成分 SiO₂），用于通信传输；（2）高温结构陶瓷（如 Si₃N₄、SiC），耐高温耐磨；（3）压电陶瓷、超导陶瓷等。\n\n【老师提醒】SiO₂ 虽是酸性氧化物但不能与水反应生成酸；SiO₂ 能与 HF 反应（特殊性质，酸性氧化物一般不与酸反应）；盛放碱液用橡胶塞不用玻璃塞。玻璃、水泥、陶瓷都是混合物，不是纯净物。"}, {"title": "环境保护与化学", "content": "大气污染：\n（1）酸雨：主要成因是 SO₂ 和 NOx 的排放。SO₂ 来源：煤和石油的燃烧（含硫燃料）；NOx 来源：汽车尾气、高温燃烧。酸雨防治：燃料脱硫、尾气处理（用碱液吸收 SO₂ 和 NOx）。\n（2）光化学烟雾：NOx 和碳氢化合物在阳光照射下发生光化学反应产生有毒烟雾。\n（3）臭氧层破坏：氟利昂等含氟氯烃化合物破坏臭氧层。\n（4）温室效应：CO₂、CH₄ 等温室气体排放增加。\n\n水污染：重金属污染（Hg、Cd、Pb、Cr 等）、富营养化（N、P 元素过多导致水华、赤潮）、酸碱盐污染、有机物污染。\n\nSO₂ 和 NOx 的处理方法：\n（1）碱液吸收法：SO₂ + 2NaOH = Na₂SO₃ + H₂O；NO₂ + 2NaOH = NaNO₃ + NaNO₂ + H₂O。\n（2）氨水吸收法：SO₂ + 2NH₃·H₂O = (NH₄)₂SO₃ + H₂O。\n\n【老师提醒】环境保护是高考热点，常以信息题形式出现。注意区分酸雨类型：硫酸型酸雨（SO₂ 为主，我国以硫酸型为主）和硝酸型酸雨（NOx 为主）。CO₂ 不属于大气污染物（不是酸雨成因），但属于温室气体。"}], "exam_points": [{"title": "SO₂ 与 CO₂ 的鉴别与性质", "content": "鉴别方法：（1）用品红溶液：SO₂ 使其褪色（加热恢复），CO₂ 不能；（2）用酸性 KMnO₄ 或溴水：SO₂ 使其褪色（还原性），CO₂ 不能。注意：SO₂ 和 CO₂ 都能使澄清石灰水变浑浊，不能用石灰水鉴别。SO₂ 使 KMnO₄ 褪色是还原性而非漂白性。"}, {"title": "硝酸的性质与计算", "content": "浓硝酸产物 NO₂（红棕色），稀硝酸产物 NO（无色→遇空气变红棕色）。与金属反应不产生 H₂。计算核心方法：电子守恒（氧化剂得电子 = 还原剂失电子）。铁铝常温钝化。硝酸不稳定（见光分解，棕色瓶保存）。久置浓硝酸变黄（NO₂ 溶解所致）。"}, {"title": "喷泉实验原理", "content": "喷泉实验原理：气体极易溶于水（或吸收液），造成瓶内压强远小于外界大气压，液体被压入瓶中形成喷泉。NH₃（1:700）、HCl（1:500）可用水做喷泉实验；CO₂ 可用 NaOH 溶液做喷泉实验。判断能否形成喷泉的关键：气体在液体中的溶解度足够大。"}, {"title": "浓硫酸三大特性", "content": "吸水性（干燥剂，不能干燥 NH₃、H₂S、HI）、脱水性（使有机物碳化）、强氧化性（与 Cu、C 反应生成 SO₂，与金属不产生 H₂）。常温钝化 Fe、Al。区分：浓硫酸与金属反应不产 H₂，稀硫酸与活泼金属反应产 H₂。"}], "examples": [{"title": "铜与硝酸反应方程式（基础题）", "question": "写出铜分别与浓硝酸、稀硝酸反应的化学方程式，并描述实验现象。", "analysis": "硝酸具有强氧化性，与金属反应不产生 H₂，而是被还原为氮的氧化物。\n\n（1）铜与浓硝酸：浓硝酸被还原为 NO₂（N 从 +5 降到 +4）。配平：Cu 从 0 → +2（失 2e⁻），N 从 +5 → +4（得 1e⁻），最小公倍数 2，所以 1 个 Cu 配 2 个 N（NO₂）。Cu + 4HNO₃（浓）= Cu(NO₃)₂ + 2NO₂↑ + 2H₂O。注意：4 个 HNO₃ 中只有 2 个被还原（作氧化剂），另外 2 个起酸的作用。\n现象：铜逐渐溶解，溶液变蓝（Cu²⁺），产生红棕色气体（NO₂）。\n\n（2）铜与稀硝酸：稀硝酸被还原为 NO（N 从 +5 降到 +2）。配平：Cu 从 0 → +2（失 2e⁻），N 从 +5 → +2（得 3e⁻），最小公倍数 6，所以 3 个 Cu 配 2 个 N（NO）。3Cu + 8HNO₃（稀）= 3Cu(NO₃)₂ + 2NO↑ + 4H₂O。8 个 HNO₃ 中只有 2 个被还原。\n现象：铜逐渐溶解，溶液变蓝（Cu²⁺），产生无色气体（NO），气体在管口遇空气变红棕色（2NO + O₂ = 2NO₂）。", "answer": "浓硝酸：Cu + 4HNO₃（浓）= Cu(NO₃)₂ + 2NO₂↑ + 2H₂O，现象：铜溶解，溶液变蓝，产生红棕色气体。\n稀硝酸：3Cu + 8HNO₃（稀）= 3Cu(NO₃)₂ + 2NO↑ + 4H₂O，现象：铜溶解，溶液变蓝，产生无色气体（遇空气变红棕色）。"}, {"title": "SO₂ 与 CO₂ 鉴别（基础题）", "question": "如何用化学方法鉴别 SO₂ 和 CO₂ 两种气体？写出实验步骤和现象。", "analysis": "SO₂ 和 CO₂ 都能使澄清石灰水变浑浊（都能与 Ca(OH)₂ 反应生成沉淀），所以不能用石灰水鉴别。但 SO₂ 有 CO₂ 不具备的两个特性：漂白性（使品红褪色）和还原性（使 KMnO₄/溴水褪色）。\n\n方法一（用品红溶液）：将两瓶气体分别通入品红溶液中。能使品红溶液褪色的是 SO₂（SO₂ 与品红化合生成无色物质），不能使品红溶液褪色的是 CO₂。进一步验证：加热褪色后的溶液，红色恢复的是 SO₂（漂白可逆）。\n\n方法二（用酸性 KMnO₄ 溶液）：将气体分别通入酸性 KMnO₄ 溶液中。能使紫色 KMnO₄ 溶液褪色的是 SO₂（SO₂ 被 KMnO₄ 氧化，表现还原性），不能使 KMnO₄ 褪色的是 CO₂。\n\n方法三（用溴水）：将气体分别通入溴水中。能使溴水褪色的是 SO₂（SO₂ + Br₂ + 2H₂O = H₂SO₄ + 2HBr），不能使溴水褪色的是 CO₂。", "answer": "将气体通入品红溶液，能使品红褪色的是 SO₂，不能的是 CO₂（加热后恢复红色进一步确认为 SO₂）。或通入酸性 KMnO₄ 溶液，褪色者为 SO₂，不褪色者为 CO₂。"}, {"title": "喷泉实验（中档题）", "question": "（1）为什么 NH₃ 能形成喷泉实验？（2）若将 CO₂ 气体做喷泉实验，应选用什么液体？（3）喷泉实验结束后，烧瓶内溶液的物质的量浓度约为多少（假设烧瓶容积为 250 mL，气体在标况下充满烧瓶）？", "analysis": "（1）NH₃ 极易溶于水（1:700），当少量水进入烧瓶后，NH₃ 大量溶解使瓶内气体压强急剧减小，远低于外界大气压，水被大气压压入瓶中形成喷泉。\n\n（2）CO₂ 在水中的溶解度不大（1:1），用水做喷泉实验效果不明显。但 CO₂ 是酸性氧化物，能与 NaOH 溶液反应：CO₂ + 2NaOH = Na₂CO₃ + H₂O，使 CO₂ 被大量吸收，瓶内压强急剧减小，所以可用 NaOH 溶液做喷泉实验。\n\n（3）以 NH₃ 为例计算。标况下烧瓶充满 NH₃：n(NH₃) = V/Vm = 0.25/22.4 ≈ 0.0112 mol。喷泉实验后 NH₃ 全部溶于水，溶液充满烧瓶（250 mL = 0.25 L）。\n\nc(NH₃) = n/V = 0.0112/0.25 = 0.0448 mol/L ≈ 0.045 mol/L。\n\n注意：若用 HCl 气体，结果相同（1/22.4 mol/L ≈ 0.045 mol/L）。", "answer": "（1）NH₃ 极易溶于水（1:700），使瓶内压强骤降，水被压入形成喷泉。（2）CO₂ 应用 NaOH 溶液做喷泉实验（CO₂ + 2NaOH = Na₂CO₃ + H₂O）。（3）c = (0.25/22.4)/0.25 = 1/22.4 ≈ 0.045 mol/L。"}, {"title": "硝酸反应计算（中档题）", "question": "将 6.4 g 铜片投入足量浓硝酸中，充分反应后，求：（1）参加反应的硝酸的物质的量；（2）被还原的硝酸的物质的量；（3）生成气体的体积（标况）。", "analysis": "首先计算铜的物质的量：n(Cu) = 6.4/64 = 0.1 mol。\n\n铜与浓硝酸反应：Cu + 4HNO₃（浓）= Cu(NO₃)₂ + 2NO₂↑ + 2H₂O。\n\n（1）参加反应的硝酸：由方程式，1 mol Cu 消耗 4 mol HNO₃，所以 n(HNO₃)总 = 0.1 × 4 = 0.4 mol。\n\n（2）被还原的硝酸：4 mol HNO₃ 中只有 2 mol 被还原为 NO₂（N 从 +5 → +4），另外 2 mol 起酸的作用生成 Cu(NO₃)₂。所以被还原的 HNO₃ = 0.1 × 2 = 0.2 mol。\n\n（3）生成 NO₂ 气体：n(NO₂) = 0.1 × 2 = 0.2 mol，V(NO₂) = 0.2 × 22.4 = 4.48 L。\n\n【老师提醒】参加反应的硝酸分为两部分：一部分被还原（作氧化剂），另一部分起酸的作用（生成盐）。被还原的硝酸 = 生成气体的物质的量。", "answer": "n(Cu) = 6.4/64 = 0.1 mol。Cu + 4HNO₃（浓）= Cu(NO₃)₂ + 2NO₂↑ + 2H₂O。（1）n(HNO₃)总 = 0.1×4 = 0.4 mol。（2）被还原 n(HNO₃) = 0.1×2 = 0.2 mol。（3）V(NO₂) = 0.2×22.4 = 4.48 L。"}, {"title": "浓硫酸性质综合（高考模拟题）", "question": "向蔗糖（C₁₂H₂₂O₁₁）中加入浓硫酸，观察到的现象是什么？写出涉及的反应方程式，并解释浓硫酸表现了什么性质。", "analysis": "蔗糖中加入浓硫酸发生'黑面包'实验，现象分步分析：\n\n第一步（脱水性）：浓硫酸具有脱水性，从蔗糖分子中按水的比例（H:O = 2:1）夺取氢和氧元素，使蔗糖碳化变黑。反应：C₁₂H₂₂O₁₁ →（浓H₂SO₄）12C + 11H₂O。此时表现浓硫酸的脱水性。\n\n第二步（强氧化性）：生成的碳继续与浓硫酸反应：C + 2H₂SO₄（浓）=（加热）CO₂↑ + 2SO₂↑ + 2H₂O。反应放热使混合物温度升高，产生大量气体（CO₂ 和 SO₂），使黑色碳化物体积膨胀形成疏松多孔的'黑面包'。此时表现浓硫酸的强氧化性。\n\n第三步（吸水性）：浓硫酸吸收生成的水，使反应更彻底。\n\n现象总结：蔗糖变黑（脱水碳化），体积膨胀形成疏松多孔的黑色柱状物（'黑面包'），有刺激性气味气体产生（SO₂）。\n\n浓硫酸在此实验中表现了脱水性（使蔗糖碳化）、强氧化性（氧化碳生成 SO₂ 和 CO₂）、吸水性（吸收生成的水）。", "answer": "现象：蔗糖变黑，体积膨胀形成疏松多孔'黑面包'，有刺激性气味气体放出。反应：C₁₂H₂₂O₁₁ → 12C + 11H₂O（脱水性）；C + 2H₂SO₄（浓）= CO₂↑ + 2SO₂↑ + 2H₂O（强氧化性）。浓硫酸表现了脱水性、强氧化性和吸水性。"}]}, {"id": "ch_2_6", "title": "第六章 化学反应与能量", "summary": "学习化学反应中的能量变化、化学反应速率与限度，初步认识化学平衡。", "knowledge": [{"title": "化学反应与能量变化", "content": "化学反应中不仅有物质变化，还伴随着能量变化（吸热或放热），能量变化通常以热能形式表现。\n\n放热反应：反应物总能量大于生成物总能量，反应过程中放出热量。常见放热反应：（1）燃烧反应（如 2H₂ + O₂ = 2H₂O）；（2）中和反应（如 HCl + NaOH = NaCl + H₂O）；（3）活泼金属与酸反应（如 2Na + 2H₂O = 2NaOH + H₂↑）；（4）大多数化合反应（如 CaO + H₂O = Ca(OH)₂）；（5）铝热反应（2Al + Fe₂O₃ = 2Fe + Al₂O₃）。\n\n吸热反应：反应物总能量小于生成物总能量，反应过程中吸收热量。常见吸热反应：（1）大多数分解反应（如 CaCO₃ =（加热）CaO + CO₂↑）；（2）C + CO₂ =（高温）2CO；（3）C + H₂O =（高温）CO + H₂（水煤气制取）；（4）Ba(OH)₂·8H₂O 与 NH₄Cl 反应；（5）灼热碳与水蒸气反应。\n\n从化学键角度理解能量变化：断开化学键需要吸收能量（吸热），形成化学键释放能量（放热）。反应吸放热 = 断键吸收的能量 - 成键放出的能量。若成键放出的能量 > 断键吸收的能量，则为放热反应；反之为吸热反应。\n\n放热反应和吸热反应的比较：\n（1）放热反应：反应物总能量 > 生成物总能量，反应放出热量；\n（2）吸热反应：反应物总能量 < 生成物总能量，反应吸收热量。\n\n【老师提醒】注意区分'反应放热/吸热'与'反应需要加热'。需要加热才能进行的反应不一定是吸热反应（如燃烧反应需要点燃但属于放热反应）；不需要加热就能进行的反应不一定是放热反应（如 Ba(OH)₂·8H₂O 与 NH₄Cl 在常温下反应是吸热反应）。判断反应吸放热的关键是反应物和生成物的能量大小关系。\n\n中和反应放热测定实验：使已知浓度的强酸和强碱在保温杯中反应，测量温度变化，计算中和热。"}, {"title": "化学反应速率", "content": "化学反应速率：描述化学反应进行快慢的物理量。通常用单位时间内反应物浓度的减少或生成物浓度的增加来表示。\n\n公式：v = Δc/Δt，其中 Δc 为浓度变化量（mol/L），Δt 为时间间隔（s 或 min），单位为 mol/(L·s) 或 mol/(L·min)。\n\n注意事项：（1）化学反应速率是平均值，不是瞬时速率；（2）固体或纯液体的浓度视为常数，不用固体或纯液体表示反应速率；（3）同一反应中，用不同物质表示的速率之比等于化学方程式中各物质的化学计量数之比。如反应 aA + bB = cC + dD，v(A):v(B):v(C):v(D) = a:b:c:d。\n\n影响化学反应速率的因素：\n（1）浓度：增大反应物浓度，反应速率加快（单位体积内活化分子数增多，有效碰撞频率增大）。注意：固体和纯液体的浓度不变，改变其用量不影响速率。\n（2）温度：升高温度，反应速率加快。一般规律：温度每升高 10℃，反应速率约增大到原来的 2~4 倍（因为温度升高使更多分子成为活化分子，活化分子百分数增大）。\n（3）压强：对有气体参加的反应，增大压强（缩小体积）相当于增大浓度，反应速率加快。对固体或液体反应，压强影响很小。\n（4）催化剂：加入催化剂能改变反应途径，降低反应活化能，同等程度地增大正反应和逆反应速率。注意：催化剂不能改变反应方向和平衡状态，只能缩短到达平衡的时间。\n（5）表面积：固体反应物表面积越大（如粉末状比块状），反应速率越快。\n（6）其他因素：光照、溶剂、超声波等也可影响反应速率。\n\n【老师提醒】比较反应速率大小时，必须将不同物质表示的速率换算为同一物质表示的速率再比较。如反应 2A + B = C 中 v(A) = 0.2，v(B) = 0.15，换算为以 B 表示：v(A) = 0.2/2 = 0.1（换算系数由计量数比决定），所以 v(B) = 0.15 > v(A)换算 = 0.1，B 表示的速率更快。\n\n催化剂同等程度改变正逆反应速率——这是催化剂不影响化学平衡移动的原因。"}, {"title": "化学反应限度与化学平衡", "content": "可逆反应：在同一条件下，正反应和逆反应同时进行的反应。可逆反应用'⇌'表示。如 2SO₂ + O₂ ⇌ 2SO₃。\n\n化学平衡状态：在一定条件下的可逆反应中，正反应速率和逆反应速率相等，反应混合物中各组分的浓度（或含量）保持不变的状态。\n\n化学平衡的特征（'动、等、定、变'）：\n（1）动（动态平衡）：平衡时反应并未停止，正反应和逆反应仍在进行，只是 v(正) = v(逆) ≠ 0。\n（2）等：正反应速率等于逆反应速率。\n（3）定：平衡时各组分浓度保持不变（不随时间变化）。\n（4）变：条件改变，平衡被破坏，在新的条件下建立新的平衡。\n\n判断化学平衡的方法：\n（1）直接判断：正反应速率 = 逆反应速率（针对同一种物质）；各组分浓度不再变化。\n（2）间接判断：对于反应前后气体分子数不相等的反应，压强不变、平均相对分子质量不变、密度不变等可作为平衡标志。但要注意：对于反应前后气体分子数相等的反应（如 2HI ⇌ H₂ + I₂），压强始终不变，不能用压强判断是否平衡。\n\n【老师提醒】判断是否达到平衡是重点。关键原则：能变化的量不再变化了就是平衡。'v(正) = v(逆)'是平衡的本质标志。注意：必须针对同一种物质或不同物质按计量数比换算后比较。如反应 N₂ + 3H₂ ⇌ 2NH₃，'生成 1 mol N₂ 的同时消耗 1 mol N₂'表示平衡；'生成 2 mol NH₃ 的同时消耗 1 mol N₂'也表示平衡（按计量数比）。\n\n常见陷阱：'反应停止了'是错的（平衡是动态的）；对于反应前后气体分子数不变的反应，压强不能作为判断平衡的标志。"}, {"title": "化学平衡移动", "content": "化学平衡移动：在一定条件下达到平衡的可逆反应，当条件改变时，平衡混合物中各组分的含量发生变化，达到新的平衡状态的过程。\n\n勒夏特列原理（平衡移动原理）：如果改变影响平衡的条件（如浓度、温度、压强等），平衡就向减弱这种改变的方向移动。\n\n浓度对平衡的影响：增大反应物浓度或减小生成物浓度，平衡向正反应方向移动；减小反应物浓度或增大生成物浓度，平衡向逆反应方向移动。注意：固体和纯液体的浓度不变，增减固体或纯液体不影响平衡。\n\n温度对平衡的影响：升高温度，平衡向吸热反应方向移动；降低温度，平衡向放热反应方向移动。注意：任何反应都伴随吸热或放热，温度改变一定会影响平衡。\n\n压强对平衡的影响：对于有气体参加且反应前后气体分子数不相等的反应，增大压强（缩小体积），平衡向气体分子数减少的方向移动；减小压强，平衡向气体分子数增多的方向移动。注意：（1）对反应前后气体分子数相等的反应，压强不影响平衡；（2）压强只对气体有影响，对固体和液体无影响。\n\n催化剂对平衡的影响：催化剂同等程度改变正逆反应速率，不影响化学平衡移动，但能缩短到达平衡的时间。\n\n勒夏特列原理的应用注意事项：\n（1）平衡移动只能'减弱'改变，不能完全'消除'改变。如增大某反应物浓度，平衡正移使该反应物浓度有所减小，但仍比原来大。\n（2）勒夏特列原理适用于已达到平衡的体系，不适用于未达到平衡的体系。\n（3）惰性气体的加入：恒容加入惰性气体（各组分分压不变）不影响平衡；恒压加入惰性气体（体积增大，各组分浓度减小）相当于减小压强。\n\n【老师提醒】分析平衡移动的步骤：（1）判断反应是否已达到平衡；（2）分析条件改变（浓度/温度/压强）；（3）根据勒夏特列原理判断移动方向；（4）分析移动后各量的变化。\n\n常见应用：工业合成氨 N₂ + 3H₂ ⇌ 2NH₃（正反应放热），为提高 NH₃ 产率，理论上应低温高压，但温度太低反应速率太慢，实际采用约 500℃ 和高压并使用催化剂（兼顾速率和转化率）。"}], "exam_points": [{"title": "能量变化判断", "content": "判断反应吸放热的方法：（1）根据反应物和生成物能量大小（反应物能量高→放热）；（2）根据化学键能量（断键吸热、成键放热，比较两者大小）；（3）根据常见反应类型记忆（燃烧、中和、活泼金属与酸为放热；分解、C+CO₂ 为吸热）。注意区分'需要加热'和'吸热反应'。"}, {"title": "化学反应速率计算与比较", "content": "v = Δc/Δt 是基本公式。注意：（1）浓度变化是 Δc 不是 Δn；（2）固体和纯液体不用来表示速率；（3）不同物质表示的速率之比 = 化学计量数之比，比较速率大小前需换算为同一物质。影响因素：浓度增大加快、温度升高加快、压强增大加快（气体反应）、催化剂加快。"}, {"title": "化学平衡判断与移动", "content": "判断平衡：v(正) = v(逆)（同种物质），各组分浓度不变。注意反应前后气体分子数相等的反应，压强和密度不能作为平衡标志。平衡移动方向：增大反应物浓度→正移；升高温度→吸热方向移动；增大压强→气体分子数减少方向移动。催化剂不影响平衡移动。工业合成氨的条件选择要兼顾速率和转化率。"}], "examples": [{"title": "反应速率计算（基础题）", "question": "在 2L 密闭容器中，反应 2A + B = C，10 s 内 A 的物质的量由 4 mol 降到 1.6 mol。求：（1）A 的反应速率；（2）B 的反应速率；（3）C 的反应速率。", "analysis": "首先计算 A 的浓度变化量。A 的初始浓度 = 4/2 = 2 mol/L，10 s 后浓度 = 1.6/2 = 0.8 mol/L，Δc(A) = 2 - 0.8 = 1.2 mol/L。\n\n（1）v(A) = Δc(A)/Δt = 1.2/10 = 0.12 mol/(L·s)。\n\n（2）根据化学方程式中计量数之比，v(A):v(B):v(C) = 2:1:1。\nv(B) = v(A) × (1/2) = 0.12 × 0.5 = 0.06 mol/(L·s)。\n\n（3）v(C) = v(A) × (1/2) = 0.12 × 0.5 = 0.06 mol/(L·s)。\n\n验证：B 消耗浓度 = Δc(A)/2 = 0.6 mol/L，C 生成浓度 = Δc(A)/2 = 0.6 mol/L，符合计量数比。", "answer": "（1）v(A) = (4−1.6)/(2×10) = 0.12 mol/(L·s)。（2）v(B) = v(A)/2 = 0.06 mol/(L·s)。（3）v(C) = v(A)/2 = 0.06 mol/(L·s)。"}, {"title": "平衡移动判断（基础题）", "question": "对于反应 N₂ + 3H₂ ⇌ 2NH₃（正反应为放热反应），下列条件改变时平衡如何移动？（1）增大压强；（2）升高温度；（3）分离出 NH₃；（4）加入催化剂。", "analysis": "分析反应特征：N₂ + 3H₂ ⇌ 2NH₃，正反应方向气体分子数从 4 减少到 2（体积减小），正反应放热。\n\n（1）增大压强：根据勒夏特列原理，平衡向减弱压强增大的方向移动，即向气体分子数减少的方向移动。正反应方向气体分子数减少（4→2），所以增大压强平衡向正反应方向（右）移动。\n\n（2）升高温度：平衡向吸热反应方向移动。正反应放热，逆反应吸热，所以升高温度平衡向逆反应方向（左）移动。\n\n（3）分离出 NH₃：减小生成物浓度，平衡向正反应方向（右）移动。\n\n（4）加入催化剂：催化剂同等程度改变正逆反应速率，不影响化学平衡移动，平衡不移动（但缩短到达平衡时间）。", "answer": "（1）增大压强→正向移动（气体分子数减少方向）。（2）升高温度→逆向移动（吸热方向）。（3）分离 NH₃→正向移动。（4）加催化剂→不移动。"}, {"title": "吸放热反应判断（中档题）", "question": "已知破坏 1 mol H-H 键需 436 kJ 能量，破坏 1 mol Cl-Cl 键需 243 kJ 能量，形成 1 mol H-Cl 键释放 431 kJ 能量。判断反应 H₂ + Cl₂ = 2HCl 是放热还是吸热反应？计算反应的能量变化。", "analysis": "反应过程中能量的变化 = 断键吸收的能量 - 成键释放的能量。\n\n断键吸收的能量（反应物化学键断裂）：\n- 1 mol H-H 键断裂：436 kJ\n- 1 mol Cl-Cl 键断裂：243 kJ\n- 总吸热：436 + 243 = 679 kJ\n\n成键释放的能量（生成物化学键形成）：\n- 2 mol H-Cl 键形成：2 × 431 = 862 kJ\n\n反应能量变化 = 断键吸热 - 成键放热 = 679 - 862 = -183 kJ。\n\n结果为负值，说明反应放热，放出 183 kJ 热量。\n\n判断：由于成键放出的能量（862 kJ）大于断键吸收的能量（679 kJ），所以是放热反应。", "answer": "断键吸热 = 436 + 243 = 679 kJ；成键放热 = 2×431 = 862 kJ。679 < 862，反应放热，放出 862 − 679 = 183 kJ。该反应为放热反应。"}, {"title": "平衡状态判断（中档题）", "question": "在一定温度下，可逆反应 2NO₂（g）⇌ N₂O₄（g）达到平衡的标志是（填序号）：\n① NO₂ 和 N₂O₄ 的浓度相等；② NO₂ 和 N₂O₄ 的浓度不再变化；③ 单位时间内生成 2 mol NO₂ 同时消耗 2 mol NO₂；④ 混合气体的颜色不再变化；⑤ 混合气体的压强不再变化；⑥ 混合气体的平均相对分子质量不再变化。", "analysis": "逐一分析每个选项是否为平衡标志：\n\n① 浓度相等不等于平衡。平衡要求浓度不变，而不是相等。初始时 NO₂ 浓度远大于 N₂O₄，平衡时两者浓度不一定相等。错误。\n\n② 浓度不再变化是平衡的直接标志。各组分浓度恒定不变，说明 v(正) = v(逆)。正确。\n\n③ '生成 2 mol NO₂ 同时消耗 2 mol NO₂'：生成 NO₂ 是逆反应（N₂O₄ → 2NO₂），消耗 NO₂ 是正反应（2NO₂ → N₂O₄）。单位时间内生成和消耗的量相等，说明 v(正) = v(逆)。正确。\n\n④ 混合气体颜色不变：NO₂ 是红棕色气体，N₂O₄ 无色。颜色不变意味着 NO₂ 浓度不变，是平衡的标志。正确。\n\n⑤ 压强不变：此反应 2NO₂ ⇌ N₂O₄，反应前后气体分子数不相等（2→1），反应过程中气体总物质的量变化导致压强变化。压强不变说明达到平衡。正确。\n\n⑥ 平均相对分子质量不变：反应前后气体总物质的量变化，平均相对分子质量随之变化。不变则平衡。正确。", "answer": "②③④⑤⑥ 是平衡标志。① 不是（浓度相等≠浓度不变）。"}, {"title": "工业合成氨条件选择（高考真题）", "question": "工业合成氨反应：N₂ + 3H₂ ⇌ 2NH₃（正反应放热）。从理论上分析，为提高 NH₃ 的产率应选择什么温度和压强？但实际工业生产中并未完全采用理论条件，为什么？", "analysis": "从平衡移动角度分析（提高 NH₃ 产率即提高转化率）：\n\n（1）温度：正反应放热，根据勒夏特列原理，降低温度平衡向正反应方向（放热方向）移动，NH₃ 产率提高。所以理论上应选择低温。\n\n（2）压强：正反应方向气体分子数减少（4→2），增大压强平衡向正反应方向移动，NH₃ 产率提高。所以理论上应选择高压。\n\n理论上最优条件：低温、高压。\n\n但实际工业生产并未完全采用理论条件，原因：\n\n（1）温度不能太低：温度过低反应速率太慢，达到平衡需要很长时间，生产效率低。工业上选择约 500℃，虽然此温度下 NH₃ 产率不如低温高，但反应速率较快，且使用了铁催化剂（催化剂需要一定温度才有活性），综合经济效益好。\n\n（2）压强不能太高：压强越大对设备要求越高（耐高压容器成本高），动力消耗大，安全风险大。工业上一般采用 20~50 MPa 的压强。\n\n（3）使用催化剂：铁触媒（以铁为主催化剂），加快反应速率，缩短到达平衡时间。\n\n（4）其他措施：将生成的 NH₃ 液化分离（减小生成物浓度，平衡正移），未反应的 N₂ 和 H₂ 循环使用提高利用率。", "answer": "理论上：低温高压可提高 NH₃ 产率（放热反应+气体分子数减少）。实际工业：采用约 500℃（兼顾反应速率和催化剂活性）、20~50 MPa 高压、铁催化剂、循环分离 NH₃。因为温度太低反应速率太慢不经济，压强太高设备成本和安全风险大。"}]}, {"id": "ch_2_7", "title": "第七章 有机化合物", "summary": "初步学习有机化学，认识甲烷、乙烯、乙醇、乙酸与基本营养物质。", "knowledge": [{"title": "甲烷与烷烃", "content": "甲烷（CH₄）是最简单的有机物，也是天然气和沼气的主要成分。\n\n甲烷的分子结构：正四面体结构，C 原子位于中心，4 个 H 原子位于四个顶点，4 个 C-H 键完全相同，键角 109°28'。注意：甲烷不是平面正方形结构。\n\n甲烷的物理性质：无色无味气体，难溶于水，密度比空气小。\n\n甲烷的化学性质：\n（1）氧化反应（燃烧）：CH₄ + 2O₂ =（点燃）CO₂ + 2H₂O。甲烷燃烧火焰呈淡蓝色，放出大量热，是优质清洁燃料。注意：甲烷不能与酸性 KMnO₄ 反应（不能使其褪色）。\n（2）取代反应：在光照条件下，甲烷与氯气发生取代反应。CH₄ + Cl₂ =（光照）CH₃Cl + HCl。产物为多种氯代物的混合物（CH₃Cl、CH₂Cl₂、CHCl₃、CCl₄），其中 CHCl₃（氯仿）和 CCl₄（四氯化碳）是液态。反应分步进行，每步取代一个 H 原子。注意：必须在光照条件下，不能在黑暗中或加热时反应。\n（3）受热分解：CH₄ =（高温）C + 2H₂（隔绝空气高温分解）。\n\n烷烃：饱和链烃，通式 CnH2n+2（n≥1）。碳碳单键（C-C），碳原子间以单键结合成链状，其余价键被 H 原子饱和。烷烃性质稳定，能发生燃烧和取代反应，不能发生加成反应。\n\n烷烃的物理性质递变（随碳原子数增多）：状态由气态（C₁~C₄）→ 液态（C₅~C₁₆）→ 固态（C₁₇以上）；熔沸点逐渐升高；密度逐渐增大（但都小于 1 g/cm³）。\n\n同系物：结构相似，分子组成上相差一个或若干个 CH₂ 原子团的有机化合物互称同系物。如 CH₄、C₂H₆、C₃H₈ 互为同系物。同系物化学性质相似。\n\n同分异构体：分子式相同但结构不同的化合物互称同分异构体。如正丁烷（CH₃CH₂CH₂CH₃）和异丁烷（CH₃CH(CH₃)CH₃）互为同分异构体。烷烃的同分异构体随碳原子数增多而增多（甲烷 1 种、乙烷 1 种、丙烷 1 种、丁烷 2 种、戊烷 3 种）。\n\n【老师提醒】甲烷取代反应是重点：产物是混合物（四种氯代物 + HCl），必须光照条件。正四面体结构意味着 4 个 H 原子等价，一氯代物只有一种。同分异构体书写要注意碳链异构（碳骨架不同），书写时遵循'主链由长到短，支链由整到散'原则。\n\n取代反应定义：有机物分子中的某些原子或原子团被其他原子或原子团所替代的反应。"}, {"title": "乙烯与烯烃", "content": "乙烯（CH₂=CH₂ 或 C₂H₄）是最简单的烯烃，也是石油化工最重要的基础原料。乙烯的产量是衡量一个国家化工发展水平的重要标志。\n\n乙烯的分子结构：分子中含有一个 C=C 双键（碳碳双键），双键中一个键是 σ 键（稳定），一个键是 π 键（不稳定，易断裂）。6 个原子（2 个 C 和 4 个 H）在同一平面上，键角约 120°。C=C 双键是乙烯的官能团。\n\n乙烯的物理性质：无色稍有气味的气体，难溶于水，密度比空气略小。\n\n乙烯的化学性质：\n（1）氧化反应（燃烧）：C₂H₄ + 3O₂ =（点燃）2CO₂ + 2H₂O。火焰明亮带黑烟（含碳量高燃烧不完全）。注意：乙烯能使酸性 KMnO₄ 溶液褪色（被氧化），甲烷不能，据此可鉴别。\n（2）加成反应：C=C 双键中 π 键断裂，两个原子或原子团分别加到双键两端的 C 原子上。CH₂=CH₂ + Br₂ → CH₂Br—CH₂Br（使溴水褪色，鉴别烯烃）；CH₂=CH₂ + H₂ →（催化剂）CH₃—CH₃；CH₂=CH₂ + HCl → CH₃—CH₂Cl；CH₂=CH₂ + H₂O →（催化剂，加热加压）CH₃CH₂OH（工业制乙醇）。\n（3）加聚反应：nCH₂=CH₂ →（催化剂，加热加压）—[CH₂—CH₂]—n（聚乙烯，PE）。聚乙烯无毒，用于制造塑料薄膜、食品包装等。\n\n加成反应定义：有机物分子中双键（或三键）两端的 C 原子与其他原子或原子团直接结合生成新化合物的反应。\n加聚反应定义：由不饱和化合物通过加成反应聚合成高分子化合物的反应。\n\n烯烃：含 C=C 双键的链烃，通式 CnH2n（n≥2）。烯烃的化学性质与乙烯类似，能发生加成反应、氧化反应和加聚反应。C=C 双键是烯烃的官能团。\n\n乙烯的用途：（1）植物生长调节剂，催熟水果（如催熟香蕉）；（2）重要化工原料，制聚乙烯、乙醇、乙醛等。\n\n【老师提醒】鉴别烷烃和烯烃的方法：（1）通入溴水（或溴的四氯化碳溶液），烯烃使其褪色（加成反应），烷烃不能；（2）通入酸性 KMnO₄ 溶液，烯烃使其褪色（氧化反应），烷烃不能。注意：甲烷不能使溴水和 KMnO₄ 褪色，这是烷烃和烯烃的重要区别。\n\n加成反应和取代反应的区别：加成反应中有机物分子的不饱和度降低（双键变单键），产物只有一种；取代反应中有机物分子饱和度不变，产物有多种。"}, {"title": "乙醇与乙酸", "content": "乙醇（C₂H₅OH 或 CH₃CH₂OH）：俗称酒精，是酒类的主要成分。\n\n乙醇的分子结构：分子中含有羟基（—OH），羟基是乙醇的官能团。C—O—H 中 C—O 键和 O—H 键都可能断裂发生反应。\n\n乙醇的物理性质：无色透明有特殊香味的液体，易挥发，能与水以任意比互溶，是良好的有机溶剂。\n\n乙醇的化学性质：\n（1）与金属钠反应：2CH₃CH₂OH + 2Na → 2CH₃CH₂ONa + H₂↑（乙醇钠和氢气）。注意：乙醇与钠反应比水与钠反应缓和得多，说明乙醇羟基中的 H 不如水中的 H 活泼（乙醇是非电解质，电离出 H⁺ 的能力比水弱）。\n（2）氧化反应：\n- 燃烧：C₂H₅OH + 3O₂ →（点燃）2CO₂ + 3H₂O（蓝色火焰，放热）。\n- 催化氧化：2C₂H₅OH + O₂ →（Cu/Ag 催化，加热）2CH₃CHO + 2H₂O（生成乙醛）。反应机理：Cu 作催化
