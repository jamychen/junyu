剂，先 2Cu + O₂ → 2CuO，再 CuO + C₂H₅OH → CH₃CHO + Cu + H₂O。\n- 被强氧化剂氧化：乙醇可被酸性 KMnO₄ 或 K₂Cr₂O₇ 氧化为乙酸。\n（3）消去反应（分子内脱水）：CH₃CH₂OH →（浓硫酸，170℃）CH₂=CH₂↑ + H₂O。此反应是实验室制乙烯的方法，温度必须控制在 170℃（140℃ 时发生分子间脱水生成乙醚）。\n\n乙酸（CH₃COOH）：俗称醋酸，食醋中含 3%~5% 的乙酸。纯乙酸在温度低于 16.6℃ 时凝结成冰状晶体，故又称冰醋酸。\n\n乙酸的分子结构：分子中含有羧基（—COOH），羧基是乙酸的官能团。乙酸是弱酸，在水中部分电离：CH₃COOH ⇌ CH₃COO⁻ + H⁺。\n\n乙酸的化学性质（具有弱酸的通性）：\n（1）使石蕊试液变红；（2）与活泼金属反应：2CH₃COOH + 2Na → 2CH₃COONa + H₂↑；（3）与金属氧化物反应：2CH₃COOH + CuO → (CH₃COO)₂Cu + H₂O；（4）与碱反应：CH₃COOH + NaOH → CH₃COONa + H₂O；（5）与盐反应：2CH₃COOH + Na₂CO₃ → 2CH₃COONa + H₂O + CO₂↑（证明乙酸酸性强于碳酸）。\n\n酯化反应（重点）：酸和醇作用生成酯和水的反应。\nCH₃COOH + C₂H₅OH ⇌（浓硫酸，加热）CH₃COOC₂H₅ + H₂O。\n反应特点：（1）可逆反应；（2）浓硫酸起催化剂和吸水剂作用（吸收生成的水，促进正反应）；（3）反应原理是'酸脱羟基醇脱氢'（羧酸脱去—OH 中的 OH，醇脱去—OH 中的 H，结合生成水）；（4）酯化反应属于取代反应。\n\n酯化反应实验装置：试管中加乙醇、乙酸和浓硫酸，加热（水浴加热）。长导管起冷凝回流作用（导管不能插入饱和 Na₂CO₃ 溶液中，防止倒吸）。收集到的产物用饱和 Na₂CO₃ 溶液处理（除去乙酸和乙醇，降低酯的溶解度便于分层）。\n\n【老师提醒】酯化反应是高考必考点。注意：（1）反应可逆，用可逆号；（2）浓硫酸的双重作用（催化剂+吸水剂）；（3）'酸脱羟基醇脱氢'的反应机理；（4）饱和 Na₂CO₃ 溶液的作用（中和乙酸、溶解乙醇、降低酯的溶解度）。乙醇与钠反应比水与钠反应缓和，说明—OH 中 H 的活泼性：水 > 乙醇。"}, {"title": "基本营养物质", "content": "基本营养物质包括糖类、油脂、蛋白质三大类，是维持人体生命活动的重要物质。\n\n糖类：由 C、H、O 三种元素组成，通式可表示为 (CH₂O)n（不完全准确）。糖类分为单糖、二糖和多糖。\n（1）单糖：不能水解的最简单糖类。葡萄糖（C₆H₁₂O₆）是最重要的单糖，有还原性，能发生银镜反应（与银氨溶液反应生成银镜）：CH₂OH(CHOH)₄CHO + 2Ag(NH₃)₂OH →（水浴加热）CH₂OH(CHOH)₄COONH₄ + 2Ag↓ + 3NH₃ + H₂O。果糖也是单糖，与葡萄糖互为同分异构体。\n（2）二糖：由两分子单糖脱水缩合而成。蔗糖（C₁₂H₂₂O₁₁）无还原性（不能发生银镜反应），水解生成葡萄糖和果糖：C₁₂H₂₂O₁₁ + H₂O →（催化剂）C₆H₁₂O₆ + C₆H₁₂O₆。麦芽糖有还原性，水解生成两分子葡萄糖。\n（3）多糖：淀粉（C₆H₁₀O₅)n 和纤维素（C₆H₁₀O₅)n。淀粉的检验：遇碘（I₂）变蓝色（特征反应）。淀粉水解：（C₆H₁₀O₅)n + nH₂O →（催化剂）nC₆H₁₂O₆（最终生成葡萄糖）。纤维素水解也生成葡萄糖。淀粉和纤维素不是同分异构体（n 值不同）。\n\n油脂：由高级脂肪酸和甘油（丙三醇）生成的酯。常温下呈液态的叫油（如植物油），呈固态的叫脂肪（如动物脂肪）。油脂的水解（皂化反应）：油脂 + NaOH → 高级脂肪酸钠（肥皂）+ 甘油。油脂是人体重要的能量储备物质。\n\n蛋白质：由氨基酸通过肽键连接而成的高分子化合物。蛋白质的性质：\n（1）盐析：加浓无机盐（如 (NH₄)₂SO₄、Na₂SO₄）使蛋白质从溶液中析出，是可逆过程（加水可再溶解），不改变蛋白质活性。用于分离提纯蛋白质。\n（2）变性：在加热、强酸、强碱、重金属盐、紫外线、甲醛、酒精等作用下，蛋白质失去原有的可溶性和生理活性，是不可逆过程。高温灭菌和重金属中毒的原理。\n（3）颜色反应：蛋白质遇浓硝酸变黄（含苯环的蛋白质），用于鉴别蛋白质。\n（4）灼烧：蛋白质灼烧有烧焦羽毛的气味，用于鉴别含蛋白质的物质（如区分真丝和人造丝）。\n\n【老师提醒】淀粉遇碘变蓝是检验淀粉的特征反应。葡萄糖的银镜反应和与新制 Cu(OH)₂ 反应（加热生成砖红色 Cu₂O 沉淀）是检验还原性糖的方法。蛋白质盐析（可逆）和变性（不可逆）的区别是常考点。误食重金属盐中毒后，可喝大量牛奶或蛋清解毒（蛋白质优先与重金属盐结合变性）。"}], "exam_points": [{"title": "官能团与性质", "content": "不同官能团的特征反应是鉴别有机物的依据：C=C 双键能使溴水和 KMnO₄ 褪色（加成和氧化）；—OH 羟基能与 Na 反应放出 H₂；—COOH 羧基具有酸性，能与 Na₂CO₃ 反应放出 CO₂。鉴别有机物时根据官能团的特征反应选择试剂。"}, {"title": "反应类型判断", "content": "常见有机反应类型：取代反应（甲烷与 Cl₂、酯化反应、酯的水解）、加成反应（乙烯与 Br₂、H₂、HCl、H₂O）、加聚反应（乙烯聚合）、消去反应（乙醇制乙烯）、氧化反应（乙醇催化氧化）。根据反应物和产物特征判断反应类型。"}, {"title": "同分异构体书写", "content": "烷烃同分异构体书写遵循'主链由长到短，支链由整到散'原则。戊烷有 3 种同分异构体：正戊烷（CH₃CH₂CH₂CH₂CH₃）、异戊烷（CH₃CH(CH₃)CH₂CH₃）、新戊烷（C(CH₃)₄）。同分异构体分子式相同但结构不同，物理性质不同，化学性质相似。"}, {"title": "酯化反应与酯的水解", "content": "酯化反应：酸 + 醇 → 酯 + 水（可逆，浓硫酸催化兼吸水）。酯的水解：酯 + 水 → 酸 + 醇（可逆，稀酸或碱催化）。碱性条件下水解更彻底（碱中和生成的酸）。反应机理'酸脱羟基醇脱氢'。饱和 Na₂CO₃ 在酯化反应收集中的作用。"}], "examples": [{"title": "甲烷与乙烯鉴别（基础题）", "question": "用一种试剂鉴别甲烷和乙烯两种气体，写出实验步骤和现象。", "analysis": "甲烷是饱和烃（烷烃），化学性质稳定，不能与溴水或酸性 KMnO₄ 反应。乙烯含有 C=C 双键，能发生加成反应使溴水褪色，也能被氧化使酸性 KMnO₄ 褪色。因此可用溴水或酸性 KMnO₄ 溶液鉴别。\n\n方法：将两种气体分别通入溴水（或酸性 KMnO₄ 溶液）中。能使溴水（或 KMnO₄ 溶液）褪色的是乙烯（发生了加成反应/氧化反应），不能使其褪色的是甲烷。\n\n注意：不能用燃烧法鉴别（两者都能燃烧），也不能用澄清石灰水鉴别（燃烧都产生 CO₂）。", "answer": "将气体分别通入溴水（或酸性 KMnO₄ 溶液），褪色者为乙烯（C=C 双键加成/氧化），不褪色者为甲烷。"}, {"title": "乙醇性质（基础题）", "question": "写出乙醇与金属钠反应的化学方程式，并比较乙醇与水分别与钠反应的剧烈程度。", "analysis": "乙醇分子中含有羟基（—OH），羟基中的 H 可以被活泼金属置换。反应方程式：2CH₃CH₂OH + 2Na → 2CH₃CH₂ONa + H₂↑。\n\n反应剧烈程度比较：水与钠反应非常剧烈（钠熔化成小球在水面上快速游动，发出响声，甚至燃烧爆炸）；乙醇与钠反应较缓和（钠缓慢放出气泡，不熔化不游动）。\n\n原因分析：水是弱电解质，能电离出 H⁺（H₂O ⇌ H⁺ + OH⁻）；乙醇是非电解质，几乎不电离，—OH 中的 H 原子不如水中的 H 原子活泼。因此水与钠反应比乙醇与钠反应剧烈。\n\n结论：—OH 中 H 的活泼性顺序：水 > 乙醇。", "answer": "2CH₃CH₂OH + 2Na → 2CH₃CH₂ONa + H₂↑。水与钠反应比乙醇与钠反应更剧烈，因为水能电离出 H⁺ 而乙醇几乎不电离，—OH 中 H 活泼性：水 > 乙醇。"}, {"title": "酯化反应（中档题）", "question": "写出乙酸与乙醇酯化反应的化学方程式，指出反应类型、浓硫酸的作用、反应机理，并说明如何收集和纯化生成的酯。", "analysis": "酯化反应方程式：CH₃COOH + C₂H₅OH ⇌（浓硫酸，加热）CH₃COOC₂H₅ + H₂O。\n\n反应类型：酯化反应（属于取代反应）。\n\n浓硫酸的作用：（1）催化剂——加快反应速率；（2）吸水剂——吸收反应生成的水，使平衡向正反应方向移动，提高酯的产率。\n\n反应机理：'酸脱羟基醇脱氢'。即乙酸分子中羧基（—COOH）脱去—OH，乙醇分子中羟基（—OH）脱去 H 原子，脱下的—OH 和 H 结合生成水，剩余部分结合生成酯 CH₃COOC₂H₅。可用同位素示踪法验证（用 ¹⁸O 标记乙醇中的 O，发现 ¹⁸O 出现在酯中而不是水中）。\n\n收集和纯化：反应生成的酯蒸气经长导管（冷凝回流作用）通入饱和 Na₂CO₃ 溶液中。饱和 Na₂CO₃ 溶液的作用：（1）中和未反应的乙酸（变为可溶性乙酸钠）；（2）溶解未反应的乙醇；（3）降低乙酸乙酯的溶解度，便于分层。分层后上层为乙酸乙酯（有果香味），下层为水溶液。用分液漏斗分离得到乙酸乙酯。\n\n注意：导管不能插入 Na₂CO₃ 溶液液面以下，防止因温度变化引起倒吸。", "answer": "CH₃COOH + C₂H₅OH ⇌（浓硫酸，加热）CH₃COOC₂H₅ + H₂O。反应类型：酯化反应（取代反应）。浓硫酸作用：催化剂和吸水剂。反应机理：酸脱羟基醇脱氢。收集：通入饱和 Na₂CO₃ 溶液（中和乙酸、溶解乙醇、降低酯溶解度），分液取上层。"}, {"title": "同分异构体书写（中档题）", "question": "写出戊烷（C₅H₁₂）的所有同分异构体的结构简式并命名。", "analysis": "书写烷烃同分异构体遵循'主链由长到短，支链由整到散'的原则。\n\n第一步：主链最长（5 个 C），无支链。\n结构简式：CH₃—CH₂—CH₂—CH₂—CH₃，名称：正戊烷。\n\n第二步：主链缩短为 4 个 C，剩余 1 个 C 作支链（甲基），支链只能放在中间位置（2 号碳上）。\n结构简式：CH₃—CH(CH₃)—CH₂—CH₃，名称：异戊烷（2-甲基丁烷）。\n\n第三步：主链缩短为 3 个 C，剩余 2 个 C 作支链。2 个 C 可以是 2 个甲基（不能是 1 个乙基，因为乙基放在 2 号碳上会使主链变成 4 个 C，与第二步重复）。\n2 个甲基都放在 2 号碳上。\n结构简式：CH₃—C(CH₃)₂—CH₃，名称：新戊烷（2,2-二甲基丙烷）。\n\n验证：正戊烷、异戊烷、新戊烷的分子式都是 C₅H₁₂，但碳骨架不同，共 3 种同分异构体。它们的物理性质（熔沸点）不同：正戊烷沸点最高（直链分子间接触面积大，范德华力大），新戊烷沸点最低（支链多，分子间接触面积小）。", "answer": "戊烷有 3 种同分异构体：（1）正戊烷 CH₃CH₂CH₂CH₂CH₃；（2）异戊烷 CH₃CH(CH₃)CH₂CH₃（2-甲基丁烷）；（3）新戊烷 C(CH₃)₄（2,2-二甲基丙烷）。"}, {"title": "有机物综合推断（高考模拟题）", "question": "某有机物 A 的分子式为 C₂H₆O，能与金属钠反应放出 H₂。A 在浓硫酸催化下加热到 170℃ 生成气体 B，B 能使溴水褪色。写出 A 和 B 的结构简式及有关反应方程式。", "analysis": "推断 A 的结构：A 分子式为 C₂H₆O，能与金属钠反应放出 H₂，说明 A 含有—OH（羟基）。C₂H₆O 只有一种含羟基的同分异构体：CH₃CH₂OH（乙醇）。（另一种同分异构体 CH₃—O—CH₃ 是甲醚，不含—OH，不能与 Na 反应放出 H₂）。\n所以 A = CH₃CH₂OH（乙醇）。\n\n推断 B 的结构：A 在浓硫酸催化下加热到 170℃ 发生消去反应（分子内脱水），生成不饱和气体 B。B 能使溴水褪色，说明 B 含 C=C 双键。\n反应：CH₃CH₂OH →（浓硫酸，170℃）CH₂=CH₂↑ + H₂O。\n所以 B = CH₂=CH₂（乙烯）。\n\nB 使溴水褪色的反应（加成反应）：CH₂=CH₂ + Br₂ → CH₂Br—CH₂Br（1,2-二溴乙烷）。\n\nA 与钠的反应：2CH₃CH₂OH + 2Na → 2CH₃CH₂ONa + H₂↑。\n\n注意温度条件：170℃ 发生消去反应（分子内脱水生成乙烯），140℃ 发生取代反应（分子间脱水生成乙醚 CH₃CH₂OCH₂CH₃）。", "answer": "A = CH₃CH₂OH（乙醇），B = CH₂=CH₂（乙烯）。A→B：CH₃CH₂OH →（浓硫酸，170℃）CH₂=CH₂↑ + H₂O（消去反应）。B 与溴水：CH₂=CH₂ + Br₂ → CH₂BrCH₂Br（加成反应）。A 与 Na：2CH₃CH₂OH + 2Na → 2CH₃CH₂ONa + H₂↑。"}]}, {"id": "ch_2_8", "title": "第八章 化学与可持续发展", "summary": "学习自然资源的开发利用、化学品的合理使用与环境保护。", "knowledge": [{"title": "自然资源的开发利用", "content": "金属冶炼的原理：利用还原反应将金属从其化合物中还原出来。根据金属活动性不同，采用不同的冶炼方法。\n\n（1）热分解法：适用于不活泼金属（Hg、Ag 等），其氧化物受热易分解。\n2HgO →（加热）2Hg + O₂↑；2Ag₂O →（加热）4Ag + O₂↑。\n\n（2）热还原法：适用于中等活泼金属（Fe、Cu、Zn、Sn 等），用还原剂（C、CO、H₂）在高温下还原。\n炼铁：Fe₂O₃ + 3CO →（高温）2Fe + 3CO₂（高炉炼铁原理）。\n炼铜：CuO + CO →（高温）Cu + CO₂ 或 Cu₂S + O₂ →（高温）2Cu + SO₂。\n炼钨：WO₃ + 3H₂ →（高温）W + 3H₂O。\n\n（3）电解法：适用于活泼金属（Al、Na、Mg、Ca 等），其化合物非常稳定，化学还原难以实现，必须用电解法。\n炼铝：2Al₂O₃ →（电解，冰晶石）4Al + 3O₂↑（冰晶石 Na₃AlF₆ 降低 Al₂O₃ 熔点）。\n炼钠：2NaCl →（电解熔融）2Na + Cl₂↑。\n炼镁：MgCl₂ →（电解熔融）Mg + Cl₂↑。\n\n海水资源开发利用：\n（1）海水淡化：蒸馏法、反渗透法、电渗析法等。\n（2）海水提镁：海水加石灰乳沉淀 Mg(OH)₂：MgCl₂ + Ca(OH)₂ → Mg(OH)₂↓ + CaCl₂；再加盐酸转化为 MgCl₂：Mg(OH)₂ + 2HCl → MgCl₂ + 2H₂O；电解熔融 MgCl₂ 制镁。\n（3）海水提溴：通入 Cl₂ 置换 Br₂：2Br⁻ + Cl₂ → Br₂ + 2Cl⁻；用 SO₂ 吸收 Br₂：Br₂ + SO₂ + 2H₂O → 2HBr + H₂SO₄；再通入 Cl₂ 重新氧化得高纯度 Br₂。\n（4）海水制盐：蒸发结晶得到 NaCl。\n\n煤、石油、天然气的综合利用：\n（1）煤：煤的干馏（隔绝空气加强热，得到焦炭、煤焦油、焦炉气等）、煤的气化（C + H₂O → CO + H₂，水煤气）、煤的液化（煤转化为液体燃料）。\n（2）石油：石油分馏（根据沸点不同分离出汽油、柴油、煤油等，物理变化）、石油裂化（大分子烃断裂为小分子烃，提高汽油产量和质量，化学变化）、石油裂解（深度裂化，获得乙烯、丙烯等化工原料，化学变化）。\n（3）天然气：主要成分 CH₄，用作燃料和化工原料（制合成气、制甲醇等）。\n\n【老师提醒】金属冶炼方法的选择依据金属活动性顺序：最活泼（K、Na、Ca、Mg、Al）用电解法；中等活泼（Zn、Fe、Sn、Pb、Cu）用热还原法；最不活泼（Hg、Ag）用热分解法。注意：铝的冶炼只能用电解法（Al₂O₃ 太稳定），铁的冶炼用热还原法（CO 作还原剂）。\n\n石油分馏是物理变化，裂化和裂解是化学变化。裂解的目的主要是获得乙烯等基本化工原料。"}, {"title": "化学品的合理使用", "content": "化学品的分类：按用途可分为化肥、农药、医药、合成材料、食品添加剂、日用化学品等。\n\n化肥：为农作物提供必需营养元素的化学品。\n（1）氮肥：提供 N 元素，如尿素 CO(NH₂)₂、铵盐（NH₄HCO₃、(NH₄)₂SO₄）、硝酸盐（KNO₃）。\n（2）磷肥：提供 P 元素，如过磷酸钙 Ca(H₂PO₄)₂·CaSO₄。\n（3）钾肥：提供 K 元素，如 KCl、K₂SO₄。\n（4）复合肥：含两种或以上营养元素，如 KNO₃、NH₄H₂PO₄。\n合理使用化肥：适量施用，过量会导致土壤板结、水体富营养化。铵态氮肥不能与碱性物质混合施用（会生成 NH₃ 逸出，降低肥效）。\n\n农药：杀虫剂、杀菌剂、除草剂。常见农药有有机磷农药、拟除虫菊酯等。合理使用农药：注意残留问题，避免对环境和人体健康造成危害。DDT 等难降解农药已被禁用。\n\n常见食品添加剂：\n（1）防腐剂：苯甲酸钠、山梨酸钾。\n（2）着色剂：胡萝卜素、柠檬黄。\n（3）调味剂：味精（谷氨酸钠）、食盐。\n（4）营养强化剂：维生素 C、铁强化剂。\n食品添加剂的使用必须符合国家标准，滥用食品添加剂有害健康。\n\n【老师提醒】铵态氮肥（含 NH₄⁺）不能与草木灰（含 K₂CO₃，呈碱性）混合使用，因为 NH₄⁺ + OH⁻ → NH₃↑ + H₂O，氨气逸出降低肥效。食品添加剂在规定范围内使用是安全的，但不能滥用。"}, {"title": "环境保护与绿色化学", "content": "环境污染主要来自工业生产和人类活动：\n\n大气污染：（1）酸雨——SO₂ 和 NOx 导致，我国以硫酸型酸雨为主；（2）光化学烟雾——NOx 和碳氢化合物在阳光照射下产生；（3）臭氧层破坏——氟利昂（CFCs）等引起；（4）温室效应——CO₂、CH₄ 等温室气体导致全球气候变暖；（5）PM2.5——细颗粒物污染。\n\n水污染：（1）重金属污染（Hg、Cd、Pb、Cr 等通过食物链富集）；（2）水体富营养化（N、P 过量导致水华、赤潮）；（3）有机物污染（需氧有机物消耗水中溶解氧）；（4）酸碱盐污染。\n\n土壤污染：重金属、农药、化肥、固体废弃物等。\n\n环境保护措施：\n（1）工业废气处理：碱液吸收 SO₂ 和 NOx（SO₂ + 2NaOH → Na₂SO₃ + H₂O）。\n（2）污水处理：物理法（沉淀、过滤）、化学法（中和、氧化还原）、生物法（活性污泥法）。\n（3）固体废弃物处理：分类回收、填埋、焚烧、堆肥。\n\n绿色化学的核心思想：从源头上减少或消除污染，实现'原子经济性'。绿色化学的目标是使原料中的所有原子全部转化为目标产物，不产生副产物和废弃物。\n\n原子利用率（原子经济性）：\n原子利用率 =（期望产物的质量 / 全部生成物的质量）× 100%\n\n不同反应类型的原子利用率：\n（1）加成反应：原子利用率可达 100%（所有原子都进入目标产物）。如 CH₂=CH₂ + H₂O → CH₃CH₂OH，原子利用率 100%。\n（2）取代反应、消去反应、缩合反应：原子利用率低于 100%（有副产物生成）。如 CH₃COOH + C₂H₅OH → CH₃COOC₂H₅ + H₂O，原子利用率 = 88/130 × 100% ≈ 67.7%。\n\n【老师提醒】原子利用率越高，越符合绿色化学理念。加成反应原子利用率最高（100%），是理想的绿色反应类型。计算原子利用率时，分母是全部生成物的质量（包括期望产物和副产物），不包括过量的反应物。\n\nCO₂ 是温室气体但不属于大气污染物（不直接危害人体健康，也不导致酸雨）。"}], "exam_points": [{"title": "金属冶炼方法", "content": "根据金属活动性选择冶炼方法：活泼金属（K、Na、Ca、Mg、Al）→ 电解法；中等活泼金属（Zn、Fe、Sn、Pb、Cu）→ 热还原法（C、CO、H₂ 作还原剂）；不活泼金属（Hg、Ag）→ 热分解法。注意：铝只能用电解法，铁用 CO 热还原。"}, {"title": "海水资源利用", "content": "海水提镁流程（沉淀→酸溶→电解）、海水提溴流程（Cl₂ 置换→SO₂ 吸收→Cl₂ 再氧化）、海水淡化方法（蒸馏、反渗透）。注意海水提溴中 SO₂ 吸收 Br₂ 的目的是富集溴（将稀溴水转化为 HBr，再氧化浓缩）。"}, {"title": "绿色化学与原子利用率", "content": "原子利用率 = 期望产物质量 / 全部产物质量 × 100%。加成反应原子利用率最高（100%），最符合绿色化学。取代/消去/缩合反应有副产物，原子利用率 < 100%。计算时分母是全部生成物质量（含副产物），不含过量反应物。"}, {"title": "化石燃料综合利用", "content": "煤：干馏（化学变化，得焦炭/煤焦油/焦炉气）、气化（C+H₂O→CO+H₂）、液化。石油：分馏（物理变化）、裂化（化学变化，提高汽油产量）、裂解（化学变化，获得乙烯等化工原料）。天然气主要成分 CH₄。"}], "examples": [{"title": "金属冶炼方法选择（基础题）", "question": "工业上冶炼铝、铁、汞分别用什么方法？为什么？写出相关化学方程式。", "analysis": "根据金属活动性顺序选择冶炼方法：\n\n（1）铝（Al）：很活泼的金属，其氧化物 Al₂O₃ 非常稳定，热还原法难以还原，只能用电解法。\n化学方程式：2Al₂O₃（熔融）→（电解，冰晶石）4Al + 3O₂↑\n冰晶石（Na₃AlF₆）的作用是降低 Al₂O₃ 的熔点（Al₂O₃ 熔点高达 2072℃，加冰晶石后降至约 1000℃，节省能源）。\n\n（2）铁（Fe）：中等活泼金属，其氧化物可被还原剂（CO）在高温下还原，用热还原法。\n化学方程式：Fe₂O₃ + 3CO →（高温）2Fe + 3CO₂\n这是高炉炼铁的主要反应。CO 由焦炭与 O₂ 反应生成（C + O₂ → CO₂，CO₂ + C → 2CO）。\n\n（3）汞（Hg）：不活泼金属，其氧化物 HgO 受热易分解，用热分解法。\n化学方程式：2HgO →（加热）2Hg + O₂↑\n\n规律总结：金属越活泼，其化合物越稳定，冶炼越困难，需要越强的还原手段（电解 > 热还原 > 热分解）。", "answer": "铝：电解法，2Al₂O₃（熔融）→ 4Al + 3O₂↑（冰晶石降低熔点，因为 Al 活泼其氧化物稳定）。铁：热还原法，Fe₂O₃ + 3CO →（高温）2Fe + 3CO₂（CO 作还原剂）。汞：热分解法，2HgO →（加热）2Hg + O₂↑（HgO 受热易分解）。"}, {"title": "原子利用率计算（基础题）", "question": "比较下列两个制取环氧乙烷（C₂H₄O）反应的原子利用率：（1）CH₂=CH₂ + 氯水 → ClCH₂CH₂OH，再与 Ca(OH)₂ 反应：ClCH₂CH₂OH + Ca(OH)₂ → C₂H₄O + CaCl₂ + H₂O；（2）CH₂=CH₂ + O₂ →（催化剂）C₂H₄O。哪个更符合绿色化学理念？", "analysis": "计算两个反应的原子利用率（原子利用率 = 期望产物质量 / 全部产物质量 × 100%）。\n\n（1）两步法：\n第一步：CH₂=CH₂ + Cl₂ + H₂O → ClCH₂CH₂OH + HCl\n第二步：ClCH₂CH₂OH + Ca(OH)₂ → C₂H₄O + CaCl₂ + 2H₂O\n总反应：CH₂=CH₂ + Cl₂ + Ca(OH)₂ → C₂H₄O + CaCl₂ + 2H₂O + HCl\n期望产物：C₂H₄O，M = 44\n全部产物：C₂H₄O(44) + CaCl₂(111) + 2H₂O(36) + HCl(36.5) = 227.5\n原子利用率 = 44/227.5 × 100% ≈ 19.3%\n\n（2）催化氧化法：\n2CH₂=CH₂ + O₂ →（催化剂）2C₂H₄O\n期望产物：C₂H₄O，全部产物只有 C₂H₄O（加成反应，无副产物）\n原子利用率 = 44/44 × 100% = 100%\n\n比较：反应（2）的原子利用率（100%）远高于反应（1）（约 19.3%），反应（2）更符合绿色化学理念。因为反应（2）是加成反应，所有原子都进入了目标产物，不产生废弃物；而反应（1）产生了大量副产物（CaCl₂、HCl、H₂O），原子利用率低。", "answer": "反应（1）原子利用率 ≈ 19.3%（有 CaCl₂、HCl、H₂O 等副产物）。反应（2）原子利用率 = 100%（加成反应，无副产物）。反应（2）更符合绿色化学理念。"}, {"title": "海水提镁流程（中档题）", "question": "简述海水提镁的工业流程，写出主要化学方程式。为什么不用海水直接电解制镁？", "analysis": "海水提镁的工业流程：\n\n第一步：从海水中沉淀镁。向海水（含 Mg²⁺）中加入石灰乳（Ca(OH)₂），生成 Mg(OH)₂ 沉淀。\n化学方程式：MgCl₂ + Ca(OH)₂ → Mg(OH)₂↓ + CaCl₂\n（实际海水中 Mg²⁺ 浓度低，需大量海水，石灰乳来源：贝壳 CaCO₃ → CaO → Ca(OH)₂）\n\n第二步：将 Mg(OH)₂ 沉淀过滤后加盐酸溶解，转化为 MgCl₂ 溶液。\n化学方程式：Mg(OH)₂ + 2HCl → MgCl₂ + 2H₂O\n\n第三步：将 MgCl₂ 溶液蒸发结晶得到 MgCl₂·6H₂O，再在 HCl 气流中加热脱水（防止 MgCl₂ 水解）得到无水 MgCl₂。\n\n第四步：电解熔融 MgCl₂ 制得金属镁。\n化学方程式：MgCl₂（熔融）→（电解）Mg + Cl₂↑\n\n为什么不直接电解海水制镁：\n（1）海水中 Mg²⁺ 浓度太低，直接电解不经济；\n（2）海水中含大量 NaCl 等其他电解质，电解时 Na⁺ 会先放电（Na⁺ 放电能力不如 Mg²⁺，但在水溶液中 Mg²⁺ 会水解），无法得到纯镁；\n（3）在水溶液中电解会产生 H₂ 和 O₂（水电解），得不到金属镁（Mg²⁺ 在水溶液中不能被还原为 Mg，因为水的还原电位更低）。\n\n因此必须先富集 Mg²⁺ 为 Mg(OH)₂ 沉淀，再转化为无水 MgCl₂，最后电解熔融 MgCl₂ 制镁。", "answer": "流程：海水加石灰乳沉淀 Mg(OH)₂（MgCl₂ + Ca(OH)₂ → Mg(OH)₂↓ + CaCl₂）→ 加盐酸溶解（Mg(OH)₂ + 2HCl → MgCl₂ + 2H₂O）→ 蒸发结晶脱水得无水 MgCl₂ → 电解熔融 MgCl₂（MgCl₂ → Mg + Cl₂↑）。不直接电解海水因为 Mg²⁺ 浓度低、杂质多、水溶液中不能还原 Mg²⁺ 为 Mg。"}, {"title": "化肥合理使用（中档题）", "question": "某农民将铵态氮肥（NH₄HCO₃）与草木灰混合施用，结果发现肥效降低。请解释原因，写出相关方程式，并提出正确使用建议。", "analysis": "分析铵态氮肥与草木灰混合导致肥效降低的原因：\n\n草木灰的主要成分是 K₂CO₃（碳酸钾），K₂CO₃ 水解使溶液呈碱性：CO₃²⁻ + H₂O ⇌ HCO₃⁻ + OH⁻。\n\n铵态氮肥 NH₄HCO₃ 含有 NH₄⁺，在碱性条件下 NH₄⁺ 与 OH⁻ 反应生成 NH₃·H₂O，NH₃·H₂O 不稳定分解为 NH₃ 气体逸出：\nNH₄⁺ + OH⁻ → NH₃·H₂O → NH₃↑ + H₂O\n\nNH₃ 气体逸出到空气中，导致氮元素流失，肥效降低。\n\n相关方程式：\nK₂CO₃ 水解：CO₃²⁻ + H₂O ⇌ HCO₃⁻ + OH⁻\nNH₄⁺ 与 OH⁻ 反应：NH₄⁺ + OH⁻ → NH₃↑ + H₂O\n\n正确使用建议：\n（1）铵态氮肥（含 NH₄⁺ 的化肥如 NH₄HCO₃、(NH₄)₂SO₄、NH₄Cl、NH₄NO₃）不能与碱性物质（如草木灰、石灰、石灰氮等）混合施用。\n（2）铵态氮肥应深施覆土，减少 NH₃ 的挥发损失。\n（3）最好在阴天或傍晚施用，避免阳光直射导致氮肥分解（NH₄HCO₃ 受热易分解：NH₄HCO₃ → NH₃↑ + CO₂↑ + H₂O）。\n（4）施肥后及时浇水，使肥料溶解渗入土壤。", "answer": "原因：草木灰（K₂CO₃）水解呈碱性（CO₃²⁻ + H₂O ⇌ HCO₃⁻ + OH⁻），NH₄⁺ 与 OH⁻ 反应生成 NH₃ 逸出（NH₄⁺ + OH⁻ → NH₃↑ + H₂O），导致氮元素流失。建议：铵态氮肥不能与碱性物质混用，应深施覆土，阴天施用，施肥后及时浇水。"}, {"title": "环境保护综合（高考模拟题）", "question": "某工厂排放的废气中含有 SO₂ 和 NO₂，请设计两种化学方法处理这些废气，写出化学方程式。并从绿色化学角度分析哪种方法更好。", "analysis": "处理含 SO₂ 和 NO₂ 废气的化学方法：\n\n方法一：碱液吸收法\n用 NaOH 溶液吸收：\nSO₂ + 2NaOH → Na₂SO₃ + H₂O\n2NO₂ + 2NaOH → NaNO₃ + NaNO₂ + H₂O\n优点：吸收效果好，操作简单。缺点：消耗大量 NaOH，产生的盐溶液需要进一步处理。\n\n用氨水吸收：\nSO₂ + 2NH₃·H₂O → (NH₄)₂SO₃ + H₂O\n(NH₄)₂SO₃ + SO₂ + H₂O → 2NH₄HSO₃\nNO₂ + NH₃ → N₂ + 3H₂O（还原反应）\n优点：可回收利用产物（亚硫酸铵可作化肥），变废为宝。\n\n方法二：氨-酸法（双碱法）\n先用氨水吸收 SO₂ 生成亚硫酸铵，再用硫酸处理生成高浓度 SO₂ 和硫酸铵：\n(NH₄)₂SO₃ + H₂SO₄ → (NH₄)₂SO₄ + SO₂↑ + H₂O\n产物 (NH₄)₂SO₄ 是硫酸铵化肥，SO₂ 可循环用于制硫酸。\n\n从绿色化学角度分析：\n氨-酸法更好。因为：（1）废气中的 SO₂ 被转化为有用产品（硫酸铵化肥），实现了废物资源化利用；（2）SO₂ 可循环利用制硫酸，减少资源浪费；（3）产生的二次污染少。而单纯碱液吸收法虽然能去除废气，但产生了含盐废水需要进一步处理，没有实现资源化利用。\n\n绿色化学的核心是'从源头消除污染'和'原子经济性'，最好的方法是将污染物转化为有价值的化学品，实现变废为宝。", "answer": "方法一：碱液吸收法，SO₂ + 2NaOH → Na₂SO₃ + H₂O，2NO₂ + 2NaOH → NaNO₃ + NaNO₂ + H₂O。方法二：氨-酸法，SO₂ + 2NH₃·H₂O → (NH₄)₂SO₃ + H₂O，再 (NH₄)₂SO₃ + H₂SO₄ → (NH₄)₂SO₄ + SO₂↑ + H₂O。氨-酸法更符合绿色化学（产物可作化肥，SO₂ 循环利用，变废为宝）。"}]}]}]}, {"subject": "生物", "books": [{"name": "必修1 分子与细胞", "chapters": [{"id": "bi_1_1", "title": "第1章 走近细胞", "summary": "认识细胞学说的建立、原核细胞与真核细胞的区别及生命系统的结构层次。", "knowledge": [{"title": "细胞学说", "content": "由施莱登和施旺提出。要点：一切动植物都由细胞和细胞产物构成；细胞是一个有机体；新细胞由老细胞产生。意义：揭示了生物界的统一性和生物进化的统一性。"}, {"title": "原核细胞与真核细胞", "content": "根本区别是有无以核膜为界限的细胞核。原核生物：细菌、蓝细菌（蓝藻）、支原体、衣原体等，无成形细胞核（拟核，环状 DNA），只有核糖体一种细胞器。蓝藻能光合作用（含叶绿素和藻蓝素）。真核生物：动物、植物、真菌、原生生物。"}, {"title": "生命系统层次", "content": "细胞→组织→器官→系统→个体→种群→群落→生态系统→生物圈。细胞是基本的生命系统；病毒无细胞结构，必须寄生在活细胞内。"}, {"title": "细胞学说与显微镜", "content": "列文虎克观察活细胞，罗伯特·胡克命名 cell。细胞学说在显微镜发明后才建立，体现了技术推动科学。"}], "exam_points": [{"title": "原核生物判断", "content": "区分原核与真核生物；蓝藻、细菌的特征。"}, {"title": "生命系统层次", "content": "判断各层次关系；单细胞生物的层次。"}, {"title": "病毒", "content": "病毒的结构与增殖特点。"}], "examples": [{"title": "分类判断", "question": "下列属于原核生物的是：酵母菌、乳酸菌、蓝藻、草履虫。", "分析": "酵母菌真菌、草履虫原生生物为真核；乳酸菌细菌、蓝藻为原核。", "answer": "乳酸菌和蓝藻是原核生物。酵母菌（真菌）和草履虫（原生生物）为真核生物。"}, {"title": "蓝藻", "question": "蓝藻为什么能自养？", "分析": "蓝藻虽无叶绿体但含光合色素。", "answer": "蓝藻含叶绿素和藻蓝素，能进行光合作用合成有机物，故能自养；它没有叶绿体，色素分布在光合片层上。"}]}, {"id": "bi_1_2", "title": "第2章 组成细胞的分子", "summary": "学习组成细胞的元素和化合物：水、无机盐、糖类、脂质、蛋白质、核酸。", "knowledge": [{"title": "元素与化合物", "content": "大量元素 C、H、O、N、P、S、K、Ca、Mg；微量元素 Fe、Mn、Zn、Cu、B、Mo。C 是最基本元素，O 最多。活细胞中含量最多的是水（约 85%），干重中最多的是蛋白质。"}, {"title": "蛋白质", "content": "基本单位氨基酸（约 20 种），结构通式有共同特点。氨基酸脱水缩合形成肽键（—CO—NH—），形成多肽链。蛋白质结构多样性的原因：氨基酸种类、数目、排列顺序、空间结构。功能：催化（酶）、运输、调节、免疫、结构等。"}, {"title": "核酸", "content": "DNA 和 RNA，基本单位核苷酸（磷酸+五碳糖+含氮碱基）。DNA 主要在细胞核（少量线粒体叶绿体），RNA 主要在细胞质。甲基绿吡罗红染色：DNA 绿色，RNA 红色。核酸是遗传信息的载体。"}, {"title": "糖类与脂质", "content": "糖类主要能源（葡萄糖）、储能（淀粉、糖原）、结构（纤维素）。脂质：脂肪储能保温、磷脂构成膜、固醇（胆固醇、性激素、维生素D）。"}, {"title": "水与无机盐", "content": "水：自由水（95.5%）参与代谢、运输，结合水（4.5%）组成细胞结构。自由水/结合水比值升高代谢增强。无机盐多以离子形式存在，构成化合物（Fe 血红蛋白、Mg 叶绿素）或维持渗透压酸碱平衡。"}], "exam_points": [{"title": "蛋白质计算", "content": "氨基酸数、肽键数、脱水数（n−1）、分子量计算（na−(n−1)×18）。"}, {"title": "物质鉴定", "content": "还原糖（斐林试剂，砖红）、蛋白质（双缩脲，紫）、脂肪（苏丹Ⅲ，橘黄）、淀粉（碘，蓝）。"}, {"title": "水盐作用", "content": "自由水结合水转换；无机盐作用。"}], "examples": [{"title": "蛋白质计算", "question": "由 20 个氨基酸组成的一条肽链，含肽键多少个？至少含游离氨基多少个？", "分析": "肽键数=氨基酸数−1；至少含游离氨基数=肽链数。", "answer": "肽键数=20−1=19 个；一条肽链至少含 1 个游离氨基（—NH₂）和 1 个游离羧基（—COOH）。"}, {"title": "物质鉴定", "question": "鉴定梨汁中是否含还原糖用什么试剂？现象如何？", "分析": "还原糖与斐林试剂在水浴加热下产生砖红色沉淀。", "answer": "用斐林试剂（现配现用），50~65℃水浴加热，出现砖红色沉淀说明含还原糖。"}]}, {"id": "bi_1_3", "title": "第3章 细胞的基本结构", "summary": "学习细胞膜、细胞器与细胞核的结构和功能。", "knowledge": [{"title": "细胞膜", "content": "成分：脂质（磷脂为主）约 50%、蛋白质约 40%、糖类。功能：将细胞与外界分隔、控制物质进出、进行细胞间信息交流。流动镶嵌模型：磷脂双分子层基本支架，蛋白质镶嵌贯穿，糖蛋白（糖被）有识别保护作用。膜具有流动性（结构）和选择透过性（功能）。"}, {"title": "细胞器", "content": "线粒体（有氧呼吸主要场所，双层膜）、叶绿体（光合作用，双层膜，植物）、内质网（蛋白质脂质合成）、高尔基体（加工分泌，植物细胞壁形成）、核糖体（合成蛋白质，无膜）、溶酶体（分解）、液泡（植物，维持渗透压）。中心体（动物低等植物，无膜，与细胞分裂有关）。"}, {"title": "细胞核", "content": "结构：核膜（双层膜，核孔大分子出入）、染色质（DNA+蛋白质，与染色体同物质）、核仁、核基质。功能：遗传信息库、细胞代谢遗传的控制中心。"}, {"title": "生物膜系统", "content": "细胞器膜、核膜、细胞膜结构联系功能协调，称为生物膜系统。"}, {"title": "实验", "content": "观察叶绿体（黑藻叶片）、观察线粒体（人口腔上皮，健那绿染液蓝绿色）。"}], "exam_points": [{"title": "细胞器功能", "content": "根据功能判断细胞器；分泌蛋白合成运输途径（核糖体→内质网→高尔基体→囊泡→细胞膜）。"}, {"title": "细胞膜功能", "content": "流动性与选择透过性的区别与实例（吞噬、变形运动体现流动性）。"}, {"title": "细胞核", "content": "克隆实验证明细胞核的作用。"}], "examples": [{"title": "分泌蛋白", "question": "分泌蛋白合成并分泌到细胞外经过哪些细胞结构？需要哪些细胞器？", "分析": "分泌蛋白经核糖体合成、内质网粗加工、高尔基体再加工分泌。", "answer": "依次经过核糖体→内质网→高尔基体→细胞膜（囊泡融合）；所需细胞器为核糖体、内质网、高尔基体、线粒体（供能）。"}, {"title": "膜的特性", "question": "细胞膜的流动性与选择透过性有何关系？", "分析": "结构决定功能。", "answer": "流动性是膜的结构特性（磷脂和蛋白质运动），选择透过性是功能特性。流动性是选择透过性的基础，物质跨膜运输依赖膜的流动性。"}]}, {"id": "bi_1_4", "title": "第4章 细胞的物质输入和输出", "summary": "学习渗透作用、细胞的吸水失水及物质跨膜运输的方式。", "knowledge": [{"title": "渗透作用", "content": "水分子等溶剂分子透过半透膜从低浓度向高浓度扩散。发生条件：半透膜、浓度差。成熟植物细胞的原生质层（细胞膜+液泡膜+二者间细胞质）相当于半透膜，当外界溶液浓度大于细胞液浓度时细胞失水发生质壁分离。"}, {"title": "质壁分离与复原", "content": "外界溶液浓度>细胞液，细胞失水质壁分离；细胞仍存活（用一定浓度蔗糖溶液）。若放回清水，细胞吸水质壁分离复原。质壁分离可用于判断细胞死活、测定细胞液浓度。"}, {"title": "物质跨膜运输方式", "content": "自由扩散：高→低，不耗能不需载体（O₂、CO₂、水、甘油、乙醇、脂溶性维生素）。协助扩散：高→低，需载体不耗能（葡萄糖进红细胞、离子）。主动运输：低→高，需载体耗能（肠吸收葡萄糖、离子），保证细胞按需选择性吸收。胞吞胞吐：大分子，耗能，依赖膜流动性。"}], "exam_points": [{"title": "质壁分离", "content": "判断质壁分离及复原条件；细胞死活判断。"}, {"title": "运输方式判断", "content": "根据方向、载体、能量判断三种运输方式。"}, {"title": "曲线", "content": "运输速率与浓度、氧气浓度关系曲线分析。"}], "examples": [{"title": "运输方式", "question": "K⁺ 进入小肠绒毛上皮细胞、红细胞吸收葡萄糖分别属于哪种运输方式？", "分析": "看是否需要载体和能量、是否顺浓度梯度。", "answer": "K⁺ 进入小肠上皮细胞是从低浓度到高浓度，需载体耗能，为主动运输；红细胞吸收葡萄糖是顺浓度梯度需载体不耗能，为协助扩散。"}, {"title": "质壁分离", "question": "将洋葱表皮细胞放入 0.3 g/mL 蔗糖溶液中会发生什么？换入清水后呢？", "分析": "蔗糖浓度大于细胞液，细胞失水；清水中吸水复原。", "answer": "发生质壁分离（原生质层与细胞壁分离，细胞皱缩）；换入清水后细胞吸水，发生质壁分离复原。说明该细胞是活的。"}]}, {"id": "bi_1_5", "title": "第5章 细胞的能量供应和利用", "summary": "学习酶、ATP、细胞呼吸与光合作用，理解细胞代谢的能量供应。", "knowledge": [{"title": "酶", "content": "酶是活细胞产生具有催化作用的有机物，大多数是蛋白质，少数是 RNA。特性：高效性、专一性、作用条件温和。影响酶活性因素：温度、pH（最适值）、底物浓度。酶促反应需适宜温度 pH。"}, {"title": "ATP", "content": "三磷酸腺苷，结构简式 A-P~P~P，~ 代表高能磷酸键。ATP 与 ADP 相互转化：ATP⇌ADP+Pi+能量。ATP 是细胞内主要能源物质，直接供能。合成场所：叶绿体、线粒体、细胞质基质。"}, {"title": "细胞呼吸", "content": "有氧呼吸三阶段：①细胞质基质，糖酵解，葡萄糖→丙酮酸+[H]，少量 ATP；②线粒体基质，丙酮酸+水→CO₂+[H]，少量 ATP；③线粒体内膜，[H]+O₂→水，大量 ATP。总反应：C₆H₁₂O₆+6O₂+6H₂O→6CO₂+12H₂O+能量。无氧呼吸：葡萄糖→乳酸（动物、乳酸菌）或酒精+CO₂（酵母菌、植物）。"}, {"title": "光合作用", "content": "光反应（类囊体薄膜）：水的光解产 [H] 和 O₂，合成 ATP。暗反应（叶绿体基质）：CO₂ 固定（C₃）和 C₃ 还原（CH₂O），消耗 ATP 和 [H]。总反应：6CO₂+12H₂O—光/叶绿体→C₆H₁₂O₆+6O₂+6H₂O。影响因素：光照强度、CO₂ 浓度、温度、水、矿质元素。"}, {"title": "实验", "content": "探究酵母菌细胞呼吸方式（产物检测）；绿叶中色素提取分离（无水乙醇提取，纸层析分离，4 种色素带）。"}], "exam_points": [{"title": "酶实验设计", "content": "探究温度/pH 对酶活性的影响，控制变量；酶高效性专一性实验。"}, {"title": "呼吸作用", "content": "有氧无氧呼吸过程及场所、产物、能量；呼吸速率测定。"}, {"title": "光合作用", "content": "光暗反应关系；影响光合因素；光合与呼吸综合曲线（CO₂ 吸收释放、有机物积累）。"}], "examples": [{"title": "光合呼吸综合", "question": "一昼夜中植物有机物积累量如何计算？", "分析": "净光合=总光合−呼吸消耗。", "answer": "一昼夜有机物积累量=白天光合作用合成有机物量−昼夜呼吸作用消耗有机物量。用 CO₂ 吸收量表示时，积累量=白天净吸收 CO₂−夜间释放 CO₂。"}, {"title": "酶特性", "question": "设计实验验证酶的高效性，如何设置对照组？", "分析": "比较酶与无机催化剂的催化效率。", "answer": "对照组加 FeCl₃ 溶液（Fe³⁺ 为无机催化剂），实验组加过氧化氢酶，加入等量 H₂O₂ 溶液，相同条件下比较产生气泡（O₂）速率，酶组明显更快，证明酶具有高效性。"}]}, {"id": "bi_1_6", "title": "第6章 细胞的生命历程", "summary": "学习细胞增殖、分化、衰老凋亡与癌变。", "knowledge": [{"title": "细胞增殖", "content": "真核细胞分裂方式：有丝分裂、无丝分裂、减数分裂。有丝分裂意义：保证亲、子代细胞染色体数目相同，遗传稳定。细胞周期：分裂间期（G1、S、G2，DNA 复制有关蛋白质合成，占 90%~95%）+分裂期（前、中、后、末）。"}, {"title": "有丝分裂", "content": "动物细胞：前期两消两现（核膜核仁消失，染色体纺锤体出现）；中期染色体着丝粒排列赤道板，观察最佳；后期着丝粒分裂染色体加倍移向两极；末期两现两消。植物细胞形成细胞板，动物细胞缢裂。"}, {"title": "细胞分化", "content": "细胞分化是基因的选择性表达，产生不同形态结构功能的细胞。分化是持久的、不可逆的（一般情况下）。全能性：已分化细胞仍具有发育成完整个体的潜能（植物组织培养、动物克隆）。"}, {"title": "衰老凋亡与癌变", "content": "细胞衰老特征：水分减少、酶活性降低、色素积累、核增大、膜透性改变。细胞凋亡是基因决定的程序性死亡（有利）。细胞癌变：原癌基因和抑癌基因突变，细胞恶性增殖。癌细胞特征：无限增殖、形态结构变化、表面糖蛋白减少易扩散。"}], "exam_points": [{"title": "有丝分裂", "content": "各时期染色体、DNA、染色单体数目变化；图像识别；曲线分析。"}, {"title": "分化与全能性", "content": "分化的本质；全能性表现条件。"}, {"title": "癌变", "content": "致癌因子；癌细胞特征；原癌抑癌基因作用。"}], "examples": [{"title": "数目变化", "question": "某二倍体生物体细胞含 4 条染色体，有丝分裂后期细胞中染色体、染色单体、DNA 数目分别是？", "分析": "后期着丝粒分裂，染色体加倍，染色单体为 0，DNA 数=染色体数。", "answer": "后期着丝粒分裂，染色体数=4×2=8 条，染色单体=0，DNA 数=8 个。"}, {"title": "分化", "question": "细胞分化过程中遗传物质是否改变？", "分析": "分化是基因选择性表达。", "answer": "细胞分化过程中遗传物质（DNA）不发生改变，是基因的选择性表达使不同细胞合成不同蛋白质，从而表现不同形态功能。"}]}]}, {"name": "必修2 遗传与进化", "chapters": [{"id": "bi_2_1", "title": "第1章 遗传因子的发现", "summary": "学习孟德尔杂交实验，掌握分离定律与自由组合定律。", "knowledge": [{"title": "遗传术语", "content": "性状、相对性状、显性性状、隐性性状、性状分离。基因（遗传因子）、等位基因、显性基因、隐性基因。基因型、表现型。纯合子、杂合子。杂交、自交、测交。"}, {"title": "分离定律", "content": "一对相对性状的杂交：P DD×dd→F1 Dd（显性）→F1 自交→F2 性状分离比 3:1。分离定律：在形成配子时，成对的遗传因子发生分离，分别进入不同配子。测交 F1×dd→后代表现型比 1:1。"}, {"title": "自由组合定律", "content": "两对（或多对）相对性状的遗传：F1 自交 F2 表现型比 9:3:3:1。自由组合定律：形成配子时，决定同一性状的成对遗传因子彼此分离，不同性状的遗传因子自由组合。条件：非同源染色体上非等位基因。"}, {"title": "孟德尔成功原因", "content": "选材豌豆（自花传粉闭花受粉、有明显相对性状）；由单因素到多因素；统计分析；假说演绎法。"}], "exam_points": [{"title": "概率计算", "content": "杂交子代基因型表现型及比例；基因型频率计算（9:3:3:1 变式）。"}, {"title": "遗传图解", "content": "书写规范的遗传图解（含 P、配子、F、比例）。"}, {"title": "实验设计", "content": "判断显隐性的杂交设计；纯合杂合判断（测交、自交）。"}], "examples": [{"title": "分离定律", "question": "杂合子 Aa 连续自交 n 代后，子代中纯合子比例为？", "分析": "每代自交纯合子比例增加，杂合子每代减半。", "answer": "Aa 自交 n 代后杂合子比例为 (1/2)ⁿ，纯合子比例为 1−(1/2)ⁿ。"}, {"title": "自由组合", "question": "基因型 AaBb 的个体自交，后代中表现型为 A_bb 的概率？", "分析": "拆分两对基因分别计算。", "answer": "Aa 自交 A_ 概率 3/4，Bb 自交 bb 概率 1/4，故 A_bb 概率=3/4×1/4=3/16。"}]}, {"id": "bi_2_2", "title": "第2章 基因和染色体的关系", "summary": "学习减数分裂、受精作用及伴性遗传。", "knowledge": [{"title": "减数分裂", "content": "特殊有丝分裂，DNA 复制一次，细胞连续分裂两次，产生 4 个染色体数减半的生殖细胞。减数第一次分裂：同源染色体分离（同源染色体配对、四分体、交叉互换），非同源染色体自由组合。减数第二次分裂：类似有丝分裂，着丝粒分裂。"}, {"title": "受精作用", "content": "精子和卵细胞融合形成受精卵，染色体数目恢复为 2n。受精卵中核遗传物质一半来自父方一半来自母方，细胞质几乎全部来自卵细胞。减数分裂与受精作用维持前后代染色体数目恒定。"}, {"title": "基因在染色体上", "content": "萨顿假说（基因与染色体行为平行，类比推理）；摩尔根果蝇实验证明基因在染色体上。一条染色体上有许多基因，基因在染色体上呈线性排列。"}, {"title": "伴性遗传", "content": "性染色体上的基因遗传与性别相关联。X 染色体隐性遗传（色盲、血友病）：男多于女，交叉遗传（母→子）。X 染色体显性遗传：女多于男。Y 染色体遗传（只在男性）。"}, {"title": "实验", "content": "观察细胞减数分裂装片（蝗虫精巢）。"}], "exam_points": [{"title": "减数分裂", "content": "各时期染色体、DNA、染色单体数目变化；图像识别；与有丝分裂比较。"}, {"title": "伴性遗传", "content": "色盲遗传特点与概率计算；遗传系谱图分析。"}, {"title": "综合", "content": "基因自由组合与减数分裂联系。"}], "examples": [{"title": "减数分裂", "question": "一个精原细胞（2n）经减数分裂产生几种精子？一个卵原细胞产生几个卵细胞？", "分析": "精原细胞减数分裂产生 4 个精子 2 种（若不考虑交叉互换）。", "answer": "一个精原细胞经减数分裂产生 4 个精子，基因型 2 种（2 个一种 2 个另一种）；一个卵原细胞产生 1 个卵细胞和 3 个极体（卵细胞 1 种）。"}, {"title": "色盲", "question": "色盲男子的女儿都正常（其妻正常非携带者），他的色盲基因传给外孙的概率？", "分析": "X 染色体隐性遗传，交叉遗传。", "answer": "色盲男子 XᵇY，妻子 XᴮXᴮ，女儿全为携带者 XᴮXᵇ，女儿的儿子有 1/2 概率色盲，故色盲基因传给外孙的概率为 1/2。"}]}, {"id": "bi_2_3", "title": "第3章 基因的本质", "summary": "证明 DNA 是主要遗传物质，学习 DNA 的结构与复制。", "knowledge": [{"title": "DNA 是遗传物质", "content": "肺炎双球菌转化实验（格里菲思体内转化，艾弗里体外转化证明 DNA 是转化因子）；噬菌体侵染细菌实验（赫尔希蔡斯，同位素标记 ³²P 标 DNA、³⁵S 标蛋白质，证明 DNA 是遗传物质）。DNA 是主要遗传物质（RNA 病毒中 RNA 是遗传物质）。"}, {"title": "DNA 结构", "content": "规则双螺旋：两条链反向平行，磷酸脱氧核糖交替连接为基本骨架在外侧，碱基在内侧。碱基互补配对 A=T、G≡C。查加夫法则：A=T、G=C。双螺旋结构由沃森克里克提出。"}, {"title": "DNA 复制", "content": "时间：有丝分裂间期、减数第一次分裂间期。场所：主要在细胞核。过程：解旋酶解旋→以母链为模板合成子链→形成两个相同 DNA。条件：模板、原料（4 种脱氧核苷酸）、酶（解旋酶、DNA 聚合酶）、能量。特点：边解旋边复制、半保留复制。"}, {"title": "实验", "content": "DNA 半保留复制的证据（梅塞尔森斯塔尔，密度梯度离心，¹⁵N/¹⁴N 实验）。"}], "exam_points": [{"title": "实验证据", "content": "噬菌体侵染实验操作与结论；转化实验。"}, {"title": "碱基计算", "content": "碱基互补配对原则计算（A=T、G=C，A+G=T+C 等）；双链单链比例。"}, {"title": "DNA 复制", "content": "复制过程、条件、特点；半保留复制计算（n 代后含 ¹⁵N 的比例）。"}], "examples": [{"title": "碱基计算", "question": "某 DNA 分子中胞嘧啶占 20%，求腺嘌呤比例。", "分析": "碱基互补配对 C=G=20%，A=T。", "answer": "C=G=20%，故 C+G=40%，A+T=60%，A=T=30%，腺嘌呤占 30%。"}, {"title": "半保留复制", "question": "含 ¹⁵N 的 DNA 在 ¹⁴N 培养基复制 2 代，含 ¹⁵N 的 DNA 占总 DNA 比例？", "分析": "半保留复制，原母链始终在两条 DNA 中。", "answer": "复制 2 代产生 4 个 DNA，其中只有 2 个含 ¹⁵N（均含一条 ¹⁵N 链一条 ¹⁴N 链），比例=2/4=50%。"}]}, {"id": "bi_2_4", "title": "第4章 基因的表达", "summary": "学习转录、翻译与中心法则，理解基因如何控制性状。", "knowledge": [{"title": "转录", "content": "在细胞核内，以 DNA 一条链为模板合成 RNA 的过程。模板：DNA 一条链；原料：4 种核糖核苷酸；酶：RNA 聚合酶；产物：mRNA。碱基互补配对（A-U）。"}, {"title": "翻译", "content": "在核糖体上，以 mRNA 为模板合成蛋白质的过程。密码子：mRNA 上 3 个相邻碱基决定 1 个氨基酸（64 个密码子，其中 3 个终止密码子不编码氨基酸）。tRNA 携带氨基酸，反密码子与密码子配对。"}, {"title": "中心法则", "content": "描述遗传信息流动：DNA→DNA（复制）、DNA→RNA（转录）、RNA→蛋白质（翻译）；补充 RNA→RNA（RNA 复制）、RNA→DNA（逆转录，HIV）。"}, {"title": "基因与性状", "content": "基因通过控制酶的合成控制代谢从而控制性状，或通过控制蛋白质结构直接控制性状。一个基因可影响多个性状，一个性状可受多个基因影响。表观遗传（DNA 甲基化）使表型变化可遗传但 DNA 序列不变。"}], "exam_points": [{"title": "转录翻译", "content": "过程比较；碱基互补配对的对应关系（DNA 模板链、mRNA、tRNA）。"}, {"title": "计算", "content": "基因碱基数:氨基酸数:密码子数=6:1:1（考虑终止密码子）。"}, {"title": "中心法则", "content": "各类生物的遗传信息流动。"}], "examples": [{"title": "碱基对应", "question": "某基因片段为 …ATGC…（非模板链），转录出的 mRNA 上的相应序列是？", "分析": "非模板链（编码链）与 mRNA 序列一致（T 换 U）。", "answer": "非模板链与 mRNA 碱基序列相同（除 T/U），故 mRNA 序列为 …AUGC…。"}, {"title": "数目关系", "question": "合成含 100 个氨基酸的多肽，控制它的基因至少含多少个碱基？", "分析": "1 个氨基酸对应 1 个密码子（3 碱基），基因双链。", "answer": "100 个氨基酸对应 100 个密码子（mRNA 上 300 个碱基），基因双链故至少 600 个碱基（还需考虑终止密码子，故实际至少 603 个）。"}]}, {"id": "bi_2_5", "title": "第5章 基因突变及其他变异", "summary": "学习基因突变、基因重组和染色体变异三种可遗传变异。", "knowledge": [{"title": "基因突变", "content": "DNA 分子发生碱基对的替换、增添或缺失，引起基因结构改变。特点：普遍性、随机性、低频性、不定向性、多害少利性。意义：新基因产生的途径，生物变异的根本来源，进化原材料。诱变因素：物理（射线）、化学、生物（病毒）。"}, {"title": "基因重组", "content": "控制不同性状的基因重新组合。类型：自由组合（非同源染色体非等位基因）、交叉互换（同源染色体非姐妹染色单体）。发生于减数分裂。意义：生物变异来源之一，有性生殖后代多样性。"}, {"title": "染色体变异", "content": "染色体结构变异（缺失、重复、倒位、易位）和数目变异。整倍体变异（单倍体、二倍体、多倍体）：多倍体植株大（用秋水仙素处理使染色体加倍）；非整倍体变异（如 21 三体综合征）。"}, {"title": "变异类型比较", "content": "基因突变是基因结构的改变（新基因）；基因重组是基因重新组合（无新基因）；染色体变异是染色体结构数目改变。三者都可遗传，仅基因突变产生新基因。"}], "exam_points": [{"title": "变异判断", "content": "区分三种变异类型及意义。"}, {"title": "基因突变", "content": "碱基变化对蛋白质的影响（替换影响小，增添缺失影响大）。"}, {"title": "育种", "content": "诱变育种、杂交育种、多倍体育种、单倍体育种的原理方法优缺点。"}], "examples": [{"title": "变异判断", "question": "镰刀型细胞贫血症的病因属于哪种变异？", "分析": "血红蛋白基因碱基对替换。", "answer": "镰刀型细胞贫血症是血红蛋白基因上一个碱基对替换（T→A），导致氨基酸改变，属于基因突变。"}, {"title": "育种", "question": "用秋水仙素处理萌发的种子或幼苗可获得多倍体，原理是什么？", "分析": "秋水仙素抑制纺锤体形成。", "answer": "秋水仙素抑制细胞分裂前期纺锤体的形成，使染色体已复制但细胞不能正常分裂，导致染色体数目加倍，从而获得多倍体。"}]}, {"id": "bi_2_6", "title": "第6章 生物的进化", "summary": "学习现代生物进化理论，理解生物进化的原因与生物多样性的形成。", "knowledge": [{"title": "拉马克与达尔文", "content": "拉马克：用进废退、获得性遗传（已被否定）。达尔文自然选择学说：过度繁殖、生存斗争、遗传变异、适者生存。局限：未解释遗传变异本质。"}, {"title": "现代生物进化理论", "content": "种群是生物进化的基本单位；突变和基因重组提供原材料；自然选择决定进化方向；隔离是物种形成的必要条件。种群基因频率改变是进化的实质。"}, {"title": "概念辨析", "content": "种群（同种生物全部个体）、基因库（全部基因）、基因频率（某基因占全部等位基因的比率）、物种（能相互交配产生可育后代）、隔离（生殖隔离、地理隔离）。"}, {"title": "物种形成", "content": "一般过程：地理隔离→不同环境自然选择→基因频率改变→生殖隔离→新物种。突变和基因重组、自然选择、隔离是物种形成三环节。生物多样性包括基因多样性、物种多样性、生态系统多样性。"}], "exam_points": [{"title": "基因频率", "content": "计算基因型频率与基因频率；遗传平衡定律（哈迪温伯格）。"}, {"title": "自然选择", "content": "自然选择作用于表现型；选择决定进化方向。"}, {"title": "物种形成", "content": "隔离与物种形成关系；判断是否新物种（生殖隔离）。"}], "examples": [{"title": "基因频率", "question": "某种群中 AA 占 36%、Aa 占 48%、aa 占 16%，求 A 的基因频率。", "分析": "A 频率=AA+1/2Aa。", "answer": "A 基因频率=36%+48%×1/2=60%，a 基因频率=16%+48%×1/2=40%（或 1−60%=40%）。"}, {"title": "物种形成", "question": "判断生物是否进化和是否形成新物种的标志分别是什么？", "分析": "进化看基因频率，物种看生殖隔离。", "answer": "生物进化的标志是种群基因频率发生改变；新物种形成的标志是产生生殖隔离（不同物种间不能相互交配产生可育后代）。"}]}]}]}];
const COLORS = {"语文": "#b85450", "数学": "#3a76d8", "英语": "#6a4ca0", "物理": "#2e8b57", "化学": "#c0392b", "生物": "#16a085"};
let curChapter = null;
let curTab = 'knowledge';

// localStorage 封装
const LS = {
  get(k, def){ try{ return JSON.parse(localStorage.getItem(k)) ?? def; }catch(e){ return def; } },
  set(k, v){ localStorage.setItem(k, JSON.stringify(v)); }
};
const notes = LS.get('g1_notes', {});      // {chapterId:[{id,title,content,time}]}
const studied = LS.get('g1_studied', {});   // {chapterId:true}
const uid = ()=> Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const now = ()=> { const d=new Date(); const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function br(s){ return esc(s).replace(/\n/g,'<br>'); }

// 构建章节索引
const chapterMap = {};
DATA.forEach(subj=>{
  subj.books.forEach(book=>{
    book.chapters.forEach(ch=>{
      if(!ch.id) ch.id = subj.subject+'_'+book.name+'_'+ch.title;
      chapterMap[ch.id] = {subj, book, ch};
    });
  });
});

// 渲染目录树
function renderTree(){
  const tree = document.getElementById('tree');
  let html = '';
  DATA.forEach((subj,si)=>{
    const color = COLORS[subj.subject] || '#333';
    html += `<div class="subj" id="subj${si}">
      <div class="subj-head" style="color:${color}" onclick="this.parentElement.classList.toggle('open')">
        <span>${esc(subj.subject)}</span><span class="arrow">▶</span>
      </div>`;
    subj.books.forEach((book,bi)=>{
      html += `<div class="book" id="b${si}-${bi}">
        <div class="book-head" onclick="this.parentElement.classList.toggle('open')">
          <span>${esc(book.name)}</span><span class="arrow">▶</span>
        </div><div class="ch-list">`;
      book.chapters.forEach(ch=>{
        const done = studied[ch.id] ? '<span class="done">✓</span>' : '';
        html += `<div class="ch-item" data-id="${ch.id}" onclick="selectChapter('${ch.id}')">
          <span class="dot" style="background:${color}"></span>
          <span style="flex:1">${esc(ch.title)}</span>${done}</div>`;
      });
      html += `</div></div>`;
    });
    html += `</div>`;
  });
  tree.innerHTML = html;
}

function toggleDrawer(){
  document.getElementById('drawer').classList.toggle('show');
  document.getElementById('overlay').classList.toggle('show');
}
function closeDrawer(){
  document.getElementById('drawer').classList.remove('show');
  document.getElementById('overlay').classList.remove('show');
}

function selectChapter(id){
  curChapter = id;
  closeDrawer();
  document.querySelectorAll('.ch-item').forEach(el=>el.classList.toggle('active', el.dataset.id===id));
  renderContent();
}

function updateProg(){
  const total = Object.keys(chapterMap).length;
  const done = Object.keys(studied).filter(k=>studied[k] && chapterMap[k]).length;
  document.getElementById('topProg').textContent = `${done}/${total}`;
}

function renderContent(){
  if(!curChapter){
    document.getElementById('content').innerHTML = `<div class="welcome"><h2>请选择章节</h2><p>点左上角 ☰ 展开目录</p></div>`;
    document.getElementById('topTitle').textContent = '高一学习助手';
    return;
  }
  const {subj,book,ch} = chapterMap[curChapter];
  document.getElementById('topTitle').textContent = subj.subject;
  const tabs = [
    ['knowledge','知识点'],['exam','考点精析'],['examples','典型例题'],['note','我的笔记']
  ].map(([k,t])=>`<div class="tab ${curTab===k?'active':''}" onclick="switchTab('${k}')">${t}</div>`).join('');
  let body = '';
  if(curTab==='knowledge'){
    body = ch.knowledge && ch.knowledge.length ? ch.knowledge.map((k,i)=>
      `<div class="kp"><div class="kp-t">${i+1}. ${esc(k.title)}</div><div>${br(k.content)}</div></div>`).join('')
      : '<div class="empty">暂无内容</div>';
  } else if(curTab==='exam'){
    body = ch.exam_points && ch.exam_points.length ? ch.exam_points.map((e,i)=>
      `<div class="kp ep"><div class="ep-t">${i+1}. ${esc(e.title)}</div><div>${br(e.content)}</div></div>`).join('')
      : '<div class="empty">暂无内容</div>';
  } else if(curTab==='examples'){
    body = ch.examples && ch.examples.length ? ch.examples.map((e,i)=>
      `<div class="ex"><div class="ex-t">例 ${i+1}　${esc(e.title||'')}</div>
        <div><span class="q">【题目】</span>${br(e.question)}</div>
        ${e.analysis||e['分析']?`<div><span class="an">【分析】</span>${br(e.analysis||e['分析'])}</div>`:''}
        ${e.answer||e['答案']?`<div><span class="ans">【解答】</span>${br(e.answer||e['答案'])}</div>`:''}
      </div>`).join('') : '<div class="empty">暂无内容</div>';
  } else if(curTab==='note'){
    body = renderNote();
  }
  const markOn = studied[curChapter] ? ' on' : '';
  document.getElementById('content').innerHTML = `
    <div class="ch-loc">${esc(subj.subject)} · ${esc(book.name)}</div>
    <div class="ch-title">${esc(ch.title)}</div>
    <div class="ch-summary">${esc(ch.summary||'')}</div>
    <button class="mark-btn${markOn}" onclick="toggleMark()">${studied[curChapter]?'✓ 已学习':'标记已学习'}</button>
    <div class="tabs">${tabs}</div>
    <div class="panel">${body}</div>`;
  updateProg();
}

function switchTab(t){ curTab = t; renderContent(); }

function toggleMark(){
  if(!curChapter) return;
  if(studied[curChapter]) delete studied[curChapter]; else studied[curChapter]=true;
  LS.set('g1_studied', studied);
  renderTree();
  renderContent();
}

// 笔记
function renderNote(){
  const list = notes[curChapter] || [];
  let html = `<div class="note-row"><span class="meta">在书本上做笔记 · 自动保存到本机</span></div>
    <div class="note-box">
      <input id="noteTitle" placeholder="笔记标题（可选）" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:15px;margin-bottom:6px;outline:none">
      <textarea id="noteContent" placeholder="写下你的理解、疑问、口诀…"></textarea>
    </div>
    <div class="note-row"><span class="meta" id="noteHint">新建笔记</span>
      <button onclick="saveNote()">保存笔记</button></div>
    <div class="note-list" id="noteList"></div>`;
  setTimeout(()=>{
    const ti=document.getElementById('noteTitle'), co=document.getElementById('noteContent');
    if(ti) ti.value='', co.value='';
    renderNoteList();
  },0);
  return html;
}
function renderNoteList(){
  const list = notes[curChapter] || [];
  const el = document.getElementById('noteList');
  if(!el) return;
  el.innerHTML = list.slice().reverse().map(n=>
    `<div class="note-card">
      <div class="nc-t">${esc(n.title)}</div>
      <div class="nc-c">${br(n.content)}</div>
      <div class="nc-time">${esc(n.time)} · <a href="javascript:delNote('${n.id}')" style="color:#e55">删除</a></div>
    </div>`).join('') || '<div class="empty">还没有笔记</div>';
}
function saveNote(){
  if(!curChapter) return;
  const t = (document.getElementById('noteTitle').value||'').trim() || '未命名笔记';
  const c = document.getElementById('noteContent').value;
  if(!c.trim()){ alert('请输入笔记内容'); return; }
  if(!notes[curChapter]) notes[curChapter]=[];
  notes[curChapter].push({id:uid(),title:t,content:c,time:now()});
  LS.set('g1_notes', notes);
  document.getElementById('noteTitle').value='';
  document.getElementById('noteContent').value='';
  renderNoteList();
}
function delNote(id){
  if(!confirm('删除这条笔记？')) return;
  notes[curChapter] = (notes[curChapter]||[]).filter(n=>n.id!==id);
  LS.set('g1_notes', notes);
  renderNoteList();
}

// 搜索
function doSearch(){
  const kw = (document.getElementById('searchInput').value||'').trim().toLowerCase();
  const c = document.getElementById('content');
  if(!kw){ c.innerHTML='<div class="empty-state">请输入关键词</div>'; return; }
  const res = [];
  Object.values(chapterMap).forEach(({subj,book,ch})=>{
    const parts=[ch.title,ch.summary||''];
    (ch.knowledge||[]).forEach(k=>parts.push(k.title+' '+k.content));
    (ch.exam_points||[]).forEach(e=>parts.push(e.title+' '+e.content));
    (ch.examples||[]).forEach(e=>parts.push(e.question+' '+(e.analysis||e['分析']||'')+' '+(e.answer||e['答案']||'')));
    if(parts.join(' ').toLowerCase().includes(kw)) res.push({subj,book,ch});
  });
  if(!res.length){ c.innerHTML='<div class="empty-state">未找到「'+esc(kw)+'」相关内容</div>'; return; }
  c.innerHTML = `<h3 style="margin:4px 0 10px">找到 ${res.length} 条结果，点击查看</h3>`+
    res.map(({subj,book,ch})=>{
      const color=COLORS[subj.subject]||'#333';
      return `<div class="sr-card" onclick="selectChapter('${ch.id}');switchTab('knowledge')">
        <span class="sr-subj" style="background:${color}">${esc(subj.subject)}</span>
        <div class="sr-loc">${esc(book.name)}</div>
        <div style="font-weight:600">${esc(ch.title)}</div></div>`;
    }).join('');
}
document.getElementById('searchInput').addEventListener('keydown',e=>{ if(e.key==='Enter') doSearch(); });

// 初始化
renderTree();
updateProg();
// 默认展开第一个科目
const firstSubj = document.getElementById('subj0');
if(firstSubj) firstSubj.classList.add('open');
</script>
