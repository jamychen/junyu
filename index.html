<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="theme-color" content="#3a76d8">
<title>高一学习助手 · 理科</title>
<style>
:root{
  --blue:#3a76d8; --green:#2ea040; --red:#d33; --orange:#b26a00;
  --bg:#f4f6fa; --card:#fff; --text:#222; --muted:#888; --line:#e6e8ee;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.7}
a{color:var(--blue)}
/* 顶栏 */
.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#3a76d8,#5a8fe8);color:#fff;padding:10px 12px;display:flex;align-items:center;gap:8px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.topbar .menu-btn{font-size:22px;background:none;border:0;color:#fff;padding:4px 8px;cursor:pointer;line-height:1}
.topbar .title{font-size:17px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .prog{font-size:12px;opacity:.92;white-space:nowrap}
/* 搜索条 */
.searchbar{padding:8px 10px;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:8px}
.searchbar input{flex:1;border:1px solid var(--line);border-radius:20px;padding:8px 14px;font-size:15px;outline:none}
.searchbar input:focus{border-color:var(--blue)}
.searchbar button{border:0;background:var(--blue);color:#fff;border-radius:20px;padding:0 16px;font-size:14px;cursor:pointer}
/* 抽屉 */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30;display:none}
.overlay.show{display:block}
.drawer{position:fixed;top:0;left:0;bottom:0;width:78%;max-width:320px;background:#fff;z-index:40;transform:translateX(-105%);transition:transform .25s;overflow-y:auto;padding-bottom:30px}
.drawer.show{transform:translateX(0)}
.drawer h3{padding:14px 16px 8px;margin:0;font-size:15px;color:var(--muted);background:#fafbfc;position:sticky;top:0}
.subj{border-bottom:1px solid var(--line)}
.subj-head{padding:12px 16px;font-weight:700;font-size:16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.subj-head .arrow{transition:transform .2s;font-size:12px;color:var(--muted)}
.subj.open .arrow{transform:rotate(90deg)}
.book{display:none;padding-left:8px}
.subj.open .book{display:block}
.book-head{padding:8px 16px;color:#555;font-size:14px;display:flex;justify-content:space-between;cursor:pointer}
.book-head .arrow{font-size:11px;color:var(--muted);transition:transform .2s)}
.book.open .arrow{transform:rotate(90deg)}
.ch-list{display:none;padding-left:8px}
.book.open .ch-list{display:block}
.ch-item{padding:9px 16px;font-size:14px;cursor:pointer;border-left:3px solid transparent;display:flex;align-items:center;gap:6px}
.ch-item:active{background:#eef3fb}
.ch-item.active{border-left-color:var(--blue);background:#eef3fb;color:var(--blue);font-weight:600}
.ch-item .done{color:var(--green);font-weight:700}
.ch-item .dot{width:6px;height:6px;border-radius:50%;display:inline-block}
/* 内容区 */
.content{padding:12px 14px 60px;max-width:820px;margin:0 auto}
.ch-title{font-size:20px;font-weight:700;margin:6px 0 4px}
.ch-loc{font-size:13px;color:var(--muted);margin-bottom:6px}
.ch-summary{font-size:14px;color:#555;background:#fff;border-radius:8px;padding:10px 12px;border:1px solid var(--line);margin:8px 0}
/* 标签 */
.tabs{display:flex;gap:6px;margin:10px 0;position:sticky;top:52px;background:var(--bg);padding:6px 0;z-index:5}
.tab{flex:1;text-align:center;padding:8px 4px;font-size:14px;background:#fff;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 14px;min-height:120px}
.panel h3{margin:14px 0 6px;font-size:16px;color:var(--blue)}
.panel h3.red{color:var(--red)}
.panel h3:first-child{margin-top:0}
.kp{margin:0 0 14px}
.kp .kp-t{font-weight:700;color:var(--blue);margin-bottom:2px}
.ep .ep-t{font-weight:700;color:var(--red)}
.ex{border-bottom:1px dashed var(--line);padding-bottom:10px;margin-bottom:10px}
.ex .ex-t{font-weight:700;margin-bottom:4px}
.ex .q{color:var(--green);font-weight:700}
.ex .an{color:var(--orange);font-weight:700}
.ex .ans{color:var(--blue);font-weight:700}
.panel .empty{color:var(--muted);text-align:center;padding:30px 0}
/* 笔记 */
.note-box{margin-top:6px}
.note-box textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:15px;min-height:120px;font-family:inherit;resize:vertical;outline:none}
.note-box textarea:focus{border-color:var(--blue)}
.note-row{display:flex;justify-content:space-between;align-items:center;margin:6px 0}
.note-row .meta{font-size:12px;color:var(--muted)}
.note-row button{border:0;background:var(--blue);color:#fff;border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer}
.note-row .del{background:#e55}
.note-list{margin-top:10px}
.note-card{background:#fffbea;border:1px solid #f0e3a8;border-radius:8px;padding:10px;margin-bottom:8px}
.note-card .nc-t{font-weight:700;margin-bottom:2px}
.note-card .nc-c{white-space:pre-wrap;font-size:14px}
.note-card .nc-time{font-size:11px;color:var(--muted);margin-top:4px}
.mark-btn{display:inline-block;margin:8px 0;padding:7px 14px;border-radius:20px;border:1px solid var(--blue);background:#fff;color:var(--blue);font-size:13px;cursor:pointer}
.mark-btn.on{background:var(--green);color:#fff;border-color:var(--green)}
/* 搜索结果 */
.sr-card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:8px;cursor:pointer}
.sr-card:active{background:#eef3fb}
.sr-card .sr-subj{font-size:12px;color:#fff;padding:1px 8px;border-radius:10px}
.sr-card .sr-loc{font-size:13px;color:var(--muted);margin:4px 0}
.welcome{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 16px;text-align:center}
.welcome h2{color:var(--blue);margin:0 0 8px}
.welcome ul{text-align:left;display:inline-block;margin:10px auto;padding-left:18px}
.empty-state{text-align:center;color:var(--muted);padding:50px 20px}
</style>
</head>
<body>
<div class="topbar">
  <button class="menu-btn" onclick="toggleDrawer()">☰</button>
  <div class="title" id="topTitle">高一学习助手</div>
  <div class="prog" id="topProg">0/0</div>
</div>
<div class="searchbar">
  <input id="searchInput" type="search" placeholder="搜索知识点 / 考点…" enterkeyhint="search">
  <button onclick="doSearch()">搜索</button>
</div>
<div class="overlay" id="overlay" onclick="toggleDrawer()"></div>
<div class="drawer" id="drawer">
  <h3>📚 科目 · 章节</h3>
  <div id="tree"></div>
</div>
<div class="content" id="content">
  <div class="welcome">
    <h2>欢迎使用 高一学习助手</h2>
    <p>面向高一理科方向（语数英 + 物化生）</p>
    <ul>
      <li>点左上角 ☰ 展开科目章节</li>
      <li>切换「知识点/考点/例题/笔记」</li>
      <li>顶部搜索可跨科检索</li>
      <li>可标记已学习、做笔记</li>
    </ul>
    <p style="color:var(--muted);font-size:13px">点击左上角菜单选择章节开始学习</p>
  </div>
</div>

<script>
const DATA = [{"subject": "语文", "books": [{"name": "必修上册", "chapters": [{"id": "cn_1_1", "title": "第一单元 青春的价值（现代新诗）", "summary": "本单元学习现代新诗，篇目含《沁园春·长沙》《红烛》《峨日朵雪峰之侧》《致云雀》。通过意象与情感体会青春的价值与理想。", "knowledge": [{"title": "文学常识", "content": "词兴起于唐，盛于宋，又称长短句。《沁园春》为词牌名。毛泽东，伟大的革命家、诗人。闻一多，现代诗人、学者，提出诗歌“三美”（音乐美、绘画美、建筑美）。昌耀，当代诗人。雪莱，英国浪漫主义诗人，代表作《致云雀》《西风颂》。"}, {"title": "意象与意境", "content": "意象是寄寓主观情感的客观物象。如《沁园春·长沙》以“万山红遍、层林尽染、漫江碧透、百舸争流、鹰击长空、鱼翔浅底”等意象，绘出湘江秋景图，营造生机勃勃、意境开阔的画面，抒发革命豪情。"}, {"title": "表现手法", "content": "借景抒情、情景交融、对比、象征。《红烛》以“红烛”象征奉献精神，托物言志。《致云雀》以云雀象征欢乐、光明与理想。"}, {"title": "炼字赏析", "content": "《沁园春·长沙》中“击”写出鹰飞矫健有力，“翔”写出鱼游轻盈自由，化静为动，富有动感与生命活力。"}], "exam_points": [{"title": "诗歌背诵默写", "content": "重点默写《沁园春·长沙》（尤其上下阕名句及“问苍茫大地，谁主沉浮”“数风流人物，还看今朝”类名句）。注意易错字：峥嵘、稠、遒。"}, {"title": "意象与情感分析", "content": "找出诗歌意象，分析意境特点，概括诗人情感；结合诗句分析表现手法及作用。"}, {"title": "新诗鉴赏", "content": "分析现代诗的意象、节奏、情感；闻一多“三美”理论的运用。"}], "examples": [{"title": "默写", "question": "补写出下列名篇名句中的空缺部分：______，粪土当年万户侯。", "analysis": "出自《沁园春·长沙》，上阕忆往昔峥嵘岁月。", "answer": "恰同学少年，风华正茂；书生意气，挥斥方遒。"}]}, {"id": "cn_1_2", "title": "第二单元 劳动光荣（新闻通讯）", "summary": "通过人物通讯学习劳动精神，篇目含《喜看稻菽千重浪》《心有一团火，温暖众人心》《“探界者”钟扬》。重点为新闻通讯的特点与人物通讯写法。", "knowledge": [{"title": "新闻与通讯", "content": "新闻结构：标题、导语、主体、背景、结语。通讯是比消息更详尽的新闻报道，有人物通讯、事件通讯。人物通讯以写人为中心，通过典型事例和细节表现人物精神品质。"}, {"title": "人物通讯写法", "content": "选取典型事件；运用细节描写（语言、动作、神态）；在叙述中适当议论抒情点明主旨；以小见大。"}, {"title": "精神品质概括", "content": "袁隆平——勇于创新、淡泊名利、献身科学；张秉贵——全心全意为人民服务；钟扬——献身科学、勇于探索、责任担当。"}], "exam_points": [{"title": "新闻文体常识", "content": "消息与通讯的区别；新闻标题、导语作用；新闻真实性与文学性的关系。"}, {"title": "人物形象分析", "content": "概括人物精神品质；分析细节描写作用；体会作者情感态度。"}, {"title": "新闻语言", "content": "新闻语言的准确、简明；引语与背景的作用。"}], "examples": [{"title": "细节作用", "question": "简析《喜看稻菽千重浪》中描写袁隆平“挽起裤腿走下稻田”等细节的作用。", "analysis": "从人物形象与主旨表达两方面分析细节描写作用。", "answer": "通过动作细节描写，表现袁隆平扎根田间、脚踏实地的科研精神，使人物形象真实丰满，凸显“把论文写在祖国大地上”的主旨，增强通讯的感染力。"}]}, {"id": "cn_1_3", "title": "第三单元 生命的诗意（古诗词）", "summary": "学习古代诗歌，篇目含《短歌行》《归园田居（其一）》《梦游天姥吟留别》《登高》《琵琶行并序》。重点为诗歌意象、情感与艺术手法。", "knowledge": [{"title": "文学常识", "content": "曹操，东汉末政治家、军事家、诗人，《短歌行》属乐府旧题。陶渊明，东晋诗人，田园诗派鼻祖。李白，字太白，号青莲居士，浪漫主义诗人。杜甫，字子美，现实主义诗人，世称“诗圣”，《登高》被誉为“古今七律第一”。白居易，字乐天，号香山居士，《琵琶行》为七言歌行体。"}, {"title": "诗歌题材与情感", "content": "《短歌行》抒求贤若渴、统一天下的抱负；《归园田居》表达厌弃官场、回归自然的恬淡；《梦游天姥吟留别》借梦境抒蔑视权贵、追求自由之志；《登高》写悲秋与漂泊老病之愁；《琵琶行》借琵琶女身世抒“同是天涯沦落人”之慨。"}, {"title": "艺术手法", "content": "用典（《短歌行》化用《诗经》）；白描（《归园田居》“方宅十余亩”）；夸张想象（李白梦游）；对仗（《登高》首联、颔联工对）；比喻通感（“大珠小珠落玉盘”喻乐声）。"}, {"title": "近体诗常识", "content": "律诗八句，分首联、颔联、颈联、尾联；颔联颈联须对仗。《登高》四联皆对仗。平仄、押韵为格律要求。"}], "exam_points": [{"title": "古诗默写", "content": "重点默写《短歌行》《归园田居》《登高》《琵琶行》名句。易错字：譬如、羁鸟、猿啸、幽咽、冰泉。"}, {"title": "意象与情感鉴赏", "content": "分析意象（如《登高》“落木”“长江”）营造的意境与情感；炼字赏析。"}, {"title": "表现手法赏析", "content": "判断并赏析用典、对比、借景抒情、虚实结合、衬托等手法及作用。"}], "examples": [{"title": "诗句鉴赏", "question": "赏析《登高》颔联“无边落木萧萧下，不尽长江滚滚来”的妙处。", "analysis": "从意象、对仗、意境、情感四方面赏析。", "answer": "“落木”“长江”描绘秋景，境界雄浑；“无边”“不尽”显空间之广、时间之久；对仗工整，音韵铿锵。既写自然之秋，又融诗人漂泊迟暮之悲与韶光易逝之叹，情景交融，气象宏大。"}, {"title": "默写", "question": "《琵琶行》中描写音乐暂歇后突然激越的句子是______。", "analysis": "出自《琵琶行》描写乐声变化的名句。", "answer": "银瓶乍破水浆迸，铁骑突出刀枪鸣。"}]}, {"id": "cn_1_4", "title": "第四单元 家乡文化生活（综合活动）", "summary": "实践活动单元，调查家乡人物、风物、习俗，记录家乡文化生活，撰写调查报告与建议书。", "knowledge": [{"title": "调查与访谈", "content": "调查方法：问卷、访谈、实地考察、文献查阅。访谈要拟好提纲，提问具体开放，记录客观真实。"}, {"title": "调查报告", "content": "结构：标题、前言（目的、对象、方法）、主体（情况、分析）、结尾（结论、建议）。语言客观准确，数据与事实支撑。"}, {"title": "建议书", "content": "格式：标题、称呼、正文（问题+建议）、结尾、署名日期。建议要具体可行、分条列出。"}], "exam_points": [{"title": "实用文写作", "content": "调查报告与建议书的格式与内容要求；活动方案设计。"}, {"title": "材料概括", "content": "从调查材料中提取信息、概括特点、提出建议。"}], "examples": [{"title": "建议书", "question": "针对家乡传统文化保护问题，拟写一份建议书的正文要点。", "analysis": "围绕“问题+建议”分条作答，建议具体可行。", "answer": "①建立传统文化档案，普查登记非遗项目；②加强宣传，开设乡土文化课程；③培养传承人，给予政策与资金支持；④开发文旅结合项目，让传统文化融入生活。"}]}, {"id": "cn_1_5", "title": "第五单元 整本书阅读《乡土中国》", "summary": "费孝通著，社会学经典。理解中国乡土社会的“差序格局”“礼治秩序”等核心概念，学习整本书阅读方法。", "knowledge": [{"title": "作者与体例", "content": "费孝通，社会学家、人类学家。《乡土中国》由14篇论文组成，是社区研究比较理论的成果，属学术性论著。"}, {"title": "核心概念", "content": "乡土本色：中国社会基层是乡土性的。差序格局：以“己”为中心，像石子投入水中形成的同心圆波纹的人际关系格局（区别于团体格局）。礼治秩序：靠传统与教化维持的秩序。长老统治、血缘与地缘、无讼。"}, {"title": "阅读方法", "content": "略读把握框架（目录、核心概念），精读理解论证；圈点批注；绘制概念关系图；联系现实生活理解。"}], "exam_points": [{"title": "概念理解", "content": "差序格局与团体格局的区别；礼治与法治；熟人社会特点。"}, {"title": "论证分析", "content": "分析作者举例、对比、比喻等论证方法；理解概念间逻辑。"}, {"title": "联系现实", "content": "用乡土中国理论分析现实社会现象（人情、宗族、基层治理）。"}], "examples": [{"title": "概念辨析", "question": "简述“差序格局”的含义及其与“团体格局”的区别。", "analysis": "解释差序格局比喻，对比两种格局的人际结构。", "answer": "差序格局是以“己”为中心、按亲属与地缘关系向外推衍的同心圆式人际关系，圈子大小随中心势力变化，公私界限相对。团体格局由若干人组成界限分明的团体，成员地位平等，公私分明。前者重人情伦理，后者重权利规则。"}]}, {"id": "cn_1_6", "title": "第六单元 学习之道（古代议论散文）", "summary": "学习古代议论散文《劝学》《师说》及《反对党八股》。重点为文言实词虚词、特殊句式与说理方法。", "knowledge": [{"title": "文言实词", "content": "《劝学》：劝（勉励）、学不可以已（停止）、金就砺则利（靠近、接近）、假（借助）、跂（踮起脚后跟）、驽马十驾（马拉车一天的行程）、锲（刻）。《师说》：师（从师、老师）、传道、受业解惑（受同授）、其闻道也固先乎吾（懂得）、从而师之（意动，以……为师）。"}, {"title": "文言虚词", "content": "于：①青取之于蓝（从）②而寒于水（比）③耻学于师（向）。而：①顺风而呼（表修饰）②而知明而行无过矣（表并列）③君子博学而日参省乎己（表递进）。之：①郯子之徒（这类）②句读之不知（宾前标志）③巫医乐师百工之人（代词）。"}, {"title": "特殊句式", "content": "判断句：“师者，所以传道受业解惑也”。宾语前置：“句读之不知，惑之不解”。状语后置：“学于余”。被动：“不拘于时”。省略句：“蟹六跪而二螯，非蛇鳝之穴无可寄托者”。"}, {"title": "论证方法", "content": "《劝学》用比喻论证（积、喻）与对比论证；《师说》正面论述与反面批判结合，对比论证（古之圣人—今之众人，爱其子—于其身，巫医—士大夫）。"}], "exam_points": [{"title": "文言文默写", "content": "默写《劝学》《师说》名句。易错字：鞣、砺、跂、跬、骐骥、镂、蟮（鳝）、传道受业。"}, {"title": "文言知识", "content": "实词义项推断、虚词用法辨析、特殊句式辨析与翻译。"}, {"title": "论证分析", "content": "梳理论证思路，分析论证方法与论点论据关系。"}], "examples": [{"title": "句式翻译", "question": "翻译“句读之不知，惑之不解，或师焉，或不焉”。", "analysis": "注意宾语前置句式、“或”“不（否）”通假。", "answer": "不明句读，不能解决疑惑，有的（不通句读）向老师学习，有的（有疑惑）却不向老师学习。"}, {"title": "默写", "question": "《劝学》中强调积累的重要性的两句是______。", "analysis": "以积土成山、积水成渊喻积累。", "answer": "积土成山，风雨兴焉；积水成渊，蛟龙生焉。"}]}, {"id": "cn_1_7", "title": "第七单元 自然情怀（写景抒情散文）", "summary": "学习现当代与古代写景抒情散文，篇目含《故都的秋》《荷塘月色》《我与地坛（节选）》《赤壁赋》《登泰山记》。体会情景交融。", "knowledge": [{"title": "文学常识", "content": "郁达夫，现代作家，《故都的秋》写北平秋的“清、静、悲凉”。朱自清，现代散文家，《荷塘月色》写月下荷塘。史铁生，当代作家，《我与地坛》写生命感悟。苏轼，北宋文学家，《赤壁赋》为文赋名篇。姚鼐，清代桐城派散文家，《登泰山记》为山水游记。"}, {"title": "写景手法", "content": "《荷塘月色》通感（“微风过处，送来缕缕清香，仿佛远处高楼上渺茫的歌声”）、比喻、叠词；《故都的秋》以小院秋景写意，对比南国之秋；《赤壁赋》主客问答、借景说理。"}, {"title": "情景关系", "content": "景中含情（故都之秋的落寞清冷）、因情设景（荷塘月色的淡淡喜悦淡淡哀愁）、借景说理（赤壁赋水月之喻）。"}], "exam_points": [{"title": "散文鉴赏", "content": "分析景物描写手法及作用；体会作者情感与主旨；语言赏析（叠词、通感、句式）。"}, {"title": "文言文阅读", "content": "《赤壁赋》《登泰山记》实词虚词、翻译、说理层次。"}, {"title": "默写", "content": "《赤壁赋》名句默写（如“寄蜉蝣于天地，渺沧海之一粟”）。"}], "examples": [{"title": "手法赏析", "question": "赏析《荷塘月色》“微风过处，送来缕缕清香，仿佛远处高楼上渺茫的歌声”的表达效果。", "analysis": "判断为通感修辞，分析其效果。", "answer": "运用通感，将嗅觉的“清香”比作听觉的“歌声”，“缕缕”“渺茫”写出香气若有若无、断续轻淡的特点，化无形为有形，形象传神，增添诗意美。"}]}, {"id": "cn_1_8", "title": "第八单元 词语积累与探究", "summary": "活动单元，梳理成语、熟语、新词，探究词义演变，规范语言运用。", "knowledge": [{"title": "成语知识", "content": "成语多源于神话、寓言、历史故事、诗文语句。辨析近义成语：范围大小、语意轻重、感情色彩、谦敬用法。如“耳提面命”（褒，恳切教导）与“颐指气使”（贬，傲慢）。"}, {"title": "熟语", "content": "包括惯用语、谚语、歇后语、格言。理解其约定俗成的含义。"}, {"title": "词义演变", "content": "词义扩大（“江”由长江扩大为河流通称）、缩小、转移；古今异义（“妻子”古指妻和子）。"}], "exam_points": [{"title": "成语运用", "content": "判断成语使用正误（望文生义、对象误用、褒贬误用、谦敬错位、前后矛盾）。"}, {"title": "词语辨析", "content": "近义词（实词、虚词）辨析填空。"}, {"title": "语言得体", "content": "敬辞与谦辞使用；场合与语体得体。"}], "examples": [{"title": "成语正误", "question": "下列成语使用是否正确：“他讲课娓娓道来，令学生如坐春风。”", "analysis": "“如坐春风”比喻受到良师的教诲，与语境相符。", "answer": "正确。“如坐春风”比喻沐浴在良好的教育环境中，用来形容听课感受恰当，对象与感情色彩均合适。"}]}]}, {"name": "必修下册", "chapters": [{"id": "cn_2_1", "title": "第一单元 诸子百家（古代散文）", "summary": "学习先秦诸子散文《子路、曾皙、冉有、公西华侍坐》《齐桓晋文之事》《庖丁解牛》。理解儒道思想与说理艺术。", "knowledge": [{"title": "文学常识", "content": "《论语》儒家经典，语录体，记录孔子及其弟子言行。孟子，名轲，主张“仁政”“性善论”，《孟子》为对话体论辩散文。庄子，名周，道家代表，主张顺应自然，《庄子》文章想象奇幻、善用寓言。"}, {"title": "文言实词虚词", "content": "“侍坐”（陪侍长者坐）、“居则曰”（平日）、“如其道”（合乎道）；“吾何爱一牛”（吝惜）、“牛何之”（往）；“乃中经首之会”（合乎）、“批大郤导大窾”（击、顺着）。虚词“以”“其”“之”的多义。"}, {"title": "思想与说理", "content": "孔子“为国以礼”、曾皙“浴乎沂风乎舞雩”的礼乐理想；孟子“保民而王”的仁政思想与“推恩”论证；庄子“依乎天理”顺应规律的养生哲学。"}, {"title": "人物形象", "content": "孔子和蔼民主、循循善诱；孟子善辩、气势充沛；庖丁技艺精湛、得心应手。"}], "exam_points": [{"title": "文言知识", "content": "实词推断、虚词辨析、特殊句式、文句翻译。"}, {"title": "思想内容", "content": "概括诸子主张；比较儒道思想差异。"}, {"title": "艺术特色", "content": "《孟子》论辩艺术（排比、比喻、因势利导）；《庄子》寓言说理。"}], "examples": [{"title": "翻译", "question": "翻译“老吾老，以及人之老；幼吾幼，以及人之幼”。", "analysis": "注意“老”“幼”的形容词活用及“及”的词义。", "answer": "敬重自家的长辈，从而推广到敬重别人家的长辈；爱护自家的儿女，从而推广到爱护别人家的儿女。"}]}, {"id": "cn_2_2", "title": "第二单元 悲剧的力量（戏剧）", "summary": "学习戏剧《雷雨（节选）》《哈姆莱特（节选）》。把握戏剧冲突、人物语言与悲剧意蕴。", "knowledge": [{"title": "戏剧常识", "content": "戏剧要素：戏剧冲突、戏剧语言（台词、舞台说明）。悲剧：主人公因自身缺陷或环境冲突走向毁灭，引发怜悯与恐惧的净化。曹禺，现代剧作家，《雷雨》写周鲁两家三十年恩怨。莎士比亚，英国文艺复兴戏剧家。"}, {"title": "戏剧冲突", "content": "《雷雨》周朴园与鲁侍萍相认的冲突，揭示阶级矛盾与人性虚伪；《哈姆莱特》复仇与延宕的内心冲突。"}, {"title": "人物语言", "content": "个性化台词塑造人物；潜台词（言外之意）反映心理。周朴园的语言威严虚伪，鲁侍萍含蓄克制。"}], "exam_points": [{"title": "戏剧冲突", "content": "概括冲突实质，分析冲突对塑造人物与推动情节的作用。"}, {"title": "人物形象与潜台词", "content": "分析人物性格；解读潜台词含义。"}, {"title": "悲剧意蕴", "content": "理解悲剧根源与社会意义。"}], "examples": [{"title": "潜台词", "question": "《雷雨》中周朴园问“你——你贵姓？”潜台词是什么？", "analysis": "结合相认情节分析人物心理。", "answer": "周朴园察觉眼前女子可能与三十年前的侍萍有关，内心惊疑不安，这句问话掩饰其慌乱，试探对方身份，反映其虚伪怯懦的心理。"}]}, {"id": "cn_2_3", "title": "第三单元 探索与发现（实用性文本）", "summary": "学习科普与学术文章《青蒿素：人类征服疾病的一小步》《一名物理学家的教育历程》。理解科学精神与说明方法。", "knowledge": [{"title": "文体知识", "content": "科普文：以通俗语言介绍科学知识。学术报告/自传性说明文：介绍研究过程与思想。说明方法：下定义、分类别、举例子、作比较、列数字、打比方。"}, {"title": "科学精神", "content": "屠呦呦团队锲而不舍、从古籍汲取智慧、严谨求实；加来道雄由好奇驱动、勇于探索。"}, {"title": "语言特点", "content": "准确性（术语、数据）与通俗性（比喻、口语化）结合。"}], "exam_points": [{"title": "说明文阅读", "content": "概括说明对象与特征；分析说明方法与作用；说明顺序与语言准确性。"}, {"title": "科学精神概括", "content": "从文中提炼科学家的品质与科学方法。"}], "examples": [{"title": "说明方法", "question": "《青蒿素》运用了哪些说明方法？举一例分析。", "analysis": "结合文本列举说明方法并分析作用。", "answer": "运用了举例子（列举临床病例）、列数字（提取成功率、实验次数）、作比较（与氯喹等对比）等。如列举大量临床治愈数据，具体准确地说明青蒿素的疗效，增强说服力。"}]}, {"id": "cn_2_4", "title": "第四单元 信息时代的语文生活", "summary": "活动单元，认识媒介特点，辨析网络信息，撰写媒介素养相关文案。", "knowledge": [{"title": "媒介素养", "content": "认识不同媒介（报刊、广播、电视、网络）特点；辨别信息真伪，警惕谣言与算法偏见；理性表达，规范网络语言。"}, {"title": "信息处理", "content": "筛选、整合、概括多则信息；比较不同来源报道的差异。"}], "exam_points": [{"title": "信息概括与整合", "content": "从多则材料提取关键信息并概括。"}, {"title": "媒介应用文", "content": "拟写消息、倡议书、网络评论等。"}], "examples": [{"title": "信息辨析", "question": "面对网络上一条引发争议的新闻，应如何理性对待？", "analysis": "从核实来源、多方比对、理性判断角度作答。", "answer": "①核实信息来源是否权威可靠；②查找官方通报与多方报道比对；③不轻信不传谣，等待事实澄清；④理性评论，避免情绪化与网络暴力。"}]}, {"id": "cn_2_5", "title": "第五单元 演讲（演讲词）", "summary": "学习演讲词《在〈人民报〉创刊纪念会上的演说》《在马克思墓前的讲话》《我有一个梦想》。体会演讲的针对性与感染力。", "knowledge": [{"title": "演讲特点", "content": "针对性（针对听众与场合）、鼓动性、口语化。结构常为提出问题—分析问题—发出号召。"}, {"title": "论证与修辞", "content": "运用比喻、排比、对比增强气势与感染力。恩格斯对马克思的评价客观中肯；马丁·路德·金用大量排比抒情达意。"}, {"title": "演讲写作", "content": "观点鲜明，开头引人，结尾有力；联系实际，情感真挚。"}], "exam_points": [{"title": "演讲词鉴赏", "content": "分析演讲的针对性与感染力；修辞手法及作用；论证思路。"}, {"title": "演讲稿写作", "content": "拟写演讲稿，注意对象意识与逻辑层次。"}], "examples": [{"title": "修辞作用", "question": "分析《我有一个梦想》中排比句的表达效果。", "analysis": "从气势、情感、主旨角度分析排比作用。", "answer": "“我有一个梦想”反复排比，层层递进，强化对种族平等的热切渴望，形成强烈节奏感与抒情气势，增强演讲的感染力与鼓动性，深刻表达主旨。"}]}, {"id": "cn_2_6", "title": "第六单元 小说阅读", "summary": "学习中外小说（含《祝福》《变形记》等）。把握人物、情节、环境与主题，理解小说叙事艺术。", "knowledge": [{"title": "小说三要素", "content": "人物、情节、环境。情节结构：开端、发展、高潮、结局（有时有序幕、尾声）。环境分自然环境与社会环境，烘托人物、暗示主题。"}, {"title": "人物塑造", "content": "正面描写（肖像、语言、动作、神态、心理）与侧面描写。典型环境中的典型人物。祥林嫂的悲剧是封建礼教所致。"}, {"title": "叙事艺术", "content": "叙述视角（第一/第三人称）、叙述顺序（顺叙、倒叙、插叙）、细节描写、伏笔照应。"}, {"title": "主题探究", "content": "透过人物命运与社会环境挖掘主题；关注现代派小说（如《变形记》异化主题）。"}], "exam_points": [{"title": "人物形象分析", "content": "概括人物性格特点，分析塑造手法。"}, {"title": "环境作用", "content": "分析自然环境与社会环境的作用。"}, {"title": "标题与主题", "content": "标题含义与作用；探究小说主题。"}], "examples": [{"title": "环境作用", "question": "简析《祝福》开头描写鲁镇祝福景象的作用。", "analysis": "从环境渲染、人物衬托、主题揭示、结构方面分析。", "answer": "渲染了鲁镇年终祝福的热闹喜庆氛围，与祥林嫂惨死的悲凉形成强烈对比，反衬其命运的悲惨；揭示封建迷信与礼教环境，暗示悲剧根源；首尾照应祝福，使结构完整，深化批判主题。"}]}, {"id": "cn_2_7", "title": "第七单元 整本书阅读《红楼梦》", "summary": "阅读《红楼梦》，把握主要人物与悲剧主题，理解章回小说艺术，学习长篇小说阅读方法。", "knowledge": [{"title": "作品常识", "content": "曹雪芹著，前八十回曹雪芹，后四十回一般认为高鹗续。中国古典小说巅峰，章回体。以贾宝玉、林黛玉、薛宝钗爱情婚姻悲剧为主线，写贾府由盛转衰。"}, {"title": "主要人物", "content": "贾宝玉——叛逆、厌恶仕途经济；林黛玉——多愁善感、才华出众、追求真情；薛宝钗——端庄贤淑、恪守礼教；王熙凤——精明强干、泼辣狠毒。判词暗示人物命运。"}, {"title": "艺术成就", "content": "网状结构，草蛇灰线伏脉千里；人物塑造千人千面；诗词曲赋与人物性格命运契合；悲剧意蕴深刻。"}], "exam_points": [{"title": "人物分析", "content": "结合情节分析人物性格与命运；判词解读。"}, {"title": "主题与艺术", "content": "悲剧的社会意义；结构与伏笔艺术。"}, {"title": "整本书阅读方法", "content": "梳理关系、关注回目、专题探究。"}], "examples": [{"title": "人物判读", "question": "简析林黛玉这一人物形象。", "analysis": "从性格、才华、命运、意义概括。", "answer": "林黛玉寄人篱下，多愁善感、孤高自许；才华横溢、率真多情，追求自由的爱情与人格独立。她与宝玉的爱情因礼教与家族利益受阻，最终泪尽而逝，其悲剧既是性格与环境冲突所致，也寄托了作者对个性解放的向往。"}]}, {"id": "cn_2_8", "title": "第八单元 古诗词诵读", "summary": "学习《李凭箜篌引》《锦瑟》《书愤》《越中览古》等古诗词，拓展积累，提升鉴赏与默写能力。", "knowledge": [{"title": "文学常识", "content": "李贺，中唐诗人，诗风奇崛，人称“诗鬼”。李商隐，晚唐诗人，诗风朦胧绮丽。陆游，南宋爱国诗人。"}, {"title": "艺术手法", "content": "《李凭箜篌引》以奇喻摹写乐声（“女娲炼石补天处，石破天惊逗秋雨”）；《锦瑟》用典朦胧多义（庄生梦蝶、望帝春心、鲛人泣珠、蓝田生玉）；《书愤》对比今昔，抒壮志未酬之愤。"}, {"title": "用典与多义", "content": "用典使语言凝练含蓄；《锦瑟》主旨众说纷纭（悼亡、自伤、诗序），体现诗歌多义性。"}], "exam_points": [{"title": "默写积累", "content": "默写《锦瑟》《书愤》等名句。易错字：惘、沧、鬓、衰。"}, {"title": "鉴赏", "content": "赏析音乐描写手法；分析用典与情感；比较阅读。"}], "examples": [{"title": "默写", "question": "补写《锦瑟》：此情可待成追忆，______。", "analysis": "出自李商隐《锦瑟》尾联。", "answer": "只是当时已惘然。"}]}]}]}, {"subject": "数学", "books": [{"name": "必修第一册", "chapters": [{"id": "math_1_1", "title": "第一章 集合与常用逻辑用语", "summary": "集合是现代数学的基本语言。本章学习集合的概念、表示、关系与运算，以及充分条件、必要条件、全称量词与存在量词，是函数与后续内容的基础。", "knowledge": [{"title": "集合与元素", "content": "把一些能够确定的不同的对象看成一个整体，就说这个整体是由这些对象的全体构成的集合。元素具有确定性、互异性、无序性。若 a 是集合 A 的元素，记 a∈A；否则记 a∉A。"}, {"title": "集合的表示", "content": "常用表示法：列举法（把元素一一列出，写在大括号内）、描述法（{x|x 满足的性质 P}）、Venn 图法。常见数集：N(非负整数集)、N*/N+(正整数集)、Z(整数集)、Q(有理数集)、R(实数集)。"}, {"title": "集合间的基本关系", "content": "若集合 A 的任意元素都是 B 的元素，则 A 是 B 的子集，记 A⊆B。若 A⊆B 且 B 中至少有一个元素不属于 A，则 A 是 B 的真子集，记 A⫋B。规定空集 ∅ 是任何集合的子集，是任何非空集合的真子集。A⊆B 且 B⊆A ⇔ A=B。"}, {"title": "集合的基本运算", "content": "并集 A∪B={x|x∈A 或 x∈B}；交集 A∩B={x|x∈A 且 x∈B}；补集 ∁UA={x|x∈U 且 x∉A}，其中 U 为全集。运算性质：A∪A=A，A∩A=A，A∪∅=A，A∩∅=∅；A∩(∁UB) 等可借助 Venn 图分析；∁U(A∪B)=(∁UA)∩(∁UB)，∁U(A∩B)=(∁UA)∪(∁UB)（德·摩根定律）。"}, {"title": "充分条件与必要条件", "content": "若 p⇒q，则 p 是 q 的充分条件，q 是 p 的必要条件。若 p⇔q，则 p 与 q 互为充要条件。判断方法：看能否推出及方向。"}, {"title": "全称量词与存在量词", "content": "全称量词∀：∀x∈M，p(x) 表示对 M 中任意 x 都有 p(x) 成立；存在量词∃：∃x∈M，p(x) 表示 M 中存在 x 使 p(x) 成立。否定：¬(∀x,p(x)) ⇔ ∃x,¬p(x)；¬(∃x,p(x)) ⇔ ∀x,¬p(x)。"}], "exam_points": [{"title": "集合的含义与表示", "content": "考查元素确定性、互异性（注意含参集合求参数时要检验互异性）、列举法与描述法的互译。"}, {"title": "集合间关系的应用", "content": "由子集关系求参数取值范围，注意空集的讨论（A⊆B 时务必考虑 A=∅ 的情形）；集合相等求参数。"}, {"title": "集合运算", "content": "交、并、补运算，常结合不等式（一元二次不等式、绝对值不等式）的解集；利用 Venn 图求元素个数或参数。"}, {"title": "充分必要条件的判定", "content": "结合具体命题判定条件关系；通过反例否定；与方程、不等式结合求参数范围。"}], "examples": [{"title": "集合运算与参数", "question": "已知集合 A={x|-1<x<3}，B={x|x<a}，若 A∪B=B，求 a 的取值范围。", "analysis": "A∪B=B 等价于 A⊆B，即 A 中所有元素都属于 B，故 B 的右端点 a 不能小于 A 的右端点。", "answer": "由 A∪B=B 得 A⊆B，需 a≥3。所以 a 的取值范围是 [3,+∞)。"}, {"title": "互异性检验", "question": "已知集合 A={1, a, a+1}，且 2∈A，求 a。", "analysis": "由 2∈A 知 a=2 或 a+1=2，分别求出再检验元素互异性。", "answer": "若 a=2，则 A={1,2,3}，满足；若 a+1=2 得 a=1，则 A={1,1,2}，元素重复，舍去。故 a=2。"}]}, {"id": "math_1_2", "title": "第二章 一元二次函数、方程和不等式", "summary": "本章从等式与不等式的性质出发，学习基本不等式及其应用，建立一元二次函数、一元二次方程与一元二次不等式之间的联系。", "knowledge": [{"title": "等式与不等式的性质", "content": "对称性：a>b⇔b<a；传递性：a>b,b>c⇒a>c；可加性：a>b⇒a+c>b+c；可乘性：a>b,c>0⇒ac>bc；a>b,c<0⇒ac<bc。同向不等式可相加；正数同向不等式可相乘。"}, {"title": "基本不等式", "content": "对任意 a,b>0，有 a+b≥2√(ab)，当且仅当 a=b 时取等号。变形：ab≤((a+b)/2)²。用于求和的最小值或积的最大值（注意“一正、二定、三相等”三要素）。"}, {"title": "一元二次不等式", "content": "设 ax²+bx+c=0 (a>0) 的判别式 Δ=b²-4ac。Δ>0 有两根 x1<x2，则 ax²+bx+c>0 的解集为 {x|x<x1 或 x>x2}；Δ=0 解集为 {x|x≠-b/2a}；Δ<0 解集为 R。a<0 时先化为 a>0 再解。三个“二次”关系：函数图象、方程根、不等式解集相互决定。"}, {"title": "分式不等式", "content": "f(x)/g(x)>0 ⇔ f(x)g(x)>0；f(x)/g(x)≥0 ⇔ f(x)g(x)≥0 且 g(x)≠0。转化为整式不等式求解，注意分母不为零。"}], "exam_points": [{"title": "基本不等式求最值", "content": "“1”的代换、配凑定值；注意取等条件，常考函数最值与实际应用（面积、造价最值）。"}, {"title": "一元二次不等式解法", "content": "含参不等式分类讨论（按 Δ、开口、根的大小）；二次不等式恒成立问题（Δ 与开口结合）。"}, {"title": "三个二次的关系", "content": "由二次函数图象求不等式解集、求方程根的分布；已知不等式解集求参数。"}], "examples": [{"title": "基本不等式求最值", "question": "已知 x>0，求 f(x)=x+4/x 的最小值。", "analysis": "x>0，可用基本不等式 a+b≥2√(ab)，取等条件需满足。", "answer": "f(x)=x+4/x≥2√(x·4/x)=2√4=4，当且仅当 x=4/x 即 x=2 时取等。故最小值为 4。"}, {"title": "含参一元二次不等式", "question": "解关于 x 的不等式 x²-(a+1)x+a<0 (a∈R)。", "analysis": "因式分解得 (x-1)(x-a)<0，比较 1 与 a 的大小关系分类讨论。", "answer": "(x-1)(x-a)<0。若 a>1，解集为 (1,a)；若 a=1，无解即 ∅；若 a<1，解集为 (a,1)。"}]}, {"id": "math_1_3", "title": "第三章 函数的概念与性质", "summary": "建立用集合语言定义的函数概念，研究函数的单调性、奇偶性、最大（小）值与幂函数，是高中函数学习的核心。", "knowledge": [{"title": "函数的概念", "content": "设 A、B 是非空数集，若按某种确定对应关系 f，使 A 中任意数 x 在 B 中都有唯一确定的数 f(x) 与之对应，则称 f:A→B 为从 A 到 B 的函数，记 y=f(x)。定义域为 A，值域为 {f(x)|x∈A}⊆B。两个函数相同当且仅当定义域与对应关系都相同。"}, {"title": "函数的表示法", "content": "解析法、列表法、图象法。分段函数：不同区间有不同解析式，定义域为各段并集，求值先判断自变量所在区间。"}, {"title": "单调性", "content": "设函数 f 定义域为 I，区间 D⊆I：若∀x1,x2∈D，x1<x2 都有 f(x1)<f(x2)，则 f 在 D 上单调递增；若 f(x1)>f(x2) 则单调递减。判定用定义法（取值—作差—变形—定号—结论）或图象。复合函数“同增异减”。"}, {"title": "奇偶性", "content": "若对定义域内任意 x 都有 f(-x)=f(x)，则 f 为偶函数，图象关于 y 轴对称；若 f(-x)=-f(x)，则为奇函数，图象关于原点对称。奇偶性前提是定义域关于原点对称。"}, {"title": "最大（小）值", "content": "设 f 在 D 上有定义：若存在 x0∈D 使∀x∈D, f(x)≤f(x0)，则 f(x0) 为最大值。常借助单调性或图象求最值。"}, {"title": "幂函数", "content": "形如 y=x^α 的函数叫幂函数。α=1,2,3,1/2,-1 时图象都过 (1,1)；α>0 在第一象限递增，α<0 递减；α 为偶数时偶函数，奇数时奇函数。"}], "exam_points": [{"title": "定义域与值域", "content": "求函数定义域（分母不为零、偶次根下非负、对数真数为正等）；分段函数求值与值域。"}, {"title": "单调性与奇偶性综合", "content": "用定义法证明单调性；利用奇偶性求解析式（已知奇函数在 [0,+∞) 的解析式求 (-∞,0]）；单调性与奇偶性结合比较大小、解抽象不等式。"}, {"title": "函数图象与应用", "content": "图象变换（平移、对称）；利用性质求最值与参数范围。"}], "examples": [{"title": "单调性证明", "question": "证明 f(x)=x+1/x 在 (1,+∞) 上单调递增。", "analysis": "用定义法，任取 x1>x2>1，作差 f(x1)-f(x2) 并判断符号。", "answer": "任取 1<x2<x1，f(x1)-f(x2)=(x1-x2)+(1/x1-1/x2)=(x1-x2)·(1-1/(x1x2))。因 x1>x2>1，故 x1-x2>0，x1x2>1，1-1/(x1x2)>0，所以 f(x1)-f(x2)>0，f 单调递增。"}, {"title": "奇偶性求解析式", "question": "f(x) 为 R 上奇函数，x>0 时 f(x)=x²+x，求 x<0 时的解析式。", "analysis": "设 x<0，则 -x>0，可用已知解析式求 f(-x)，再由奇函数 f(-x)=-f(x) 转化。", "answer": "设 x<0，则 -x>0，f(-x)=(-x)²+(-x)=x²-x。因 f 为奇函数，f(x)=-f(-x)=-(x²-x)=-x²+x。故 x<0 时 f(x)=-x²+x。"}]}, {"id": "math_1_4", "title": "第四章 指数函数与对数函数", "summary": "将整数指数幂推广到实数指数幂，研究指数函数与对数函数的图象和性质，并学习函数零点与二分法。", "knowledge": [{"title": "n 次方根与分数指数幂", "content": "a^(m/n)=ⁿ√(a^m) (a>0, m,n∈N*, n>1)；负分数指数幂 a^(-m/n)=1/a^(m/n)。有理指数幂运算性质：a^r·a^s=a^(r+s)，(a^r)^s=a^(rs)，(ab)^r=a^r·b^r。"}, {"title": "指数函数", "content": "y=a^x (a>0 且 a≠1)。定义域 R，值域 (0,+∞)，过定点 (0,1)。a>1 时在 R 上递增；0<a<1 时递减。图象恒在 x 轴上方，渐近线为 x 轴。"}, {"title": "对数", "content": "若 a^b=N (a>0,a≠1,N>0)，则 b=log_a N。常用对数 lg N=log_10 N，自然对数 ln N=log_e N。性质：a^(log_a N)=N，log_a a=1，log_a 1=0；运算法则：log_a(MN)=log_a M+log_a N，log_a(M/N)=log_a M-log_a N，log_a M^n=n log_a M。换底公式 log_a b=log_c b/log_c a。"}, {"title": "对数函数", "content": "y=log_a x (a>0,a≠1)。定义域 (0,+∞)，值域 R，过定点 (1,0)。a>1 时在 (0,+∞) 递增；0<a<1 时递减。指数函数 y=a^x 与对数函数 y=log_a x 互为反函数，图象关于 y=x 对称。"}, {"title": "函数的零点与二分法", "content": "f(x)=0 的实数根 x0 称为函数 f 的零点。零点存在定理：若 f 在 [a,b] 上图象连续且 f(a)·f(b)<0，则在 (a,b) 内有零点。二分法通过不断取区间中点缩小零点所在区间求近似值。"}], "exam_points": [{"title": "指数、对数运算", "content": "指数幂与对数式化简求值；换底公式的应用。"}, {"title": "指数函数与对数函数图象性质", "content": "比较大小（同底数比单调性、不同底数借助中间值）；求定义域、值域；图象变换与定点。"}, {"title": "函数零点问题", "content": "判断零点个数（数形结合）；已知零点个数或零点所在区间求参数范围。"}], "examples": [{"title": "比较大小", "question": "比较 a=0.2^1.5，b=log_0.2 1.5，c=1.5^0.2 的大小。", "analysis": "分别判断各值的正负与范围，利用相应函数的单调性。", "answer": "a=0.2^1.5，底 0<0.2<1，指数 1.5>0，故 0<a<1；b=log_0.2 1.5，底 0<0.2<1，真数 1.5>1，故 b<0；c=1.5^0.2，底 1.5>1，指数 0.2>0，故 c>1。因此 b<a<c。"}, {"title": "零点个数", "question": "求函数 f(x)=2^x+log_2 x-3 的零点个数。", "analysis": "转化为 2^x+log_2 x=3，数形结合分析 y=2^x+log_2 x 与 y=3 交点。", "answer": "f(x) 在 (0,+∞) 上 2^x 与 log_2 x 均递增，故 f(x) 递增。f(1)=2+0-3=-1<0，f(2)=4+1-3=2>0，由零点存在定理及单调性知 f 有唯一零点，个数为 1。"}]}, {"id": "math_1_5", "title": "第五章 三角函数", "summary": "以圆周运动为背景推广角的概念，建立弧度制，定义任意角三角函数，研究诱导公式与三角函数的图象和性质。", "knowledge": [{"title": "任意角与弧度制", "content": "按逆时针旋转为正角，顺时针为负角。弧度制：长度等于半径的弧所对圆心角为 1 弧度。换算 180°=π rad。弧长公式 l=|α|r，扇形面积 S=½|α|r²=½lr。"}, {"title": "三角函数概念", "content": "设角 α 终边上一点 P(x,y)，r=√(x²+y²)，则 sinα=y/r，cosα=x/r，tanα=y/x (x≠0)。各象限符号：一全正、二正弦、三正切、四余弦。同角关系：sin²α+cos²α=1，tanα=sinα/cosα。"}, {"title": "诱导公式", "content": "“奇变偶不变，符号看象限”：k·π/2±α 的三角函数，k 为偶数函数名不变，k 为奇数正余弦互变；符号视 k·π/2±α 所在象限原函数符号而定。常用 2kπ+α、π±α、-α、π/2±α 公式。"}, {"title": "正弦、余弦、正切函数图象与性质", "content": "y=sin x 与 y=cos x 定义域 R，值域 [-1,1]，周期 2π；y=tan x 定义域 {x|x≠π/2+kπ}，值域 R，周期 π。五点法作 y=sin x 图象：(0,0)、(π/2,1)、(π,0)、(3π/2,-1)、(2π,0)。"}, {"title": "函数 y=A sin(ωx+φ)", "content": "振幅 A、周期 T=2π/|ω|、频率 f=1/T、相位 ωx+φ、初相 φ。“五点法”或变换法作图：由 y=sin x 经平移、伸缩得到。"}], "exam_points": [{"title": "三角函数定义与同角关系", "content": "由终边上点求三角函数值；知一求二（结合 sin²+cos²=1 与象限符号）。"}, {"title": "诱导公式化简求值", "content": "用诱导公式化任意角三角函数为锐角三角函数；条件求值。"}, {"title": "图象与性质", "content": "求 y=A sin(ωx+φ) 的周期、单调区间、对称中心；图象变换（平移、伸缩顺序）；由图象求解析式。"}], "examples": [{"title": "知一求二", "question": "已知 sinα=3/5，α 为第二象限角，求 cosα 与 tanα。", "analysis": "由同角关系 sin²+cos²=1 及象限符号求 cosα，再求 tanα。", "answer": "sin²α+cos²α=1，cos²α=1-9/25=16/25，α 在第二象限故 cosα<0，cosα=-4/5，tanα=sinα/cosα=(3/5)/(-4/5)=-3/4。"}, {"title": "求解析式", "question": "函数 y=A sin(ωx+φ) (A>0,ω>0) 图象最高点 (1,2)，相邻最低点 (5,-2)，求 A 与周期，并指出 ω。", "analysis": "A 为振幅即最高点纵坐标；相邻最高与最低横坐标之差为半个周期。", "answer": "由最高点纵坐标得 A=2。相邻最高点与最低点横坐标差 5-1=4 为 T/2，故 T=8，ω=2π/T=2π/8=π/4。"}]}]}, {"name": "必修第二册", "chapters": [{"id": "math_2_6", "title": "第六章 平面向量及其应用", "summary": "向量是兼具几何与代数特征的重要工具。本章学习向量的概念、线性运算、基本定理、坐标表示与数量积，并用于解决平面几何与物理问题。", "knowledge": [{"title": "向量的概念", "content": "既有大小又有方向的量叫向量，用有向线段表示。向量 AB 的大小叫模，记 |AB|。零向量 0 模为 0 方向任意；单位向量模为 1；平行向量（共线向量）方向相同或相反；相等向量长度相等方向相同。"}, {"title": "向量的线性运算", "content": "加法满足三角形法则（首尾相接）与平行四边形法则（同起点）；减法 a-b=a+(-b)；数乘 λa：λ>0 同向，λ<0 反向，模为 |λ||a|。运算律：交换律、结合律、分配律。"}, {"title": "共线向量定理", "content": "向量 a (a≠0) 与 b 共线 ⇔ 存在唯一实数 λ 使 b=λa。用于三点共线判定。"}, {"title": "平面向量基本定理", "content": "若 e1,e2 是同一平面内两个不共线向量，则该平面任一向量 a 都可唯一表示为 a=λ1 e1+λ2 e2。{e1,e2} 叫一组基底。"}, {"title": "平面向量的坐标表示", "content": "在直角坐标系中 a=(x,y)。加减：a±b=(x1±x2,y1±y2)；数乘 λa=(λx,λy)；a∥b ⇔ x1y2-x2y1=0。中点坐标公式。"}, {"title": "数量积", "content": "a·b=|a||b|cosθ (θ 为夹角)。坐标：a·b=x1x2+y1y2。性质：a·b=0 ⇔ a⊥b；|a|=√(a·a)；cosθ=(a·b)/(|a||b|)。投影：|a|cosθ 为 a 在 b 方向上的投影数量。"}], "exam_points": [{"title": "线性运算与共线", "content": "用基底表示向量；三点共线与向量共线判定求参数。"}, {"title": "坐标运算", "content": "坐标加减数乘；平行与垂直的坐标条件求参数。"}, {"title": "数量积应用", "content": "求模、夹角、判断垂直；用坐标求数量积。"}], "examples": [{"title": "数量积求夹角", "question": "已知 a=(1,2)，b=(-3,4)，求 a 与 b 的夹角 θ。", "analysis": "用坐标公式求数量积与模，再由 cosθ 公式计算。", "answer": "a·b=1×(-3)+2×4=5，|a|=√5，|b|=5，cosθ=5/(5√5)=1/√5=√5/5，故 θ=arccos(√5/5)。"}, {"title": "共线求参数", "question": "已知 a=(1,2)，b=(m,4)，且 a∥b，求 m。", "analysis": "由平行的坐标条件 x1y2-x2y1=0 列方程。", "answer": "a∥b ⇔ 1×4-2×m=0，得 m=2。"}]}, {"id": "math_2_7", "title": "第七章 复数", "summary": "在实数系基础上引入虚数单位 i，建立复数概念，学习复数的几何意义与代数形式的四则运算。", "knowledge": [{"title": "复数的概念", "content": "形如 z=a+bi (a,b∈R) 的数叫复数，i²=-1。a 为实部，b 为虚部。b=0 时为实数，b≠0 时为虚数，a=0 且 b≠0 为纯虚数。两复数相等当且仅当实部、虚部分别相等。"}, {"title": "复数的几何意义", "content": "复数 z=a+bi 与复平面内点 Z(a,b) 一一对应，也与向量 OZ 一一对应。|z|=√(a²+b²) 为模。共轭复数 z̄=a-bi。"}, {"title": "复数的四则运算", "content": "(a+bi)±(c+di)=(a±c)+(b±d)i；(a+bi)(c+di)=(ac-bd)+(ad+bc)i；除法分子分母同乘分母共轭。i 的幂周期：i¹=i, i²=-1, i³=-i, i⁴=1。"}], "exam_points": [{"title": "复数概念与分类", "content": "由实部虚部条件确定复数类别；复数相等求参数。"}, {"title": "复数运算", "content": "代数形式四则运算与化简；i 的幂运算；复数模与共轭。"}, {"title": "几何意义", "content": "复数与点、向量的对应；模的几何意义。"}], "examples": [{"title": "复数相等", "question": "已知 (1+i)x+(2-3i)y=3+4i (x,y∈R)，求 x,y。", "analysis": "整理为 (x+2y)+i(x-3y) 形式，由复数相等实部虚部分别相等列方程组。", "answer": "整理得 (x+2y)+i(x-3y)=3+4i，故 x+2y=3，x-3y=4，解得 x=17/5，y=-1/5。"}, {"title": "复数除法", "question": "计算 (2+i)/(1-i)。", "analysis": "分子分母同乘分母的共轭 1+i 化简。", "answer": "(2+i)(1+i)/((1-i)(1+i))=(2+2i+i+i²)/(1-i²)=(1+3i)/2=1/2+3/2 i。"}]}, {"id": "math_2_8", "title": "第八章 立体几何初步", "summary": "认识基本立体图形，用斜二测画法画直观图，研究空间点、线、面的位置关系及平行、垂直的判定与性质。", "knowledge": [{"title": "基本立体图形", "content": "多面体：棱柱、棱锥、棱台；旋转体：圆柱、圆锥、圆台、球。棱柱：两底面全等且平行，侧棱平行且相等。棱锥：一底面是多边形，侧面是三角形。"}, {"title": "直观图与三视图", "content": "斜二测画法：x 轴、y 轴夹角 45°（或 135°），平行 x 轴长度不变，平行 y 轴长度减半。三视图：正视图、侧视图、俯视图，遵循“长对正、高平齐、宽相等”。"}, {"title": "平面的基本性质", "content": "公理1：一条直线上两点在平面内则整条直线在平面内；公理2：不共线三点确定一平面（及推论）；公理3：两平面若有一个公共点则交于过该点的一条直线。"}, {"title": "空间中的平行", "content": "线面平行判定：平面外一条直线与平面内一条直线平行则该直线与此平面平行。线面平行性质：若直线与平面平行，过该直线的平面与原平面相交，则交线与该直线平行。面面平行判定与性质。"}, {"title": "空间中的垂直", "content": "线面垂直判定：一条直线与平面内两条相交直线都垂直则与平面垂直。性质：垂直于同一平面的两直线平行。面面垂直判定：一平面经过另一平面的一条垂线。三垂线定理及逆定理。"}, {"title": "空间角与距离", "content": "异面直线所成角（平移后夹角，范围 (0°,90°]）；线面角（斜线与射影夹角，[0°,90°]）；二面角（用平面角度量）。点到平面距离。"}], "exam_points": [{"title": "三视图与直观图", "content": "由三视图还原几何体求体积表面积；斜二测画法还原原图形面积。"}, {"title": "平行垂直的证明", "content": "用判定定理证明线面、面面平行与垂直；性质定理的综合应用。"}, {"title": "空间角计算", "content": "求线面角、二面角；几何体体积与表面积。"}], "examples": [{"title": "线面垂直证明", "question": "在正方体 ABCD-A1B1C1D1 中，证明 A1C⊥平面 BC1D。", "analysis": "只需证 A1C 与平面 BC1D 内两条相交直线 BD、BC1 都垂直。", "answer": "连 A1C，由正方体知 A1A⊥底面 ABCD，故 A1C 在底面射影为 AC，又 AC⊥BD，由三垂线定理 A1C⊥BD；同理连 A1B，射影 AB⊥BC，由三垂线定理 A1C⊥BC1。BD∩BC1=B，故 A1C⊥平面 BC1D。"}, {"title": "三视图求体积", "question": "某几何体三视图均为直角三角形，俯视图为两直角边为 2,2 的等腰直角三角形，正视图两直角边为 2,2，求体积。", "analysis": "三视图还原为底面是等腰直角三角形、高为 2 的三棱锥。", "answer": "该几何体为三棱锥，底面积 S=½×2×2=2，高 h=2，体积 V=⅓Sh=⅓×2×2=4/3。"}]}, {"id": "math_2_9", "title": "第九章 统计", "summary": "学习简单随机抽样与分层随机抽样，用样本的频率分布和数字特征估计总体。", "knowledge": [{"title": "随机抽样", "content": "简单随机抽样：抽签法、随机数法，每个个体入样机会相等。分层随机抽样：总体按差异分成互不重叠的层，按比例在各层内独立简单随机抽样，适用于层间差异明显的情况。"}, {"title": "频率分布直方图", "content": "横轴为分组，纵轴为频率/组距，小矩形面积=频率，总面积为 1。可估计众数（最高矩形中点）、中位数（面积累计 0.5 处）、平均数（每组中值×频率之和）。"}, {"title": "样本数字特征", "content": "平均数 x̄=(Σxi)/n；方差 s²=[Σ(xi-x̄)²]/n，标准差 s=√s²。方差/标准差越大，数据离散程度越大。众数、中位数、平均数刻画集中趋势。"}], "exam_points": [{"title": "抽样方法", "content": "分层抽样按比例分配样本量与抽取个数。"}, {"title": "频率分布直方图", "content": "由直方图求频率、频数、众数、中位数、平均数。"}, {"title": "数字特征", "content": "求平均数、方差；数据变化对方差标准差的影响。"}], "examples": [{"title": "分层抽样", "question": "某校高一 1200 人，高二 1000 人，高三 800 人，用分层抽样抽取 60 人，求高一抽取人数。", "analysis": "按年级人数比例分配样本量。", "answer": "抽样比 60/3000=1/50，高一抽取 1200×1/50=24 人。"}, {"title": "直方图求平均数", "question": "频率分布直方图共 4 组，组中值分别为 25,35,45,55，对应频率 0.2,0.4,0.3,0.1，求平均数。", "analysis": "平均数为各组中值乘以对应频率之和。", "answer": "x̄=25×0.2+35×0.4+45×0.3+55×0.1=5+14+13.5+5.5=38。"}]}, {"id": "math_2_10", "title": "第十章 概率", "summary": "从随机试验出发建立概率概念，学习古典概型与概率的基本性质，理解频率与概率的关系。", "knowledge": [{"title": "随机事件与样本空间", "content": "随机试验的所有可能结果构成样本空间 Ω，每个结果为样本点，事件是样本空间的子集。不可能事件 ∅ 概率为 0，必然事件 Ω 概率为 1。事件关系：包含、相等、互斥、对立（对立必互斥，互斥未必对立）。"}, {"title": "概率的基本性质", "content": "0≤P(A)≤1；若 A⊆B 则 P(A)≤P(B)；互斥事件 P(A∪B)=P(A)+P(B)；对立事件 P(A)+P(Ā)=1。"}, {"title": "古典概型", "content": "特征：有限性、等可能性。P(A)=A 包含的样本点数/样本空间样本点总数。常用列举法、列表法、树状图计数。"}, {"title": "频率与概率", "content": "频率是试验中事件发生的次数比，随试验变化；概率是理论值。大量重复试验中频率稳定于概率附近，可作为概率的估计。"}], "exam_points": [{"title": "事件关系与概率性质", "content": "互斥、对立的判定；用概率性质求概率。"}, {"title": "古典概型", "content": "列举法求基本事件数；游戏公平性、抽取问题。"}, {"title": "频率估计概率", "content": "由频率分布估计概率；大量试验的稳定性。"}], "examples": [{"title": "古典概型", "question": "先后掷两枚骰子，求点数之和为 7 的概率。", "analysis": "列举使和为 7 的样本点数，除以总样本点数 36。", "answer": "和为 7 的组合 (1,6)(2,5)(3,4)(4,3)(5,2)(6,1) 共 6 个，总样本点 36，P=6/36=1/6。"}, {"title": "对立事件", "question": "袋中有 3 红 2 白球，一次取 2 球，求至少有 1 个红球的概率。", "analysis": "“至少 1 红”的对立事件是“两球全白”，用对立事件计算更简便。", "answer": "P(全白)=C(2,2)/C(5,2)=1/10，故 P(至少1红)=1-1/10=9/10。"}]}]}]}, {"subject": "英语", "books": [{"name": "必修第一册", "chapters": [{"id": "en_1_0", "title": "Welcome Unit 初高中衔接", "summary": "衔接初高中英语，复习基本句型结构、学习策略与校园生活词汇。", "knowledge": [{"title": "五大基本句型", "content": "①S+V（主谓）②S+V+O（主谓宾）③S+V+IO+DO（主谓双宾）④S+V+O+C（主谓宾补）⑤S+V+P（主系表）。分析句子先找谓语动词，再判断结构。"}, {"title": "校园生活词汇", "content": "campus 校园, lecture 讲座, registration 注册, dormitory 宿舍, exchange 交流, strategy 策略, flashcard 抽认卡, take notes 记笔记, concentrate on 专注。"}, {"title": "学习策略", "content": "扩大词汇量（构词法、语境记忆）；坚持听说读写训练；建立错题本；用英语记日记；利用词典与语料。"}], "exam_points": [{"title": "句型分析", "content": "判断句子结构，划分句子成分（主谓宾定状补表）。"}, {"title": "词义推断", "content": "阅读中通过构词法、上下文、同义反义推断生词含义。"}], "examples": [{"title": "句型判断", "question": "指出 \"She bought me a dictionary.\" 的句型。", "analysis": "bought 为谓语，me 为间接宾语，a dictionary 为直接宾语。", "answer": "S+V+IO+DO（主谓双宾结构）。"}]}, {"id": "en_1_1", "title": "Unit 1 Teenage Life 青少年生活", "summary": "话题：青少年生活与课外活动。语法：复习时态。写作：建议信。", "knowledge": [{"title": "重点词汇", "content": "volunteer 志愿者, debate 辩论, prefer 更喜欢, suitable 合适的, challenge 挑战, schedule 日程, quit 放弃, responsible 负责任的, generation 一代人, attract 吸引, focus 集中, advance 进步。"}, {"title": "重点短语", "content": "prefer...to... 喜欢……胜过……, sign up for 报名参加, be suitable for 适合, focus on 集中于, be responsible for 对……负责, hand out 分发, be addicted to 沉迷于, get used to 习惯于。"}, {"title": "核心句型", "content": "①I prefer... to... ②The reason why... is that... ③It is + adj. + for sb. to do sth. ④You'd better (not) do...（表建议）。"}, {"title": "语法：复习时态", "content": "一般现在时表习惯真理；一般过去时表过去事实；现在进行时表进行；现在完成时表过去动作对现在的影响；一般将来时表将来。注意时间状语搭配与主从句时态呼应。"}], "exam_points": [{"title": "词汇与短语", "content": "prefer/preference 词形变化；be addicted to 后接动名词；focus 与 concentrate 辨析。"}, {"title": "时态", "content": "依据语境与时间状语选择正确时态，注意主从句时态一致。"}, {"title": "建议信写作", "content": "格式（称呼、正文、结尾）；常用句式 I suggest/recommend that..., It is advisable to..., Why not...?。"}], "examples": [{"title": "时态选择", "question": "用适当形式填空：He ______ (join) the chess club last term and ______ (be) a member ever since.", "analysis": "前句 last term 用一般过去时；后句 ever since 提示现在完成时。", "answer": "joined; has been。"}, {"title": "建议句式", "question": "翻译：我建议你报名参加辩论社。", "analysis": "suggest 后从句用 (should)+动词原形。", "answer": "I suggest that you (should) sign up for the debate club."}]}, {"id": "en_1_2", "title": "Unit 2 Travelling Around 旅游", "summary": "话题：旅游与目的地。语法：现在进行时表将来。写作：旅行计划/游记。", "knowledge": [{"title": "重点词汇", "content": "destination 目的地, amazing 令人惊叹的, ancient 古老的, narrow 狭窄的, flight 航班, accommodation 住宿, unique 独特的, official 官方的, emperor 皇帝, site 遗址, economy 经济。"}, {"title": "重点短语", "content": "apply for 申请, take control of 控制, other than 除了, make up 构成/编造, check in 办理登记, check out 结账离开, be famous for 因……著名, package tour 跟团游。"}, {"title": "核心句型", "content": "①be doing sth. 表按计划即将发生 ②It is amazing that... ③主语 + be + to do（表计划安排）。"}, {"title": "语法：现在进行时表将来", "content": "come, go, arrive, leave, start, fly, travel 等位移动词的现在进行时可表示按计划即将发生的动作。如 I am leaving for Beijing tomorrow."}], "exam_points": [{"title": "现在进行时表将来", "content": "位移动词进行时表将来；与 be going to / be to do 的区别。"}, {"title": "词汇运用", "content": "amaze/amazed/amazing 辨析（-ing 修饰物，-ed 修饰人）；apply/application 词族。"}, {"title": "旅行计划写作", "content": "用现在进行时描述行程，条理清晰，包含交通、住宿、景点。"}], "examples": [{"title": "语法填空", "question": "My flight ______ (take off) at 9:00 tomorrow morning.", "analysis": "位移动词 take off 进行时表按计划将来。", "answer": "is taking off。"}, {"title": "词形辨析", "question": "用 amaze 适当形式填空：The view was ______ and we were ______ at it.", "analysis": "amazing 修饰物，amazed 修饰人。", "answer": "amazing; amazed。"}]}, {"id": "en_1_3", "title": "Unit 3 Sports and Fitness 运动与健康", "summary": "话题：体育运动与健康生活。语法：反意疑问句。写作：健康生活方式比较。", "knowledge": [{"title": "重点词汇", "content": "fitness 健康, champion 冠军, determine 决心, injured 受伤的, captain 队长, graceful 优雅的, strength 力量, failure 失败, compete 竞争, pretend 假装, diet 饮食, balanced 平衡的。"}, {"title": "重点短语", "content": "make it 成功/赶到, work out 锻炼, give up 放弃, lose weight 减肥, rather than 而不是, cut out 戒除, compare...to... 把……比作, make a difference 起作用。"}, {"title": "核心句型", "content": "①Instead of doing..., sb. does... ②The more..., the more... ③It is up to sb. to do sth.。"}, {"title": "语法：反意疑问句", "content": "前肯后否、前否后肯；be/助/情态动词与主句一致。特殊情况：let's 用 shall we；祈使句用 will you；nothing/nobody 等否定词后用肯定；I think/believe 后反问与从句主语一致。"}], "exam_points": [{"title": "反意疑问句", "content": "依据主句谓语与否定词确定反问部分；特殊句型（let's, 祈使, 主从复合句）的用法。"}, {"title": "词汇辨析", "content": "compete/competition/competitive；injure/wound/hurt。"}, {"title": "健康话题写作", "content": "比较不同生活方式，提出建议，结构对比清晰。"}], "examples": [{"title": "反意疑问句", "question": "完成反意疑问句：He has never been to the gym, ______?", "analysis": "前句有 never 否定词，反问部分用肯定；谓语 has 为助动词。", "answer": "has he。"}, {"title": "句型翻译", "question": "翻译：你锻炼得越多，就越健康。", "analysis": "用 The more..., the more... 句型。", "answer": "The more you work out, the healthier you will be."}]}, {"id": "en_1_4", "title": "Unit 4 Natural Disasters 自然灾害", "summary": "话题：自然灾害与救援。语法：限制性定语从句（关系代词）。写作：灾害报道/新闻报道。", "knowledge": [{"title": "重点词汇", "content": "disaster 灾难, earthquake 地震, rescue 救援, shelter 庇护所, survive 幸存, destroy 破坏, affect 影响, effort 努力, emergency 紧急情况, supply 供应, summary 摘要, significant 重大的。"}, {"title": "重点短语", "content": "in ruins 严重受损, as if 仿佛, come to an end 结束, in shock 震惊, dig out 掘出, sweep away 冲走, suffer from 遭受, provide sth. for sb. 为某人提供某物。"}, {"title": "核心句型", "content": "①It seemed as if... ②There were... doing sth. ③The number of... who/which...（定语从句）。"}, {"title": "语法：限制性定语从句（关系代词）", "content": "who 指人作主/宾，whom 指人作宾，which 指物，that 指人或物，whose 表所属（人/物均可）。作宾语可省略。that 与 which 区别：只用 that 的情况（最高级、序数词修饰、不定代词先行词、人和物并列先行词等）。"}], "exam_points": [{"title": "定语从句关系代词", "content": "选用正确关系代词；that 与 which 的辨析；whose 的用法。"}, {"title": "词汇运用", "content": "destroy/ruin/damage 辨析；survive/survival/survivor 词族。"}, {"title": "新闻写作", "content": "新闻要素（when/where/who/what/why/how）；语言客观简洁。"}], "examples": [{"title": "定语从句", "question": "用关系代词填空：The earthquake ______ struck the city caused great damage.", "analysis": "先行词 earthquake 指物，在从句中作主语，可用 that 或 which。", "answer": "that / which。"}, {"title": "that 与 which", "question": "This is the most terrible disaster ______ I have ever experienced.（填关系代词）", "analysis": "先行词被最高级修饰，只用 that。", "answer": "that。"}]}, {"id": "en_1_5", "title": "Unit 5 Languages Around the World 世界语言", "summary": "话题：世界语言与汉字发展。语法：限制性定语从句（关系副词与介词+关系代词）。写作：语言学习经验。", "knowledge": [{"title": "重点词汇", "content": "symbol 符号, classic 经典的, regard 看作, variety 多样性, major 主要的, native 本地的, attitude 态度, official 官方的, appreciate 欣赏, demand 要求, vocabulary 词汇。"}, {"title": "重点短语", "content": "regard...as... 把……看作, refer to 指的是/提到, date back to 追溯到, be based on 基于, no matter 不管, point of view 观点, depend on 依赖。"}, {"title": "核心句型", "content": "①even though/if 即使 ②no matter + 疑问词 ③the way (in which/that) + 定语从句。"}, {"title": "语法：关系副词与介词+关系代词", "content": "when 表时间 (=at/in/on which)，where 表地点 (=in/at which)，why 表原因 (=for which)。介词+which/whom：根据动词搭配或先行词确定介词。关系副词可用 that 替换，作状语不可省略。"}], "exam_points": [{"title": "关系副词", "content": "区分关系代词与关系副词（看在从句中作主宾还是状语）；when/where/why 的选用。"}, {"title": "介词+关系代词", "content": "根据搭配确定介词；which 指物 whom 指人。"}, {"title": "词汇与句型", "content": "no matter 与 however 的转换；regard...as...。"}], "examples": [{"title": "关系副词", "question": "填空：This is the school ______ I studied for three years.", "analysis": "先行词 school 表地点，从句缺地点状语，用 where。", "answer": "where。"}, {"title": "介词+关系代词", "question": "填空：The person ______ ______ I talked is our English teacher.", "analysis": "talk to sb. 搭配，介词用 to，指人用 whom。", "answer": "to; whom。"}]}]}, {"name": "必修第二册", "chapters": [{"id": "en_2_1", "title": "Unit 1 Cultural Heritage 文化遗产", "summary": "话题：文化遗产保护（以阿斯旺大坝神庙搬迁为例）。语法：限制性定语从句（复习）。写作：保护文化遗产倡议。", "knowledge": [{"title": "重点词汇", "content": "heritage 遗产, temple 寺庙, preserve 保护, promote 促进, balance 平衡, protest 抗议, committee 委员会, establish 建立, limit 限制, conduct 进行, document 文件/记录。"}, {"title": "重点短语", "content": "give way to 让步于, turn to 求助于, take apart 拆开, piece by piece 一块块地, contribute to 有助于, be likely to 可能, in turn 依次。"}, {"title": "核心句型", "content": "①Not only...but also...（部分倒装） ②There comes a time when... ③It is worthwhile to do...。"}, {"title": "语法：定语从句复习", "content": "综合运用关系代词与关系副词；非限制性定语从句初步认识（用逗号隔开，补充说明，不可用 that）。"}], "exam_points": [{"title": "定语从句综合", "content": "限制性与非限制性定语从句辨析；关系词选用与省略。"}, {"title": "倒装句", "content": "not only...but also 置于句首引起部分倒装。"}, {"title": "应用文写作", "content": "倡议书结构与呼吁句式。"}], "examples": [{"title": "倒装", "question": "用倒装改写：Not only ______ ______ (he/protect) the temple, but he also raised funds.", "analysis": "Not only 置于句首，主句部分倒装，用助动词 did。", "answer": "did he protect。"}]}, {"id": "en_2_2", "title": "Unit 2 Wildlife Protection 野生动植物保护", "summary": "话题：野生动植物保护。语法：现在进行时的被动语态。写作：保护动物短文。", "knowledge": [{"title": "重点词汇", "content": "wildlife 野生动物, species 物种, endangered 濒危的, habitat 栖息地, reserve 保护区, adapt 适应, exist 存在, attack 攻击, recover 恢复, concern 担忧, harmony 和谐。"}, {"title": "重点短语", "content": "die out 灭绝, be concerned about 关心, adapt to 适应, under pressure 在压力下, be aware of 意识到, on average 平均, make progress 取得进步。"}, {"title": "核心句型", "content": "①...is being done（正在进行被动） ②It is high time that sb. did sth. ③Only by doing... can we...（部分倒装）。"}, {"title": "语法：现在进行时被动语态", "content": "结构 am/is/are + being + 过去分词，表示正在被进行的动作。如 The bridge is being built now. 注意：being 不可遗漏。"}], "exam_points": [{"title": "现在进行时被动", "content": "结构辨析与填空；与一般现在时被动、现在完成时被动的区别。"}, {"title": "词汇", "content": "adapt/adopt 辨析；die out/die of/die from 区别。"}, {"title": "倒装", "content": "only + 状语前置的部分倒装。"}], "examples": [{"title": "被动语态", "question": "填空：The old church ______ ______ ______ (repair) at present.", "analysis": "at present 提示现在进行，主语被修用被动。", "answer": "is being repaired。"}, {"title": "倒装", "question": "改写：Only by working together ______ ______ (we/save) these animals.", "analysis": "Only+状语前置引起部分倒装。", "answer": "can we save。"}]}, {"id": "en_2_3", "title": "Unit 3 The Internet 互联网", "summary": "话题：互联网与生活。语法：现在完成时的被动语态。写作：网络利弊议论文。", "knowledge": [{"title": "重点词汇", "content": "convenient 方便的, benefit 利益, privacy 隐私, identity 身份, update 更新, confirm 确认, distance 距离, addicted 上瘾的, battery 电池, discount 折扣。"}, {"title": "重点短语", "content": "keep track of 跟踪, keep sb. company 陪伴, now that 既然, have access to 有权使用, in shape 状况良好, belong to 属于。"}, {"title": "核心句型", "content": "①...has/have been done（现在完成被动） ②It is the first time that...has/have done ③so...that...。"}, {"title": "语法：现在完成时被动语态", "content": "结构 has/have + been + 过去分词，表示过去已完成且对现在有影响的被动动作。如 The work has been finished."}], "exam_points": [{"title": "现在完成时被动", "content": "结构辨析；与一般过去时被动的区别（看是否对现在有影响）。"}, {"title": "议论文写作", "content": "利弊分析结构：引出话题—利—弊—结论；连接词 however, on the other hand, in addition。"}, {"title": "词汇辨析", "content": "benefit from/by；convenient 不能以人作主语。"}], "examples": [{"title": "被动语态", "question": "填空：All the tickets ______ ______ ______ (sell) online so far.", "analysis": "so far 提示现在完成，tickets 被售用被动。", "answer": "have been sold。"}, {"title": "时态句型", "question": "翻译：这是我第一次参观故宫。", "analysis": "It is the first time that... 后用现在完成时。", "answer": "It is the first time that I have visited the Palace Museum."}]}, {"id": "en_2_4", "title": "Unit 4 History and Traditions 历史与传统", "summary": "话题：英国历史与传统文化。语法：过去分词作定语和宾补。写作：地点/景点介绍。", "knowledge": [{"title": "重点词汇", "content": "ancestor 祖先, philosopher 哲学家, individual 个人, belong 属于, evidence 证据, achieve 达到, generous 慷慨的, position 位置, fascinating 迷人的, landscape 风景。"}, {"title": "重点短语", "content": "belong to 属于, as well as 也, be proud of 以……为豪, break away from 脱离, result in 导致, leave behind 留下。"}, {"title": "核心句型", "content": "①过去分词短语作后置定语 ②have/get sth. done ③with + 宾语 + 过去分词（宾补）。"}, {"title": "语法：过去分词作定语与宾补", "content": "作定语：单个词前置（fallen leaves 落叶），短语后置（the book written by him）；及物动词过去分词表被动完成。作宾补：have/get sth. done（使某事被做），表状态或被动。"}], "exam_points": [{"title": "过去分词作定语", "content": "区分现在分词与过去分词作定语（主动进行 vs 被动完成）；位置。"}, {"title": "过去分词作宾补", "content": "have/get sth. done 结构；与 doing 宾补的区别。"}, {"title": "地点介绍写作", "content": "位置、历史、特色、感受；现在/过去分词丰富表达。"}], "examples": [{"title": "过去分词作定语", "question": "填空：The building ______ (build) in 1900 is still in use.", "analysis": "build 与 building 为被动关系，且已完成，用过去分词。", "answer": "built。"}, {"title": "宾补结构", "question": "翻译：我昨天让人修了电脑。", "analysis": "have sth. done 表使某事被做。", "answer": "I had the computer repaired yesterday."}]}, {"id": "en_2_5", "title": "Unit 5 Music 音乐", "summary": "话题：音乐与虚拟合唱团。语法：过去分词作状语。写作：音乐的影响短文。", "knowledge": [{"title": "重点词汇", "content": "perform 表演, stage 舞台, award 奖项, composition 作品, capable 有能力的, phenomenon 现象, treatment 治疗, relief 缓解, thus 因此, equipment 设备。"}, {"title": "重点短语", "content": "fall in love with 爱上, be capable of 能够, in addition to 除……之外, take part in 参加, come up with 想出, from then on 从那时起。"}, {"title": "核心句型", "content": "①过去分词作状语（时间/原因/条件/让步） ②It is said that... ③Not only...but also...。"}, {"title": "语法：过去分词作状语", "content": "过去分词作状语表被动、完成，逻辑主语与主句主语一致。如 Given more time, I could do better. 否定用 Not given。注意与现在分词作状语区分（主动 vs 被动）。"}], "exam_points": [{"title": "过去分词作状语", "content": "判断分词与主语关系选 doing/done；分词作状语的否定与位置。"}, {"title": "词汇", "content": "perform/performance；award/reward 辨析。"}, {"title": "写作", "content": "用分词状语使句式多样。"}], "examples": [{"title": "分词作状语", "question": "填空：______ (give) another chance, he would succeed.", "analysis": "give 与 he 为被动关系，作条件状语用过去分词。", "answer": "Given。"}, {"title": "分词选择", "question": "填空：______ (face) with difficulties, she didn't give up.", "analysis": "be faced with 固定搭配，作状语用 faced。", "answer": "Faced。"}]}]}, {"name": "必修第三册", "chapters": [{"id": "en_3_1", "title": "Unit 1 Festivals and Celebrations 节日", "summary": "话题：世界节日与庆祝。语法：情态动词。写作：节日介绍。", "knowledge": [{"title": "重点词汇", "content": "festival 节日, celebrate 庆祝, origin 起源, religious 宗教的, custom 习俗, gather 聚集, feast 盛宴, gratitude 感激, joy 喜悦, decorate 装饰, symbol 象征。"}, {"title": "重点短语", "content": "in spite of 尽管, range from...to... 范围从……到……, dress up 打扮, after all 毕竟, be grateful for 感激, figure out 弄明白。"}, {"title": "核心句型", "content": "①情态动词表能力、许可、必须、建议 ②No matter how... ③It is a time when...。"}, {"title": "语法：情态动词", "content": "can/could 表能力或许可；may/might 表许可或推测；must 表必须（否定 needn't 不必）；should/ought to 表建议；shall 表征求意见或命令；will/would 表意愿。推测：must be 一定是，can't be 不可能是。"}], "exam_points": [{"title": "情态动词", "content": "基本用法与辨析；表推测的用法（must/can't/may）；must 与 have to 的区别。"}, {"title": "词汇", "content": "celebrate/celebration；custom/habit 辨析。"}, {"title": "节日介绍写作", "content": "时间、起源、活动、意义。"}], "examples": [{"title": "情态动词", "question": "填空：You ______ not park here; it's forbidden.", "analysis": "禁止停车，表必须不，用 must。", "answer": "must。"}, {"title": "推测", "question": "改写：I'm sure he is the thief. → He ______ be the thief.", "analysis": "肯定推测用 must。", "answer": "must。"}]}, {"id": "en_3_2", "title": "Unit 2 Morals and Virtues 道德与美德", "summary": "话题：道德困境与美德（以林巧稚为例）。语法：情态动词表推测。写作：美德故事/观点。", "knowledge": [{"title": "重点词汇", "content": "moral 道德的, virtue 美德, dilemma 困境, faint 晕倒, complain 抱怨, respond 回应, reject 拒绝, tend 照顾, retire 退休, principle 原则, significant 重要的。"}, {"title": "重点短语", "content": "carry sb. through 帮某人渡过难关, in trouble 处于困境, be known for 因……闻名, first aid 急救, in despair 绝望, be responsible for 对……负责。"}, {"title": "核心句型", "content": "①情态动词表推测（must/may/might/can't + do/be doing/have done） ②It is worthwhile to do... ③Rather than..., sb. did...。"}, {"title": "语法：情态动词表推测", "content": "肯定推测 must（一定）、may/might（可能）；否定推测 can't（不可能）。对现在推测 + do/be doing，对过去推测 + have done。如 He must have finished it yesterday."}], "exam_points": [{"title": "情态动词表推测", "content": "依据肯定/否定选 must/can't/may；时态搭配（have done 表过去）。"}, {"title": "词汇", "content": "respond/response；reject/refuse 辨析。"}, {"title": "写作", "content": "叙述美德故事，夹叙夹议。"}], "examples": [{"title": "推测过去", "question": "填空：The ground is wet. It ______ ______ rained last night.", "analysis": "对过去肯定推测用 must have done。", "answer": "must have。"}, {"title": "否定推测", "question": "填空：He ______ be at home; I just saw him at school.", "分析": "否定推测用 can't。", "answer": "can't。"}]}, {"id": "en_3_3", "title": "Unit 3 Diverse Cultures 多元文化", "summary": "话题：多元文化（以旧金山为例）。语法：it 的用法。写作：城市/文化介绍。", "knowledge": [{"title": "重点词汇", "content": "diverse 多样的, fortune 财富, immigrant 移民, contain 包含, district 地区, material 材料, construction 建设, definitely 肯定地, historical 历史的, diverse 不同的。"}, {"title": "重点短语", "content": "head to 前往, seek one's fortune 寻找发财机会, a variety of 各种, bring about 引起, apart from 除了, settle in 定居于。"}, {"title": "核心句型", "content": "①It is + adj./n. + that... ②It takes sb. time to do... ③It is... that...（强调句）。"}, {"title": "语法：it 的用法", "content": "it 作形式主语（It is said that...）、形式宾语（find it hard to...）；强调句 It is/was + 强调部分 + that...；指代时间、天气、距离。判断强调句：去掉 It is/was...that 后句子仍完整。"}], "exam_points": [{"title": "it 用法", "content": "形式主语/宾语；强调句判断与改写；与定语从句区分。"}, {"title": "词汇", "content": "diverse/diversity；contain/include 辨析。"}, {"title": "文化介绍写作", "content": "特点、成因、表现、感受。"}], "examples": [{"title": "强调句", "question": "对画线部分强调：I met Tom in the park yesterday.（强调 in the park）", "分析": "强调句结构 It is/was + 强调部分 + that + 其余。", "answer": "It was in the park that I met Tom yesterday."}, {"title": "形式宾语", "question": "填空：I find ______ important to learn English well.", "分析": "it 作形式宾语，真正宾语为 to do。", "answer": "it。"}]}, {"id": "en_3_4", "title": "Unit 4 Space Exploration 太空探索", "summary": "话题：太空探索历程。语法：不定式。写作：太空探索意义议论文。", "knowledge": [{"title": "重点词汇", "content": "explore 探索, launch 发射, astronaut 宇航员, signal 信号, intelligent 智能的, determine 决心, independent 独立的, limited 有限的, vital 至关重要的, mystery 谜。"}, {"title": "重点短语", "content": "carry on 继续, on board 在船上/机上, as a result 结果, provide for 供养, in closing 最后, run out 用完。"}, {"title": "核心句型", "content": "①It is + adj. + for sb. to do ②To do... is...（不定式作主语） ③so as to / in order to 表目的。"}, {"title": "语法：不定式", "content": "不定式作主语（常以 it 作形式主语）、宾语、表语、定语（表将来）、状语（表目的、结果）。否定 not to do。注意：decide/hope/plan + to do；make up one's mind to do。"}], "exam_points": [{"title": "不定式", "content": "作各成分的辨析；不定式作定语与状语；to do 与 doing 区别。"}, {"title": "词汇", "content": "explore/exploration；determined/determine。"}, {"title": "议论文写作", "content": "明确观点，论据充分，逻辑清晰。"}], "examples": [{"title": "不定式作主语", "question": "改写：To master a language is necessary. → It is necessary ______.", "分析": "it 作形式主语，不定式后置。", "answer": "to master a language。"}, {"title": "不定式作目的状语", "question": "翻译：他早起是为了赶上首班车。", "分析": "表目的用不定式。", "answer": "He got up early to catch the first bus."}]}, {"id": "en_3_5", "title": "Unit 5 The Value of Money 金钱的价值", "summary": "话题：金钱的价值（以《百万英镑》为例）。语法：复习情态动词与不定式。写作：金钱观讨论/剧本片段。", "knowledge": [{"title": "重点词汇", "content": "value 价值, basis 基础, apologise 道歉, spot 发现, patience 耐心, manner 方式/礼貌, permission 允许, indeed 确实, hesitate 犹豫, reserve 预订。"}, {"title": "重点短语", "content": "as a matter of fact 事实上, on the basis of 在……基础上, take out a loan 贷款, in return 作为回报, be about to do 即将做, to be honest 老实说。"}, {"title": "核心句型", "content": "①be about to do... when... ②It is up to sb. to do ③情态动词 + have done（表对过去的推测或责备）。"}, {"title": "语法：复习情态动词与不定式", "content": "should have done 本该做却没做；ought to have done；could have done 本可以做；needn't have done 本不必做。不定式综合运用。"}], "exam_points": [{"title": "情态动词+have done", "content": "表责备/推测/虚拟的辨析；should/could/needn't have done。"}, {"title": "词汇", "content": "value/valuable；manner(s) 单复数含义。"}, {"title": "写作", "content": "金钱观议论；剧本对白格式。"}], "examples": [{"title": "情态动词+have done", "question": "填空：You ______ ______ (not/hurry); we still have plenty of time.", "分析": "本不必做用 needn't have done。", "answer": "needn't have hurried。"}, {"title": "句型", "question": "翻译：我刚要出门，这时电话响了。", "分析": "be about to do... when... 句型。", "answer": "I was about to go out when the phone rang."}]}]}]}, {"subject": "物理", "books": [{"name": "必修第一册", "chapters": [{"id": "ph_1_1", "title": "第一章 运动的描述", "summary": "建立质点、参考系、坐标系等概念，用位移、速度、加速度描述物体运动。", "knowledge": [{"title": "质点、参考系", "content": "质点：忽略物体大小和形状，把它看作有质量的点。物体能否看成质点视研究问题而定。参考系：用来作参考的物体，通常选地面或相对地面静止的物体。"}, {"title": "时刻与时间间隔", "content": "时刻对应时间轴上一点，时间间隔对应一段。位置是时刻对应，位移是时间间隔对应。"}, {"title": "位移与路程", "content": "位移描述位置变化，是矢量（从初位置指向末位置的有向线段）；路程是运动轨迹长度，是标量。单向直线运动中位移大小等于路程。"}, {"title": "速度", "content": "速度 v=Δx/Δt，矢量，方向与位移方向相同。平均速度＝位移/时间；瞬时速度是某一时刻（位置）的速度。速率是瞬时速度的大小（标量）。平均速率＝路程/时间。"}, {"title": "加速度", "content": "加速度 a=Δv/Δt，矢量，方向与速度变化量 Δv 方向相同。a 与 v 同向加速，反向减速。a 大小与 v 大小无必然联系。"}], "exam_points": [{"title": "质点模型", "content": "判断物体能否视为质点（看大小形状是否为次要因素）。"}, {"title": "矢量运算", "content": "位移、速度、加速度的矢量性，方向判断；Δv=v2−v1 的矢量运算（直线运动带正负号）。"}, {"title": "v-t 图象", "content": "斜率表加速度，面积表位移；截距、交点含义。"}], "examples": [{"title": "加速度与速度关系", "question": "汽车以 10 m/s 行驶，刹车 2 s 后速度变为 4 m/s，求加速度大小与方向。", "analysis": "取初速度方向为正，由 a=Δv/Δt 计算，符号表示方向。", "answer": "a=(4−10)/2=−3 m/s²，大小 3 m/s²，方向与初速度方向相反（减速）。"}, {"title": "v-t 图象", "question": "在 v-t 图象中，一物体速度随时间增大但增加得越来越慢，其加速度如何变化？", "analysis": "v-t 图象斜率表示加速度。", "answer": "速度增大说明加速度与速度同向；增加越来越慢说明斜率减小，即加速度逐渐减小但方向不变。"}]}, {"id": "ph_1_2", "title": "第二章 匀变速直线运动的研究", "summary": "研究匀变速直线运动的规律，包括速度、位移公式及自由落体运动，掌握逐差法处理纸带数据。", "knowledge": [{"title": "基本公式", "content": "速度公式 v=v0+at；位移公式 x=v0t+½at²；速度位移公式 v²−v0²=2ax。适用匀变速直线运动。"}, {"title": "重要推论", "content": "①中间时刻速度 vm=v/2=(v0+v)/2；②中间位置速度 vx=√((v0²+v²)/2)；③连续相等时间 T 内位移差 Δx=aT²（逐差法求 a）；④初速度为零的匀加速运动比例式。"}, {"title": "自由落体运动", "content": "初速度为零、加速度为 g（约 9.8 m/s²）的匀加速直线运动。v=gt，h=½gt²，v²=2gh。"}, {"title": "实验：探究小车速度随时间变化", "content": "用打点计时器获取纸带；用逐差法求加速度 a=Δx/T²；平衡摩擦力使细线拉力近似等于合力。"}], "exam_points": [{"title": "公式应用", "content": "运动学公式选择与计算；多过程问题（分段处理）。"}, {"title": "推论应用", "content": "Δx=aT² 逐差法；中间时刻速度等于平均速度。"}, {"title": "图象", "content": "v-t、x-t、x-v² 图象的识别与转换。"}], "examples": [{"title": "逐差法", "question": "纸带上连续相等时间 T 内的位移依次为 x1,x2,x3,x4，求加速度 a。", "analysis": "用逐差法取两段差除以总时间平方。", "answer": "a=[(x4−x2)+(x3−x1)]/(4T²)，或 a=(x4−x2)/(2T²)。"}, {"title": "自由落体", "question": "物体从高处自由下落，最后 1 s 内下落 25 m，求下落总时间（g=10 m/s²）。", "analysis": "设总时间 t，最后 1 s 位移＝总位移−前(t−1)s 位移。", "answer": "½gt²−½g(t−1)²=25，代入 g=10 得 5[2t−1]=25，t=3 s。"}]}, {"id": "ph_1_3", "title": "第三章 相互作用——力", "summary": "认识重力、弹力、摩擦力，学习力的合成与分解，掌握共点力平衡条件。", "knowledge": [{"title": "重力", "content": "G=mg，方向竖直向下。重心位置与质量分布有关，可用悬挂法测定。g 随纬度、高度变化。"}, {"title": "弹力", "content": "弹力产生条件：接触且发生弹性形变。方向垂直接触面（或沿绳）。胡克定律 F=kx，k 为劲度系数，x 为形变量。"}, {"title": "摩擦力", "content": "滑动摩擦力 Ff=μFN，方向与相对运动方向相反。静摩擦力大小在 0~Fmax 之间，由平衡或牛顿定律确定，方向与相对运动趋势相反。μ 与接触面粗糙程度有关，与压力、面积无关。"}, {"title": "力的合成与分解", "content": "遵循平行四边形定则。合力范围 |F1−F2|≤F≤F1+F2。正交分解：将力分解到两个互相垂直方向。"}, {"title": "共点力平衡", "content": "平衡条件：合力为零，即 ΣFx=0，ΣFy=0。三力平衡时三力可构成闭合三角形。"}], "exam_points": [{"title": "摩擦力分析", "content": "静摩擦与滑动摩擦的判断与计算；摩擦力方向判定。"}, {"title": "力的合成与分解", "content": "平行四边形定则计算；正交分解法解题；合力范围。"}, {"title": "平衡问题", "content": "用平衡条件求未知力；动态平衡分析（图解法、解析法）。"}], "examples": [{"title": "摩擦力计算", "question": "质量 2 kg 物体置于水平地面，μ=0.2，用 3 N 水平力拉它，求摩擦力（g=10）。", "analysis": "先判断是否运动：最大静摩擦近似 μmg=4 N > 3 N，物体静止。", "answer": "物体未动，受静摩擦力，由平衡得 Ff=3 N，方向与拉力相反。"}, {"title": "动态平衡", "question": "用轻绳将小球悬挂，用另一绳水平拉球使绳与竖直方向成 θ 角，θ 增大时各绳拉力如何变化？", "analysis": "用图解法或解析法，重力恒定。", "answer": "设悬绳拉力 F1、水平绳拉力 F2，由平衡 F1=mg/cosθ，F2=mg tanθ。θ 增大时 cosθ 减小、tanθ 增大，故 F1、F2 均增大。"}]}, {"id": "ph_1_4", "title": "第四章 运动和力的关系", "summary": "建立牛顿三大定律，用牛顿定律分析物体受力与运动的关系，解决超重失重等问题。", "knowledge": [{"title": "牛顿第一定律", "content": "一切物体总保持匀速直线运动状态或静止状态，除非作用在它上面的力迫使它改变。揭示了惯性，质量是惯性大小的量度。"}, {"title": "牛顿第二定律", "content": "物体加速度的大小与所受合力成正比、与质量成反比，方向与合力方向相同。F合=ma。矢量性、瞬时性。"}, {"title": "牛顿第三定律", "content": "两个物体之间的作用力和反作用力总是大小相等、方向相反、作用在两个物体上、同性质、同时产生消失。"}, {"title": "超重与失重", "content": "视重大于实重为超重（加速度向上）；视重小于实重为失重（加速度向下）；视重为零为完全失重（a=g 向下）。物体实际重力不变。"}, {"title": "整体法与隔离法", "content": "连接体问题：求整体加速度用整体法，求内力用隔离法。"}], "exam_points": [{"title": "牛顿第二定律应用", "content": "受力分析列 F=ma 求加速度或未知力；多过程问题。"}, {"title": "连接体问题", "content": "整体法与隔离法结合求加速度与相互作用力。"}, {"title": "超重失重", "content": "判断超失重状态及视重计算。"}], "examples": [{"title": "牛顿第二定律", "question": "质量 2 kg 物体受水平力 F=8 N，μ=0.1，求加速度（g=10）。", "analysis": "合力=F−μmg，由 F合=ma 求 a。", "answer": "F合=8−0.1×2×10=6 N，a=F合/m=6/2=3 m/s²。"}, {"title": "超重失重", "question": "电梯中的人站在体重计上，电梯由静止开始向上加速，体重计示数如何变化？", "analysis": "向上加速时人处于超重状态。", "answer": "向上加速时加速度向上，人受支持力 N−mg=ma，N=m(g+a)>mg，体重计示数变大（超重）。"}]}]}, {"name": "必修第二册", "chapters": [{"id": "ph_2_5", "title": "第五章 抛体运动", "summary": "研究曲线运动条件，平抛运动规律与一般抛体运动。", "knowledge": [{"title": "曲线运动", "content": "物体做曲线运动的条件：合力方向与速度方向不在同一直线上。速度方向沿轨迹切线方向。"}, {"title": "运动的合成与分解", "content": "合运动与分运动具有等时性、独立性。分运动、合运动都遵守平行四边形定则。"}, {"title": "平抛运动", "content": "初速度水平、只受重力的匀变速曲线运动。水平：匀速 vx=v0，x=v0t；竖直：自由落体 vy=gt，y=½gt²。合速度 v=√(vx²+vy²)，方向 tanθ=vy/vx。"}, {"title": "斜抛运动", "content": "可分解为水平匀速与竖直匀变速运动。射程、射高与抛射角有关，45° 射程最大（不计空气阻力）。"}], "exam_points": [{"title": "平抛规律", "content": "位移、速度计算；落地时间由高度决定 t=√(2h/g)，水平射程由 v0 和 h 决定。"}, {"title": "速度方向", "content": "某一时刻速度方向与位移方向不同；速度反向延长线交水平位移中点。"}, {"title": "合成与分解", "content": "小船渡河问题（渡河时间、最短位移）。"}], "examples": [{"title": "平抛", "question": "从高 20 m 处以 5 m/s 水平抛出物体，求落地时间、水平射程和落地速度（g=10）。", "分析": "竖直方向自由落体求时间，水平匀速求射程。", "answer": "t=√(2h/g)=√(40/10)=2 s；x=v0t=5×2=10 m；vy=gt=20 m/s，v=√(25+400)=√425≈20.6 m/s。"}, {"title": "速度反向延长", "question": "平抛运动某时刻速度方向与水平方向夹角为 α，此时位移方向与水平方向夹角 β，二者关系？", "分析": "速度反向延长线过水平位移中点。", "answer": "tanα=2tanβ，即速度方向角正切是位移方向角正切的两倍。"}]}, {"id": "ph_2_6", "title": "第六章 圆周运动", "summary": "描述圆周运动的物理量，研究匀速圆周运动的向心加速度、向心力及生活中的圆周运动。", "knowledge": [{"title": "描述量", "content": "线速度 v=Δs/Δt=2πr/T；角速度 ω=Δφ/Δt=2π/T；v=ωr；周期 T、频率 f=1/T；转速 n。同轴转动 ω 相同，同带（不打滑）传动 v 相同。"}, {"title": "向心加速度", "content": "a=v²/r=ω²r=ωv，方向始终指向圆心，只改变速度方向不改变大小。"}, {"title": "向心力", "content": "F=m v²/r=mω²r，方向指向圆心，是效果力，由重力、弹力、摩擦力等提供。匀速圆周运动中合力等于向心力。"}, {"title": "变速圆周与离心", "content": "合力不指向圆心时为变速圆周运动；所受合力不足以提供所需向心力时物体做离心运动。"}], "exam_points": [{"title": "向心力来源分析", "content": "分析什么力提供向心力（如汽车转弯、圆锥摆、火车转弯）。"}, {"title": "临界问题", "content": "最高点最低点临界速度（如绳模型最高点 v≥√(gr)，杆模型 v 可为零）。"}, {"title": "传动问题", "content": "同轴、同带传动的 v、ω、a 关系。"}], "examples": [{"title": "向心力来源", "question": "汽车在水平弯道转弯，半径 50 m，μ=0.4，求最大安全速度（g=10）。", "分析": "静摩擦力提供向心力，最大静摩擦近似 μmg。", "answer": "μmg=m v²/r，v=√(μgr)=√(0.4×10×50)=√200≈14.1 m/s。"}, {"title": "绳模型临界", "question": "长 1 m 轻绳系小球在竖直平面做圆周运动，最高点最小速度（g=10）？", "分析": "最高点重力恰好提供向心力时速度最小。", "answer": "mg=m v²/r，v=√(gr)=√10≈3.16 m/s。"}]}, {"id": "ph_2_7", "title": "第七章 万有引力与宇宙航行", "summary": "学习万有引力定律，用其分析天体运动，了解人造卫星与宇宙速度。", "knowledge": [{"title": "开普勒定律", "content": "第一定律：行星轨道为椭圆，太阳在焦点；第二定律：相同时间扫过相同面积（近日点快）；第三定律：a³/T²=k，对所有绕同一天体运动的物体成立。"}, {"title": "万有引力定律", "content": "F=G m1m2/r²，G=6.67×10⁻¹¹ N·m²/kg²。引力存在于一切物体间，距离 r 为质心间距。"}, {"title": "天体质量与密度", "content": "对环绕天体：G Mm/r²=m(2π/T)²r，得 M=4π²r³/(GT²)。由表面重力 GMm/R²=mg 得 GM=gR²（黄金代换）。"}, {"title": "宇宙速度", "content": "第一宇宙速度 v1=√(gR)=7.9 km/s，是最小发射速度、最大环绕速度；第二 11.2 km/s；第三 16.7 km/s。同步卫星周期 24 h、定轨道平面。"}], "exam_points": [{"title": "卫星问题", "content": "轨道半径、速度、周期、加速度关系（r 越大 v、ω、a 越小，T 越大）。"}, {"title": "天体质量计算", "content": "用环绕法或表面重力法求中心天体质量与密度。"}, {"title": "变轨问题", "content": "卫星变轨中速度、加速度变化（近地点加速、远地点）。"}], "examples": [{"title": "卫星速度", "question": "已知地球质量 M、半径 R，求近地卫星环绕速度表达式。", "分析": "近地卫星轨道半径近似 R，万有引力提供向心力。", "answer": "GMm/R²=m v²/R，v=√(GM/R)。"}, {"title": "天体质量", "question": "某行星的卫星轨道半径 r、周期 T，求行星质量 M。", "分析": "万有引力提供向心力。", "answer": "GMm/r²=m(4π²/T²)r，M=4π²r³/(GT²)。"}]}, {"id": "ph_2_8", "title": "第八章 机械能守恒定律", "summary": "建立功、功率概念，学习动能定理与机械能守恒定律，理解功能关系。", "knowledge": [{"title": "功", "content": "W=Fl cosα，α 为力与位移夹角。α<90° 正功，α>90° 负功，α=90° 不做功。功是标量，单位 J。"}, {"title": "功率", "content": "P=W/t（平均功率）；P=Fv cosα（瞬时功率）。额定功率与实际功率。机车启动：恒定功率启动时 a 减小，速度增大直至 a=0 匀速。"}, {"title": "动能与动能定理", "content": "动能 Ek=½mv²。动能定理：合力做的功等于动能变化，W合=ΔEk=½mv2²−½mv1²。适用一切过程。"}, {"title": "势能", "content": "重力势能 Ep=mgh（h 相对零势面），重力做正功势能减少，W_G=−ΔEp。弹性势能 Ep=½kx²。"}, {"title": "机械能守恒定律", "content": "只有重力（或弹力）做功时，动能与势能相互转化，机械能总量不变。Ek1+Ep1=Ek2+Ep2。条件：除重弹力外其它力不做功。"}], "exam_points": [{"title": "功与功率", "content": "恒力做功、变力做功（图象、动能定理）；机车启动问题。"}, {"title": "动能定理", "content": "多过程问题中用动能定理求速度或位移。"}, {"title": "机械能守恒", "content": "判断守恒条件；用守恒定律解题；功能关系（合外力功=ΔEk，重力弹簧力功=−ΔEp）。"}], "examples": [{"title": "动能定理", "question": "质量 1 kg 物体从高 5 m 处由静止下落，落地速度 8 m/s，求阻力做功（g=10）。", "分析": "合外力功等于动能变化。", "answer": "mgh+Wf=½mv²−0，1×10×5+Wf=½×1×64，Wf=32−50=−18 J，阻力做负功 18 J。"}, {"title": "机械能守恒", "question": "小球从光滑半球顶端由静止滑下，求滑离球面时距地面的高度（球半径 R）。", "分析": "光滑无摩擦，只有重力做功，机械能守恒；脱离时支持力为零。", "answer": "由机械能守恒 mgR=mv²/2+mg h，脱离时 mg cosθ=m v²/R 且 h=R cosθ，联立得 v²=gR(1−cosθ)，代入守恒解得 cosθ=2/3，h=2R/3。"}]}]}, {"name": "必修第三册", "chapters": [{"id": "ph_3_9", "title": "第九章 静电场及其应用", "summary": "建立电荷、库仑定律、电场概念，学习电场强度与电场线。", "knowledge": [{"title": "电荷与守恒", "content": "自然界两种电荷，同斥异引。元电荷 e=1.6×10⁻¹⁹ C。电荷守恒：电荷不会创生消灭，只能转移。起电方式：摩擦、感应、接触。"}, {"title": "库仑定律", "content": "真空中两个静止点电荷间作用力 F=k q1q2/r²，k=9×10⁹ N·m²/C²。方向沿连线，同种电荷相斥异种相吸。适用于真空中静止点电荷。"}, {"title": "电场强度", "content": "E=F/q（定义式，与 F、q 无关）；点电荷 E=kQ/r²（决定式）。矢量，方向规定为正电荷受力方向。叠加遵循平行四边形定则。"}, {"title": "电场线", "content": "形象描述电场：从正电荷出发到负电荷终止，不相交，疏密表强弱，切线方向表场强方向。匀强电场电场线平行等距。"}], "exam_points": [{"title": "库仑定律", "content": "力的大小计算与方向判断；接触带电后电荷平分。"}, {"title": "电场强度", "content": "定义式与决定式区别；场强叠加（多个点电荷）。"}, {"title": "电场线", "content": "识别常见电场线；判断场强大小方向。"}], "examples": [{"title": "库仑力", "question": "真空中间距 r 的两个点电荷 q1、q2，相互作用力 F，将距离增大到 2r，力变为多少？", "分析": "库仑力与距离平方成反比。", "answer": "F'=F×(r/2r)²=F/4。"}, {"title": "场强叠加", "question": "等量异种电荷连线中垂线上，距中点远处一点的电场强度方向如何？", "分析": "两电荷在该点场强叠加，水平分量抵消，竖直分量合成。", "answer": "等量异种电荷中垂线上场强方向垂直中垂线、由正电荷指向负电荷一侧，各点方向相同。"}]}, {"id": "ph_3_10", "title": "第十章 静电场中的能量", "summary": "学习电势、电势能、电势差与电容，理解电场力做功与电势能变化的关系。", "knowledge": [{"title": "电势能与电场力做功", "content": "电场力做正功电势能减少，W_AB=EpA−EpB。电势能是标量，有正负。"}, {"title": "电势与电势差", "content": "电势 φ=Ep/q（相对零势点）；电势差 UAB=φA−φB=WAB/q。沿电场线方向电势降低。等势面与电场线垂直。"}, {"title": "匀强电场", "content": "E=U/d（d 为沿电场方向距离）。电场力做功 W=qU，与路径无关。"}, {"title": "电容", "content": "C=Q/U（定义式），平行板电容 C=εrS/(4πkd)。电容器充放电：电压不变（接电源）改变 d、S，或电荷量不变（断电）改变 d、S，分析 Q、E 变化。"}], "exam_points": [{"title": "电势高低判断", "content": "沿电场线方向电势降低；正电荷在电势高处电势能大。"}, {"title": "电场力做功", "content": "W=qU 计算；动能定理在电场中的应用。"}, {"title": "电容器动态分析", "content": "区分电压恒定与电荷量恒定两种情况分析。"}], "examples": [{"title": "电场力做功", "question": "电场中 A、B 两点电势差 UAB=100 V，电子从 A 到 B 电场力做功多少？", "分析": "电子电量 q=−e，W=qUAB。", "answer": "q=−1.6×10⁻¹⁹ C，W=qUAB=−1.6×10⁻¹⁹×100=−1.6×10⁻¹⁷ J，电场力做负功，电势能增加。"}, {"title": "匀强电场", "question": "匀强电场 E=200 V/m，沿电场方向相距 0.1 m 的两点电势差？", "分析": "匀强电场中 U=Ed。", "answer": "U=Ed=200×0.1=20 V。"}]}, {"id": "ph_3_11", "title": "第十一章 电路及其应用", "summary": "学习电流、电阻、欧姆定律与串并联电路，掌握电学实验与电表改装。", "knowledge": [{"title": "电流与电阻", "content": "电流 I=q/t，方向为正电荷定向移动方向。电阻 R=U/I（定义），R=ρL/S（决定），ρ 随温度变化。"}, {"title": "欧姆定律", "content": "I=U/R（适用于金属和电解液，不适用于气态）。伏安特性曲线：线性元件直线过原点，非线性元件曲线。"}, {"title": "串并联", "content": "串联：I 相同，U、P 与 R 成正比，R=R1+R2；并联：U 相同，I、P 与 R 成反比，1/R=1/R1+1/R2。并联总电阻小于任一支路。"}, {"title": "电表改装与测量", "content": "电流表内阻很小，电压表内阻很大。测电阻：伏安法（电流表内接测大电阻、外接测小电阻）；测电源电动势和内阻（伏安法、安阻法）。"}], "exam_points": [{"title": "电路计算", "content": "串并联化简；含电容电路；电路动态分析（R 变化引起 I、U 变化）。"}, {"title": "电表改装", "content": "电流表改装电压表（串联分压电阻）；量程扩大计算。"}, {"title": "实验", "content": "测金属电阻率、描绘伏安特性曲线、测电动势与内阻的电路与数据处理。"}], "examples": [{"title": "电路动态", "question": "并联电路中一支路电阻增大，总电流、另一支路电流如何变化（电压恒定）？", "分析": "电压不变，分析各支路与总电阻。", "answer": "恒定电压下，该支路电流减小，另一支路电压不变电流不变；总电阻增大，总电流减小。"}, {"title": "电表改装", "question": "满偏电流 Ig=1 mA、内阻 Rg=100 Ω 的电流表改装为 3 V 电压表，需串联多大电阻？", "分析": "串联电阻分担额外电压。", "answer": "Ug=IgRg=0.1 V，需分担 2.9 V，R=(3−0.1)/0.001=2900 Ω。"}]}, {"id": "ph_3_12", "title": "第十二章 电能 能量守恒定律", "summary": "学习电动势、闭合电路欧姆定律、焦耳定律与电源功率，理解能量守恒。", "knowledge": [{"title": "电动势", "content": "电源把其它形式能转化为电能的本领，E=W/q。电源内阻 r。"}, {"title": "闭合电路欧姆定律", "content": "I=E/(R+r)。路端电压 U=E−Ir。外电路断路 I=0 时 U=E；短路 R=0 时 I=E/r。U-I 图象纵截距为 E、斜率为 −r。"}, {"title": "电功与电热", "content": "电功 W=UIt（电能转化为其它形式能）；电热 Q=I²Rt（焦耳定律，纯电阻时 W=Q）。功率 P=UI，热功率 P=I²R。电源功率 P=EI，内耗 I²r，输出 UI=EI−I²r。"}, {"title": "能量守恒", "content": "能量不会创生消灭，只发生转化转移。电源总能量＝内耗＋外电路消耗。"}], "exam_points": [{"title": "闭合电路欧姆定律", "content": "求电流、路端电压；含电容电路；U-I 图象分析。"}, {"title": "功率分配", "content": "电源输出功率最大条件 R=r；效率 η=U/E=R/(R+r)。"}, {"title": "动态与故障", "content": "电阻变化引起各量变化；含容电路电容电量。"}], "examples": [{"title": "闭合电路", "question": "电源 E=6 V、r=1 Ω，外接 R=2 Ω，求路端电压与电源效率。", "分析": "由闭合电路欧姆定律求电流再求路端电压。", "answer": "I=E/(R+r)=6/3=2 A，U=IR=4 V，η=U/E=4/6≈66.7%。"}, {"title": "输出功率最大", "question": "电源 E、r 一定，外阻 R 为何值时输出功率最大？", "分析": "输出功率 P=I²R=E²R/(R+r)²，求极值。", "answer": "当 R=r 时输出功率最大，Pmax=E²/(4r)。"}]}, {"id": "ph_3_13", "title": "第十三章 电磁感应与电磁波初步", "summary": "初步认识磁场对电流的作用、电磁感应现象与电磁波，了解麦克斯韦电磁理论。", "knowledge": [{"title": "磁场与安培力", "content": "磁感线闭合，磁感应强度 B。安培力 F=BIL（B⊥I），方向用左手定则。地磁场分布。"}, {"title": "电磁感应", "content": "穿过闭合回路的磁通量 Φ=BS（B⊥S）变化时产生感应电流。法拉第电磁感应定律 E=nΔΦ/Δt。导体切割磁感线 E=BLv。楞次定律判断方向：感应电流磁场阻碍磁通量变化。"}, {"title": "电磁波", "content": "变化的电场和磁场交替产生由近及远传播形成电磁波。真空中 c=3×10⁸ m/s，c=λf。电磁波谱：无线电波、红外线、可见光、紫外线、X 射线、γ 射线，频率依次增大、波长依次减小。"}, {"title": "能量量子化", "content": "普朗克能量子 ε=hν，h=6.63×10⁻³⁴ J·s。光电效应：极限频率，光子说。"}], "exam_points": [{"title": "安培力", "content": "大小计算与左手定则判断方向。"}, {"title": "电磁感应", "content": "感应电动势 E=nΔΦ/Δt、E=BLv 计算；楞次定律判断方向。"}, {"title": "电磁波", "content": "波速 c=λf；电磁波谱顺序与应用。"}], "examples": [{"title": "感应电动势", "question": "长 0.5 m 导体棒以 4 m/s 垂直切割 B=0.2 T 的匀强磁场，求感应电动势。", "分析": "切割磁感线 E=BLv。", "answer": "E=BLv=0.2×0.5×4=0.4 V。"}, {"title": "电磁波", "question": "某电磁波频率 5×10¹⁴ Hz，求真空中波长。", "分析": "由 c=λf 求 λ。", "answer": "λ=c/f=3×10⁸/(5×10¹⁴)=6×10⁻⁷ m=600 nm（可见光范围）。"}]}]}]}, {"subject": "化学", "books": [{"name": "必修第一册", "chapters": [{"id": "ch_1_1", "title": "第一章 物质及其变化", "summary": "学习物质分类、分散系与胶体、离子反应、氧化还原反应，建立化学变化的基本认识。", "knowledge": [{"title": "物质的分类", "content": "根据组成分为纯净物（单质、化合物）和混合物。化合物分无机物（酸碱盐氧化物）和有机物。氧化物分酸性氧化物、碱性氧化物、两性氧化物、不成盐氧化物。"}, {"title": "分散系与胶体", "content": "分散系按分散质粒子大小分溶液（<1 nm）、胶体（1~100 nm）、浊液（>100 nm）。胶体的性质：丁达尔效应（鉴别）、电泳、聚沉。Fe(OH)₃ 胶体制备：饱和 FeCl₃ 滴入沸水中。"}, {"title": "离子反应", "content": "电解质：在水溶液中或熔融状态下能导电的化合物（酸碱盐、活泼金属氧化物）。复分解型离子反应发生条件：生成沉淀、气体或弱电解质。离子方程式书写步骤：写、拆、删、查。"}, {"title": "氧化还原反应", "content": "本质是电子转移，表现为化合价升降。升失氧（化合价升高、失电子、被氧化、作还原剂）、降得还。氧化剂得电子化合价降低被还原，发生还原反应；还原剂反之。常见氧化剂：O₂、Cl₂、浓 H₂SO₄、HNO₃、KMnO₄；还原剂：金属单质、H₂、C、CO。"}], "exam_points": [{"title": "离子共存", "content": "判断离子能否大量共存（结合生成沉淀气体弱电解质、发生氧化还原、双水解则不共存）。"}, {"title": "离子方程式", "content": "书写与正误判断（拆分原则、电荷质量守恒、量的问题如少量过量）。"}, {"title": "氧化还原", "content": "标化合价、判断氧化剂还原剂、电子转移数目；氧化还原反应配平。"}], "examples": [{"title": "离子方程式", "question": "写出石灰石与稀盐酸反应的离子方程式。", "分析": "CaCO₃ 难溶不拆，HCl 强电解质拆，CO₂ 气体、H₂O 弱电解质不拆。", "answer": "CaCO₃ + 2H⁺ = Ca²⁺ + CO₂↑ + H₂O。"}, {"title": "氧化还原判断", "question": "反应 2Na + Cl₂ = 2NaCl 中，哪种物质被氧化？", "分析": "Na 化合价由 0 升到 +1，失电子被氧化，作还原剂。", "answer": "Na 元素化合价升高被氧化，Na 是还原剂；Cl₂ 是氧化剂。"}]}, {"id": "ch_1_2", "title": "第二章 海水中的重要元素——钠和氯", "summary": "学习钠及其化合物、氯及其化合物，建立物质的量的概念及计算。", "knowledge": [{"title": "钠及其化合物", "content": "钠：银白软质，与水剧烈反应 2Na+2H₂O=2NaOH+H₂↑（现象：浮熔游响红）。Na₂O 碱性氧化物，Na₂O₂ 淡黄色，与水、CO₂ 反应既氧化又还原：2Na₂O₂+2H₂O=4NaOH+O₂↑，2Na₂O₂+2CO₂=2Na₂CO₃+O₂。NaOH 强碱，Na₂CO₃（纯碱）与 NaHCO₃（小苏打）相互转化与鉴别。"}, {"title": "氯及其化合物", "content": "Cl₂ 黄绿色有毒气体。与金属、非金属、水、碱反应：Cl₂+H₂O=HCl+HClO（HClO 强氧化性漂白消毒）。Cl₂+2NaOH=NaCl+NaClO+H₂O（制漂白液）。实验室制 Cl₂：MnO₂+4HCl(浓)=MnCl₂+Cl₂↑+2H₂O，用浓盐酸，需尾气处理（NaOH）。"}, {"title": "物质的量", "content": "n=N/NA=m/M=V/Vm=cV。NA≈6.02×10²³ mol⁻¹，气体摩尔体积 Vm≈22.4 L/mol（标况）。物质的量浓度 c=nV（溶液）。配制一定浓度溶液步骤：计算、称量、溶解、冷却、转移、洗涤、定容、摇匀。"}, {"title": "焰色试验", "content": "Na 黄色，K 紫色（透过蓝色钴玻璃滤去黄光）。用于鉴别某些金属离子。"}], "exam_points": [{"title": "钠的反应", "content": "Na、Na₂O₂ 与水、CO₂ 反应的计算与现象；Na₂O₂ 作供氧剂。"}, {"title": "氯的制备与性质", "content": "实验室制 Cl₂ 装置、除杂、收集、尾气处理；Cl₂ 性质实验。"}, {"title": "物质的量计算", "content": "n、N、m、V、c 间的换算；溶液稀释 c₁V₁=c₂V₂；配制溶液误差分析。"}], "examples": [{"title": "物质的量计算", "question": "标况下 11.2 L CO₂ 的物质的量与所含原子数为多少？", "分析": "用 n=V/Vm，N=n·NA。", "answer": "n=11.2/22.4=0.5 mol；每个 CO₂ 含 3 个原子，N=0.5×3×6.02×10²³=9.03×10²³。"}, {"title": "Na₂O₂ 反应", "question": "将足量 Na₂O₂ 通入 CO₂ 和 H₂O 的混合气体，固体增重的实质是什么？", "分析": "写出反应方程式分析质量关系。", "answer": "2Na₂O₂+2CO₂=2Na₂CO₃+O₂，增重相当于吸收 CO₂ 减去放出 O₂，即相当于吸收 CO；2Na₂O₂+2H₂O=4NaOH+O₂，增重相当于吸收 H₂。固体增重等于混合气体质量减去放出 O₂ 质量。"}]}, {"id": "ch_1_3", "title": "第三章 铁 金属材料", "summary": "学习铁及其化合物的性质与转化、合金等金属材料。", "knowledge": [{"title": "铁的性质", "content": "Fe 中等活泼金属，与强氧化剂（Cl₂、稀 HNO₃）生成 Fe³⁺，与弱氧化剂（S、稀 H₂SO₄、HCl）生成 Fe²⁺：Fe+2HCl=FeCl₂+H₂↑，2Fe+3Cl₂=2FeCl₃。"}, {"title": "铁的化合物", "content": "FeO 黑色、Fe₂O₃ 红棕色，均为碱性氧化物与酸反应。Fe(OH)₂ 白色迅速氧化为灰绿最终 Fe(OH)₃ 红褐色：4Fe(OH)₂+O₂+2H₂O=4Fe(OH)₃。Fe²⁺ 浅绿色有还原性，Fe³⁺ 黄色有氧化性。"}, {"title": "Fe²⁺ 与 Fe³⁺ 转化与检验", "content": "Fe²⁺→Fe³⁺：加氧化剂（Cl₂、稀 HNO₃）；Fe³⁺→Fe²⁺：加还原剂（Fe、Cu、KI）。检验 Fe³⁺ 用 KSCN 显血红色；检验 Fe²⁺ 先加 KSCN 无现象再加氯水变红。"}, {"title": "金属材料", "content": "合金是混合物，硬度比纯组分大、熔点比纯组分低。钢（铁碳合金）、铝合金、铜合金。新型金属材料如储氢合金、钛合金。"}], "exam_points": [{"title": "Fe²⁺/Fe³⁺ 转化", "content": "用离子方程式表示转化；判断试剂。"}, {"title": "检验", "content": "KSCN 检验 Fe³⁺；Fe²⁺ 检验方法。"}, {"title": "计算", "content": "铁与不同氧化剂反应产物判断；铁的氧化物组成计算。"}], "examples": [{"title": "离子方程式", "question": "写出 FeCl₃ 溶液与铜反应的离子方程式。", "分析": "Fe³⁺ 氧化 Cu，Fe³⁺ 被还原为 Fe²⁺。", "answer": "2Fe³⁺ + Cu = 2Fe²⁺ + Cu²⁺。"}, {"title": "检验", "question": "如何证明某溶液中含 Fe²⁺ 而不含 Fe³⁺？", "分析": "先用 KSCN 检验无 Fe³⁺，再氧化 Fe²⁺ 后检验。", "answer": "取试样加 KSCN 溶液，无明显现象说明无 Fe³⁺；再滴加少量氯水，溶液变血红色，证明原溶液含 Fe²⁺。"}]}, {"id": "ch_1_4", "title": "第四章 物质结构 元素周期律", "summary": "学习原子结构、元素周期表与元素周期律、化学键，建立微观结构决定性质的认识。", "knowledge": [{"title": "原子结构", "content": "原子由原子核（质子、中子）和核外电子构成。质子数=核电荷数=核外电子数=原子序数。质量数 A=质子数 Z+中子数 N。核外电子排布规律：每层最多 2n² 个，最外层不超过 8 个。"}, {"title": "元素周期表", "content": "7 周期（1、2、3 短周期）、18 纵行 16 族（7 主族、7 副族、Ⅷ族、0 族）。周期数=电子层数，主族序数=最外层电子数。同周期从左到右金属性减弱非金属性增强；同主族从上到下金属性增强非金属性减弱。"}, {"title": "元素周期律", "content": "元素性质随原子序数递增呈周期性变化。原子半径、化合价、金属性非金属性周期性变化。金属性越强最高价氧化物水化物碱性越强、越易与水酸反应；非金属性越强气态氢化物越稳定、最高价含氧酸酸性越强。"}, {"title": "化学键", "content": "离子键：阴阳离子间静电作用（活泼金属与活泼非金属），离子化合物。共价键：共用电子对（非金属间），共价化合物。极性键与非极性键。分子间作用力与氢键。"}], "exam_points": [{"title": "周期表位置推断", "content": "由原子结构推断周期、族；同位素概念。"}, {"title": "性质比较", "content": "比较元素金属性非金属性强弱及对应化合物性质。"}, {"title": "化学键判断", "content": "判断化合物中化学键类型；离子化合物与共价化合物区别。"}], "examples": [{"title": "周期表推断", "question": "某主族元素 R 原子最外层 6 个电子、3 个电子层，R 在周期表第几周期第几族？", "分析": "电子层数=周期数，最外层电子数=主族序数。", "answer": "3 个电子层为第三周期，最外层 6 个电子为第ⅥA 族（硫）。"}, {"title": "化学键", "question": "指出 NaOH、CO₂、NaCl、HCl 中的化学键类型。", "分析": "活泼金属与氢氧根为离子键，O-H 为共价键。", "answer": "NaOH 含离子键和共价键（离子化合物）；NaCl 含离子键；CO₂、HCl 只含共价键（共价化合物）。"}]}]}, {"name": "必修第二册", "chapters": [{"id": "ch_2_5", "title": "第五章 化工生产中的重要非金属元素——硫、氮", "summary": "学习硫及其化合物、氮及其化合物、无机非金属材料的性质与转化。", "knowledge": [{"title": "硫及其化合物", "content": "S 与金属非金属反应。SO₂ 有毒，有刺激性气味，水溶液亚硫酸（中强酸），既有还原性（被 O₂、KMnO₄ 氧化）又有氧化性（与 H₂S 反应），有漂白性（不稳定，可逆）。SO₃ 与水生成 H₂SO₄。浓 H₂SO₄ 三特性：吸水性、脱水性、强氧化性（与 Cu、C 反应不产生 H₂）。"}, {"title": "氮及其化合物", "content": "N₂ 稳定。NO 无色遇空气变红棕色 NO₂。NO₂ 红棕色有毒，与水反应 3NO₂+H₂O=2HNO₃+NO。氨：刺激性气味，水溶液氨水（弱碱），喷泉实验。NH₃ 催化氧化制 NO（工业制硝酸原理）。铵盐受热分解、与碱反应放出 NH₃（检验）。硝酸强氧化性：与金属一般不产生 H₂，浓硝酸产物 NO₂，稀硝酸产物 NO。"}, {"title": "无机非金属材料", "content": "传统硅酸盐材料（玻璃、水泥、陶瓷）；新型无机非金属材料（硅单质半导体、光导纤维 SiO₂、高温结构陶瓷）。SiO₂ 与 HF、强碱反应，是酸性氧化物但难溶于水。"}, {"title": "环境保护", "content": "酸雨（SO₂、NOx）、光化学烟雾、臭氧层破坏。SO₂、NOx 的处理（碱液吸收）。"}], "exam_points": [{"title": "SO₂ 与 CO₂ 鉴别", "content": "用品红溶液或溴水/高锰酸钾鉴别（SO₂ 使之褪色，CO₂ 不能使品红褪色）。"}, {"title": "硝酸性质", "content": "与金属反应计算（电子守恒）；浓稀硝酸产物。"}, {"title": "喷泉实验", "content": "NH₃、HCl 喷泉原理（气体极易溶于水造成压强差）。"}], "examples": [{"title": "方程式", "question": "写出铜与浓硝酸反应的化学方程式。", "分析": "浓硝酸强氧化性，产物 NO₂。", "answer": "Cu + 4HNO₃(浓) = Cu(NO₃)₂ + 2NO₂↑ + 2H₂O。"}, {"title": "鉴别", "question": "如何鉴别 SO₂ 和 CO₂？", "分析": "SO₂ 有漂白性和还原性，CO₂ 没有。", "answer": "将气体通入品红溶液，能使品红褪色且加热后复原的是 SO₂，不能的是 CO₂；或通入酸性 KMnO₄ 溶液，褪色者为 SO₂。"}]}, {"id": "ch_2_6", "title": "第六章 化学反应与能量", "summary": "学习化学反应中的能量变化、化学反应速率与限度，初步认识化学平衡。", "knowledge": [{"title": "化学反应与能量", "content": "放热反应：反应物总能量大于生成物（燃烧、中和、活泼金属与酸）；吸热反应：反应物总能量小于生成物（C+CO₂、Ba(OH)₂·8H₂O 与 NH₄Cl）。化学键断裂吸热、形成放热。"}, {"title": "化学反应速率", "content": "v=Δc/Δt，单位 mol/(L·s) 或 mol/(L·min)。影响因素：浓度（增大浓度加快）、温度（升高 10℃ 速率约 2~4 倍）、压强（对有气体参加的反应）、催化剂（同等程度改变正逆速率）。"}, {"title": "化学反应限度", "content": "可逆反应：同一条件下正逆方向同时进行。化学平衡状态特征：动（动态平衡 v正=v逆≠0）、等、定、变。判断平衡：正逆速率相等，各组分浓度不变。"}, {"title": "化学平衡移动", "content": "勒夏特列原理：改变影响平衡的条件，平衡向减弱该改变的方向移动。浓度、温度、压强对平衡的影响（催化剂不影响移动）。"}], "exam_points": [{"title": "能量变化", "content": "判断吸放热反应；反应热与化学键能量关系。"}, {"title": "速率计算与影响因素", "content": "速率计算；条件改变对速率的影响。"}, {"title": "平衡判断与移动", "content": "判断是否达到平衡；浓度温度压强对平衡移动的影响。"}], "examples": [{"title": "速率计算", "question": "反应 2A+B=C，10 s 内 A 浓度由 2 mol/L 降到 1.2 mol/L，求 A 的反应速率。", "分析": "用 v=Δc/Δt。", "answer": "v(A)=(2−1.2)/10=0.08 mol/(L·s)。"}, {"title": "平衡移动", "question": "对于 N₂+3H₂⇌2NH₃（正反应放热），增大压强平衡如何移动？", "分析": "增大压强平衡向气体体积减小方向移动。", "answer": "正反应气体分子数减小（4→2），增大压强平衡向正反应方向移动，NH₃ 浓度增大。"}]}, {"id": "ch_2_7", "title": "第七章 有机化合物", "summary": "初步学习有机化学，认识甲烷、乙烯、乙醇、乙酸与基本营养物质。", "knowledge": [{"title": "甲烷与烷烃", "content": "CH₄ 正四面体结构。取代反应（与氯气光照）：CH₄+Cl₂→CH₃Cl+HCl，生成多种氯代物混合物。烷烃通式 CnH2n+2，饱和，可燃烧，能发生取代反应。同系物与同分异构体。"}, {"title": "乙烯与烯烃", "content": "乙烯 CH₂=CH₂，含 C=C 双键，平面结构。加成反应（与 Br₂、H₂、HCl、H₂O）：CH₂=CH₂+Br₂→CH₂BrCH₂Br（使溴水褪色）。加聚反应：nCH₂=CH₂→—[CH₂—CH₂]—n（聚乙烯）。乙烯是植物生长调节剂、衡量化工水平。"}, {"title": "乙醇与乙酸", "content": "乙醇 C₂H₅OH 含羟基—OH，与钠反应放出 H₂，催化氧化生成乙醛。乙酸 CH₃COOH 弱酸含羧基—COOH，有酸的通性。酯化反应：CH₃COOH+C₂H₅OH⇌CH₃COOC₂H₅+H₂O（浓硫酸催化加热，可逆）。"}, {"title": "基本营养物质", "content": "糖类（单糖葡萄糖果糖、二糖蔗糖麦芽糖、多糖淀粉纤维素）、油脂（皂化水解）、蛋白质（盐析、变性、颜色反应）。淀粉遇碘变蓝；葡萄糖银镜反应。"}], "exam_points": [{"title": "官能团与性质", "content": "C=C、—OH、—COOH 的特征反应；鉴别。"}, {"title": "反应类型", "content": "取代、加成、加聚、酯化、水解的判断与方程式。"}, {"title": "同分异构", "content": "烷烃同分异构体书写（戊烷 3 种）。"}], "examples": [{"title": "鉴别", "question": "用一种试剂鉴别甲烷和乙烯。", "分析": "乙烯能使溴水或高锰酸钾褪色，甲烷不能。", "answer": "通入溴水（或酸性 KMnO₄ 溶液），褪色者为乙烯，不褪色者为甲烷。"}, {"title": "酯化反应", "question": "写出乙酸与乙醇酯化反应的化学方程式，并指出反应类型。", "分析": "酸脱羟基醇脱氢，浓硫酸催化可逆。", "answer": "CH₃COOH + C₂H₅OH ⇌(浓硫酸,△) CH₃COOC₂H₅ + H₂O，属酯化反应（取代反应）。"}]}, {"id": "ch_2_8", "title": "第八章 化学与可持续发展", "summary": "学习自然资源的开发利用、化学品的合理使用与环境保护。", "knowledge": [{"title": "自然资源利用", "content": "金属冶炼：热分解（HgO）、热还原（Fe、Cu）、电解（Al、Na）。海水资源：海水提溴、海水提镁、海水淡化。煤、石油、天然气的综合利用：煤干馏、石油分馏裂化裂解。"}, {"title": "化学品使用", "content": "化肥（氮磷钾肥）、农药、医药、合成材料。合理使用化肥农药，防止污染。常见食品添加剂。"}, {"title": "环境保护", "content": "水污染（重金属、富营养化）、大气污染（SO₂、NOx、PM2.5）、固体废弃物。绿色化学核心：从源头消除污染，原子经济性。"}, {"title": "原子利用率", "content": "原子利用率=期望产物质量/全部产物质量×100%。加成反应原子利用率高。"}], "exam_points": [{"title": "金属冶炼", "content": "根据金属活动性选择冶炼方法。"}, {"title": "海水资源", "content": "提溴提镁流程与原理。"}, {"title": "绿色化学", "content": "原子利用率计算；判断绿色化学理念。"}], "examples": [{"title": "金属冶炼", "question": "工业上冶炼铝用什么方法？为什么？", "分析": "铝活泼，常温下化学方法难以还原。", "answer": "用电解法，电解熔融 Al₂O₃：2Al₂O₃(熔融)=4Al+3O₂↑（冰晶石降低熔点）。因铝很活泼，其氧化物较稳定，热还原法难以实现，只能用电解。"}, {"title": "原子利用率", "question": "比较 CH₂=CH₂+H₂O→C₂H₅OH 与 2C₂H₅OH+2Na→2C₂H₅ONa+H₂↑ 的原子利用率。", "分析": "加成反应无副产物。", "answer": "前者加成反应只生成乙醇，原子利用率为 100%；后者有 H₂ 副产物，原子利用率低于 100%。前者更符合绿色化学。"}]}]}]}, {"subject": "生物", "books": [{"name": "必修1 分子与细胞", "chapters": [{"id": "bi_1_1", "title": "第1章 走近细胞", "summary": "认识细胞学说的建立、原核细胞与真核细胞的区别及生命系统的结构层次。", "knowledge": [{"title": "细胞学说", "content": "由施莱登和施旺提出。要点：一切动植物都由细胞和细胞产物构成；细胞是一个有机体；新细胞由老细胞产生。意义：揭示了生物界的统一性和生物进化的统一性。"}, {"title": "原核细胞与真核细胞", "content": "根本区别是有无以核膜为界限的细胞核。原核生物：细菌、蓝细菌（蓝藻）、支原体、衣原体等，无成形细胞核（拟核，环状 DNA），只有核糖体一种细胞器。蓝藻能光合作用（含叶绿素和藻蓝素）。真核生物：动物、植物、真菌、原生生物。"}, {"title": "生命系统层次", "content": "细胞→组织→器官→系统→个体→种群→群落→生态系统→生物圈。细胞是基本的生命系统；病毒无细胞结构，必须寄生在活细胞内。"}, {"title": "细胞学说与显微镜", "content": "列文虎克观察活细胞，罗伯特·胡克命名 cell。细胞学说在显微镜发明后才建立，体现了技术推动科学。"}], "exam_points": [{"title": "原核生物判断", "content": "区分原核与真核生物；蓝藻、细菌的特征。"}, {"title": "生命系统层次", "content": "判断各层次关系；单细胞生物的层次。"}, {"title": "病毒", "content": "病毒的结构与增殖特点。"}], "examples": [{"title": "分类判断", "question": "下列属于原核生物的是：酵母菌、乳酸菌、蓝藻、草履虫。", "分析": "酵母菌真菌、草履虫原生生物为真核；乳酸菌细菌、蓝藻为原核。", "answer": "乳酸菌和蓝藻是原核生物。酵母菌（真菌）和草履虫（原生生物）为真核生物。"}, {"title": "蓝藻", "question": "蓝藻为什么能自养？", "分析": "蓝藻虽无叶绿体但含光合色素。", "answer": "蓝藻含叶绿素和藻蓝素，能进行光合作用合成有机物，故能自养；它没有叶绿体，色素分布在光合片层上。"}]}, {"id": "bi_1_2", "title": "第2章 组成细胞的分子", "summary": "学习组成细胞的元素和化合物：水、无机盐、糖类、脂质、蛋白质、核酸。", "knowledge": [{"title": "元素与化合物", "content": "大量元素 C、H、O、N、P、S、K、Ca、Mg；微量元素 Fe、Mn、Zn、Cu、B、Mo。C 是最基本元素，O 最多。活细胞中含量最多的是水（约 85%），干重中最多的是蛋白质。"}, {"title": "蛋白质", "content": "基本单位氨基酸（约 20 种），结构通式有共同特点。氨基酸脱水缩合形成肽键（—CO—NH—），形成多肽链。蛋白质结构多样性的原因：氨基酸种类、数目、排列顺序、空间结构。功能：催化（酶）、运输、调节、免疫、结构等。"}, {"title": "核酸", "content": "DNA 和 RNA，基本单位核苷酸（磷酸+五碳糖+含氮碱基）。DNA 主要在细胞核（少量线粒体叶绿体），RNA 主要在细胞质。甲基绿吡罗红染色：DNA 绿色，RNA 红色。核酸是遗传信息的载体。"}, {"title": "糖类与脂质", "content": "糖类主要能源（葡萄糖）、储能（淀粉、糖原）、结构（纤维素）。脂质：脂肪储能保温、磷脂构成膜、固醇（胆固醇、性激素、维生素D）。"}, {"title": "水与无机盐", "content": "水：自由水（95.5%）参与代谢、运输，结合水（4.5%）组成细胞结构。自由水/结合水比值升高代谢增强。无机盐多以离子形式存在，构成化合物（Fe 血红蛋白、Mg 叶绿素）或维持渗透压酸碱平衡。"}], "exam_points": [{"title": "蛋白质计算", "content": "氨基酸数、肽键数、脱水数（n−1）、分子量计算（na−(n−1)×18）。"}, {"title": "物质鉴定", "content": "还原糖（斐林试剂，砖红）、蛋白质（双缩脲，紫）、脂肪（苏丹Ⅲ，橘黄）、淀粉（碘，蓝）。"}, {"title": "水盐作用", "content": "自由水结合水转换；无机盐作用。"}], "examples": [{"title": "蛋白质计算", "question": "由 20 个氨基酸组成的一条肽链，含肽键多少个？至少含游离氨基多少个？", "分析": "肽键数=氨基酸数−1；至少含游离氨基数=肽链数。", "answer": "肽键数=20−1=19 个；一条肽链至少含 1 个游离氨基（—NH₂）和 1 个游离羧基（—COOH）。"}, {"title": "物质鉴定", "question": "鉴定梨汁中是否含还原糖用什么试剂？现象如何？", "分析": "还原糖与斐林试剂在水浴加热下产
