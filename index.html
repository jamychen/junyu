生砖红色沉淀。", "answer": "用斐林试剂（现配现用），50~65℃水浴加热，出现砖红色沉淀说明含还原糖。"}]}, {"id": "bi_1_3", "title": "第3章 细胞的基本结构", "summary": "学习细胞膜、细胞器与细胞核的结构和功能。", "knowledge": [{"title": "细胞膜", "content": "成分：脂质（磷脂为主）约 50%、蛋白质约 40%、糖类。功能：将细胞与外界分隔、控制物质进出、进行细胞间信息交流。流动镶嵌模型：磷脂双分子层基本支架，蛋白质镶嵌贯穿，糖蛋白（糖被）有识别保护作用。膜具有流动性（结构）和选择透过性（功能）。"}, {"title": "细胞器", "content": "线粒体（有氧呼吸主要场所，双层膜）、叶绿体（光合作用，双层膜，植物）、内质网（蛋白质脂质合成）、高尔基体（加工分泌，植物细胞壁形成）、核糖体（合成蛋白质，无膜）、溶酶体（分解）、液泡（植物，维持渗透压）。中心体（动物低等植物，无膜，与细胞分裂有关）。"}, {"title": "细胞核", "content": "结构：核膜（双层膜，核孔大分子出入）、染色质（DNA+蛋白质，与染色体同物质）、核仁、核基质。功能：遗传信息库、细胞代谢遗传的控制中心。"}, {"title": "生物膜系统", "content": "细胞器膜、核膜、细胞膜结构联系功能协调，称为生物膜系统。"}, {"title": "实验", "content": "观察叶绿体（黑藻叶片）、观察线粒体（人口腔上皮，健那绿染液蓝绿色）。"}], "exam_points": [{"title": "细胞器功能", "content": "根据功能判断细胞器；分泌蛋白合成运输途径（核糖体→内质网→高尔基体→囊泡→细胞膜）。"}, {"title": "细胞膜功能", "content": "流动性与选择透过性的区别与实例（吞噬、变形运动体现流动性）。"}, {"title": "细胞核", "content": "克隆实验证明细胞核的作用。"}], "examples": [{"title": "分泌蛋白", "question": "分泌蛋白合成并分泌到细胞外经过哪些细胞结构？需要哪些细胞器？", "分析": "分泌蛋白经核糖体合成、内质网粗加工、高尔基体再加工分泌。", "answer": "依次经过核糖体→内质网→高尔基体→细胞膜（囊泡融合）；所需细胞器为核糖体、内质网、高尔基体、线粒体（供能）。"}, {"title": "膜的特性", "question": "细胞膜的流动性与选择透过性有何关系？", "分析": "结构决定功能。", "answer": "流动性是膜的结构特性（磷脂和蛋白质运动），选择透过性是功能特性。流动性是选择透过性的基础，物质跨膜运输依赖膜的流动性。"}]}, {"id": "bi_1_4", "title": "第4章 细胞的物质输入和输出", "summary": "学习渗透作用、细胞的吸水失水及物质跨膜运输的方式。", "knowledge": [{"title": "渗透作用", "content": "水分子等溶剂分子透过半透膜从低浓度向高浓度扩散。发生条件：半透膜、浓度差。成熟植物细胞的原生质层（细胞膜+液泡膜+二者间细胞质）相当于半透膜，当外界溶液浓度大于细胞液浓度时细胞失水发生质壁分离。"}, {"title": "质壁分离与复原", "content": "外界溶液浓度>细胞液，细胞失水质壁分离；细胞仍存活（用一定浓度蔗糖溶液）。若放回清水，细胞吸水质壁分离复原。质壁分离可用于判断细胞死活、测定细胞液浓度。"}, {"title": "物质跨膜运输方式", "content": "自由扩散：高→低，不耗能不需载体（O₂、CO₂、水、甘油、乙醇、脂溶性维生素）。协助扩散：高→低，需载体不耗能（葡萄糖进红细胞、离子）。主动运输：低→高，需载体耗能（肠吸收葡萄糖、离子），保证细胞按需选择性吸收。胞吞胞吐：大分子，耗能，依赖膜流动性。"}], "exam_points": [{"title": "质壁分离", "content": "判断质壁分离及复原条件；细胞死活判断。"}, {"title": "运输方式判断", "content": "根据方向、载体、能量判断三种运输方式。"}, {"title": "曲线", "content": "运输速率与浓度、氧气浓度关系曲线分析。"}], "examples": [{"title": "运输方式", "question": "K⁺ 进入小肠绒毛上皮细胞、红细胞吸收葡萄糖分别属于哪种运输方式？", "分析": "看是否需要载体和能量、是否顺浓度梯度。", "answer": "K⁺ 进入小肠上皮细胞是从低浓度到高浓度，需载体耗能，为主动运输；红细胞吸收葡萄糖是顺浓度梯度需载体不耗能，为协助扩散。"}, {"title": "质壁分离", "question": "将洋葱表皮细胞放入 0.3 g/mL 蔗糖溶液中会发生什么？换入清水后呢？", "分析": "蔗糖浓度大于细胞液，细胞失水；清水中吸水复原。", "answer": "发生质壁分离（原生质层与细胞壁分离，细胞皱缩）；换入清水后细胞吸水，发生质壁分离复原。说明该细胞是活的。"}]}, {"id": "bi_1_5", "title": "第5章 细胞的能量供应和利用", "summary": "学习酶、ATP、细胞呼吸与光合作用，理解细胞代谢的能量供应。", "knowledge": [{"title": "酶", "content": "酶是活细胞产生具有催化作用的有机物，大多数是蛋白质，少数是 RNA。特性：高效性、专一性、作用条件温和。影响酶活性因素：温度、pH（最适值）、底物浓度。酶促反应需适宜温度 pH。"}, {"title": "ATP", "content": "三磷酸腺苷，结构简式 A-P~P~P，~ 代表高能磷酸键。ATP 与 ADP 相互转化：ATP⇌ADP+Pi+能量。ATP 是细胞内主要能源物质，直接供能。合成场所：叶绿体、线粒体、细胞质基质。"}, {"title": "细胞呼吸", "content": "有氧呼吸三阶段：①细胞质基质，糖酵解，葡萄糖→丙酮酸+[H]，少量 ATP；②线粒体基质，丙酮酸+水→CO₂+[H]，少量 ATP；③线粒体内膜，[H]+O₂→水，大量 ATP。总反应：C₆H₁₂O₆+6O₂+6H₂O→6CO₂+12H₂O+能量。无氧呼吸：葡萄糖→乳酸（动物、乳酸菌）或酒精+CO₂（酵母菌、植物）。"}, {"title": "光合作用", "content": "光反应（类囊体薄膜）：水的光解产 [H] 和 O₂，合成 ATP。暗反应（叶绿体基质）：CO₂ 固定（C₃）和 C₃ 还原（CH₂O），消耗 ATP 和 [H]。总反应：6CO₂+12H₂O—光/叶绿体→C₆H₁₂O₆+6O₂+6H₂O。影响因素：光照强度、CO₂ 浓度、温度、水、矿质元素。"}, {"title": "实验", "content": "探究酵母菌细胞呼吸方式（产物检测）；绿叶中色素提取分离（无水乙醇提取，纸层析分离，4 种色素带）。"}], "exam_points": [{"title": "酶实验设计", "content": "探究温度/pH 对酶活性的影响，控制变量；酶高效性专一性实验。"}, {"title": "呼吸作用", "content": "有氧无氧呼吸过程及场所、产物、能量；呼吸速率测定。"}, {"title": "光合作用", "content": "光暗反应关系；影响光合因素；光合与呼吸综合曲线（CO₂ 吸收释放、有机物积累）。"}], "examples": [{"title": "光合呼吸综合", "question": "一昼夜中植物有机物积累量如何计算？", "分析": "净光合=总光合−呼吸消耗。", "answer": "一昼夜有机物积累量=白天光合作用合成有机物量−昼夜呼吸作用消耗有机物量。用 CO₂ 吸收量表示时，积累量=白天净吸收 CO₂−夜间释放 CO₂。"}, {"title": "酶特性", "question": "设计实验验证酶的高效性，如何设置对照组？", "分析": "比较酶与无机催化剂的催化效率。", "answer": "对照组加 FeCl₃ 溶液（Fe³⁺ 为无机催化剂），实验组加过氧化氢酶，加入等量 H₂O₂ 溶液，相同条件下比较产生气泡（O₂）速率，酶组明显更快，证明酶具有高效性。"}]}, {"id": "bi_1_6", "title": "第6章 细胞的生命历程", "summary": "学习细胞增殖、分化、衰老凋亡与癌变。", "knowledge": [{"title": "细胞增殖", "content": "真核细胞分裂方式：有丝分裂、无丝分裂、减数分裂。有丝分裂意义：保证亲、子代细胞染色体数目相同，遗传稳定。细胞周期：分裂间期（G1、S、G2，DNA 复制有关蛋白质合成，占 90%~95%）+分裂期（前、中、后、末）。"}, {"title": "有丝分裂", "content": "动物细胞：前期两消两现（核膜核仁消失，染色体纺锤体出现）；中期染色体着丝粒排列赤道板，观察最佳；后期着丝粒分裂染色体加倍移向两极；末期两现两消。植物细胞形成细胞板，动物细胞缢裂。"}, {"title": "细胞分化", "content": "细胞分化是基因的选择性表达，产生不同形态结构功能的细胞。分化是持久的、不可逆的（一般情况下）。全能性：已分化细胞仍具有发育成完整个体的潜能（植物组织培养、动物克隆）。"}, {"title": "衰老凋亡与癌变", "content": "细胞衰老特征：水分减少、酶活性降低、色素积累、核增大、膜透性改变。细胞凋亡是基因决定的程序性死亡（有利）。细胞癌变：原癌基因和抑癌基因突变，细胞恶性增殖。癌细胞特征：无限增殖、形态结构变化、表面糖蛋白减少易扩散。"}], "exam_points": [{"title": "有丝分裂", "content": "各时期染色体、DNA、染色单体数目变化；图像识别；曲线分析。"}, {"title": "分化与全能性", "content": "分化的本质；全能性表现条件。"}, {"title": "癌变", "content": "致癌因子；癌细胞特征；原癌抑癌基因作用。"}], "examples": [{"title": "数目变化", "question": "某二倍体生物体细胞含 4 条染色体，有丝分裂后期细胞中染色体、染色单体、DNA 数目分别是？", "分析": "后期着丝粒分裂，染色体加倍，染色单体为 0，DNA 数=染色体数。", "answer": "后期着丝粒分裂，染色体数=4×2=8 条，染色单体=0，DNA 数=8 个。"}, {"title": "分化", "question": "细胞分化过程中遗传物质是否改变？", "分析": "分化是基因选择性表达。", "answer": "细胞分化过程中遗传物质（DNA）不发生改变，是基因的选择性表达使不同细胞合成不同蛋白质，从而表现不同形态功能。"}]}]}, {"name": "必修2 遗传与进化", "chapters": [{"id": "bi_2_1", "title": "第1章 遗传因子的发现", "summary": "学习孟德尔杂交实验，掌握分离定律与自由组合定律。", "knowledge": [{"title": "遗传术语", "content": "性状、相对性状、显性性状、隐性性状、性状分离。基因（遗传因子）、等位基因、显性基因、隐性基因。基因型、表现型。纯合子、杂合子。杂交、自交、测交。"}, {"title": "分离定律", "content": "一对相对性状的杂交：P DD×dd→F1 Dd（显性）→F1 自交→F2 性状分离比 3:1。分离定律：在形成配子时，成对的遗传因子发生分离，分别进入不同配子。测交 F1×dd→后代表现型比 1:1。"}, {"title": "自由组合定律", "content": "两对（或多对）相对性状的遗传：F1 自交 F2 表现型比 9:3:3:1。自由组合定律：形成配子时，决定同一性状的成对遗传因子彼此分离，不同性状的遗传因子自由组合。条件：非同源染色体上非等位基因。"}, {"title": "孟德尔成功原因", "content": "选材豌豆（自花传粉闭花受粉、有明显相对性状）；由单因素到多因素；统计分析；假说演绎法。"}], "exam_points": [{"title": "概率计算", "content": "杂交子代基因型表现型及比例；基因型频率计算（9:3:3:1 变式）。"}, {"title": "遗传图解", "content": "书写规范的遗传图解（含 P、配子、F、比例）。"}, {"title": "实验设计", "content": "判断显隐性的杂交设计；纯合杂合判断（测交、自交）。"}], "examples": [{"title": "分离定律", "question": "杂合子 Aa 连续自交 n 代后，子代中纯合子比例为？", "分析": "每代自交纯合子比例增加，杂合子每代减半。", "answer": "Aa 自交 n 代后杂合子比例为 (1/2)ⁿ，纯合子比例为 1−(1/2)ⁿ。"}, {"title": "自由组合", "question": "基因型 AaBb 的个体自交，后代中表现型为 A_bb 的概率？", "分析": "拆分两对基因分别计算。", "answer": "Aa 自交 A_ 概率 3/4，Bb 自交 bb 概率 1/4，故 A_bb 概率=3/4×1/4=3/16。"}]}, {"id": "bi_2_2", "title": "第2章 基因和染色体的关系", "summary": "学习减数分裂、受精作用及伴性遗传。", "knowledge": [{"title": "减数分裂", "content": "特殊有丝分裂，DNA 复制一次，细胞连续分裂两次，产生 4 个染色体数减半的生殖细胞。减数第一次分裂：同源染色体分离（同源染色体配对、四分体、交叉互换），非同源染色体自由组合。减数第二次分裂：类似有丝分裂，着丝粒分裂。"}, {"title": "受精作用", "content": "精子和卵细胞融合形成受精卵，染色体数目恢复为 2n。受精卵中核遗传物质一半来自父方一半来自母方，细胞质几乎全部来自卵细胞。减数分裂与受精作用维持前后代染色体数目恒定。"}, {"title": "基因在染色体上", "content": "萨顿假说（基因与染色体行为平行，类比推理）；摩尔根果蝇实验证明基因在染色体上。一条染色体上有许多基因，基因在染色体上呈线性排列。"}, {"title": "伴性遗传", "content": "性染色体上的基因遗传与性别相关联。X 染色体隐性遗传（色盲、血友病）：男多于女，交叉遗传（母→子）。X 染色体显性遗传：女多于男。Y 染色体遗传（只在男性）。"}, {"title": "实验", "content": "观察细胞减数分裂装片（蝗虫精巢）。"}], "exam_points": [{"title": "减数分裂", "content": "各时期染色体、DNA、染色单体数目变化；图像识别；与有丝分裂比较。"}, {"title": "伴性遗传", "content": "色盲遗传特点与概率计算；遗传系谱图分析。"}, {"title": "综合", "content": "基因自由组合与减数分裂联系。"}], "examples": [{"title": "减数分裂", "question": "一个精原细胞（2n）经减数分裂产生几种精子？一个卵原细胞产生几个卵细胞？", "分析": "精原细胞减数分裂产生 4 个精子 2 种（若不考虑交叉互换）。", "answer": "一个精原细胞经减数分裂产生 4 个精子，基因型 2 种（2 个一种 2 个另一种）；一个卵原细胞产生 1 个卵细胞和 3 个极体（卵细胞 1 种）。"}, {"title": "色盲", "question": "色盲男子的女儿都正常（其妻正常非携带者），他的色盲基因传给外孙的概率？", "分析": "X 染色体隐性遗传，交叉遗传。", "answer": "色盲男子 XᵇY，妻子 XᴮXᴮ，女儿全为携带者 XᴮXᵇ，女儿的儿子有 1/2 概率色盲，故色盲基因传给外孙的概率为 1/2。"}]}, {"id": "bi_2_3", "title": "第3章 基因的本质", "summary": "证明 DNA 是主要遗传物质，学习 DNA 的结构与复制。", "knowledge": [{"title": "DNA 是遗传物质", "content": "肺炎双球菌转化实验（格里菲思体内转化，艾弗里体外转化证明 DNA 是转化因子）；噬菌体侵染细菌实验（赫尔希蔡斯，同位素标记 ³²P 标 DNA、³⁵S 标蛋白质，证明 DNA 是遗传物质）。DNA 是主要遗传物质（RNA 病毒中 RNA 是遗传物质）。"}, {"title": "DNA 结构", "content": "规则双螺旋：两条链反向平行，磷酸脱氧核糖交替连接为基本骨架在外侧，碱基在内侧。碱基互补配对 A=T、G≡C。查加夫法则：A=T、G=C。双螺旋结构由沃森克里克提出。"}, {"title": "DNA 复制", "content": "时间：有丝分裂间期、减数第一次分裂间期。场所：主要在细胞核。过程：解旋酶解旋→以母链为模板合成子链→形成两个相同 DNA。条件：模板、原料（4 种脱氧核苷酸）、酶（解旋酶、DNA 聚合酶）、能量。特点：边解旋边复制、半保留复制。"}, {"title": "实验", "content": "DNA 半保留复制的证据（梅塞尔森斯塔尔，密度梯度离心，¹⁵N/¹⁴N 实验）。"}], "exam_points": [{"title": "实验证据", "content": "噬菌体侵染实验操作与结论；转化实验。"}, {"title": "碱基计算", "content": "碱基互补配对原则计算（A=T、G=C，A+G=T+C 等）；双链单链比例。"}, {"title": "DNA 复制", "content": "复制过程、条件、特点；半保留复制计算（n 代后含 ¹⁵N 的比例）。"}], "examples": [{"title": "碱基计算", "question": "某 DNA 分子中胞嘧啶占 20%，求腺嘌呤比例。", "分析": "碱基互补配对 C=G=20%，A=T。", "answer": "C=G=20%，故 C+G=40%，A+T=60%，A=T=30%，腺嘌呤占 30%。"}, {"title": "半保留复制", "question": "含 ¹⁵N 的 DNA 在 ¹⁴N 培养基复制 2 代，含 ¹⁵N 的 DNA 占总 DNA 比例？", "分析": "半保留复制，原母链始终在两条 DNA 中。", "answer": "复制 2 代产生 4 个 DNA，其中只有 2 个含 ¹⁵N（均含一条 ¹⁵N 链一条 ¹⁴N 链），比例=2/4=50%。"}]}, {"id": "bi_2_4", "title": "第4章 基因的表达", "summary": "学习转录、翻译与中心法则，理解基因如何控制性状。", "knowledge": [{"title": "转录", "content": "在细胞核内，以 DNA 一条链为模板合成 RNA 的过程。模板：DNA 一条链；原料：4 种核糖核苷酸；酶：RNA 聚合酶；产物：mRNA。碱基互补配对（A-U）。"}, {"title": "翻译", "content": "在核糖体上，以 mRNA 为模板合成蛋白质的过程。密码子：mRNA 上 3 个相邻碱基决定 1 个氨基酸（64 个密码子，其中 3 个终止密码子不编码氨基酸）。tRNA 携带氨基酸，反密码子与密码子配对。"}, {"title": "中心法则", "content": "描述遗传信息流动：DNA→DNA（复制）、DNA→RNA（转录）、RNA→蛋白质（翻译）；补充 RNA→RNA（RNA 复制）、RNA→DNA（逆转录，HIV）。"}, {"title": "基因与性状", "content": "基因通过控制酶的合成控制代谢从而控制性状，或通过控制蛋白质结构直接控制性状。一个基因可影响多个性状，一个性状可受多个基因影响。表观遗传（DNA 甲基化）使表型变化可遗传但 DNA 序列不变。"}], "exam_points": [{"title": "转录翻译", "content": "过程比较；碱基互补配对的对应关系（DNA 模板链、mRNA、tRNA）。"}, {"title": "计算", "content": "基因碱基数:氨基酸数:密码子数=6:1:1（考虑终止密码子）。"}, {"title": "中心法则", "content": "各类生物的遗传信息流动。"}], "examples": [{"title": "碱基对应", "question": "某基因片段为 …ATGC…（非模板链），转录出的 mRNA 上的相应序列是？", "分析": "非模板链（编码链）与 mRNA 序列一致（T 换 U）。", "answer": "非模板链与 mRNA 碱基序列相同（除 T/U），故 mRNA 序列为 …AUGC…。"}, {"title": "数目关系", "question": "合成含 100 个氨基酸的多肽，控制它的基因至少含多少个碱基？", "分析": "1 个氨基酸对应 1 个密码子（3 碱基），基因双链。", "answer": "100 个氨基酸对应 100 个密码子（mRNA 上 300 个碱基），基因双链故至少 600 个碱基（还需考虑终止密码子，故实际至少 603 个）。"}]}, {"id": "bi_2_5", "title": "第5章 基因突变及其他变异", "summary": "学习基因突变、基因重组和染色体变异三种可遗传变异。", "knowledge": [{"title": "基因突变", "content": "DNA 分子发生碱基对的替换、增添或缺失，引起基因结构改变。特点：普遍性、随机性、低频性、不定向性、多害少利性。意义：新基因产生的途径，生物变异的根本来源，进化原材料。诱变因素：物理（射线）、化学、生物（病毒）。"}, {"title": "基因重组", "content": "控制不同性状的基因重新组合。类型：自由组合（非同源染色体非等位基因）、交叉互换（同源染色体非姐妹染色单体）。发生于减数分裂。意义：生物变异来源之一，有性生殖后代多样性。"}, {"title": "染色体变异", "content": "染色体结构变异（缺失、重复、倒位、易位）和数目变异。整倍体变异（单倍体、二倍体、多倍体）：多倍体植株大（用秋水仙素处理使染色体加倍）；非整倍体变异（如 21 三体综合征）。"}, {"title": "变异类型比较", "content": "基因突变是基因结构的改变（新基因）；基因重组是基因重新组合（无新基因）；染色体变异是染色体结构数目改变。三者都可遗传，仅基因突变产生新基因。"}], "exam_points": [{"title": "变异判断", "content": "区分三种变异类型及意义。"}, {"title": "基因突变", "content": "碱基变化对蛋白质的影响（替换影响小，增添缺失影响大）。"}, {"title": "育种", "content": "诱变育种、杂交育种、多倍体育种、单倍体育种的原理方法优缺点。"}], "examples": [{"title": "变异判断", "question": "镰刀型细胞贫血症的病因属于哪种变异？", "分析": "血红蛋白基因碱基对替换。", "answer": "镰刀型细胞贫血症是血红蛋白基因上一个碱基对替换（T→A），导致氨基酸改变，属于基因突变。"}, {"title": "育种", "question": "用秋水仙素处理萌发的种子或幼苗可获得多倍体，原理是什么？", "分析": "秋水仙素抑制纺锤体形成。", "answer": "秋水仙素抑制细胞分裂前期纺锤体的形成，使染色体已复制但细胞不能正常分裂，导致染色体数目加倍，从而获得多倍体。"}]}, {"id": "bi_2_6", "title": "第6章 生物的进化", "summary": "学习现代生物进化理论，理解生物进化的原因与生物多样性的形成。", "knowledge": [{"title": "拉马克与达尔文", "content": "拉马克：用进废退、获得性遗传（已被否定）。达尔文自然选择学说：过度繁殖、生存斗争、遗传变异、适者生存。局限：未解释遗传变异本质。"}, {"title": "现代生物进化理论", "content": "种群是生物进化的基本单位；突变和基因重组提供原材料；自然选择决定进化方向；隔离是物种形成的必要条件。种群基因频率改变是进化的实质。"}, {"title": "概念辨析", "content": "种群（同种生物全部个体）、基因库（全部基因）、基因频率（某基因占全部等位基因的比率）、物种（能相互交配产生可育后代）、隔离（生殖隔离、地理隔离）。"}, {"title": "物种形成", "content": "一般过程：地理隔离→不同环境自然选择→基因频率改变→生殖隔离→新物种。突变和基因重组、自然选择、隔离是物种形成三环节。生物多样性包括基因多样性、物种多样性、生态系统多样性。"}], "exam_points": [{"title": "基因频率", "content": "计算基因型频率与基因频率；遗传平衡定律（哈迪温伯格）。"}, {"title": "自然选择", "content": "自然选择作用于表现型；选择决定进化方向。"}, {"title": "物种形成", "content": "隔离与物种形成关系；判断是否新物种（生殖隔离）。"}], "examples": [{"title": "基因频率", "question": "某种群中 AA 占 36%、Aa 占 48%、aa 占 16%，求 A 的基因频率。", "分析": "A 频率=AA+1/2Aa。", "answer": "A 基因频率=36%+48%×1/2=60%，a 基因频率=16%+48%×1/2=40%（或 1−60%=40%）。"}, {"title": "物种形成", "question": "判断生物是否进化和是否形成新物种的标志分别是什么？", "分析": "进化看基因频率，物种看生殖隔离。", "answer": "生物进化的标志是种群基因频率发生改变；新物种形成的标志是产生生殖隔离（不同物种间不能相互交配产生可育后代）。"}]}]}]}];
const COLORS = {"语文": "#b85450", "数学": "#3a76d8", "英语": "#6a4ca0", "物理": "#2e8b57", "化学": "#c0392b", "生物": "#16a085"};
let curChapter = null;
let curTab = 'knowledge';

// localStorage 封装
const LS = {
  get(k, def){ try{ return JSON.parse(localStorage.getItem(k)) ?? def; }catch(e){ return def; } },
  set(k, v){ localStorage.setItem(k, JSON.stringify(v)); }
};
const notes = LS.get('g1_notes', {});      // {chapterId:[{id,title,content,time}]}
const studied = LS.get('g1_studied', {});   // {chapterId:true}
const uid = ()=> Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const now = ()=> { const d=new Date(); const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function br(s){ return esc(s).replace(/\n/g,'<br>'); }

// 构建章节索引
const chapterMap = {};
DATA.forEach(subj=>{
  subj.books.forEach(book=>{
    book.chapters.forEach(ch=>{
      if(!ch.id) ch.id = subj.subject+'_'+book.name+'_'+ch.title;
      chapterMap[ch.id] = {subj, book, ch};
    });
  });
});

// 渲染目录树
function renderTree(){
  const tree = document.getElementById('tree');
  let html = '';
  DATA.forEach((subj,si)=>{
    const color = COLORS[subj.subject] || '#333';
    html += `<div class="subj" id="subj${si}">
      <div class="subj-head" style="color:${color}" onclick="this.parentElement.classList.toggle('open')">
        <span>${esc(subj.subject)}</span><span class="arrow">▶</span>
      </div>`;
    subj.books.forEach((book,bi)=>{
      html += `<div class="book" id="b${si}-${bi}">
        <div class="book-head" onclick="this.parentElement.classList.toggle('open')">
          <span>${esc(book.name)}</span><span class="arrow">▶</span>
        </div><div class="ch-list">`;
      book.chapters.forEach(ch=>{
        const done = studied[ch.id] ? '<span class="done">✓</span>' : '';
        html += `<div class="ch-item" data-id="${ch.id}" onclick="selectChapter('${ch.id}')">
          <span class="dot" style="background:${color}"></span>
          <span style="flex:1">${esc(ch.title)}</span>${done}</div>`;
      });
      html += `</div></div>`;
    });
    html += `</div>`;
  });
  tree.innerHTML = html;
}

function toggleDrawer(){
  document.getElementById('drawer').classList.toggle('show');
  document.getElementById('overlay').classList.toggle('show');
}
function closeDrawer(){
  document.getElementById('drawer').classList.remove('show');
  document.getElementById('overlay').classList.remove('show');
}

function selectChapter(id){
  curChapter = id;
  closeDrawer();
  document.querySelectorAll('.ch-item').forEach(el=>el.classList.toggle('active', el.dataset.id===id));
  renderContent();
}

function updateProg(){
  const total = Object.keys(chapterMap).length;
  const done = Object.keys(studied).filter(k=>studied[k] && chapterMap[k]).length;
  document.getElementById('topProg').textContent = `${done}/${total}`;
}

function renderContent(){
  if(!curChapter){
    document.getElementById('content').innerHTML = `<div class="welcome"><h2>请选择章节</h2><p>点左上角 ☰ 展开目录</p></div>`;
    document.getElementById('topTitle').textContent = '高一学习助手';
    return;
  }
  const {subj,book,ch} = chapterMap[curChapter];
  document.getElementById('topTitle').textContent = subj.subject;
  const tabs = [
    ['knowledge','知识点'],['exam','考点精析'],['examples','典型例题'],['note','我的笔记']
  ].map(([k,t])=>`<div class="tab ${curTab===k?'active':''}" onclick="switchTab('${k}')">${t}</div>`).join('');
  let body = '';
  if(curTab==='knowledge'){
    body = ch.knowledge && ch.knowledge.length ? ch.knowledge.map((k,i)=>
      `<div class="kp"><div class="kp-t">${i+1}. ${esc(k.title)}</div><div>${br(k.content)}</div></div>`).join('')
      : '<div class="empty">暂无内容</div>';
  } else if(curTab==='exam'){
    body = ch.exam_points && ch.exam_points.length ? ch.exam_points.map((e,i)=>
      `<div class="kp ep"><div class="ep-t">${i+1}. ${esc(e.title)}</div><div>${br(e.content)}</div></div>`).join('')
      : '<div class="empty">暂无内容</div>';
  } else if(curTab==='examples'){
    body = ch.examples && ch.examples.length ? ch.examples.map((e,i)=>
      `<div class="ex"><div class="ex-t">例 ${i+1}　${esc(e.title||'')}</div>
        <div><span class="q">【题目】</span>${br(e.question)}</div>
        ${e.analysis||e['分析']?`<div><span class="an">【分析】</span>${br(e.analysis||e['分析'])}</div>`:''}
        ${e.answer||e['答案']?`<div><span class="ans">【解答】</span>${br(e.answer||e['答案'])}</div>`:''}
      </div>`).join('') : '<div class="empty">暂无内容</div>';
  } else if(curTab==='note'){
    body = renderNote();
  }
  const markOn = studied[curChapter] ? ' on' : '';
  document.getElementById('content').innerHTML = `
    <div class="ch-loc">${esc(subj.subject)} · ${esc(book.name)}</div>
    <div class="ch-title">${esc(ch.title)}</div>
    <div class="ch-summary">${esc(ch.summary||'')}</div>
    <button class="mark-btn${markOn}" onclick="toggleMark()">${studied[curChapter]?'✓ 已学习':'标记已学习'}</button>
    <div class="tabs">${tabs}</div>
    <div class="panel">${body}</div>`;
  updateProg();
}

function switchTab(t){ curTab = t; renderContent(); }

function toggleMark(){
  if(!curChapter) return;
  if(studied[curChapter]) delete studied[curChapter]; else studied[curChapter]=true;
  LS.set('g1_studied', studied);
  renderTree();
  renderContent();
}

// 笔记
function renderNote(){
  const list = notes[curChapter] || [];
  let html = `<div class="note-row"><span class="meta">在书本上做笔记 · 自动保存到本机</span></div>
    <div class="note-box">
      <input id="noteTitle" placeholder="笔记标题（可选）" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:15px;margin-bottom:6px;outline:none">
      <textarea id="noteContent" placeholder="写下你的理解、疑问、口诀…"></textarea>
    </div>
    <div class="note-row"><span class="meta" id="noteHint">新建笔记</span>
      <button onclick="saveNote()">保存笔记</button></div>
    <div class="note-list" id="noteList"></div>`;
  setTimeout(()=>{
    const ti=document.getElementById('noteTitle'), co=document.getElementById('noteContent');
    if(ti) ti.value='', co.value='';
    renderNoteList();
  },0);
  return html;
}
function renderNoteList(){
  const list = notes[curChapter] || [];
  const el = document.getElementById('noteList');
  if(!el) return;
  el.innerHTML = list.slice().reverse().map(n=>
    `<div class="note-card">
      <div class="nc-t">${esc(n.title)}</div>
      <div class="nc-c">${br(n.content)}</div>
      <div class="nc-time">${esc(n.time)} · <a href="javascript:delNote('${n.id}')" style="color:#e55">删除</a></div>
    </div>`).join('') || '<div class="empty">还没有笔记</div>';
}
function saveNote(){
  if(!curChapter) return;
  const t = (document.getElementById('noteTitle').value||'').trim() || '未命名笔记';
  const c = document.getElementById('noteContent').value;
  if(!c.trim()){ alert('请输入笔记内容'); return; }
  if(!notes[curChapter]) notes[curChapter]=[];
  notes[curChapter].push({id:uid(),title:t,content:c,time:now()});
  LS.set('g1_notes', notes);
  document.getElementById('noteTitle').value='';
  document.getElementById('noteContent').value='';
  renderNoteList();
}
function delNote(id){
  if(!confirm('删除这条笔记？')) return;
  notes[curChapter] = (notes[curChapter]||[]).filter(n=>n.id!==id);
  LS.set('g1_notes', notes);
  renderNoteList();
}

// 搜索
function doSearch(){
  const kw = (document.getElementById('searchInput').value||'').trim().toLowerCase();
  const c = document.getElementById('content');
  if(!kw){ c.innerHTML='<div class="empty-state">请输入关键词</div>'; return; }
  const res = [];
  Object.values(chapterMap).forEach(({subj,book,ch})=>{
    const parts=[ch.title,ch.summary||''];
    (ch.knowledge||[]).forEach(k=>parts.push(k.title+' '+k.content));
    (ch.exam_points||[]).forEach(e=>parts.push(e.title+' '+e.content));
    (ch.examples||[]).forEach(e=>parts.push(e.question+' '+(e.analysis||e['分析']||'')+' '+(e.answer||e['答案']||'')));
    if(parts.join(' ').toLowerCase().includes(kw)) res.push({subj,book,ch});
  });
  if(!res.length){ c.innerHTML='<div class="empty-state">未找到「'+esc(kw)+'」相关内容</div>'; return; }
  c.innerHTML = `<h3 style="margin:4px 0 10px">找到 ${res.length} 条结果，点击查看</h3>`+
    res.map(({subj,book,ch})=>{
      const color=COLORS[subj.subject]||'#333';
      return `<div class="sr-card" onclick="selectChapter('${ch.id}');switchTab('knowledge')">
        <span class="sr-subj" style="background:${color}">${esc(subj.subject)}</span>
        <div class="sr-loc">${esc(book.name)}</div>
        <div style="font-weight:600">${esc(ch.title)}</div></div>`;
    }).join('');
}
document.getElementById('searchInput').addEventListener('keydown',e=>{ if(e.key==='Enter') doSearch(); });

// 初始化
renderTree();
updateProg();
// 默认展开第一个科目
const firstSubj = document.getElementById('subj0');
if(firstSubj) firstSubj.classList.add('open');
</script>
